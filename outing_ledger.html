<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>외출·외박 신청서(대장)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
        * { box-sizing: border-box; font-family: "Pretendard", sans-serif; }
        body { margin: 0; padding: 0; background: #f1f5f9; }

        /* ── 화면 미리보기용 ── */
        .page {
            width: 277mm;          /* A4 가로(297mm) - 좌우여백 각 10mm */
            padding: 8mm 10mm;
            margin: 10mm auto;
            background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
        }

        /* 펀치 구멍 가이드 */
        .punch-hole { position:absolute; left:3mm; width:5mm; height:5mm; background:#cbd5e1; border-radius:50%; }
        .hole-1 { top:60mm; } .hole-2 { bottom:60mm; }

        .title { text-align:center; font-size:26px; font-weight:900; letter-spacing:8px; margin:0 0 6px 0; }
        .course-title { text-align:right; font-size:15px; font-weight:bold; border-bottom:2px solid #000; padding-bottom:4px; margin-bottom:8px; }

        table { width:100%; border-collapse:collapse; border:2px solid #000; table-layout:fixed; }
        th, td { border:1px solid #000; text-align:center; vertical-align:middle; padding:2px 3px; }
        th { background:#f1f5f9; font-size:12px; font-weight:800; height:36px; }
        td { font-size:12px; word-break:break-all; }

        /* 행 높이: 데이터 행은 내용에 따라 자동, 최소 높이 보장 */
        tbody tr { min-height:45px; }
        tbody td { height:45px; }

        /* 단체외출 행 강조 */
        tr.group-row td { background:#faf5ff; }
        tr.group-row td:first-child { border-left:4px solid #7c3aed; }

        .shrink-text { display:block; width:100%; font-size:11px; line-height:1.3; }
        .name-cell { font-weight:900; font-size:14px; }
        .stamp-img { height:38px; width:auto; mix-blend-mode:multiply; }
        .confirm-text { font-size:11px; font-weight:bold; color:#333; }
        .time-out { font-size:11px; font-weight:800; color:#1e3a8a; }
        .time-in  { font-size:11px; font-weight:800; color:#b91c1c; }
        .divider  { border-top:1px dashed #cbd5e1; margin:2px 5px; }

        .badge-group { display:inline-block; background:#7c3aed; color:white; padding:1px 6px; border-radius:5px; font-size:10px; font-weight:800; margin-bottom:2px; }
        .badge-return { display:block; font-size:9px; color:#10b981; font-weight:bold; margin-top:2px; }

        /* ── 인쇄 전용 ── */
        .print-btn { position:fixed; top:20px; right:20px; padding:12px 28px; background:#003366; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:900; z-index:1000; font-size:15px; }

        @media print {
            body { background:white; }
            .print-btn { display:none; }
            /* A4 가로, 여백 10mm로 잘림 방지 */
            @page { size: A4 landscape; margin: 10mm; }
            .page {
                width: 100%;
                margin: 0;
                padding: 0;
                box-shadow: none;
            }
            /* 행이 페이지 경계에서 잘리지 않게 */
            tbody tr { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <button class="print-btn" onclick="window.print()">대장 인쇄하기</button>

    <div class="page">
        <div class="punch-hole hole-1"></div>
        <div class="punch-hole hole-2"></div>

        <h1 class="title">외출 (외박) 신청서</h1>
        <div class="course-title">◎ 과정명 : <span id="displayCourseName">-</span></div>

        <table>
            <thead>
                <tr>
                    <th style="width:7%;">일자</th>
                    <th style="width:13%;">시간<br>(외출/복귀)</th>
                    <th style="width:11%;">소속</th>
                    <th style="width:10%;">성명</th>
                    <th style="width:12%;">행선지</th>
                    <th style="width:16%;">전화번호</th>
                    <th style="width:21%;">사유</th>
                    <th style="width:10%;">확인<br>(담임/담당)</th>
                </tr>
            </thead>
            <tbody id="ledgerBody"></tbody>
        </table>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const room   = params.get('room');

        if (!room) {
            document.querySelector('.page').innerHTML =
                '<div style="text-align:center;padding:80px 20px;color:#64748b;">' +
                '<h2>⚠️ 강의실 정보가 없습니다</h2>' +
                '<p>강사 플랫폼 또는 교육운영부 플랫폼에서 버튼을 통해 접속해 주세요.</p></div>';
        }

        const db = firebase.database();

        async function init() {
            if (!room) return;

            const setSnap = await db.ref(`courses/${room}/settings`).once('value');
            const settings = setSnap.val() || {};
            document.getElementById('displayCourseName').innerText = settings.courseName || room;

            // 기간 파싱
            const periodStr = settings.period || '';
            let startDate = '', endDate = '';
            const sep = periodStr.includes(' ~ ') ? ' ~ ' : '~';
            if (periodStr.includes(sep)) {
                [startDate, endDate] = periodStr.split(sep).map(s => s.trim());
            }

            db.ref(`courses/${room}/admin_actions`).on('value', snap => {
                const allData = snap.val() || {};
                const body = document.getElementById('ledgerBody');
                body.innerHTML = '';

                let list = [];
                Object.keys(allData).forEach(date => {
                    if ((!startDate || date >= startDate) && (!endDate || date <= endDate)) {
                        Object.entries(allData[date]).forEach(([token, item]) => {
                            list.push({ date, token, ...item });
                        });
                    }
                });

                // 날짜 → 이름 순 정렬 (단체외출은 맨 위)
                list.sort((a, b) => {
                    if (a.date !== b.date) return a.date.localeCompare(b.date);
                    // 같은 날짜면 단체외출 먼저
                    if (a.type === 'group_outing' && b.type !== 'group_outing') return -1;
                    if (a.type !== 'group_outing' && b.type === 'group_outing') return 1;
                    return (a.timestamp || 0) - (b.timestamp || 0);
                });

                list.forEach(a => {
                    const tr = document.createElement('tr');
                    const isGroup = (a.type === 'group_outing');
                    if (isGroup) tr.classList.add('group-row');

                    let endTimeDisplay = a.endTime || '-';
                    if (a.type === 'overnight' && a.returnDate) {
                        const retDay = a.returnDate.substring(8, 10);
                        endTimeDisplay = `익일(${retDay}일) ${endTimeDisplay}`;
                    }

                    const timeHtml = `
                        <div class="time-out">출발: ${a.startTime || '-'}</div>
                        <div class="divider"></div>
                        <div class="time-in">복귀: ${endTimeDisplay}</div>
                    `;

                    const nameCellHtml = `
                        ${isGroup ? '<span class="badge-group">단체</span><br>' : ''}
                        ${a.name || ''}
                        ${a.returned ? `<span class="badge-return">[복귀:${a.returnReportTime || ''}]</span>` : ''}
                    `;

                    let confirmDisplay = '';
                    if (a.confirmedBySign) {
                        confirmDisplay = `<img src="${a.confirmedBySign}" class="stamp-img">`;
                    } else if (a.confirmedBy) {
                        confirmDisplay = `<span class="confirm-text">${a.confirmedBy}</span>`;
                    }

                    tr.innerHTML = `
                        <td>${a.date ? a.date.substring(5) : ''}</td>
                        <td style="padding:4px 2px;">${timeHtml}</td>
                        <td><span class="shrink-text">${a.dept || ''}</span></td>
                        <td class="name-cell">${nameCellHtml}</td>
                        <td><span class="shrink-text">${a.destination || ''}</span></td>
                        <td style="font-size:11px;">${a.phone || ''}</td>
                        <td><span class="shrink-text">${a.reason || ''}</span></td>
                        <td>${confirmDisplay}</td>
                    `;
                    body.appendChild(tr);
                });

                // 빈 줄 최소 10줄 보장
                const minRows = 10;
                for (let i = list.length; i < minRows; i++) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = '<td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>';
                    body.appendChild(tr);
                }
            });
        }

        init();
    </script>
</body>
</html>
