<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>외출·외박 신청서(대장)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
        * { box-sizing: border-box; font-family: "Pretendard", sans-serif; }
        body { margin: 0; padding: 0; background: #f1f5f9; }

        /* ── 화면 미리보기용 ── */
        .page {
            width: 277mm;          /* A4 가로(297mm) - 좌우여백 각 10mm */
            padding: 8mm 10mm;
            margin: 10mm auto;
            background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
        }

        /* 펀치 구멍 가이드 */
        .punch-hole { position:absolute; left:3mm; width:5mm; height:5mm; background:#cbd5e1; border-radius:50%; }
        .hole-1 { top:60mm; } .hole-2 { bottom:60mm; }

        .title { text-align:center; font-size:26px; font-weight:900; letter-spacing:8px; margin:0 0 6px 0; }
        .course-title { text-align:right; font-size:15px; font-weight:bold; border-bottom:2px solid #000; padding-bottom:4px; margin-bottom:8px; }
        .period-line { text-align:right; font-size:13px; font-weight:600; color:#334155; margin-bottom:8px; }
        /* 표 안 반복 헤더(제목 블록): 테두리 없이 깔끔하게, 데이터 그리드만 격자 */
        table.ledger { border: none; }
        .doc-head td { border: none; padding: 2px 2px 8px; background:#fff; }

        table { width:100%; border-collapse:collapse; border:2px solid #000; table-layout:fixed; }
        th, td { border:1px solid #000; text-align:center; vertical-align:middle; padding:2px 3px; }
        th { background:#f1f5f9; font-size:12px; font-weight:800; height:36px; }
        td { font-size:12px; word-break:break-all; }

        /* 행 높이: 데이터 행은 내용에 따라 자동, 최소 높이 보장 */
        tbody tr { min-height:45px; }
        tbody td { height:45px; }

        /* 단체외출 행 강조 */
        tr.group-row td { background:#faf5ff; }
        tr.group-row td:first-child { border-left:4px solid #7c3aed; }

        .shrink-text { display:block; width:100%; font-size:11px; line-height:1.3; }
        .name-cell { font-weight:900; font-size:14px; }
        .stamp-img { height:38px; width:auto; mix-blend-mode:multiply; }
        .confirm-text { font-size:11px; font-weight:bold; color:#333; }
        .time-out { font-size:11px; font-weight:800; color:#1e3a8a; }
        .time-in  { font-size:11px; font-weight:800; color:#b91c1c; }
        .divider  { border-top:1px dashed #cbd5e1; margin:2px 5px; }

        .badge-group { display:inline-block; background:#7c3aed; color:white; padding:1px 6px; border-radius:5px; font-size:10px; font-weight:800; margin-bottom:2px; }
        .badge-return { display:block; font-size:9px; color:#10b981; font-weight:bold; margin-top:2px; }

        /* [신규] 주차 구분 행 */
        tr.week-sep td { background:#e0e7ff; color:#1e3a8a; font-weight:900; font-size:12px; text-align:left; padding:5px 10px; letter-spacing:1px; }

        /* ── 인쇄 전용 ── */
        .print-btn { position:fixed; top:20px; right:20px; padding:12px 28px; background:#003366; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:900; z-index:1000; font-size:15px; }

        @media print {
            html, body { background:white !important; margin:0 !important; padding:0 !important; }
            .print-btn, .no-print { display:none !important; }
            header, footer, nav { display:none !important; }
            /* @page 여백 0 → 브라우저가 자동 삽입하는 머리글/꼬리글(주소·날짜·페이지번호) 제거 */
            @page { size: A4 landscape; margin: 0; }
            /* 화면 카드 1장 = 인쇄 1페이지 */
            .page { width: 100%; margin: 0; padding: 6mm 8mm; box-shadow: none; page-break-after: always; }
            .page:last-child { page-break-after: auto; }
            table.ledger thead .doc-head td { padding-top: 4mm !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            tr { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <button class="print-btn" onclick="printLedger()">대장 인쇄하기</button>

    <div id="ledgerPages"></div>

    <!-- 한 장(페이지) 템플릿: JS가 복제하여 페이지마다 제목블록+컬럼헤더+행(약 10명)을 채움 -->
    <template id="pageTpl">
        <div class="page">
            <div class="punch-hole hole-1"></div>
            <div class="punch-hole hole-2"></div>
            <table class="ledger">
                <thead>
                    <tr class="doc-head">
                        <td colspan="8">
                            <h1 class="title">외출 (외박) 신청서</h1>
                            <div class="course-title">◎ 과정명 : <span class="docCourseName">-</span></div>
                            <div class="period-line">교육기간 : <span class="docPeriod">-</span></div>
                        </td>
                    </tr>
                    <tr class="col-head">
                        <th style="width:7%;">일자</th>
                        <th style="width:13%;">시간<br>(외출/복귀)</th>
                        <th style="width:11%;">소속</th>
                        <th style="width:10%;">성명</th>
                        <th style="width:12%;">행선지</th>
                        <th style="width:16%;">전화번호</th>
                        <th style="width:21%;">사유</th>
                        <th style="width:10%;">확인<br>(담임/담당)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </template>

    <script>
        const params = new URLSearchParams(window.location.search);
        const room   = params.get('room');
        const autoSave = params.get('auto') === '1';   // 교육운영부 버튼에서 'PDF 저장' 확인 후 진입 시 자동 인쇄
        let _autoDone = false;

        if (!room) {
            document.getElementById('ledgerPages').innerHTML =
                '<div class="page" style="text-align:center;padding:80px 20px;color:#64748b;">' +
                '<h2>⚠️ 강의실 정보가 없습니다</h2>' +
                '<p>강사 플랫폼 또는 교육운영부 플랫폼에서 버튼을 통해 접속해 주세요.</p></div>';
        }

        const db = firebase.database();
        window._courseNameStr = '-';   // 페이지 제목블록·인쇄 파일명용
        window._periodDisplay = '-';

        // 실제 PDF 파일 생성·다운로드 (모바일/인앱 브라우저에서도 동작). 미지원 시 인쇄로 폴백.
        function printLedger() {
            const cn = (window._courseNameStr || '').trim();
            const base = (cn && cn !== '-') ? `(외출외박대장)${cn}` : '외출외박대장';
            const el = document.getElementById('ledgerPages');
            if (!el) return;
            if (typeof html2pdf === 'undefined') { document.title = base; window.print(); return; }
            const btn = document.querySelector('.print-btn');
            const oldTxt = btn ? btn.innerHTML : '';
            if (btn) { btn.disabled = true; btn.innerHTML = '⏳ PDF 생성 중…'; }
            // 캡처용 임시 스타일 (카드 여백·그림자 제거 → 깔끔한 페이지)
            const tmp = document.createElement('style');
            tmp.innerHTML = '#ledgerPages .page{margin:0 !important;box-shadow:none !important;border-radius:0 !important;}';
            document.head.appendChild(tmp);
            const done = () => { tmp.remove(); if (btn) { btn.disabled = false; btn.innerHTML = oldTxt; } };
            html2pdf().set({
                margin: 0,
                filename: base + '.pdf',
                image: { type: 'jpeg', quality: 0.95 },
                html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                pagebreak: { mode: ['css', 'legacy'], before: '.page' }
            }).from(el).save().then(done).catch(() => { done(); document.title = base; window.print(); });
        }
        window.addEventListener('afterprint', () => { document.title = '외출·외박 신청서(대장)'; });

        async function init() {
            const _p = new URLSearchParams(location.search);
            const archiveId = _p.get('archive');
            let settings = {}, dataRef = null;
            if (archiveId) {
                const arSnap = await db.ref('system/course_archive/' + archiveId).once('value');
                const ar = arSnap.val() || {};
                settings = { courseName: ar.courseName || '', period: ar.period || '' };
                dataRef = db.ref('system/course_archive/' + archiveId + '/admin_actions');
            } else {
                if (!room) return;
                const setSnap = await db.ref(`courses/${room}/settings`).once('value');
                settings = setSnap.val() || {};
                dataRef = db.ref(`courses/${room}/admin_actions`);
            }
            const _qTitle = _p.get('title'), _qStart = _p.get('start'), _qEnd = _p.get('end');
            window._courseNameStr = _qTitle || settings.courseName || room || '지난 과정';

            // 기간 파싱 — start/end 파라미터가 있으면 우선 (지난 기록 조회용)
            const periodStr = settings.period || '';
            let startDate = '', endDate = '';
            if (_qStart || _qEnd) { startDate = _qStart || ''; endDate = _qEnd || ''; }
            else {
                const sep = periodStr.includes(' ~ ') ? ' ~ ' : '~';
                if (periodStr.includes(sep)) { [startDate, endDate] = periodStr.split(sep).map(s => s.trim()); }
            }

            // 기간 표시 문자열 (페이지 제목블록에 사용)
            if (startDate && endDate) {
                const fmt = (s) => {
                    const d = new Date(s + 'T00:00:00');
                    return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
                };
                window._periodDisplay = `${fmt(startDate)} ~ ${fmt(endDate)}`;
            } else {
                window._periodDisplay = periodStr || '-';
            }

            dataRef.on('value', snap => {
                const allData = snap.val() || {};
                const host = document.getElementById('ledgerPages');
                host.innerHTML = '';
                const tpl = document.getElementById('pageTpl');

                let list = [];
                Object.keys(allData).forEach(date => {
                    if ((!startDate || date >= startDate) && (!endDate || date <= endDate)) {
                        Object.entries(allData[date]).forEach(([token, item]) => {
                            list.push({ date, token, ...item });
                        });
                    }
                });

                // 날짜 → 이름 순 정렬 (단체외출은 맨 위)
                list.sort((a, b) => {
                    if (a.date !== b.date) return a.date.localeCompare(b.date);
                    if (a.type === 'group_outing' && b.type !== 'group_outing') return -1;
                    if (a.type !== 'group_outing' && b.type === 'group_outing') return 1;
                    return (a.timestamp || 0) - (b.timestamp || 0);
                });

                // 주(월요일 기준) 키 계산 헬퍼
                const weekKeyOf = (dateStr) => {
                    const dt = new Date(dateStr + 'T00:00:00');
                    if (isNaN(dt)) return '';
                    const monday = new Date(dt);
                    const dow = (dt.getDay() + 6) % 7;
                    monday.setDate(dt.getDate() - dow);
                    const sun = new Date(monday); sun.setDate(monday.getDate() + 6);
                    const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
                    return `${fmt(monday)} ~ ${fmt(sun)}`;
                };

                const PER_PAGE = 10;      // 한 페이지(한 장)당 행 수
                let curBody = null, rowsOnPage = 0;

                // 새 A4 페이지 카드 생성 (제목블록·기간·컬럼헤더 포함)
                function newPage() {
                    const node = tpl.content.firstElementChild.cloneNode(true);
                    node.querySelector('.docCourseName').textContent = window._courseNameStr || '-';
                    node.querySelector('.docPeriod').textContent     = window._periodDisplay || '-';
                    host.appendChild(node);
                    curBody = node.querySelector('tbody');
                    rowsOnPage = 0;
                }
                // 행 추가 전 페이지 여유 확보 (forSep=true면 구분행이 페이지 끝 고아가 안 되게)
                function ensureRoom(forSep) {
                    if (!curBody || rowsOnPage >= PER_PAGE) { newPage(); return; }
                    if (forSep && rowsOnPage >= PER_PAGE - 1) newPage();
                }

                newPage();
                let curWeek = null;
                list.forEach(a => {
                    const wk = weekKeyOf(a.date);
                    if (wk && wk !== curWeek) {
                        curWeek = wk;
                        ensureRoom(true);
                        const sep = document.createElement('tr');
                        sep.className = 'week-sep';
                        sep.innerHTML = `<td colspan="8"><i class="fa-regular fa-calendar-week"></i> 주간 (${wk})</td>`;
                        curBody.appendChild(sep);
                        rowsOnPage++;
                    }

                    ensureRoom(false);
                    const tr = document.createElement('tr');
                    const isGroup = (a.type === 'group_outing');
                    if (isGroup) tr.classList.add('group-row');

                    let endTimeDisplay = a.endTime || '-';
                    if (a.type === 'overnight' && a.returnDate) {
                        const retDay = a.returnDate.substring(8, 10);
                        endTimeDisplay = `익일(${retDay}일) ${endTimeDisplay}`;
                    }

                    const timeHtml = `
                        <div class="time-out">출발: ${a.startTime || '-'}</div>
                        <div class="divider"></div>
                        <div class="time-in">복귀: ${endTimeDisplay}</div>
                    `;
                    const nameCellHtml = `
                        ${isGroup ? '<span class="badge-group">단체</span><br>' : ''}
                        ${a.name || ''}
                        ${a.returned ? `<span class="badge-return">[복귀:${a.returnReportTime || ''}]</span>` : ''}
                    `;
                    let confirmDisplay = '';
                    if (a.confirmedBySign) {
                        confirmDisplay = `<img src="${a.confirmedBySign}" class="stamp-img">`;
                    } else if (a.confirmedBy) {
                        confirmDisplay = `<span class="confirm-text">${a.confirmedBy}</span>`;
                    }

                    tr.innerHTML = `
                        <td>${a.date ? a.date.substring(5) : ''}</td>
                        <td style="padding:4px 2px;">${timeHtml}</td>
                        <td><span class="shrink-text">${a.dept || ''}</span></td>
                        <td class="name-cell">${nameCellHtml}</td>
                        <td><span class="shrink-text">${a.destination || ''}</span></td>
                        <td style="font-size:11px;">${a.phone || ''}</td>
                        <td><span class="shrink-text">${a.reason || ''}</span></td>
                        <td>${confirmDisplay}</td>
                    `;
                    curBody.appendChild(tr);
                    rowsOnPage++;
                });

                // 마지막 페이지를 10줄로 채우기(빈 줄). 신청자 없으면 한 페이지 빈 양식.
                const remaining = PER_PAGE - rowsOnPage;
                for (let i = 0; i < remaining; i++) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = '<td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>';
                    curBody.appendChild(tr);
                }

                // auto=1 진입 시(교육운영부 'PDF 저장' 확인 후) 렌더 완료 후 자동으로 저장(인쇄) 창 띄움 — 1회만
                if (autoSave && !_autoDone) {
                    _autoDone = true;
                    setTimeout(() => { try { printLedger(); } catch (e) {} }, 800);
                }
            });
        }

        init();
    </script>
