<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ============================================================
  CATC · 포털  (portal.html)
  @version  A
  @build    20260610-220210
  ────────────────────────────────────────────────────────
  [코드 수정 규칙 · AI/개발자 공통]
  이 파일을 한 글자라도 고치면:
    1) 위 @version 을 다음 순서로 딱 1단계 올린다
       A → B → C → … → Z → A1 → B1 → … → Z1 → A2 → …
    2) @build 를 수정 시각(YYYYMMDD-HHMMSS)으로 갱신한다
    3) 아래 화면 배지(vA)와 콘솔 로그의 글자도 같이 맞춘다
  화면 우측 하단의 작은 'v?' 배지 / 콘솔 로그를 보고
  Shift+Ctrl+R(강력 새로고침) 후 최신본 적용 여부를 확인한다.
============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CATC 교육플랫폼 포털</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #2563eb;
      --blue-light: #3b82f6;
      --green: #059669;
      --orange: #ea580c;
      --purple: #7c3aed;
      --sky: #0284c7;
      --amber: #d97706;
      --rose: #e11d48;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg-page: #e8eef8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    /* PC 배경 — 연한 격자 패턴으로 고급스럽게 */
    body {
      font-family: 'Noto Sans KR', 'DM Sans', sans-serif;
      min-height: 100dvh;
      background: var(--bg-page);
      background-image:
        linear-gradient(rgba(37,99,235,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 모바일에서는 패딩 없이 꽉 채우기 */
    @media (max-width: 540px) {
      body { padding: 0; align-items: stretch; }
    }

    /* ── 앱 카드 컨테이너 ─────────────── */
    .app-container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(15,23,42,0.14), 0 4px 16px rgba(15,23,42,0.08);
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 540px) {
      .app-container {
        max-width: 100%;
        border-radius: 0;
        min-height: 100dvh;
        box-shadow: none;
      }
    }

    /* ── 헤더 (파란 그라디언트) ────────── */
    .app-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%);
      padding: 20px 20px 28px;
      position: relative;
      overflow: hidden;
    }
    /* 배경 원형 장식 */
    .app-header::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 130px; height: 130px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }
    .app-header::after {
      content: '';
      position: absolute;
      bottom: -20px; left: 40px;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      position: relative; z-index: 1;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-badge {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.22);
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: #fff;
    }
    .header-sub   { font-size: 9px; color: rgba(255,255,255,0.65); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .header-title { font-size: 14px; font-weight: 900; color: #fff; margin-top: 1px; }
    .header-gear {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.85); cursor: pointer;
    }

    /* 환영 블록 */
    .header-info {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative; z-index: 1;
    }
    .hi-left h2 { font-size: 20px; font-weight: 900; color: #fff; }
    .hi-left p  { font-size: 12px; color: rgba(255,255,255,0.72); margin-top: 3px; }
    .hi-clock { text-align: right; }
    #clock-display { font-size: 24px; font-weight: 800; color: #fff; font-family: 'DM Sans', monospace; letter-spacing: -0.5px; line-height: 1; }
    #date-display  { font-size: 11px; color: rgba(255,255,255,0.65); margin-top: 4px; font-weight: 600; }

    /* ── 메뉴 영역 ───────────────────── */
    .app-body {
      background: #f8fafc;
      padding: 16px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .menu-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 16px 14px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      cursor: pointer;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(15,23,42,0.05);
      transition: transform 0.14s, box-shadow 0.14s;
    }
    .menu-card:hover  { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(15,23,42,0.1); }
    .menu-card:active { transform: scale(0.96); box-shadow: 0 1px 4px rgba(15,23,42,0.06); }

    /* 상단 컬러 라인 */
    .menu-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3.5px;
      border-radius: 18px 18px 0 0;
    }
    .c-driver::before  { background: linear-gradient(90deg,#1d4ed8,#60a5fa); }
    .c-meal::before    { background: linear-gradient(90deg,#047857,#34d399); }
    .c-coord::before   { background: linear-gradient(90deg,#0369a1,#38bdf8); }
    .c-support::before { background: linear-gradient(90deg,#c2410c,#fb923c); }
    .c-facility::before{ background: linear-gradient(90deg,#b45309,#fbbf24); }
    .c-dorm::before    { background: linear-gradient(90deg,#be123c,#fb7185); }

    .card-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; margin-bottom: 10px; margin-top: 2px;
    }
    .c-driver .card-icon   { background: #eff6ff; color: #2563eb; }
    .c-meal .card-icon     { background: #ecfdf5; color: #059669; }
    .c-coord .card-icon    { background: #f0f9ff; color: #0284c7; }
    .c-support .card-icon  { background: #fff7ed; color: #ea580c; }
    .c-facility .card-icon { background: #fffbeb; color: #d97706; }
    .c-dorm .card-icon     { background: #fff1f2; color: #e11d48; }

    .card-label { font-size: 14px; font-weight: 800; color: var(--text); }
    .card-sub   { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
    .card-arrow { position: absolute; bottom: 12px; right: 13px; font-size: 11px; color: #cbd5e1; }

    /* 학생장 버튼 */
    .leader-btn {
      background: linear-gradient(135deg, #6d28d9, #7c3aed);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 13px;
      text-decoration: none; cursor: pointer;
      box-shadow: 0 4px 18px rgba(109,40,217,0.28);
      transition: transform 0.14s, box-shadow 0.14s;
    }
    .leader-btn:hover  { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(109,40,217,0.35); }
    .leader-btn:active { transform: scale(0.97); }
    .leader-icon {
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; color: #fff; flex-shrink: 0;
    }
    .lt { font-size: 14px; font-weight: 800; color: #fff; }
    .ls { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; }
    .leader-arrow { color: rgba(255,255,255,0.5); font-size: 13px; margin-left: auto; }

    /* 하단 */
    .app-footer {
      background: #f8fafc;
      border-top: 1px solid var(--border);
      padding: 10px 18px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-brand { display: flex; align-items: center; gap: 7px; }
    .footer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue-light); }
    .footer-label { font-size: 11px; color: var(--muted); font-weight: 600; }
    .footer-ver   { font-size: 11px; color: #cbd5e1; font-weight: 600; }

    /* 모달 */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(15,23,42,0.5);
      z-index: 2000; align-items: center; justify-content: center;
      padding: 24px; backdrop-filter: blur(10px);
    }
    .modal-box {
      background: #fff; border: 1px solid var(--border);
      width: 100%; max-width: 360px; border-radius: 24px;
      padding: 26px 22px 20px;
      box-shadow: 0 20px 60px rgba(15,23,42,0.15);
    }
    .modal-box h3 { font-size: 17px; font-weight: 900; color: var(--text); margin-bottom: 16px; }
    .modal-input {
      width: 100%; padding: 12px 16px; margin-bottom: 9px;
      background: #f8fafc; border: 1.5px solid var(--border);
      border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--text);
      outline: none; transition: border-color 0.2s;
      font-family: inherit;
    }
    .modal-input:focus { border-color: var(--blue); background: #fff; }
    .modal-input::placeholder { color: #94a3b8; }
    .modal-btn {
      width: 100%; padding: 13px; background: var(--blue); color: #fff;
      border: none; border-radius: 12px; font-weight: 800; cursor: pointer;
      font-size: 15px; margin-top: 4px; font-family: inherit;
    }
    .modal-btn.sec { background: #f1f5f9; color: var(--muted); margin-top: 8px; }

    /* 입장 애니메이션 */
    .menu-card, .leader-btn {
      animation: fadeUp 0.35s cubic-bezier(.25,.8,.25,1) both;
    }
    .menu-card:nth-child(1) { animation-delay: 0.05s; }
    .menu-card:nth-child(2) { animation-delay: 0.09s; }
    .menu-card:nth-child(3) { animation-delay: 0.13s; }
    .menu-card:nth-child(4) { animation-delay: 0.17s; }
    .menu-card:nth-child(5) { animation-delay: 0.21s; }
    .menu-card:nth-child(6) { animation-delay: 0.25s; }
    .leader-btn { animation-delay: 0.29s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app-container">

    <header class="app-header">
      <div class="header-top">
        <div class="header-brand">
          <div class="header-badge"><i class="fa-solid fa-plane-up"></i></div>
          <div>
            <div class="header-sub">Korea Airports Corp. · CATC</div>
            <div class="header-title">교육플랫폼 통합포털</div>
          </div>
        </div>
        <div class="header-gear" onclick="openAdminSettings()">
          <i class="fa-solid fa-gear" style="font-size:15px;"></i>
        </div>
      </div>
      <div class="header-info">
        <div class="hi-left">
          <h2>서비스 선택</h2>
          <p>수행하실 업무를 선택해 주세요</p>
        </div>
        <div class="hi-clock">
          <div id="clock-display">00:00</div>
          <div id="date-display">0000.00.00</div>
        </div>
      </div>
    </header>

    <div class="app-body">
      <div class="menu-grid">
        <a class="menu-card c-driver" onclick="goWithPin('driver.html','driver')">
          <div class="card-icon"><i class="fa-solid fa-bus"></i></div>
          <div class="card-label">운전원</div>
          <div class="card-sub">차량 운행 관리</div>
          <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
        </a>
        <a class="menu-card c-meal" onclick="goWithPin('nutritionist.html','meal')">
          <div class="card-icon"><i class="fa-solid fa-utensils"></i></div>

        <a class="menu-card c-support" onclick="goWithPin('dorm_admin.html','support')">

      <a class="leader-btn" href="student_leader.html">

          <div class="lt">학생장 전용 플랫폼</div>
          <div class="ls">학생장만 접근 가능한 전용 서비스</div>

    <footer class="app-footer">
      <div class="footer-brand">
        <span class="footer-dot"></span>

      <span class="footer-ver">v2026.06</span>

  </div>

  <div id="adminModal" class="modal">
    <div class="modal-box">
      <h3>🔐 포털 보안 PIN 설정</h3>
      <input type="password" id="new_driver"   class="modal-input" placeholder="운전원 PIN (4자리)">
      <input type="password" id="new_meal"     class="modal-input" placeholder="영양사 PIN (4자리)">
      <input type="password" id="new_coord"    class="modal-input" placeholder="교육운영 PIN (4자리)">
      <input type="password" id="new_support"  class="modal-input" placeholder="교육지원 PIN (4자리)">
      <input type="password" id="new_facility" class="modal-input" placeholder="미화/시설 PIN (4자리)">
      <button class="modal-btn" onclick="saveNewPins()">설정 저장</button>
      <button class="modal-btn sec" onclick="closeModal()">닫기</button>
    </div>

  <script>
    function runClock() {
      const now = new Date();
      const week = ['일','월','화','수','목','금','토'];
      const h = now.getHours(), m = now.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      document.getElementById('clock-display').textContent =
        `${(h%12||12).toString().padStart(2,'0')}:${m.toString().padStart(2,'0')} ${ampm}`;
      const mo = now.getMonth()+1, d = now.getDate();
      document.getElementById('date-display').textContent =
        `${now.getFullYear()}.${String(mo).padStart(2,'0')}.${String(d).padStart(2,'0')} (${week[now.getDay()]})`;
    }
    setInterval(runClock, 1000); runClock();

    async function hashPin(p) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
    async function goWithPin(url, role) {
      const key = 'kac_session_'+role, saved = localStorage.getItem(key);
      if (saved && Date.now()-JSON.parse(saved).time < 5*3600*1000) { location.href=url; return; }
      const input = prompt('접속 PIN 번호 4자리를 입력하세요.');
      if (!input) return;
      try {
        const snap = await firebase.database().ref(`system/portalPins/${role}`).once('value');
        const db = snap.val();
        if (!db) { alert('PIN이 설정되지 않았습니다.'); return; }
        if (await hashPin(input) === db) {
          localStorage.setItem(key, JSON.stringify({time:Date.now()}));
          location.href = url;
        } else { alert('잘못된 PIN 번호입니다.'); }
      } catch(e) { alert('데이터 연결 오류가 발생했습니다.'); }
    }
    async function openAdminSettings() {
      const pw = prompt('시스템 마스터 비밀번호를 입력하세요.');
      if (!pw) return;
      try { await firebase.auth().signInWithEmailAndPassword('admin@kac.com', pw); document.getElementById('adminModal').style.display='flex'; }
      catch(e) { alert('비밀번호가 올바르지 않습니다.'); }
    }
    async function saveNewPins() {
      for (const r of ['driver','meal','coord','support','facility']) {
        const v = document.getElementById('new_'+r).value;
        if (v) { if(v.length!==4){alert('PIN은 4자리여야 합니다.');return;} await firebase.database().ref(`system/portalPins/${r}`).set(await hashPin(v)); }
      }
      alert('PIN 설정이 저장되었습니다.'); closeModal();
    }
    function closeModal() { document.getElementById('adminModal').style.display='none'; }
  </script>
<!-- ── 화면 자동 맞춤(auto-fit): 가로+세로 모두 화면에 맞게 자동 축소 · JDS260613 ──
     원인: Windows 디스플레이 배율(125%/150%)·저해상도 화면에서 유효 뷰포트가 작아져
           고정폭 디자인이 안 맞고 세로 콘텐츠가 화면 밖으로 밀려 잘림.
     해결: 가로 초과량(scrollWidth) + 세로 콘텐츠 실제 높이(문서 전체 및 내부 스크롤 컨테이너)를
           모두 측정해 더 많이 넘치는 쪽 기준으로 zoom 축소 → 어느 PC에서도 한 화면에 표시. -->
<script>
(function(){
  var MIN_ZOOM = 0.5;                 // 글씨가 안 보일 만큼 작아지지 않도록 하한
  // 이 페이지에서 화면을 넘길 수 있는 내부 스크롤 컨테이너 후보(없으면 문서 전체 기준)
  var SCROLLERS = '.content-area,.app-content,.ap-scroll,.modal-scroll-area';
  var t;

  function neededHeight(){
    var need = document.documentElement.scrollHeight;     // 문서 전체(자연 스크롤·body 클리핑 모두 포함)
    var list = document.querySelectorAll(SCROLLERS);
    for (var i=0; i<list.length; i++){
      var sc = list[i];
      if (sc.offsetParent === null) continue;             // 숨김 요소 제외
      if (sc.scrollHeight > sc.clientHeight + 2){          // 내부에서 넘쳐 스크롤되는 컨테이너
        var top = sc.getBoundingClientRect().top + (window.scrollY||0);
        need = Math.max(need, top + sc.scrollHeight + 20);
      }
    }
    return need;
  }

  function fit(){
    var el = document.documentElement;
    el.style.zoom = '';                                   // 항상 100%로 되돌린 뒤 측정(반복 적용해도 안전)
    var wRatio = window.innerWidth  / Math.max(1, el.scrollWidth, (document.body?document.body.scrollWidth:0));
    var hRatio = window.innerHeight / Math.max(1, neededHeight());
    var z = Math.max(MIN_ZOOM, Math.min(wRatio, hRatio, 1));   // 축소만(확대 안 함)
    el.style.zoom = (z < 0.995) ? z.toFixed(4) : '';
  }
  function soon(){ clearTimeout(t); t = setTimeout(fit, 80); }

  window.addEventListener('resize', soon);
  window.addEventListener('load', fit);
  document.addEventListener('DOMContentLoaded', fit);
  [300,900,2000].forEach(function(ms){ setTimeout(fit, ms); });

  // 뷰 전환·실시간 데이터 갱신·이미지 로드로 본문 높이가 바뀌면 다시 맞춤
  if (window.MutationObserver){
    document.addEventListener('DOMContentLoaded', function(){
      new MutationObserver(soon).observe(document.body, {
        childList:true, subtree:true, attributes:true, attributeFilter:['style','class']
      });
    });
  }
})();
</script>
