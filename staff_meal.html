<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAC 항공기술훈련원 식당 — 식사 체크인</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard',sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; }
        html,body { height:100%; }
        body { background:linear-gradient(160deg,#0b1220,#111c33); color:#e2e8f0; display:flex; flex-direction:column; min-height:100dvh; overflow:hidden; }
        .topbar { display:flex; align-items:center; justify-content:space-between; padding:18px 26px; background:rgba(255,255,255,.04); border-bottom:1px solid rgba(255,255,255,.08); flex-shrink:0; }
        .topbar .ttl { font-size:20px; font-weight:900; letter-spacing:.5px; }
        .topbar .ttl small { display:block; font-size:12px; color:#94a3b8; font-weight:700; letter-spacing:1px; margin-top:2px; }
        .topbar .info { text-align:right; }
        .topbar .date { font-size:15px; font-weight:800; color:#cbd5e1; }
        .topbar .cnt  { font-size:13px; color:#38bdf8; font-weight:800; margin-top:2px; }
        .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; overflow:auto; }

        /* 홈 — 3 카테고리 */
        .home { width:100%; max-width:920px; }
        .home h2 { text-align:center; font-size:26px; font-weight:900; margin-bottom:6px; }
        .home p  { text-align:center; font-size:15px; color:#94a3b8; font-weight:700; margin-bottom:30px; }
        .cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
        .cat-btn { background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.1); border-radius:22px; padding:34px 18px; cursor:pointer; transition:transform .12s, border-color .2s, background .2s; text-align:center; }
        .cat-btn:active { transform:scale(.97); }
        .cat-btn .ico { font-size:46px; margin-bottom:14px; }
        .cat-btn .nm  { font-size:20px; font-weight:900; }
        .cat-btn .sub { font-size:12px; color:#94a3b8; font-weight:700; margin-top:6px; }
        .cat-staff .ico{ color:#34d399; } .cat-int .ico{ color:#60a5fa; } .cat-ext .ico{ color:#fbbf24; }
        @media (max-width:680px){ .cat-grid{ grid-template-columns:1fr; } }

        .back { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#cbd5e1; border-radius:12px; padding:11px 18px; font-size:15px; font-weight:800; cursor:pointer; margin-bottom:18px; }
        .back:active { opacity:.8; }
        .screen-ttl { font-size:22px; font-weight:900; margin-bottom:4px; }
        .screen-sub { font-size:13px; color:#94a3b8; font-weight:700; margin-bottom:20px; }

        /* 직원 명단 그리드 */
        .panel { width:100%; max-width:960px; }
        .staff-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
        .staff-btn { position:relative; background:#fff; color:#0f172a; border:none; border-radius:18px; padding:22px 12px; cursor:pointer; text-align:center; transition:transform .1s; box-shadow:0 6px 16px rgba(0,0,0,.25); }
        .staff-btn:active { transform:scale(.96); }
        .staff-btn .s-nm { font-size:20px; font-weight:900; }
        .staff-btn .s-dp { font-size:12px; color:#64748b; font-weight:700; margin-top:4px; min-height:15px; }
        .staff-btn.done { background:#dcfce7; border:2px solid #22c55e; }
        .staff-btn.done::after { content:'✓ 식사완료'; position:absolute; top:8px; right:10px; font-size:11px; font-weight:900; color:#16a34a; }
        .empty { text-align:center; color:#94a3b8; font-weight:700; padding:60px 0; font-size:16px; }

        /* 강사 키패드 입력 */
        .keypad-wrap { width:100%; max-width:440px; }
        .kp-field { background:#fff; color:#0f172a; border-radius:14px; padding:14px 16px; margin-bottom:12px; cursor:pointer; border:2px solid transparent; }
        .kp-field.active { border-color:#38bdf8; }
        .kp-field .lab { font-size:11px; color:#64748b; font-weight:800; }
        .kp-field .val { font-size:22px; font-weight:900; min-height:28px; letter-spacing:1px; }
        .kp-field .val.ph { color:#cbd5e1; font-weight:700; letter-spacing:0; }
        .name-input { width:100%; padding:14px 16px; border-radius:14px; border:2px solid #e2e8f0; font-size:20px; font-weight:800; margin-bottom:12px; outline:none; }
        .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
        .key { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); color:#fff; border-radius:14px; padding:20px 0; font-size:24px; font-weight:900; cursor:pointer; }
        .key:active { background:rgba(255,255,255,.2); }
        .key.wide { grid-column:span 1; font-size:18px; }
        .submit-btn { width:100%; margin-top:14px; padding:18px; background:#22c55e; color:#fff; border:none; border-radius:16px; font-size:19px; font-weight:900; cursor:pointer; }
        .submit-btn:active { opacity:.88; }
        .submit-btn:disabled { opacity:.45; }

        /* 오버레이 (코인/결과) */
        .overlay { position:fixed; inset:0; background:rgba(8,12,22,.92); display:none; align-items:center; justify-content:center; z-index:100; padding:24px; }
        .overlay.show { display:flex; }
        .ov-card { text-align:center; max-width:420px; width:100%; }
        .coin { width:120px; height:120px; margin:0 auto 22px; border-radius:50%;
                background:linear-gradient(135deg,#fde68a,#f59e0b); color:#7c2d12;
                display:flex; align-items:center; justify-content:center; font-size:52px; font-weight:900;
                box-shadow:0 10px 30px rgba(245,158,11,.5); animation:spin 0.7s linear infinite; }
        @keyframes spin { 0%{ transform:rotateY(0deg);} 100%{ transform:rotateY(360deg);} }
        .ov-ttl { font-size:30px; font-weight:900; margin-bottom:8px; }
        .ov-name { font-size:24px; font-weight:900; color:#fff; }
        .ov-sub { font-size:15px; color:#94a3b8; font-weight:700; margin-top:8px; }
        .ov-time { font-size:40px; font-weight:900; color:#fff; margin:14px 0; }
        .ov-ok .ov-ttl { color:#34d399; }
        .ov-dup .ov-ttl { color:#fbbf24; }
        .ov-cancel .ov-ttl { color:#f87171; }
        .ov-actions { display:flex; gap:12px; margin-top:24px; }
        .ov-btn { flex:1; padding:18px; border:none; border-radius:16px; font-size:18px; font-weight:900; cursor:pointer; }
        .ov-btn.red { background:#ef4444; color:#fff; } .ov-btn.gray { background:rgba(255,255,255,.12); color:#e2e8f0; }
        .ov-btn.green{ background:#22c55e; color:#fff; }
        .badge-done { display:inline-flex; width:120px;height:120px; margin:0 auto 22px; border-radius:50%; align-items:center; justify-content:center; font-size:58px; }
        .badge-ok { background:#064e3b; color:#34d399; } .badge-warn{ background:#451a03; color:#fbbf24; } .badge-cancel{ background:#450a0a; color:#f87171; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="ttl">KAC 항공기술훈련원 식당 <small>MEAL CHECK-IN</small></div>
        <div class="info">
            <div class="date" id="todayLabel">-</div>
            <div class="cnt" id="todayCount">오늘 식사 0명</div>
        </div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="overlay" id="overlay"><div class="ov-card" id="ovCard"></div></div>

<script>
const db = firebase.database();
let ROSTER = {};       // {id:{name,dept,active}}
let TODAY_CHECKS = {}; // checks/{today} 전체
const today = (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
const monthKey = today.slice(0,7);
function nowTime(){ return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }

document.getElementById('todayLabel').textContent = today + ' (' + ['일','월','화','수','목','금','토'][new Date().getDay()] + ')';

// 실시간 구독: 명단 + 오늘 체크 현황
db.ref('system/staffMeal/roster').on('value', s => { ROSTER = s.val() || {}; if (CURRENT==='staff') renderStaffList(); refreshCount(); });
db.ref(`system/staffMeal/checks/${today}`).on('value', s => { TODAY_CHECKS = s.val() || {}; if (CURRENT==='staff') renderStaffList(); refreshCount(); });

function refreshCount(){ document.getElementById('todayCount').textContent = '오늘 식사 ' + Object.keys(TODAY_CHECKS).length + '명'; }

let CURRENT = 'home';
const stage = document.getElementById('stage');

// ── 홈 ──
function goHome(){
    CURRENT='home';
    stage.innerHTML = `
        <div class="home">
            <h2>식사하실 분을 선택해 주세요</h2>
            <p>해당하는 구분을 누르면 식사 체크인 화면으로 이동합니다.</p>
            <div class="cat-grid">
                <div class="cat-btn cat-staff" onclick="goStaff()">
                    <div class="ico"><i class="fa-solid fa-id-badge"></i></div>
                    <div class="nm">항공기술훈련원 직원</div>
                    <div class="sub">명단에서 본인 이름 터치</div>
                </div>
                <div class="cat-btn cat-int" onclick="goInstructor('internal')">
                    <div class="ico"><i class="fa-solid fa-chalkboard-user"></i></div>
                    <div class="nm">사내 강사 (KAC)</div>
                    <div class="sub">사번 · 성함 입력</div>
                </div>
                <div class="cat-btn cat-ext" onclick="goInstructor('external')">
                    <div class="ico"><i class="fa-solid fa-user-tie"></i></div>
                    <div class="nm">사외 강사</div>
                    <div class="sub">연락처 · 성함 입력</div>
                </div>
            </div>
        </div>`;
}

// ── 직원 명단 ──
function goStaff(){ CURRENT='staff'; renderStaffList(); }
function renderStaffList(){
    if (CURRENT!=='staff') return;
    const items = Object.entries(ROSTER).filter(([id,r])=>r && r.active!==false)
        .sort((a,b)=> (a[1].name||'').localeCompare(b[1].name||'','ko'));
    const grid = items.length ? items.map(([id,r])=>{
        const done = !!TODAY_CHECKS[id];
        return `<button class="staff-btn ${done?'done':''}" onclick="tapStaff('${id}')">
                    <div class="s-nm">${esc(r.name||'')}</div>
                    <div class="s-dp">${esc(r.dept||'')}</div>
                </button>`;
    }).join('') : `<div class="empty">등록된 직원이 없습니다.<br>영양사 페이지에서 직원 명단을 추가해 주세요.</div>`;
    stage.innerHTML = `
        <div class="panel">
            <button class="back" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> 처음으로</button>
            <div class="screen-ttl">항공기술훈련원 직원</div>
            <div class="screen-sub">본인 이름을 누르면 식사가 처리됩니다. 잘못 눌렀을 때는 다시 누르면 취소됩니다.</div>
            <div class="staff-grid">${grid}</div>
        </div>`;
}

function tapStaff(id){
    const r = ROSTER[id]; if(!r) return;
    const ref = db.ref(`system/staffMeal/checks/${today}/${id}`);
    ref.once('value').then(s=>{
        if (s.exists()){
            // 이미 처리됨 → 취소 확인
            const prev = s.val();
            showCancelConfirm(r.name, prev.time, ()=> ref.remove());
        } else {
            spinThenSet(ref, { name:r.name, dept:r.dept||'', category:'staff', staffId:id, time:nowTime(), ts:firebase.database.ServerValue.TIMESTAMP, month:monthKey }, r.name, r.dept||'');
        }
    });
}

// ── 강사(사내/사외) 키패드 ──
let KP = { mode:'internal', num:'', name:'' };
function goInstructor(mode){
    CURRENT='instr'; KP={ mode, num:'', name:'' };
    const isInt = mode==='internal';
    stage.innerHTML = `
        <div class="keypad-wrap">
            <button class="back" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> 처음으로</button>
            <div class="screen-ttl">${isInt?'사내 강사 (KAC)':'사외 강사'}</div>
            <div class="screen-sub">${isInt?'사번과 성함을 입력해 주세요.':'연락처와 성함을 입력해 주세요.'}</div>
            <input class="name-input" id="kpName" type="text" placeholder="성함 입력 (예: 홍길동)" maxlength="12"
                   oninput="KP.name=this.value; syncSubmit()">
            <div class="kp-field active" id="kpNumField">
                <div class="lab">${isInt?'사번':'연락처'}</div>
                <div class="val ph" id="kpNumVal">${isInt?'사번을 입력하세요':'연락처를 입력하세요'}</div>
            </div>
            <div class="keypad">
                ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="key" onclick="kpPush('${n}')">${n}</div>`).join('')}
                <div class="key wide" onclick="kpBack()">⌫</div>
                <div class="key" onclick="kpPush('0')">0</div>
                <div class="key wide" onclick="kpClear()">전체삭제</div>
            </div>
            <button class="submit-btn" id="kpSubmit" disabled onclick="submitInstructor()"><i class="fa-solid fa-utensils"></i> 식사 체크인</button>
        </div>`;
}
function kpPush(d){ if(KP.num.length>=15) return; KP.num+=d; paintNum(); }
function kpBack(){ KP.num=KP.num.slice(0,-1); paintNum(); }
function kpClear(){ KP.num=''; paintNum(); }
function paintNum(){
    const el=document.getElementById('kpNumVal'); if(!el) return;
    if(KP.num){ el.textContent=KP.num; el.classList.remove('ph'); }
    else { el.textContent=(KP.mode==='internal'?'사번을 입력하세요':'연락처를 입력하세요'); el.classList.add('ph'); }
    syncSubmit();
}
function syncSubmit(){ const b=document.getElementById('kpSubmit'); if(b) b.disabled = !(KP.num.trim() && KP.name.trim()); }
function submitInstructor(){
    const name=KP.name.trim(), num=KP.num.trim(); if(!name||!num) return;
    const isInt = KP.mode==='internal';
    const key = (isInt?'int_':'ext_') + num.replace(/[^0-9]/g,'');
    const ref = db.ref(`system/staffMeal/checks/${today}/${key}`);
    ref.once('value').then(s=>{
        if (s.exists()){
            const prev=s.val();
            showCancelConfirm(prev.name||name, prev.time, ()=> ref.remove(), '이미 식사 처리된 ' + (isInt?'사번':'연락처') + '입니다.');
        } else {
            spinThenSet(ref, { name, category:isInt?'internal':'external', idValue:num, time:nowTime(), ts:firebase.database.ServerValue.TIMESTAMP, month:monthKey }, name, (isInt?'사번 ':'연락처 ')+num);
        }
    });
}

// ── 코인 회전 후 기록 ──
const overlay=document.getElementById('overlay'), ovCard=document.getElementById('ovCard');
function spinThenSet(ref, payload, name, sub){
    ovCard.className='ov-card';
    ovCard.innerHTML = `<div class="coin">₩</div><div class="ov-ttl" style="color:#fbbf24;">식수 처리 중…</div><div class="ov-name">${esc(name)}</div>`;
    overlay.classList.add('show');
    ref.set(payload).then(()=>{
        setTimeout(()=>{
            ovCard.className='ov-card ov-ok';
            ovCard.innerHTML = `<div class="badge-done badge-ok">✓</div>
                <div class="ov-ttl">식사 완료</div>
                <div class="ov-name">${esc(name)}</div>
                <div class="ov-sub">${esc(sub||'')}</div>
                <div class="ov-time">${payload.time}</div>
                <div class="ov-actions"><button class="ov-btn green" onclick="closeOverlay()">확인</button></div>`;
            autoClose();
        }, 850);
    }).catch(()=>{
        ovCard.className='ov-card ov-cancel';
        ovCard.innerHTML = `<div class="badge-done badge-cancel">!</div><div class="ov-ttl">처리 실패</div><div class="ov-sub">네트워크를 확인해 주세요.</div><div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">닫기</button></div>`;
    });
}
function showCancelConfirm(name, time, onCancel, msg){
    ovCard.className='ov-card ov-dup';
    ovCard.innerHTML = `<div class="badge-done badge-warn">!</div>
        <div class="ov-ttl">이미 처리됨</div>
        <div class="ov-name">${esc(name)}</div>
        <div class="ov-sub">${esc(msg||'오늘 이미 식사 처리되었습니다.')}<br>체크인 ${time||'-'}</div>
        <div class="ov-actions">
            <button class="ov-btn gray" onclick="closeOverlay()">유지</button>
            <button class="ov-btn red" id="ovCancelBtn">식사 취소</button>
        </div>`;
    overlay.classList.add('show');
    document.getElementById('ovCancelBtn').onclick = ()=>{
        onCancel();
        ovCard.className='ov-card ov-cancel';
        ovCard.innerHTML = `<div class="badge-done badge-cancel">✕</div><div class="ov-ttl">취소되었습니다</div><div class="ov-name">${esc(name)}</div><div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">확인</button></div>`;
        autoClose();
    };
}
let _ac=null;
function autoClose(){ clearTimeout(_ac); _ac=setTimeout(closeOverlay, 2200); }
function closeOverlay(){ clearTimeout(_ac); overlay.classList.remove('show'); if(CURRENT==='instr') goHome(); }

function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

goHome();
</script>
</body>
</html>
<!-- @build 20260612-125323 (식당 터치패널 키오스크(직원/사내·사외강사, 코인 애니메이션, 취소)) -->
