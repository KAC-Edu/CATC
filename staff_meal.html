<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAC 항공기술훈련원 식당 — 식사 체크인</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard',sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; }
        html,body { height:100%; }
        body { color:#1e293b; display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;
               background:#e8eef8;
               background-image:linear-gradient(rgba(37,99,235,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.05) 1px,transparent 1px);
               background-size:28px 28px; }
        .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 24px;
                  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#3b82f6 100%); color:#fff; flex-shrink:0;
                  box-shadow:0 6px 20px rgba(37,99,235,.25); }
        .topbar .ttl { font-size:20px; font-weight:900; letter-spacing:-.3px; }
        .topbar .ttl small { display:block; font-size:11px; color:#bfdbfe; font-weight:700; letter-spacing:1.5px; margin-top:3px; }
        .topbar .info { display:flex; align-items:center; gap:10px; }
        .htop-btn { display:inline-flex; align-items:center; gap:7px; height:44px; padding:0 15px; border-radius:11px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.14); color:#fff; font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap; transition:.12s; }
        .htop-btn:hover { background:rgba(255,255,255,.24); }
        .htop-btn.ext { background:rgba(245,158,11,.30); border-color:rgba(251,191,36,.55); }
        .htop-btn.acc { background:rgba(16,185,129,.28); border-color:rgba(52,211,153,.55); }
        .htop-btn.snd { width:44px; padding:0; justify-content:center; }
        .htop-btn.snd.off { opacity:.55; }
        .clock-pill { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28); border-radius:12px; padding:0 16px; height:44px; font-weight:900; font-size:16px; letter-spacing:.3px; color:#fff; }
        .clock-pill .ck-ap { font-size:12px; color:#bfdbfe; }
        .check-burst { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:9999; }
        .check-burst .cb { width:150px; height:150px; border-radius:50%; background:rgba(34,197,94,.96); color:#fff; display:flex; align-items:center; justify-content:center; font-size:78px; box-shadow:0 14px 44px rgba(34,197,94,.5); animation:cbpop .6s ease forwards; }
        @keyframes cbpop { 0%{transform:scale(.4); opacity:0;} 28%{transform:scale(1); opacity:1;} 68%{transform:scale(1); opacity:1;} 100%{transform:scale(1.12); opacity:0;} }
        .topbar .when { text-align:right; }
        .topbar .date { font-size:15px; font-weight:800; }
        .topbar .cnt  { font-size:13px; color:#bfdbfe; font-weight:800; margin-top:2px; }
        .nutri-btn { display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.4);
                     color:#fff; border-radius:12px; padding:10px 15px; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap; transition:background .15s; }
        .nutri-btn:hover { background:rgba(255,255,255,.28); }
        .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:28px 20px; overflow:auto; }

        /* 홈 */
        .home { width:100%; max-width:940px; text-align:center; }
        .home h2 { font-size:27px; font-weight:900; color:#0f172a; margin-bottom:8px; }
        .home p  { font-size:15px; color:#64748b; font-weight:700; margin-bottom:32px; }
        .cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
        .cat-btn { background:#fff; border:1.5px solid #e2e8f0; border-radius:24px; padding:36px 18px 30px; cursor:pointer;
                   box-shadow:0 8px 24px rgba(15,23,42,.07); transition:transform .12s, box-shadow .12s, border-color .15s; position:relative; overflow:hidden; }
        .cat-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; }
        .cat-staff::before{ background:linear-gradient(90deg,#059669,#34d399); }
        .cat-int::before  { background:linear-gradient(90deg,#2563eb,#60a5fa); }
        .cat-ext::before  { background:linear-gradient(90deg,#d97706,#fbbf24); }
        .cat-btn:hover { transform:translateY(-3px); box-shadow:0 14px 34px rgba(15,23,42,.12); }
        .cat-btn:active { transform:scale(.97); }
        .cat-btn .ico { width:74px; height:74px; margin:0 auto 16px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:34px; }
        .cat-staff .ico{ background:#ecfdf5; color:#059669; } .cat-int .ico{ background:#eff6ff; color:#2563eb; } .cat-ext .ico{ background:#fffbeb; color:#d97706; }
        .cat-btn .nm  { font-size:20px; font-weight:900; color:#0f172a; }
        .cat-btn .sub { font-size:12.5px; color:#64748b; font-weight:700; margin-top:7px; }
        @media (max-width:680px){ .cat-grid{ grid-template-columns:1fr; gap:14px; } }

        .back { display:inline-flex; align-items:center; gap:8px; background:#fff; border:1.5px solid #e2e8f0; color:#475569; border-radius:12px; padding:11px 18px; font-size:15px; font-weight:800; cursor:pointer; margin-bottom:20px; box-shadow:0 2px 8px rgba(15,23,42,.05); }
        .back:active { transform:scale(.97); }
        .screen-ttl { font-size:24px; font-weight:900; color:#0f172a; margin-bottom:4px; }
        .screen-sub { font-size:13px; color:#64748b; font-weight:700; margin-bottom:22px; }

        /* 직원 명단 */
        .panel { width:100%; max-width:980px; }
        .staff-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
        .staff-btn { position:relative; background:#fff; color:#0f172a; border:1.5px solid #e2e8f0; border-radius:18px; padding:22px 12px; cursor:pointer; text-align:center; transition:transform .1s, box-shadow .12s; box-shadow:0 4px 14px rgba(15,23,42,.06); }
        .staff-btn:hover { box-shadow:0 8px 20px rgba(15,23,42,.1); }
        .staff-btn:active { transform:scale(.96); }
        .staff-btn .s-nm { font-size:20px; font-weight:900; }
        .staff-btn .s-dp { font-size:12px; color:#64748b; font-weight:700; margin-top:4px; min-height:15px; }
        .staff-btn.done { background:#ecfdf5; border-color:#34d399; }
        .staff-btn.done::after { content:'✓ 식사완료'; position:absolute; top:8px; right:10px; font-size:11px; font-weight:900; color:#059669; }
        .empty { text-align:center; color:#94a3b8; font-weight:700; padding:60px 0; font-size:16px; }

        /* 강사 키패드 */
        .keypad-wrap { width:100%; max-width:460px; }
        .kp-field { background:#fff; color:#0f172a; border-radius:14px; padding:14px 16px; margin-bottom:12px; cursor:pointer; border:2px solid #e2e8f0; box-shadow:0 2px 8px rgba(15,23,42,.04); }
        .kp-field.active { border-color:#2563eb; }
        .kp-field .lab { font-size:11px; color:#64748b; font-weight:800; }
        .kp-field .val { font-size:22px; font-weight:900; min-height:28px; letter-spacing:1px; }
        .kp-field .val.ph { color:#cbd5e1; font-weight:700; letter-spacing:0; }
        .name-input { width:100%; padding:14px 16px; border-radius:14px; border:2px solid #e2e8f0; font-size:20px; font-weight:800; margin-bottom:12px; outline:none; box-shadow:0 2px 8px rgba(15,23,42,.04); }
        .name-input:focus { border-color:#2563eb; }
        .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
        .key { background:#fff; border:1.5px solid #e2e8f0; color:#1e293b; border-radius:14px; padding:20px 0; font-size:24px; font-weight:900; cursor:pointer; box-shadow:0 2px 8px rgba(15,23,42,.05); transition:background .1s; text-align:center; display:flex; align-items:center; justify-content:center; }
        .key:active { background:#eff6ff; }
        .key.wide { font-size:17px; color:#475569; }
        .submit-btn { width:100%; margin-top:14px; padding:18px; background:linear-gradient(135deg,#059669,#22c55e); color:#fff; border:none; border-radius:16px; font-size:19px; font-weight:900; cursor:pointer; box-shadow:0 8px 22px rgba(34,197,94,.32); }
        .submit-btn:active { opacity:.9; }
        .submit-btn:disabled { opacity:.45; box-shadow:none; }

        /* 오버레이 */
        .overlay { position:fixed; inset:0; background:rgba(15,23,42,.5); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:100; padding:24px; }
        .overlay.show { display:flex; }
        .ov-card { background:#fff; border-radius:26px; padding:36px 30px; text-align:center; max-width:430px; width:100%; box-shadow:0 30px 70px rgba(15,23,42,.35); }
        .coin { width:120px; height:120px; margin:0 auto 22px; border-radius:50%;
                background:linear-gradient(135deg,#fde68a,#f59e0b); color:#7c2d12;
                display:flex; align-items:center; justify-content:center; font-size:52px; font-weight:900;
                box-shadow:0 10px 30px rgba(245,158,11,.5); animation:spin .7s linear infinite; }
        @keyframes spin { 0%{transform:rotateY(0)} 100%{transform:rotateY(360deg)} }
        .ov-ttl { font-size:30px; font-weight:900; margin-bottom:8px; color:#0f172a; }
        .ov-name { font-size:24px; font-weight:900; color:#0f172a; }
        .ov-sub { font-size:15px; color:#64748b; font-weight:700; margin-top:8px; }
        .ov-time { font-size:42px; font-weight:900; color:#0f172a; margin:14px 0; }
        .ov-ok .ov-ttl { color:#059669; } .ov-dup .ov-ttl { color:#d97706; } .ov-cancel .ov-ttl { color:#dc2626; }
        .ov-actions { display:flex; gap:12px; margin-top:24px; }
        .ov-btn { flex:1; padding:18px; border:none; border-radius:16px; font-size:18px; font-weight:900; cursor:pointer; }
        .ov-btn.red { background:#ef4444; color:#fff; } .ov-btn.gray { background:#f1f5f9; color:#475569; } .ov-btn.green{ background:#22c55e; color:#fff; }
        .badge-done { display:inline-flex; width:120px; height:120px; margin:0 auto 22px; border-radius:50%; align-items:center; justify-content:center; font-size:58px; font-weight:900; }
        .badge-ok { background:#ecfdf5; color:#059669; } .badge-warn{ background:#fffbeb; color:#d97706; } .badge-cancel{ background:#fef2f2; color:#dc2626; }
        /* 직원 식수 표 */
        .meal-panel { width:100%; max-width:1080px; }
        .mtable-wrap { overflow-x:auto; border-radius:14px; box-shadow:0 8px 24px rgba(15,23,42,.08); }
        .meal-table { width:100%; border-collapse:collapse; background:#fff; }
        .meal-table thead tr { background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%); }
        .meal-table th { background:transparent; color:#fff; font-size:14px; font-weight:800; padding:14px 10px; white-space:nowrap; }
        .meal-table td { border:1px solid #e2e8f0; padding:17px 14px; text-align:center; font-size:17px; }
        .meal-table .dept-cell { background:#eff6ff; font-weight:900; color:#1e40af; font-size:15px; vertical-align:middle; white-space:nowrap; }
        .meal-table .pos-cell { color:#64748b; font-weight:700; white-space:nowrap; }
        .meal-table .name-cell { font-weight:900; color:#0f172a; white-space:nowrap; }
        .meal-table tbody tr:hover { background:#f8fafc; }
        .mchk { display:inline-flex; align-items:center; justify-content:center; width:50px; height:50px; border-radius:13px; border:2px solid #cbd5e1; background:#fff; color:#fff; cursor:pointer; font-size:24px; transition:transform .1s, background .12s, border-color .12s; }
        .mchk:active { transform:scale(.88); }
        .mchk.on { background:#22c55e; border-color:#16a34a; box-shadow:0 4px 12px rgba(34,197,94,.35); }
        .note-inp { width:100%; min-width:130px; border:1.5px solid #e2e8f0; border-radius:9px; padding:9px 11px; font-size:14px; font-weight:600; outline:none; }
        .note-inp:focus { border-color:#2563eb; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="ttl">KAC 항공기술훈련원 식당 <small>MEAL CHECK-IN</small></div>
        <div class="info">
            <div class="clock-pill" id="hdrClock">-</div>
            <div class="when"><div class="cnt" id="todayCount">오늘 식사 0명</div></div>
            <button class="htop-btn snd" id="sndToggle" onclick="toggleSound()" title="소리 켜기/끄기"><i class="fa-solid fa-volume-high"></i></button>
            <button class="htop-btn int" onclick="showInstrQr('internal')"><i class="fa-solid fa-qrcode"></i> 사내강사 QR</button>
            <button class="htop-btn ext" onclick="showInstrQr('external')"><i class="fa-solid fa-qrcode"></i> 사외강사 QR</button>
            <button class="htop-btn acc" onclick="showAccount()"><i class="fa-solid fa-building-columns"></i> 계좌입금</button>
            <button class="nutri-btn" onclick="location.href='nutritionist.html'"><i class="fa-solid fa-clipboard-list"></i> 영양사 관리</button>
        </div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="overlay" id="overlay"><div class="ov-card" id="ovCard"></div></div>

<script>
const db = firebase.database();
let ROSTER = {};       // {id:{name,dept,position,active}}
let TODAY_CHECKS = {}; // 점심: checks/{today}
let TODAY_BREAKFAST = {}; // 아침
let TODAY_DINNER = {};    // 저녁
let TODAY_NOTES = {};     // 비고
const today = (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
const monthKey = today.slice(0,7);
function nowTime(){ return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }

// 실시간 구독: 명단 + 오늘 체크 현황
db.ref('system/staffMeal/roster').on('value', s => { ROSTER = s.val() || {}; if (CURRENT==='staff') renderStaffList(); refreshCount(); });
db.ref(`system/staffMeal/checks/${today}`).on('value', s => { TODAY_CHECKS = s.val() || {}; if (CURRENT==='staff') renderStaffList(); refreshCount(); });
db.ref(`system/staffMeal/breakfast/${today}`).on('value', s => { TODAY_BREAKFAST = s.val() || {}; if (CURRENT==='staff') renderStaffList(); refreshCount(); });
db.ref(`system/staffMeal/dinner/${today}`).on('value', s => { TODAY_DINNER = s.val() || {}; if (CURRENT==='staff') renderStaffList(); refreshCount(); });
db.ref(`system/staffMeal/notes/${today}`).on('value', s => { TODAY_NOTES = s.val() || {}; if (CURRENT==='staff') renderStaffList(); });

function refreshCount(){
    const ppl = new Set();
    Object.keys(TODAY_BREAKFAST||{}).forEach(k=>ppl.add(k));
    Object.keys(TODAY_CHECKS||{}).forEach(k=>ppl.add(k));
    Object.keys(TODAY_DINNER||{}).forEach(k=>ppl.add(k));
    document.getElementById('todayCount').textContent = '오늘 식사 ' + ppl.size + '명';
}

let CURRENT = 'home';
const stage = document.getElementById('stage');

// ── 홈 ──
let MOBILE_MODE=null;   // QR로 폰 접속 시 'internal'|'external'
function goHome(){
    if(MOBILE_MODE){ showMobileDone(); return; }
    goStaff();   // 키오스크 홈 = 직원 식수체크 표
}

// ── 직원 명단 ──
function goStaff(){ CURRENT='staff'; renderStaffList(); }
function renderStaffList(){
    if (CURRENT!=='staff') return;
    const items = Object.entries(ROSTER).filter(([id,r])=>r && r.active!==false);
    let inner;
    if(!items.length){
        inner = `<div class="empty">등록된 직원이 없습니다.<br>영양사 페이지에서 직원 명단을 추가해 주세요.</div>`;
    } else {
        const groups = {};
        items.forEach(([id,r])=>{ const d=((r.dept||'').trim())||'(소속 미지정)'; (groups[d]||(groups[d]=[])).push([id,r]); });
        const depts = Object.keys(groups).sort((a,b)=>a.localeCompare(b,'ko'));
        let rows='';
        depts.forEach(d=>{
            const grp = groups[d].sort((a,b)=> (((a[1].order!=null?a[1].order:9999)-(b[1].order!=null?b[1].order:9999))) || (a[1].name||'').localeCompare(b[1].name||'','ko'));
            grp.forEach(([id,r],i)=>{
                const cell=(key,on)=>`<td class="c"><span class="mchk ${on?'on':''}" onclick="toggleMeal('${id}','${key}')">${on?'<i class="fa-solid fa-check"></i>':''}</span></td>`;
                rows += `<tr>
                    ${i===0?`<td class="dept-cell" rowspan="${grp.length}">${esc(d)}</td>`:''}
                    <td class="pos-cell">${esc(r.position||'-')}</td>
                    <td class="name-cell">${esc(r.name||'')}</td>
                    ${cell('b', !!TODAY_BREAKFAST[id])}
                    ${cell('l', !!TODAY_CHECKS[id])}
                    ${cell('d', !!TODAY_DINNER[id])}
                </tr>`;
            });
        });
        inner = `<div class="mtable-wrap"><table class="meal-table">
            <thead><tr><th>소속</th><th>직책</th><th>이름</th><th>아침</th><th>점심</th><th>저녁</th></tr></thead>
            <tbody>${rows}</tbody></table></div>`;
    }
    stage.innerHTML = `
        <div class="meal-panel">
            <div class="screen-ttl">항공기술훈련원 직원 식수 체크</div>
            <div class="screen-sub">본인 줄에서 <b>아침·점심·저녁</b> 칸을 눌러 체크하세요. 다시 누르면 취소됩니다. &nbsp;|&nbsp; 강사는 상단 <b>QR</b> 버튼을 이용해 주세요.</div>
            ${inner}
        </div>`;
}
function toggleMeal(id, key){
    const r = ROSTER[id]; if(!r) return;
    const TS = firebase.database.ServerValue.TIMESTAMP;
    const ref = key==='b' ? db.ref(`system/staffMeal/breakfast/${today}/${id}`)
              : key==='l' ? db.ref(`system/staffMeal/checks/${today}/${id}`)
              :             db.ref(`system/staffMeal/dinner/${today}/${id}`);
    const isOn = key==='b' ? !!TODAY_BREAKFAST[id] : key==='l' ? !!TODAY_CHECKS[id] : !!TODAY_DINNER[id];
    const labels = { b:'아침', l:'점심', d:'저녁' };
    if(isOn){
        confirmMealCancel(r.name, labels[key], ()=>{ ref.remove(); playSnd('cancel'); });
        return;
    }
    let payload;
    if(key==='b') payload={ name:r.name||'', dept:r.dept||'', position:r.position||'', ts:TS, month:monthKey };
    else if(key==='l') payload={ name:r.name||'', dept:r.dept||'', position:r.position||'', category:'staff', staffId:id, time:nowTime(), ts:TS, month:monthKey };
    else payload={ name:r.name||'', dept:r.dept||'', position:r.position||'', category:'staff', ts:TS };
    ref.set(payload);
    playSnd('sel'); flashCheck();
}
function confirmMealCancel(name, mealLabel, onYes){
    ovCard.className='ov-card ov-dup';
    ovCard.innerHTML = `<div class="badge-done badge-warn">!</div>
        <div class="ov-ttl">체크 취소</div>
        <div class="ov-name">${esc(name)} · ${esc(mealLabel)}</div>
        <div class="ov-sub">이미 체크된 항목입니다.<br>취소하시겠습니까?</div>
        <div class="ov-actions">
            <button class="ov-btn gray" onclick="closeOverlay()">유지</button>
            <button class="ov-btn red" id="ovMealCancelBtn">취소하기</button>
        </div>`;
    overlay.classList.add('show');
    document.getElementById('ovMealCancelBtn').onclick = ()=>{ onYes(); closeOverlay(); };
}
/* ── 시계 / 사운드 / 체크 애니메이션 ── */
function startClock(){
    const el=document.getElementById('hdrClock'); if(!el) return;
    const days=['일','월','화','수','목','금','토'];
    const tick=()=>{ const n=new Date(), p=x=>String(x).padStart(2,'0');
        let h=n.getHours(); const ap=h<12?'AM':'PM'; h=h%12||12;
        el.innerHTML=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())} (${days[n.getDay()]}) ${p(h)}:${p(n.getMinutes())}:${p(n.getSeconds())} <span class="ck-ap">${ap}</span>`; };
    tick(); setInterval(tick,1000);
}
let SOUND_ON = (()=>{ try{ return localStorage.getItem('kacMealSound')!=='off'; }catch(e){ return true; } })();
const SND = { sel:'선택.mp3', cancel:'취소.mp3' };
function playSnd(which){ if(!SOUND_ON) return; try{ const a=new Audio(encodeURI(SND[which])); a.volume=0.9; a.play().catch(()=>{}); }catch(e){} }
function applySoundIcon(){
    const b=document.getElementById('sndToggle'); if(!b) return;
    b.classList.toggle('off', !SOUND_ON);
    const ic=b.querySelector('i'); if(ic) ic.className = SOUND_ON ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
}
function toggleSound(){ SOUND_ON=!SOUND_ON; try{ localStorage.setItem('kacMealSound', SOUND_ON?'on':'off'); }catch(e){} applySoundIcon(); }
function flashCheck(){
    const w=document.createElement('div'); w.className='check-burst';
    w.innerHTML='<div class="cb"><i class="fa-solid fa-check"></i></div>';
    document.body.appendChild(w); setTimeout(()=>w.remove(), 660);
}
function saveNote(id, text){
    const r = ROSTER[id]; if(!r) return;
    const v=(text||'').trim();
    const ref=db.ref(`system/staffMeal/notes/${today}/${id}`);
    if(v) ref.set({ name:r.name||'', note:v, ts:firebase.database.ServerValue.TIMESTAMP }); else ref.remove();
}

function tapStaff(id){
    const r = ROSTER[id]; if(!r) return;
    const ref = db.ref(`system/staffMeal/checks/${today}/${id}`);
    ref.once('value').then(s=>{
        if (s.exists()){
            // 이미 처리됨 → 취소 확인
            const prev = s.val();
            showCancelConfirm(r.name, prev.time, ()=> ref.remove());
        } else {
            spinThenSet(ref, { name:r.name, dept:r.dept||'', category:'staff', staffId:id, time:nowTime(), ts:firebase.database.ServerValue.TIMESTAMP, month:monthKey }, r.name, r.dept||'');
        }
    });
}

// ── 강사(사내/사외) 키패드 ──
let KP = { mode:'internal', num:'', name:'' };
function goInstructor(mode){
    CURRENT='instr'; KP={ mode, num:'', name:'' };
    const isInt = mode==='internal';
    stage.innerHTML = `
        <div class="keypad-wrap">
            <button class="back" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> 처음으로</button>
            <div class="screen-ttl">${isInt?'사내 강사 (KAC)':'사외 강사'}</div>
            <div class="screen-sub">${isInt?'사번과 성함을 입력해 주세요.':'연락처와 성함을 입력해 주세요.'}</div>
            <input class="name-input" id="kpName" type="text" placeholder="성함 입력 (예: 홍길동)" maxlength="12"
                   oninput="KP.name=this.value; syncSubmit()">
            <div class="kp-field active" id="kpNumField">
                <div class="lab">${isInt?'사번':'연락처'}</div>
                <div class="val ph" id="kpNumVal">${isInt?'사번을 입력하세요':'연락처를 입력하세요'}</div>
            </div>
            <div class="keypad">
                ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="key" onclick="kpPush('${n}')">${n}</div>`).join('')}
                <div class="key wide" onclick="kpBack()">⌫</div>
                <div class="key" onclick="kpPush('0')">0</div>
                <div class="key wide" onclick="kpClear()">전체삭제</div>
            </div>
            <button class="submit-btn" id="kpSubmit" disabled onclick="submitInstructor()"><i class="fa-solid fa-utensils"></i> 식사 체크인</button>
        </div>`;
}
function kpPush(d){ if(KP.num.length>=15) return; KP.num+=d; paintNum(); }
function kpBack(){ KP.num=KP.num.slice(0,-1); paintNum(); }
function kpClear(){ KP.num=''; paintNum(); }
function paintNum(){
    const el=document.getElementById('kpNumVal'); if(!el) return;
    if(KP.num){ el.textContent=KP.num; el.classList.remove('ph'); }
    else { el.textContent=(KP.mode==='internal'?'사번을 입력하세요':'연락처를 입력하세요'); el.classList.add('ph'); }
    syncSubmit();
}
function syncSubmit(){ const b=document.getElementById('kpSubmit'); if(b) b.disabled = !(KP.num.trim() && KP.name.trim()); }
function submitInstructor(){
    const name=KP.name.trim(), num=KP.num.trim(); if(!name||!num) return;
    const isInt = KP.mode==='internal';
    const key = (isInt?'int_':'ext_') + num.replace(/[^0-9]/g,'');
    const ref = db.ref(`system/staffMeal/checks/${today}/${key}`);
    ref.once('value').then(s=>{
        if (s.exists()){
            const prev=s.val();
            showCancelConfirm(prev.name||name, prev.time, ()=> ref.remove(), '이미 식사 처리된 ' + (isInt?'사번':'연락처') + '입니다.');
        } else {
            spinThenSet(ref, { name, category:isInt?'internal':'external', idValue:num, time:nowTime(), ts:firebase.database.ServerValue.TIMESTAMP, month:monthKey }, name, (isInt?'사번 ':'연락처 ')+num);
        }
    });
}

// ── 코인 회전 후 기록 ──
const overlay=document.getElementById('overlay'), ovCard=document.getElementById('ovCard');
function spinThenSet(ref, payload, name, sub){
    ovCard.className='ov-card';
    ovCard.innerHTML = `<div class="coin">₩</div><div class="ov-ttl" style="color:#fbbf24;">식수 처리 중…</div><div class="ov-name">${esc(name)}</div>`;
    overlay.classList.add('show');
    ref.set(payload).then(()=>{
        setTimeout(()=>{
            const dkey = ref.key;
            ovCard.className='ov-card ov-ok';
            ovCard.innerHTML = `<div class="badge-done badge-ok">✓</div>
                <div class="ov-ttl">식사 완료</div>
                <div class="ov-name">${esc(name)}</div>
                <div class="ov-sub">${esc(sub||'')}</div>
                <div class="ov-time">${payload.time}</div>
                <div class="ov-sub" style="margin-top:6px; font-weight:800; color:#0f172a;">오늘 <b style="color:#d97706;">석식</b>도 드시나요?</div>
                <div class="ov-actions">
                    <button class="ov-btn gray" onclick="closeOverlay()">아니요</button>
                    <button class="ov-btn green" id="dinnerYes">네, 석식 신청</button>
                </div>`;
            const dy = document.getElementById('dinnerYes');
            if (dy) dy.onclick = ()=>{
                db.ref('system/staffMeal/dinner/'+today+'/'+dkey).set({ name, category: payload.category||'staff', ts: firebase.database.ServerValue.TIMESTAMP }).catch(()=>{});
                ovCard.className='ov-card ov-ok';
                ovCard.innerHTML = `<div class="badge-done badge-ok">🍚</div>
                    <div class="ov-ttl" style="color:#059669;">석식까지 신청 완료</div>
                    <div class="ov-name">${esc(name)}</div>
                    <div class="ov-sub">오늘 중식·석식 모두 식사 처리되었습니다.</div>
                    <div class="ov-actions"><button class="ov-btn green" onclick="closeOverlay()">확인</button></div>`;
                clearTimeout(_ac); _ac=setTimeout(closeOverlay, 2600);
            };
            clearTimeout(_ac); _ac=setTimeout(closeOverlay, 5000);
        }, 850);
    }).catch(()=>{
        ovCard.className='ov-card ov-cancel';
        ovCard.innerHTML = `<div class="badge-done badge-cancel">!</div><div class="ov-ttl">처리 실패</div><div class="ov-sub">네트워크를 확인해 주세요.</div><div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">닫기</button></div>`;
    });
}
function showCancelConfirm(name, time, onCancel, msg){
    ovCard.className='ov-card ov-dup';
    ovCard.innerHTML = `<div class="badge-done badge-warn">!</div>
        <div class="ov-ttl">이미 처리됨</div>
        <div class="ov-name">${esc(name)}</div>
        <div class="ov-sub">${esc(msg||'오늘 이미 식사 처리되었습니다.')}<br>체크인 ${time||'-'}</div>
        <div class="ov-actions">
            <button class="ov-btn gray" onclick="closeOverlay()">유지</button>
            <button class="ov-btn red" id="ovCancelBtn">식사 취소</button>
        </div>`;
    overlay.classList.add('show');
    document.getElementById('ovCancelBtn').onclick = ()=>{
        onCancel();
        ovCard.className='ov-card ov-cancel';
        ovCard.innerHTML = `<div class="badge-done badge-cancel">✕</div><div class="ov-ttl">취소되었습니다</div><div class="ov-name">${esc(name)}</div><div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">확인</button></div>`;
        autoClose();
    };
}
let _ac=null;
function autoClose(){ clearTimeout(_ac); _ac=setTimeout(closeOverlay, 2200); }
function closeOverlay(){ clearTimeout(_ac); overlay.classList.remove('show'); if(CURRENT==='instr') goHome(); }

/* ── 강사 QR 표시 (키오스크) ── */
function showInstrQr(mode){
    const isInt = mode==='internal';
    const url = new URL('staff_meal.html', location.href);
    url.searchParams.set('go', mode);
    ovCard.className='ov-card';
    ovCard.innerHTML = `
        <div class="ov-ttl" style="color:#0f172a;">${isInt?'사내 강사 (KAC)':'사외 강사'}</div>
        <div class="ov-sub" style="margin-bottom:16px;">스마트폰 카메라로 아래 QR을 스캔해<br><b>본인 휴대폰에서 직접 입력</b>해 주세요.</div>
        <div id="instrQr" style="display:flex; justify-content:center; padding:14px; background:#fff; border-radius:16px; border:1.5px solid #e2e8f0;"></div>
        <div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">닫기</button></div>`;
    overlay.classList.add('show');
    const box = document.getElementById('instrQr'); box.innerHTML='';
    try { new QRCode(box, { text:url.toString(), width:220, height:220, correctLevel:QRCode.CorrectLevel.M }); }
    catch(e){ box.textContent = url.toString(); }
}

/* ── 사외강사 계좌 안내 ── */
function showAccount(){
    db.ref('system/staffMeal/account').once('value').then(s=>{
        const v=s.val();
        const acc=(v&&typeof v==='object')?v:{ bank:'', number:(typeof v==='string'?v:''), holder:'' };
        const has=acc.number && String(acc.number).trim();
        const line = has ? `${esc(acc.bank||'')} <span style="user-select:all;">${esc(acc.number)}</span>${acc.holder?`<div style="font-size:14px;font-weight:700;color:#64748b;margin-top:6px;">예금주 ${esc(acc.holder)}</div>`:''}` : '';
        ovCard.className='ov-card';
        ovCard.innerHTML = `
            <div class="ov-ttl" style="color:#0f172a;">사외 강사 식대 계좌</div>
            <div class="ov-sub" style="margin-bottom:16px;">아래 계좌로 식대를 입금해 주세요.</div>
            <div style="font-size:23px; font-weight:900; color:#0f172a; background:#f0fdf4; border:1.5px solid #bbf7d0; border-radius:14px; padding:20px; line-height:1.4;">${has?line:'등록된 계좌가 없습니다.<br><span style="font-size:13px;font-weight:700;color:#64748b;">영양사 페이지에서 계좌를 입력해 주세요.</span>'}</div>
            <div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">닫기</button></div>`;
        overlay.classList.add('show');
    }).catch(()=>{});
}

/* ── 폰 입력 완료 화면 ── */
function showMobileDone(){
    CURRENT='done';
    stage.innerHTML = `
        <div class="home">
            <div class="ico" style="width:84px;height:84px;margin:0 auto 18px;border-radius:22px;background:#ecfdf5;color:#059669;display:flex;align-items:center;justify-content:center;font-size:40px;"><i class="fa-solid fa-circle-check"></i></div>
            <h2>식사 신청이 완료되었습니다</h2>
            <p>창을 닫으셔도 됩니다.</p>
            <div style="margin-top:20px;"><button class="back" onclick="goInstructor(MOBILE_MODE)"><i class="fa-solid fa-pen"></i> 다시 입력하기</button></div>
        </div>`;
}

/* ── 진입 분기: QR(폰) ↔ 키오스크 ── */
(function(){
    const go = new URLSearchParams(location.search).get('go');
    if(go==='internal' || go==='external'){ MOBILE_MODE=go; goInstructor(go); }
    else { goHome(); }
    startClock(); applySoundIcon();
})();

function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 초기 진입은 위의 ?go 분기에서 처리됨 */
