<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAC 항공기술훈련원 식당 — 식사 체크인</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Pretendard',sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; }
        html,body { height:100%; }
        body { color:#1e293b; display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;
               background:#e8eef8;
               background-image:linear-gradient(rgba(37,99,235,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.05) 1px,transparent 1px);
               background-size:28px 28px; }
        .topbar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:16px 24px;
                  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#3b82f6 100%); color:#fff; flex-shrink:0;
                  box-shadow:0 6px 20px rgba(37,99,235,.25); }
        .topbar .ttl { justify-self:start; min-width:0; max-width:48vw; line-height:1.22; }
        .topbar .ttl .ttl-h { font-size:19px; font-weight:900; letter-spacing:-.3px; white-space:nowrap; }
        .topbar .ttl .ttl-sub { font-size:12px; font-weight:700; color:#cfe0ff; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .topbar .ttl .ttl-sub b { color:#fff; }
        .topbar .ttl .ttl-sub .sep { opacity:.45; margin:0 5px; }
        .topbar #hdrClock { justify-self:center; }
        .topbar .info { justify-self:end; display:flex; align-items:center; gap:10px; }
        .htop-btn { display:inline-flex; align-items:center; gap:7px; height:44px; padding:0 15px; border-radius:11px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.14); color:#fff; font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap; transition:.12s; }
        .htop-btn:hover { background:rgba(255,255,255,.24); }
        .htop-btn.ext { background:rgba(245,158,11,.30); border-color:rgba(251,191,36,.55); }
        .htop-btn.acc { background:rgba(16,185,129,.28); border-color:rgba(52,211,153,.55); }
        .htop-btn.snd { width:44px; padding:0; justify-content:center; }
        .htop-btn.snd.off { opacity:.55; }
        /* ── 헤더 시계 (강사플랫폼 클론) ── */
        #hdrClock { display:inline-flex; align-items:center; gap:12px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13); border-radius:50px; padding:5px 20px; color:#fff; white-space:nowrap; }
        #hdrClock .clock-date { font-size:14px; font-weight:400; letter-spacing:.5px; opacity:.75; line-height:1; }
        #hdrClock .clock-day { font-size:13px; font-weight:600; opacity:.6; letter-spacing:.3px; }
        #hdrClock .clock-divider { width:1px; height:22px; background:rgba(255,255,255,.2); }
        #hdrClock .clock-time { font-size:26px; font-weight:800; font-family:'Consolas','Roboto Mono','SF Mono',monospace; letter-spacing:-.5px; line-height:1; color:#fff; }
        #hdrClock .clock-ampm { font-size:13px; font-weight:700; margin-left:5px; color:#60a5fa; letter-spacing:.5px; }
        #hdrClock .blink { animation:blink-animation 1s steps(2,start) infinite; }
        @keyframes blink-animation { to { visibility:hidden; } }
        .check-burst { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:9999; }
        .check-burst .cb { width:150px; height:150px; border-radius:50%; background:rgba(34,197,94,.96); color:#fff; display:flex; align-items:center; justify-content:center; font-size:78px; box-shadow:0 14px 44px rgba(34,197,94,.5); animation:cbpop .6s ease forwards; }
        @keyframes cbpop { 0%{transform:scale(.4); opacity:0;} 28%{transform:scale(1); opacity:1;} 68%{transform:scale(1); opacity:1;} 100%{transform:scale(1.12); opacity:0;} }
        .mchk.locked { background:#f1f5f9; border-color:#e2e8f0; color:#cbd5e1; cursor:not-allowed; }
        .mchk.locked i { color:#cbd5e1; font-size:18px; }
        .mchk.on.resv { background:#f59e0b; border-color:#d97706; box-shadow:0 4px 12px rgba(245,158,11,.45); }
        .kio-toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px); background:#0f172a; color:#fff; padding:14px 24px; border-radius:14px; font-weight:800; font-size:16px; opacity:0; pointer-events:none; transition:.2s; z-index:10000; box-shadow:0 12px 32px rgba(0,0,0,.3); }
        .kio-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .topbar .when { text-align:right; }
        .topbar .date { font-size:15px; font-weight:800; }
        .topbar .cnt  { font-size:13px; color:#bfdbfe; font-weight:800; margin-top:2px; }
        .nutri-btn { display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.4);
                     color:#fff; border-radius:12px; padding:10px 15px; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap; transition:background .15s; }
        .nutri-btn:hover { background:rgba(255,255,255,.28); }
        .nutri-btn { position:relative; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none; }
        .nutri-btn.holding { background:rgba(251,191,36,.30); border-color:rgba(251,191,36,.9); }
        .nutri-btn .nb-fill { position:absolute; left:0; bottom:0; height:4px; width:0; background:#fbbf24; box-shadow:0 0 6px rgba(251,191,36,.8); }
        /* ── 좁은 화면(세로형 태블릿 등): 안내문구 숨김·버튼 축소, 더 좁으면 시계 숨김 ── */
        @media (max-width:1100px){
            .topbar { padding:12px 16px; gap:10px; }
            .topbar .ttl { max-width:44vw; }
            .topbar .ttl .ttl-sub { display:none; }
            .topbar .ttl .ttl-h { font-size:17px; }
            .topbar .info { gap:8px; }
            .topbar .info .htop-btn, .topbar .info .nutri-btn { padding:0 12px; height:42px; font-size:13px; }
            #hdrClock { padding:4px 14px; gap:9px; }
            #hdrClock .clock-time { font-size:22px; }
            #hdrClock .clock-date { font-size:13px; }
        }
        @media (max-width:860px){
            .topbar { grid-template-columns:1fr auto; }
            .topbar #hdrClock { display:none; }
            .topbar .info { justify-self:end; }
            .topbar .ttl { max-width:none; }
        }
        /* ── 휴대폰(QR 강사 접속): 상단 단순화 + 키패드 한 화면 ── */
        @media (max-width:560px){
            .topbar { grid-template-columns:1fr; gap:0; padding:9px 14px; }
            .topbar .ttl { max-width:none; }
            .topbar .ttl .ttl-h { font-size:16px; white-space:normal; line-height:1.2; }
            .topbar .ttl .ttl-sub { display:none; }
            .topbar .info { display:none; }       /* 강사 접속 시 관리 버튼 숨김 */
            .topbar #hdrClock { display:none; }
            .stage { padding:12px 14px 20px; }
            .keypad-wrap { max-width:none; }
            .back { margin-bottom:12px; padding:8px 14px; font-size:14px; }
            .screen-ttl { font-size:20px; }
            .screen-sub { font-size:12.5px; margin-bottom:12px; }
            .name-input { padding:11px 14px; font-size:17px; margin-bottom:9px; }
            .kp-field { padding:9px 14px; margin-bottom:9px; }
            .kp-field .val { font-size:19px; min-height:24px; }
            .keypad { gap:7px; margin-top:4px; }
            .key { padding:11px 0; font-size:20px; border-radius:12px; }
            .key.wide { font-size:14px; }
            .submit-btn { padding:13px; font-size:17px; margin-top:10px; border-radius:14px; }
            #__ver { font-size:8px; padding:2px 5px; opacity:.5; }
        }
        .stage { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:18px 20px 30px; overflow:auto; }

        /* ── 환경설정 팝업 ── */
        .set-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 4px; border-bottom:1px solid #eef2f7; text-align:left; }
        .set-row:first-of-type { border-top:1px solid #eef2f7; margin-top:18px; }
        .set-label { font-size:16px; font-weight:800; color:#0f172a; }
        .set-label i { color:#2563eb; margin-right:7px; }
        .set-hint { display:block; font-size:12px; font-weight:700; color:#94a3b8; margin-top:4px; }
        .set-toggle { flex-shrink:0; min-width:80px; padding:11px 16px; border:none; border-radius:12px; font-size:15px; font-weight:900; cursor:pointer; background:#e2e8f0; color:#64748b; transition:.12s; }
        .set-toggle.on { background:#22c55e; color:#fff; box-shadow:0 4px 12px rgba(34,197,94,.3); }
        .set-toggle.danger { background:#fef2f2; color:#dc2626; box-shadow:none; }
        .set-toggle.danger:active { background:#fee2e2; }
        /* ── 테스트 모드 배너 ── */
        .test-banner { background:#fffbeb; border:1.5px solid #fcd34d; color:#b45309; border-radius:12px; padding:11px 16px; font-size:13.5px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:9px; }
        .test-banner i { color:#d97706; }
        .test-banner span { flex:1; min-width:0; }
        .test-banner .tb-end { flex-shrink:0; border:none; background:#d97706; color:#fff; font-weight:900; font-size:13px; padding:8px 14px; border-radius:10px; cursor:pointer; }
        .test-banner .tb-end:active { opacity:.9; }
        /* ── 범례 ── */
        .meal-legend { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin-bottom:12px; padding:9px 14px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; font-size:13px; font-weight:700; color:#475569; box-shadow:0 2px 8px rgba(15,23,42,.05); }
        .meal-legend .lg-item { display:inline-flex; align-items:center; gap:7px; }
        .lg-sw { width:24px; height:24px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; border:2px solid #cbd5e1; background:#fff; color:#fff; }
        .lg-sw.lg-on { background:#22c55e; border-color:#16a34a; }
        .lg-sw.lg-resv { background:#f59e0b; border-color:#d97706; }
        .lg-sw.lg-empty { background:#fff; }
        .lg-sw.lg-lock { background:#f1f5f9; border-color:#e2e8f0; color:#cbd5e1; }
        .meal-legend .lg-div { width:1px; height:18px; background:#e2e8f0; }
        .meal-legend .lg-note { color:#94a3b8; font-weight:700; }
        .meal-legend .lg-status { font-weight:800; }
        .lg-status .ms-open { color:#16a34a; } .lg-status .ms-open i { font-size:8px; vertical-align:middle; margin-right:4px; }
        .lg-status .ms-wait { color:#64748b; } .lg-status .ms-wait i { margin-right:4px; }
        .lg-status .ms-test { color:#b45309; } .lg-status .ms-test i { margin-right:4px; }
        /* ── 되돌리기 스낵바 ── */
        .kio-undo { position:fixed; left:50%; bottom:38px; transform:translateX(-50%) translateY(20px); background:#0f172a; color:#fff; padding:12px 14px 12px 22px; border-radius:16px; font-weight:800; font-size:17px; opacity:0; pointer-events:none; transition:.2s; z-index:10000; box-shadow:0 14px 36px rgba(0,0,0,.35); display:flex; align-items:center; gap:18px; }
        .kio-undo.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
        .kio-undo .ku-btn { border:none; background:#f59e0b; color:#fff; font-weight:900; font-size:16px; padding:11px 20px; border-radius:11px; cursor:pointer; white-space:nowrap; }
        .kio-undo .ku-btn:active { opacity:.9; }
        /* ── 석식예약 열 구분 (식사 기록 ↔ 예약) ── */
        .meal-table th.sep, .meal-table td.sep { border-left:2px solid #f59e0b; }
        .meal-table th.sep { background:#b45309; }
        /* ── 헤더 고정(틀고정): 명단이 화면보다 길 때 ── */
        .meal-table thead th { position:sticky; top:0; z-index:5; background:#1e40af; }
        .meal-table thead th.sep { background:#b45309; }
        /* ── 전체화면 해제 진행 표시 ── */
        #fsHold { position:fixed; inset:0; display:none; align-items:flex-start; justify-content:center; z-index:10001; pointer-events:none; }
        #fsHold.show { display:flex; }
        #fsHold .fsh-card { margin-top:20px; background:rgba(15,23,42,.92); color:#fff; padding:12px 18px; border-radius:14px; display:flex; align-items:center; gap:11px; font-weight:800; font-size:14px; box-shadow:0 12px 32px rgba(0,0,0,.35); }
        #fsHold .fsh-card i { color:#60a5fa; }
        #fsHold .fsh-track { width:120px; height:6px; background:rgba(255,255,255,.22); border-radius:6px; overflow:hidden; }
        #fsHold .fsh-bar { width:0%; height:100%; background:#60a5fa; }

        /* 홈 */
        .home { width:100%; max-width:940px; text-align:center; }
        .home h2 { font-size:27px; font-weight:900; color:#0f172a; margin-bottom:8px; }
        .home p  { font-size:15px; color:#64748b; font-weight:700; margin-bottom:32px; }
        .cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
        .cat-btn { background:#fff; border:1.5px solid #e2e8f0; border-radius:24px; padding:36px 18px 30px; cursor:pointer;
                   box-shadow:0 8px 24px rgba(15,23,42,.07); transition:transform .12s, box-shadow .12s, border-color .15s; position:relative; overflow:hidden; }
        .cat-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; }
        .cat-staff::before{ background:linear-gradient(90deg,#059669,#34d399); }
        .cat-int::before  { background:linear-gradient(90deg,#2563eb,#60a5fa); }
        .cat-ext::before  { background:linear-gradient(90deg,#d97706,#fbbf24); }
        .cat-btn:hover { transform:translateY(-3px); box-shadow:0 14px 34px rgba(15,23,42,.12); }
        .cat-btn:active { transform:scale(.97); }
        .cat-btn .ico { width:74px; height:74px; margin:0 auto 16px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:34px; }
        .cat-staff .ico{ background:#ecfdf5; color:#059669; } .cat-int .ico{ background:#eff6ff; color:#2563eb; } .cat-ext .ico{ background:#fffbeb; color:#d97706; }
        .cat-btn .nm  { font-size:20px; font-weight:900; color:#0f172a; }
        .cat-btn .sub { font-size:12.5px; color:#64748b; font-weight:700; margin-top:7px; }
        @media (max-width:680px){ .cat-grid{ grid-template-columns:1fr; gap:14px; } }

        .back { display:inline-flex; align-items:center; gap:8px; background:#fff; border:1.5px solid #e2e8f0; color:#475569; border-radius:12px; padding:11px 18px; font-size:15px; font-weight:800; cursor:pointer; margin-bottom:20px; box-shadow:0 2px 8px rgba(15,23,42,.05); }
        .back:active { transform:scale(.97); }
        .screen-ttl { font-size:24px; font-weight:900; color:#0f172a; margin-bottom:4px; }
        .screen-sub { font-size:13px; color:#64748b; font-weight:700; margin-bottom:22px; }

        /* 직원 명단 */
        .panel { width:100%; max-width:980px; }
        .staff-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
        .staff-btn { position:relative; background:#fff; color:#0f172a; border:1.5px solid #e2e8f0; border-radius:18px; padding:22px 12px; cursor:pointer; text-align:center; transition:transform .1s, box-shadow .12s; box-shadow:0 4px 14px rgba(15,23,42,.06); }
        .staff-btn:hover { box-shadow:0 8px 20px rgba(15,23,42,.1); }
        .staff-btn:active { transform:scale(.96); }
        .staff-btn .s-nm { font-size:20px; font-weight:900; }
        .staff-btn .s-dp { font-size:12px; color:#64748b; font-weight:700; margin-top:4px; min-height:15px; }
        .name-cell { cursor:pointer; }
        .name-cell:hover { color:#2563eb; text-decoration:underline; }
        .staff-btn.done { background:#ecfdf5; border-color:#34d399; }
        .staff-btn.done::after { content:'✓ 식사완료'; position:absolute; top:8px; right:10px; font-size:11px; font-weight:900; color:#059669; }
        .empty { text-align:center; color:#94a3b8; font-weight:700; padding:60px 0; font-size:16px; }

        /* 강사 키패드 */
        .keypad-wrap { width:100%; max-width:460px; }
        .kp-field { background:#fff; color:#0f172a; border-radius:14px; padding:14px 16px; margin-bottom:12px; cursor:pointer; border:2px solid #e2e8f0; box-shadow:0 2px 8px rgba(15,23,42,.04); }
        .kp-field.active { border-color:#2563eb; }
        .kp-field .lab { font-size:11px; color:#64748b; font-weight:800; }
        .kp-field .val { font-size:22px; font-weight:900; min-height:28px; letter-spacing:1px; }
        .kp-field .val.ph { color:#cbd5e1; font-weight:700; letter-spacing:0; }
        .name-input { width:100%; padding:14px 16px; border-radius:14px; border:2px solid #e2e8f0; font-size:20px; font-weight:800; margin-bottom:12px; outline:none; box-shadow:0 2px 8px rgba(15,23,42,.04); }
        .name-input:focus { border-color:#2563eb; }
        .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
        .key { background:#fff; border:1.5px solid #e2e8f0; color:#1e293b; border-radius:14px; padding:20px 0; font-size:24px; font-weight:900; cursor:pointer; box-shadow:0 2px 8px rgba(15,23,42,.05); transition:background .1s; text-align:center; display:flex; align-items:center; justify-content:center; }
        .key:active { background:#eff6ff; }
        .key.wide { font-size:17px; color:#475569; }
        .submit-btn { width:100%; margin-top:14px; padding:18px; background:linear-gradient(135deg,#059669,#22c55e); color:#fff; border:none; border-radius:16px; font-size:19px; font-weight:900; cursor:pointer; box-shadow:0 8px 22px rgba(34,197,94,.32); }
        .submit-btn:active { opacity:.9; }
        .submit-btn:disabled { opacity:.45; box-shadow:none; }

        /* 오버레이 */
        .overlay { position:fixed; inset:0; background:rgba(15,23,42,.5); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:100; padding:24px; }
        .overlay.show { display:flex; }
        .ov-card { background:#fff; border-radius:26px; padding:36px 30px; text-align:center; max-width:430px; width:100%; box-shadow:0 30px 70px rgba(15,23,42,.35); }
        .ov-card.ext-acct-card { max-width:500px; padding:34px 30px; }
        .ov-card.pat-card { max-width:380px; }
        .pat-pad { position:relative; width:240px; height:240px; margin:6px auto 4px; touch-action:none; user-select:none; -webkit-user-select:none; }
        .pat-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
        .pat-dot { position:absolute; width:22px; height:22px; border-radius:50%; background:#cbd5e1; transform:translate(-50%,-50%); box-shadow:0 0 0 8px rgba(203,213,225,.18); transition:background .1s, box-shadow .1s; pointer-events:none; }
        .pat-dot.on { background:#2563eb; box-shadow:0 0 0 11px rgba(37,99,235,.22); }
        .pw-dots { font-size:34px; font-weight:900; letter-spacing:12px; color:#0f172a; min-height:46px; margin-bottom:14px; }
        .pw-keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:300px; margin:0 auto; }
        .pw-key { height:62px; border:1.5px solid #e2e8f0; background:#fff; border-radius:14px; font-size:23px; font-weight:800; color:#0f172a; cursor:pointer; }
        .pw-key:active { background:#eff6ff; }
        .pw-key.pw-ok { background:#2563eb; color:#fff; border-color:#2563eb; font-size:17px; }
        .pw-key.pw-del { color:#64748b; }
        .coin { width:120px; height:120px; margin:0 auto 22px; border-radius:50%;
                background:linear-gradient(135deg,#fde68a,#f59e0b); color:#7c2d12;
                display:flex; align-items:center; justify-content:center; font-size:52px; font-weight:900;
                box-shadow:0 10px 30px rgba(245,158,11,.5); animation:spin .7s linear infinite; }
        @keyframes spin { 0%{transform:rotateY(0)} 100%{transform:rotateY(360deg)} }
        .ov-ttl { font-size:30px; font-weight:900; margin-bottom:8px; color:#0f172a; }
        .ov-name { font-size:24px; font-weight:900; color:#0f172a; }
        .ov-sub { font-size:15px; color:#64748b; font-weight:700; margin-top:8px; }
        .ov-time { font-size:42px; font-weight:900; color:#0f172a; margin:14px 0; }
        .ov-ok .ov-ttl { color:#059669; } .ov-dup .ov-ttl { color:#d97706; } .ov-cancel .ov-ttl { color:#dc2626; }
        .ov-actions { display:flex; gap:12px; margin-top:24px; }
        .ov-btn { flex:1; padding:18px; border:none; border-radius:16px; font-size:18px; font-weight:900; cursor:pointer; }
        .ov-btn.red { background:#ef4444; color:#fff; } .ov-btn.gray { background:#f1f5f9; color:#475569; } .ov-btn.green{ background:#22c55e; color:#fff; }
        .badge-done { display:inline-flex; width:120px; height:120px; margin:0 auto 22px; border-radius:50%; align-items:center; justify-content:center; font-size:58px; font-weight:900; }
        .badge-ok { background:#ecfdf5; color:#059669; } .badge-warn{ background:#fffbeb; color:#d97706; } .badge-cancel{ background:#fef2f2; color:#dc2626; }
        /* 직원 식수 표 */
        .meal-panel { width:100%; max-width:1100px; }
        .meal-panel.two { max-width:1720px; }
        .split-wrap { display:flex; gap:16px; align-items:flex-start; justify-content:center; }
        .split-wrap .mtable-wrap { flex:1 1 0; min-width:0; }
        @media (max-width:820px){ .split-wrap { flex-direction:column; } }
        .mtable-wrap { overflow:visible; border-radius:14px; box-shadow:0 8px 24px rgba(15,23,42,.08); }
        .meal-table thead th:first-child { border-top-left-radius:14px; }
        .meal-table thead th:last-child { border-top-right-radius:14px; }
        .meal-table { width:100%; border-collapse:collapse; background:#fff;
            --row-h:60px; --chk:46px; --name-fz:18px; --pos-fz:15px; --dept-fz:15px; }
        .meal-table thead tr { background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%); }
        .meal-table th { background:transparent; color:#fff; font-size:15px; font-weight:800; padding:11px 10px; white-space:nowrap; }
        .meal-table td { border:1px solid #e2e8f0; padding:0 12px; height:var(--row-h); text-align:center; font-size:17px; }
        .meal-table tbody tr:nth-child(even) { background:#f8fafc; }   /* 줄무늬: 본인 줄 찾기 쉽게 */
        .meal-table tbody tr:hover { background:#eef4ff; }
        .meal-table td.c { cursor:pointer; padding:0; }
        .meal-table td.c.locked { cursor:not-allowed; }
        .meal-table .dept-cell { background:#eff6ff; font-weight:900; color:#1e40af; font-size:var(--dept-fz); vertical-align:middle; white-space:nowrap; letter-spacing:.04em; }
        .meal-table .pos-cell { color:#334155; font-weight:700; font-size:var(--pos-fz); white-space:nowrap; }
        .meal-table .name-cell { font-weight:900; color:#0f172a; font-size:var(--name-fz); white-space:nowrap; letter-spacing:.26em; padding-left:.26em; }
        .mchk { display:inline-flex; vertical-align:middle; align-items:center; justify-content:center; width:var(--chk); height:var(--chk); border-radius:13px; border:2px solid #cbd5e1; background:#fff; color:#fff; font-size:calc(var(--chk) * .5); transition:transform .1s, background .12s, border-color .12s; pointer-events:none; }
        .meal-table td.c:active .mchk { transform:scale(.88); }
        .mchk.on { background:#22c55e; border-color:#16a34a; box-shadow:0 4px 12px rgba(34,197,94,.35); }
        .note-inp { width:100%; min-width:130px; border:1.5px solid #e2e8f0; border-radius:9px; padding:9px 11px; font-size:14px; font-weight:600; outline:none; }
        .note-inp:focus { border-color:#2563eb; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="ttl">
            <div class="ttl-h">항공기술훈련원 직원 식수 체크</div>
            <div class="ttl-sub">본인 줄에서 <b>아침·점심·저녁</b> 칸을 눌러 체크하세요. 다시 누르면 취소됩니다. <span class="sep">|</span> 강사는 상단 <b>QR</b> 버튼을 이용해 주세요.</div>
        </div>
        <div id="hdrClock">-</div>
        <div class="info">
            <button class="htop-btn snd" id="fsBtn" title="전체화면"><i class="fa-solid fa-expand"></i></button>
            <button class="htop-btn snd" id="settingsBtn" onclick="openSettings()" title="환경설정"><i class="fa-solid fa-gear"></i></button>
            <button class="htop-btn int" onclick="showInstrQr('internal')"><i class="fa-solid fa-id-card-clip"></i> KAC 임직원</button>
            <button class="htop-btn ext" onclick="showInstrQr('external')"><i class="fa-solid fa-user-tie"></i> 사외 강사</button>
            <button class="nutri-btn" id="nutriBtn" title="3초간 꾹 누르면 영양사 관리로 이동합니다" onpointerdown="nutriDown(event)" onpointerup="nutriUp()" onpointerleave="nutriUp()" onpointercancel="nutriUp()" oncontextmenu="return false;"><i class="fa-solid fa-clipboard-list"></i> 영양사 관리<span class="nb-fill" id="nbFill"></span></button>
        </div>
    </div>
    <div class="stage" id="stage"></div>
    <div id="fsHold"><div class="fsh-card"><i class="fa-solid fa-compress"></i><span>전체화면 해제 중…</span><div class="fsh-track"><div class="fsh-bar" id="fsHoldBar"></div></div></div></div>
    <div class="overlay" id="overlay"><div class="ov-card" id="ovCard"></div></div>

<script>
const db = firebase.database();
let ROSTER = {};       // {id:{name,dept,position,active}}
let TODAY_CHECKS = {}; // 점심: checks/{today}
let TODAY_BREAKFAST = {}; // 아침
let TODAY_DINNER = {};    // 저녁
let TODAY_NOTES = {};     // 비고
let TODAY_RESV = {};      // 석식 예약
const today = (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
const monthKey = today.slice(0,7);
function nowTime(){ return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }

// 실시간 구독: 명단 + 오늘 체크 현황
let _deptOrder = {};
db.ref('system/staffMeal/deptOrder').on('value', s => { _deptOrder = s.val() || {}; if (CURRENT==='staff') renderStaffList(); });
let WEEKEND_OK = (()=>{ try{ return localStorage.getItem('kacMealWeekend')==='on'; }catch(e){ return false; } })();   // 주말(토·일) 식사 허용 — Firebase 공유
db.ref('system/staffMeal/config/weekendOk').on('value', s => { WEEKEND_OK = (s.val()===true); try{ localStorage.setItem('kacMealWeekend', WEEKEND_OK?'on':'off'); }catch(e){} if (CURRENT==='staff') renderStaffList(); if(typeof updateMealStatus==='function') updateMealStatus(); });
db.ref('system/staffMeal/roster').on('value', s => { ROSTER = s.val() || {}; if (CURRENT==='staff') renderStaffList(); refreshCount(); });
db.ref(`system/staffMeal/checks/${today}`).on('value', s => { TODAY_CHECKS = s.val() || {}; if (CURRENT==='staff') renderStaffList(); refreshCount(); });
db.ref(`system/staffMeal/breakfast/${today}`).on('value', s => { TODAY_BREAKFAST = s.val() || {}; if (CURRENT==='staff') renderStaffList(); refreshCount(); });
db.ref(`system/staffMeal/dinner/${today}`).on('value', s => { TODAY_DINNER = s.val() || {}; if (CURRENT==='staff') renderStaffList(); refreshCount(); });
db.ref(`system/staffMeal/notes/${today}`).on('value', s => { TODAY_NOTES = s.val() || {}; });
db.ref(`system/staffMeal/dinner_resv/${today}`).on('value', s => { TODAY_RESV = s.val() || {}; if (CURRENT==='staff') renderStaffList(); });

function refreshCount(){ /* 상단 '오늘 식사 N명' 표기 제거됨 */ }

let CURRENT = 'home';
const stage = document.getElementById('stage');

// ── 홈 ──
let MOBILE_MODE=null;   // QR로 폰 접속 시 'internal'|'external'
function goHome(){
    if(MOBILE_MODE){ showMobileDone(); return; }
    goStaff();   // 키오스크 홈 = 직원 식수체크 표
}

// ── 직원 명단 ──
function goStaff(){ CURRENT='staff'; renderStaffList(); }
let _countTimer=null;
function renderStaffList(){
    if (CURRENT!=='staff') return;
    const items = Object.entries(ROSTER).filter(([id,r])=>r && r.active!==false);
    const TEST_BANNER = TEST_MODE ? '<div class="test-banner"><i class="fa-solid fa-flask"></i> <span>테스트 모드 — 모든 칸 체크 가능 (실제 기록됨)</span> <button class="tb-end" onclick="toggleTest()">테스트 종료</button></div>' : '';
    if(!items.length){
        stage.innerHTML = `<div class="meal-panel">${TEST_BANNER}<div class="empty">등록된 직원이 없습니다.<br>영양사 페이지에서 직원 명단을 추가해 주세요.</div></div>`;
        return;
    }
    const deptOf = r => (((r.dept||'').trim()) || '(소속 미지정)');
    // 부서별 그룹 → 부서 정렬(영양사 명단과 동일: 먼저 등록한 소속 먼저) → 부서 내 order 정렬 → 한 줄로 평탄화
    const groups = {};
    items.forEach(([id,r])=>{ const d=deptOf(r); (groups[d]||(groups[d]=[])).push([id,r]); });
    const _deptFirst={};
    Object.entries(groups).forEach(([d,arr])=>{ _deptFirst[d]=Math.min.apply(null, arr.map(([id,r])=>(r.createdAt!=null?r.createdAt:Infinity))); });
    const _drank=(d,fc)=>{ const o=_deptOrder[(d||'').trim()]; if(o!=null) return o; const v=(fc==null||fc===Infinity)?9e14:fc; return 1e15+v; };
    const depts = Object.keys(groups).sort((a,b)=> (_drank(a,_deptFirst[a])-_drank(b,_deptFirst[b])) || a.localeCompare(b,'ko'));
    const flat = [];
    const _en=r=>{const v=((r&&r.empNo)||'').toString().trim();if(!v)return Infinity;const n=parseInt(v.replace(/\D/g,''),10);return isNaN(n)?Infinity:n;};
    depts.forEach(d=>{
        groups[d].sort((a,b)=> (_en(a[1])-_en(b[1])) || ((a[1].order!=null?a[1].order:9999)-(b[1].order!=null?b[1].order:9999)) || (a[1].name||'').localeCompare(b[1].name||'','ko'))
            .forEach(x=>flat.push(x));
    });

    const cell=(id,key,on)=>{
        const act=isActive(key);
        const cls='mchk'+(on?' on':'')+(key==='r'?' resv':'')+(act?'':' locked');
        const oc=act?`toggleMeal('${id}','${key}')`:`lockMsg('${key}')`;
        const ic = on ? '<i class="fa-solid fa-check"></i>' : (act?'':'<i class="fa-solid fa-lock"></i>');
        return `<td class="c${key==='r'?' sep':''}${act?'':' locked'}" onclick="${oc}"><span class="${cls}">${ic}</span></td>`;
    };
    // 한 컬럼(슬라이스)을 부서 묶음(rowspan) 표로 — 열: 아침·점심·석식·석식예약
    const rowsOf=(arr)=>{
        let html='', i=0;
        while(i<arr.length){
            const dept=deptOf(arr[i][1]);
            let j=i; while(j<arr.length && deptOf(arr[j][1])===dept) j++;
            const run=j-i;
            for(let k=i;k<j;k++){
                const [id,r]=arr[k];
                html += `<tr>
                    ${k===i?`<td class="dept-cell" rowspan="${run}">${esc(dept)}</td>`:''}
                    <td class="pos-cell">${esc(r.position||'-')}</td>
                    <td class="name-cell" onclick="showMyCount('${id}')" title="이번 달 식사 횟수 보기">${esc(r.name||'')}</td>
                    ${cell(id,'b', !!TODAY_BREAKFAST[id])}
                    ${cell(id,'l', !!TODAY_CHECKS[id])}
                    ${cell(id,'d', !!TODAY_DINNER[id])}
                    ${cell(id,'r', !!TODAY_RESV[id])}
                </tr>`;
            }
            i=j;
        }
        return html;
    };
    const tableHTML=(body)=>`<div class="mtable-wrap"><table class="meal-table">
        <thead><tr><th>소속</th><th>직책</th><th>이름</th><th>아침</th><th>점심</th><th>석식</th><th class="sep">석식<br>예약</th></tr></thead>
        <tbody>${body}</tbody></table></div>`;

    const LEGEND = `<div class="meal-legend">
        <span class="lg-item"><span class="lg-sw lg-on"><i class="fa-solid fa-check"></i></span> 체크 완료</span>
        <span class="lg-item"><span class="lg-sw lg-resv"><i class="fa-solid fa-check"></i></span> 석식 예약</span>
        <span class="lg-item"><span class="lg-sw lg-empty"></span> 미체크</span>
        <span class="lg-item"><span class="lg-sw lg-lock"><i class="fa-solid fa-lock"></i></span> 시간대 아님</span>
        <span class="lg-div"></span><span class="lg-note"><i class="fa-solid fa-arrow-down-1-9"></i> 소속·배치순서 순 정렬</span>
        <span class="lg-div"></span><span id="mealStatus" class="lg-status"></span>
    </div>`;

    // 채움 순서: 좌측을 위에서부터 20줄까지 먼저 채우고, 넘치면 우측을 위에서부터 이어 채운다.
    const LEFT_MAX = 20;
    const TWO_COL = flat.length > LEFT_MAX;
    let inner;
    if(TWO_COL){
        const left=flat.slice(0,LEFT_MAX), right=flat.slice(LEFT_MAX);
        inner = `<div class="split-wrap">${tableHTML(rowsOf(left))}${tableHTML(rowsOf(right))}</div>`;
    } else {
        inner = tableHTML(rowsOf(flat));
    }
    stage.innerHTML = `<div class="meal-panel${TWO_COL?' two':''}">${TEST_BANNER}${LEGEND}${inner}</div>`;
    requestAnimationFrame(fitTable);
    updateMealStatus();
}
function toggleMeal(id, key){
    const r = ROSTER[id]; if(!r) return;
    const TS = firebase.database.ServerValue.TIMESTAMP;
    if(!isActive(key)){ lockMsg(key); return; }
    const ref = key==='b' ? db.ref(`system/staffMeal/breakfast/${today}/${id}`)
              : key==='l' ? db.ref(`system/staffMeal/checks/${today}/${id}`)
              : key==='r' ? db.ref(`system/staffMeal/dinner_resv/${today}/${id}`)
              :             db.ref(`system/staffMeal/dinner/${today}/${id}`);
    const isOn = key==='b' ? !!TODAY_BREAKFAST[id] : key==='l' ? !!TODAY_CHECKS[id] : key==='r' ? !!TODAY_RESV[id] : !!TODAY_DINNER[id];
    const labels = { b:'아침', l:'점심', r:'석식예약', d:'석식' };
    const buildPayload = ()=>{
        if(key==='b') return { name:r.name||'', dept:r.dept||'', position:r.position||'', ts:TS, month:monthKey };
        if(key==='l') return { name:r.name||'', dept:r.dept||'', position:r.position||'', category:'staff', staffId:id, time:nowTime(), ts:TS, month:monthKey };
        if(key==='r') return { name:r.name||'', dept:r.dept||'', position:r.position||'', ts:TS, month:monthKey };
        return { name:r.name||'', dept:r.dept||'', position:r.position||'', category:'staff', ts:TS };
    };
    if(isOn){
        // 잘못 체크한 경우 취소 전 확인 팝업 (사용자 선호 — 실수 취소 방지)
        confirmMealCancel(r.name, labels[key], ()=>{ ref.remove(); playSnd('cancel'); });
        return;
    }
    playSnd('sel'); flashCheck(); ref.set(buildPayload());
}
/* ── 되돌리기 스낵바 (3.5초 내 즉시 취소/복구) ── */
let _undoTimer=null;
function showUndo(msg, actionLabel, onAction){
    let t=document.getElementById('kioUndo');
    if(!t){ t=document.createElement('div'); t.id='kioUndo'; t.className='kio-undo'; document.body.appendChild(t); }
    t.innerHTML=`<span class="ku-msg">${msg}</span><button class="ku-btn">${actionLabel}</button>`;
    t.querySelector('.ku-btn').onclick=()=>{ clearTimeout(_undoTimer); t.classList.remove('show'); try{ onAction(); }catch(e){} };
    t.classList.add('show');
    clearTimeout(_undoTimer); _undoTimer=setTimeout(()=>t.classList.remove('show'), 3500);
}
function confirmMealCancel(name, mealLabel, onYes){
    ovCard.className='ov-card ov-dup';
    ovCard.innerHTML = `<div class="badge-done badge-warn">!</div>
        <div class="ov-ttl">체크 취소</div>
        <div class="ov-name">${esc(name)} · ${esc(mealLabel)}</div>
        <div class="ov-sub">이미 체크된 항목입니다.<br>취소하시겠습니까?</div>
        <div class="ov-actions">
            <button class="ov-btn gray" onclick="closeOverlay()">유지</button>
            <button class="ov-btn red" id="ovMealCancelBtn">취소하기</button>
        </div>`;
    overlay.classList.add('show');
    document.getElementById('ovMealCancelBtn').onclick = ()=>{ onYes(); closeOverlay(); };
}
/* ── 식사 시간대 활성화 ── */
function _hm(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function _isWeekendToday(){ const d=new Date().getDay(); return d===0||d===6; }
function isActive(key){
    if(TEST_MODE) return true;   // 테스트 모드: 모든 시간대 잠금 해제
    if(_isWeekendToday() && !WEEKEND_OK) return false;   // 주말 미운영(설정에서 허용 가능)
    const t=_hm();
    if(key==='b') return t>=7*60  && t<=9*60;    // 아침 07:00~09:00
    if(key==='l') return t>=11*60 && t<=13*60;   // 점심 11:00~13:00
    if(key==='r') return t>=11*60 && t<=16*60;   // 석식예약 11:00~16:00
    if(key==='d') return t>=17*60 && t<=19*60;   // 석식 17:00~19:00
    return true;
}
const _winMsg={ b:'아침 체크는 07:00~09:00에 가능합니다.', l:'점심 체크는 11:00~13:00에 가능합니다.', r:'석식 예약은 11:00~16:00에 가능합니다.', d:'석식 체크는 17:00~19:00에 가능합니다.' };
function lockMsg(key){ if(_isWeekendToday() && !WEEKEND_OK && !TEST_MODE){ toast('주말(토·일)은 식사 미운영입니다. 환경설정에서 허용할 수 있습니다.'); return; } toast(_winMsg[key]||'지금은 체크할 수 없습니다.'); }
/* ── 현재 식사 시간대·남은 시간 안내 ── */
const _mealWindows=[
    {key:'b', label:'아침',     s:7*60,  e:9*60},
    {key:'l', label:'점심',     s:11*60, e:13*60},
    {key:'r', label:'석식예약', s:11*60, e:16*60},
    {key:'d', label:'석식',     s:17*60, e:19*60},
];
function _fmtHM(m){ return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
function updateMealStatus(){
    const el=document.getElementById('mealStatus'); if(!el) return;
    if(TEST_MODE){ el.innerHTML='<span class="ms-test"><i class="fa-solid fa-flask"></i> 테스트 모드 — 모든 칸 열림</span>'; return; }
    if(_isWeekendToday() && !WEEKEND_OK){ el.innerHTML='<span class="ms-wait"><i class="fa-regular fa-calendar-xmark"></i> 주말(토·일)은 식사 미운영입니다 — 환경설정에서 허용 가능</span>'; return; }
    const t=_hm();
    const open=_mealWindows.filter(w=>t>=w.s && t<=w.e);
    if(open.length){
        const parts=open.map(w=>`${w.label} <b>${w.e-t}분</b> 남음`);
        el.innerHTML=`<span class="ms-open"><i class="fa-solid fa-circle"></i> 지금 체크 가능 — ${parts.join(' · ')}</span>`;
    } else {
        const next=_mealWindows.filter(w=>w.s>t).sort((a,b)=>a.s-b.s)[0];
        el.innerHTML = next
            ? `<span class="ms-wait"><i class="fa-regular fa-clock"></i> 현재 체크 가능한 식사 없음 · 다음 <b>${next.label} ${_fmtHM(next.s)}</b> (${next.s-t}분 후)</span>`
            : `<span class="ms-wait"><i class="fa-regular fa-clock"></i> 오늘 식사 체크 시간이 모두 종료되었습니다</span>`;
    }
}
function toast(msg){
    let t=document.getElementById('kioToast');
    if(!t){ t=document.createElement('div'); t.id='kioToast'; t.className='kio-toast'; document.body.appendChild(t); }
    t.textContent=msg; t.classList.add('show');
    clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200);
}
/* ── 시계 / 사운드 / 체크 애니메이션 ── */
let _lastActiveSig='';
function startClock(){
    const el=document.getElementById('hdrClock'); if(!el) return;
    const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const tick=()=>{ const n=new Date(), p=x=>String(x).padStart(2,'0');
        const dateStr=`${n.getFullYear()}.${p(n.getMonth()+1)}.${p(n.getDate())}`;
        let h=n.getHours(); const ampm=h<12?'AM':'PM'; h=h%12||12;

function _patCleanup(){ try{ window.removeEventListener('pointerup',_patUp); }catch(_){} _patState=null; }

function _openPatModal(mode, onOk, first){

function _patHit(e){ const pad=document.getElementById('patPad'); if(!pad) return -1; const r=pad.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*240, y=(e.clientY-r.top)/r.height*240; for(let i=0;i<9;i++){ const c=_patCenter(i); if(Math.hypot(x-c.x,y-c.y)<30) return i; } return -1; }

function _patMove(e){ if(!_patState||!_patState.drawing) return; const i=_patHit(e); if(i>=0 && _patState.cur.indexOf(i)<0){ _patState.cur.push(i); _patDraw(); } }
function _patUp(e){ if(!_patState||!_patState.drawing) return; _patState.drawing=false; _patFinish(); }
function _patDraw(){ if(!_patState) return; const cur=_patState.cur; document.querySelectorAll('.pat-dot').forEach(d=>{ d.classList.toggle('on', cur.indexOf(+d.getAttribute('data-i'))>=0); }); const svg=document.getElementById('patSvg'); if(svg){ const pts=cur.map(i=>{const c=_patCenter(i);return c.x+','+c.y;}).join(' '); svg.innerHTML = cur.length>1?`<polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`:''; } }

function _patFinish(){
    const cur=(_patState&&_patState.cur)||[], code=cur.join('-'), mode=_patState&&_patState.mode, onOk=_patState&&_patState.onOk;

/* ── 표 자동 맞춤: 인원수에 맞춰 행 높이·버튼·글자 크기를 화면에 꽉 차게 ── */
function fitTable(){
    if (CURRENT!=='staff') return;
    const tables = stage.querySelectorAll('.meal-table'); if(!tables.length) return;
    let maxRows=0, headH=48;
    tables.forEach(t=>{ const tb=t.querySelector('tbody'); const n=tb?tb.querySelectorAll('tr').length:0; if(n>maxRows)maxRows=n; const th=t.querySelector('thead'); if(th) headH=th.offsetHeight; });
    if(!maxRows) return;
    // 표 위쪽 영역(배너·범례 등)을 자동 반영: 첫 표의 위치부터 stage 하단까지가 가용 높이
    const wrap = stage.querySelector('.mtable-wrap'); if(!wrap) return;
    const wrapTop = wrap.getBoundingClientRect().top;
    const stageBottom = stage.getBoundingClientRect().bottom;
    const avail = stageBottom - wrapTop - 30 - headH - 6;   // 30=하단 여백
    let rowH = Math.floor(avail / maxRows);
    rowH = Math.max(30, Math.min(64, rowH));     // 30~64px 사이로 제한
    const chk    = Math.max(24, Math.min(48, rowH - 12));
    const nameFz = Math.max(15, Math.min(22, Math.round(rowH * 0.42)));   // 이름: 충분히 크게(고령자 배려)
    tables.forEach(t=>{
        t.style.setProperty('--row-h', rowH + 'px');
        t.style.setProperty('--chk',   chk  + 'px');
        t.style.setProperty('--name-fz', nameFz + 'px');
        t.style.setProperty('--pos-fz',  nameFz + 'px');           // 직책 = 이름과 동일 크기
        t.style.setProperty('--dept-fz', (nameFz + 2) + 'px');     // 소속 = 더 크게
    });
}

const FS_HOLD_MS = 3000;
function _fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }

function enterFs(){
    const el = document.documentElement;

    if (req) { try { Promise.resolve(req.call(el)).catch(()=>toast('이 기기/브라우저는 전체화면을 지원하지 않습니다.')); } catch(e){ toast('이 기기/브라우저는 전체화면을 지원하지 않습니다.'); } }
    else toast('이 기기/브라우저는 전체화면을 지원하지 않습니다. (아이패드 Safari는 홈 화면에 추가 후 실행해 주세요)');
}
function exitFs(){ const ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) { try { ex.call(document); } catch(e){} } }

function _fsHoldStart(ev){
    if(!isFs()) return;             // 해제 길게누르기는 전체화면일 때만
    ev.preventDefault();
    const ind=document.getElementById('fsHold'), bar=document.getElementById('fsHoldBar');
    if(ind) ind.classList.add('show');
    if(bar){ bar.style.transition='none'; bar.style.width='0%'; void bar.offsetWidth; bar.style.transition=`width ${FS_HOLD_MS}ms linear`; bar.style.width='100%'; }
    clearTimeout(_fsHoldTimer);
    _fsHoldTimer=setTimeout(()=>{ _fsHoldEnd(); _fsJustExited=true; _fsIntentExit=true; exitFs(); setTimeout(()=>{ _fsJustExited=false; }, 700); }, FS_HOLD_MS);
}
function _fsHoldEnd(){
    clearTimeout(_fsHoldTimer); _fsHoldTimer=null;
    const ind=document.getElementById('fsHold'), bar=document.getElementById('fsHoldBar');
    if(ind) ind.classList.remove('show');
    if(bar){ bar.style.transition='none'; bar.style.width='0%'; }
}
function _armFsReenter(){
    toast('전체화면이 해제되었습니다. 화면을 누르면 다시 전체화면으로 전환됩니다.');
    const h=()=>{ document.removeEventListener('pointerdown',h,true); if(!isFs() && !TEST_MODE){ try{ enterFs(); }catch(_){} } };

    b.addEventListener('click', ()=>{ if(_fsJustExited){ _fsJustExited=false; return; } if(!isFs()){ enterFs(); return; } if(TEST_MODE){ _fsIntentExit=true; exitFs(); return; } toast('전체화면을 끄려면 버튼을 3초간 누르세요.'); });
    b.addEventListener('pointerdown', _fsHoldStart);
    b.addEventListener('pointerup',   _fsHoldEnd);
    b.addEventListener('pointerleave',_fsHoldEnd);
    b.addEventListener('pointercancel',_fsHoldEnd);
    document.addEventListener('fullscreenchange', onFsChange);
    document.addEventListener('webkitfullscreenchange', onFsChange);
}
function flashCheck(){
    const w=document.createElement('div'); w.className='check-burst';
    w.innerHTML='<div class="cb"><i class="fa-solid fa-check"></i></div>';
    document.body.appendChild(w); setTimeout(()=>w.remove(), 660);
}
function saveNote(id, text){
    const r = ROSTER[id]; if(!r) return;
    const v=(text||'').trim();
    const ref=db.ref(`system/staffMeal/notes/${today}/${id}`);
    if(v) ref.set({ name:r.name||'', note:v, ts:firebase.database.ServerValue.TIMESTAMP }); else ref.remove();
}

function tapStaff(id){
    const r = ROSTER[id]; if(!r) return;
    const ref = db.ref(`system/staffMeal/checks/${today}/${id}`);
    ref.once('value').then(s=>{
        if (s.exists()){
            // 이미 처리됨 → 취소 확인
            const prev = s.val();
            showCancelConfirm(r.name, prev.time, ()=> ref.remove());
        } else {
            spinThenSet(ref, { name:r.name, dept:r.dept||'', category:'staff', staffId:id, time:nowTime(), ts:firebase.database.ServerValue.TIMESTAMP, month:monthKey }, r.name, r.dept||'');
        }
    });
}

// ── 이름 클릭 시: 이번 달 본인 식사 횟수 팝업 (센터·닫기·2초 자동닫힘) ──
function showMyCount(id){
    const r = ROSTER[id]; if(!r) return;
    const mk = monthKey;   // 'YYYY-MM'
    const cnt = snap => { let c=0; const v=snap.val()||{}; Object.entries(v).forEach(([date,recs])=>{ if(date.indexOf(mk)===0 && recs && recs[id]) c++; }); return c; };
    const q = node => db.ref('system/staffMeal/'+node).orderByKey().startAt(mk+'-01').endAt(mk+'-31').once('value');
    Promise.all([ q('breakfast'), q('checks'), q('dinner') ])
        .then(([b,l,d])=>{ showCountPopup(r.name||'', cnt(b)+cnt(l)+cnt(d)); })
        .catch(()=>{ showCountPopup(r.name||'', null); });
}
function showCountPopup(name, tot){
    const m = parseInt((monthKey.split('-')[1]||'0'),10);
    ovCard.className = 'ov-card ov-ok';
    ovCard.innerHTML = `<div class="badge-done badge-ok"><i class="fa-solid fa-bowl-food"></i></div>
        <div class="ov-ttl" style="color:#0f172a;">${esc(name)} 님</div>
        <div class="ov-sub">${m}월 식사 횟수</div>
        <div class="ov-time" style="color:#2563eb;">${tot==null?'-':tot}<span style="font-size:24px; font-weight:800;"> 회</span></div>
        <div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">닫기</button></div>`;
    overlay.classList.add('show');
    clearTimeout(_countTimer);
    _countTimer = setTimeout(()=>{ closeOverlay(); }, 2000);
}

// ── 강사(사내/사외) 키패드 ──
let KP = { mode:'internal', num:'', name:'' };
function goInstructor(mode){
    CURRENT='instr'; KP={ mode, num:'', name:'' };
    const isInt = mode==='internal';
    stage.innerHTML = `
        <div class="keypad-wrap">
            <button class="back" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> 처음으로</button>
            <div class="screen-ttl">${isInt?'사내 강사 (KAC)':'사외 강사'}</div>
            <div class="screen-sub">${isInt?'사번과 성함을 입력해 주세요.':'연락처와 성함을 입력해 주세요.'}</div>
            <input class="name-input" id="kpName" type="text" placeholder="성함 입력 (예: 홍길동)" maxlength="12"
                   oninput="KP.name=this.value; syncSubmit()">
            <div class="kp-field active" id="kpNumField">
                <div class="lab">${isInt?'사번':'연락처'}</div>
                <div class="val ph" id="kpNumVal">${isInt?'사번을 입력하세요':'연락처를 입력하세요'}</div>
            </div>
            <div class="keypad">
                ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="key" onclick="kpPush('${n}')">${n}</div>`).join('')}
                <div class="key wide" onclick="kpBack()">⌫</div>
                <div class="key" onclick="kpPush('0')">0</div>
                <div class="key wide" onclick="kpClear()">전체삭제</div>
            </div>
            <button class="submit-btn" id="kpSubmit" disabled onclick="submitInstructor()"><i class="fa-solid fa-utensils"></i> 식사 체크인</button>
        </div>`;
}
function kpPush(d){ if(KP.num.length>=15) return; KP.num+=d; paintNum(); }
function kpBack(){ KP.num=KP.num.slice(0,-1); paintNum(); }
function kpClear(){ KP.num=''; paintNum(); }
function paintNum(){
    const el=document.getElementById('kpNumVal'); if(!el) return;
    if(KP.num){ el.textContent=KP.num; el.classList.remove('ph'); }
    else { el.textContent=(KP.mode==='internal'?'사번을 입력하세요':'연락처를 입력하세요'); el.classList.add('ph'); }
    syncSubmit();
}
function syncSubmit(){ const b=document.getElementById('kpSubmit'); if(b) b.disabled = !(KP.num.trim() && KP.name.trim()); }
function submitInstructor(){
    const name=KP.name.trim(), num=KP.num.trim(); if(!name||!num) return;
    const isInt = KP.mode==='internal';
    const key = (isInt?'int_':'ext_') + num.replace(/[^0-9]/g,'');
    const ref = db.ref(`system/staffMeal/checks/${today}/${key}`);
    ref.once('value').then(s=>{
        if (s.exists()){
            const prev=s.val();
            showCancelConfirm(prev.name||name, prev.time, ()=> ref.remove(), '이미 식사 처리된 ' + (isInt?'사번':'연락처') + '입니다.');
        } else {
            spinThenSet(ref, { name, category:isInt?'internal':'external', idValue:num, time:nowTime(), ts:firebase.database.ServerValue.TIMESTAMP, month:monthKey }, name, (isInt?'사번 ':'연락처 ')+num);
        }
    });
}

// ── 코인 회전 후 기록 ──
const overlay=document.getElementById('overlay'), ovCard=document.getElementById('ovCard');
/* 안전장치: 켜진 팝업은 기본 3초 뒤 자동으로 닫힘(설정·패턴·비밀번호 등 상호작용 팝업은 _overlayKeep=true 로 제외) */
let _overlayKeep=false, _ocSafetyT=null;
(function(){ try{
    const mo=new MutationObserver(()=>{
        clearTimeout(_ocSafetyT);
        if(overlay.classList.contains('show') && !_overlayKeep){ _ocSafetyT=setTimeout(()=>{ try{ closeOverlay(); }catch(_){} }, 3000); }
    });
    mo.observe(overlay, { attributes:true, attributeFilter:['class'] });
}catch(e){} })();
function spinThenSet(ref, payload, name, sub){
    ovCard.className='ov-card';
    ovCard.innerHTML = `<div class="coin">₩</div><div class="ov-ttl" style="color:#fbbf24;">식수 처리 중…</div><div class="ov-name">${esc(name)}</div>`;
    overlay.classList.add('show');
    ref.set(payload).then(()=>{
        setTimeout(()=>{
            const dkey = ref.key;
            ovCard.className='ov-card ov-ok';
            ovCard.innerHTML = `<div class="badge-done badge-ok">✓</div>
                <div class="ov-ttl">식사 완료</div>
                <div class="ov-name">${esc(name)}</div>
                <div class="ov-sub">${esc(sub||'')}</div>
                <div class="ov-time">${payload.time}</div>
                <div class="ov-sub" style="margin-top:6px; font-weight:800; color:#0f172a;">오늘 <b style="color:#d97706;">석식</b>도 드시나요?</div>
                <div class="ov-actions">
                    <button class="ov-btn gray" onclick="closeOverlay()">아니요</button>
                    <button class="ov-btn green" id="dinnerYes">네, 석식 신청</button>
                </div>`;
            const dy = document.getElementById('dinnerYes');
            if (dy) dy.onclick = ()=>{
                db.ref('system/staffMeal/dinner/'+today+'/'+dkey).set({ name, category: payload.category||'staff', ts: firebase.database.ServerValue.TIMESTAMP }).catch(()=>{});
                ovCard.className='ov-card ov-ok';
                ovCard.innerHTML = `<div class="badge-done badge-ok">🍚</div>
                    <div class="ov-ttl" style="color:#059669;">석식까지 신청 완료</div>
                    <div class="ov-name">${esc(name)}</div>
                    <div class="ov-sub">오늘 중식·석식 모두 식사 처리되었습니다.</div>
                    <div class="ov-actions"><button class="ov-btn green" onclick="closeOverlay()">확인</button></div>`;
                clearTimeout(_ac); _ac=setTimeout(closeOverlay, 2600);
            };
            clearTimeout(_ac); _ac=setTimeout(closeOverlay, 5000);
        }, 850);
    }).catch(()=>{
        ovCard.className='ov-card ov-cancel';
        ovCard.innerHTML = `<div class="badge-done badge-cancel">!</div><div class="ov-ttl">처리 실패</div><div class="ov-sub">네트워크를 확인해 주세요.</div><div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">닫기</button></div>`;
    });
}
function showCancelConfirm(name, time, onCancel, msg){
    ovCard.className='ov-card ov-dup';
    ovCard.innerHTML = `<div class="badge-done badge-warn">!</div>
        <div class="ov-ttl">이미 처리됨</div>
        <div class="ov-name">${esc(name)}</div>
        <div class="ov-sub">${esc(msg||'오늘 이미 식사 처리되었습니다.')}<br>체크인 ${time||'-'}</div>
        <div class="ov-actions">
            <button class="ov-btn gray" onclick="closeOverlay()">유지</button>
            <button class="ov-btn red" id="ovCancelBtn">식사 취소</button>
        </div>`;
    overlay.classList.add('show');
    document.getElementById('ovCancelBtn').onclick = ()=>{
        onCancel();
        ovCard.className='ov-card ov-cancel';
        ovCard.innerHTML = `<div class="badge-done badge-cancel">✕</div><div class="ov-ttl">취소되었습니다</div><div class="ov-name">${esc(name)}</div><div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">확인</button></div>`;
        autoClose();
    };
}
let _ac=null;
function autoClose(){ clearTimeout(_ac); _ac=setTimeout(closeOverlay, 2200); }
function closeOverlay(){ clearTimeout(_ac); _clearExtTimers(); _patCleanup(); _overlayKeep=false; clearTimeout(_ocSafetyT); overlay.classList.remove('show'); if(CURRENT==='instr') goHome(); }

/* ── 강사 QR 표시 (키오스크) ── */
let _extCloseT=null, _extCountT=null;
function _clearExtTimers(){ try{clearTimeout(_extCloseT);}catch(_){} try{clearInterval(_extCountT);}catch(_){} _extCloseT=null; _extCountT=null; }
function showInstrQr(mode){
    const isInt = mode==='internal';
    _clearExtTimers(); _overlayKeep=false;
    if(isInt){
        // KAC 임직원: 기존처럼 본인 휴대폰에서 입력하는 QR
        const url = new URL('staff_meal.html', location.href);
        url.searchParams.set('go', mode);
        ovCard.className='ov-card';
        ovCard.innerHTML = `
            <div class="ov-ttl" style="color:#0f172a;">KAC 임직원</div>
            <div class="ov-sub" style="margin-bottom:16px;">스마트폰 카메라로 아래 QR을 스캔해<br><b>본인 휴대폰에서 직접 입력</b>해 주세요.</div>
            <div id="instrQr" style="display:flex; justify-content:center; padding:14px; background:#fff; border-radius:16px; border:1.5px solid #e2e8f0;"></div>
            <div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">닫기</button></div>`;
        overlay.classList.add('show');
        const box = document.getElementById('instrQr'); box.innerHTML='';
        try { new QRCode(box, { text:url.toString(), width:220, height:220, correctLevel:QRCode.CorrectLevel.M }); }
        catch(e){ box.textContent = url.toString(); }
        return;
    }
    // 사외 강사: 입력 없이 계좌이체 안내. QR=계좌정보(스캔 시 폰에 계좌 표시), 계좌번호 크게, 3초 자동 닫힘.
    db.ref('system/staffMeal/account').once('value').then(s=>{
        const v=s.val(); const acc=(v&&typeof v==='object')?v:{ bank:'', number:(typeof v==='string'?v:''), holder:'' };
        const has=acc.number && String(acc.number).trim();
        const acctUrl = (function(){ const u=new URL('staff_meal.html', location.href); u.searchParams.set('go','acct'); return u.toString(); })();
        const acctBox = has
          ? `<div style="font-size:21px; font-weight:800; color:#0f172a;">${esc(acc.bank||'')}</div>
             <div style="font-size:38px; font-weight:900; color:#0f172a; letter-spacing:0.5px; user-select:all; margin-top:2px; word-break:break-all; line-height:1.1;">${esc(acc.number)}</div>
             ${acc.holder?`<div style="font-size:16px; font-weight:700; color:#64748b; margin-top:10px;">예금주 ${esc(acc.holder)}</div>`:''}`
          : `<div style="font-size:15px; color:#94a3b8; font-weight:700;">등록된 계좌가 없습니다.<br>(영양사 페이지에서 입력)</div>`;
        ovCard.className='ov-card ext-acct-card';
        ovCard.innerHTML = `
            <div class="ov-ttl" style="color:#0f172a;">사외 강사 식대 계좌</div>
            <div class="ov-sub" style="margin-bottom:14px;">QR을 스캔하거나 아래 계좌로<br>식대를 <b>계좌이체</b> 해 주세요.</div>
            <div id="instrQr" style="display:flex; justify-content:center; padding:12px; background:#fff; border-radius:16px; border:1.5px solid #e2e8f0;"></div>
            <div style="margin-top:16px; background:#f0fdf4; border:2px solid #bbf7d0; border-radius:16px; padding:22px 18px;">
                <div style="font-size:14px; font-weight:800; color:#16a34a; margin-bottom:10px;"><i class="fa-solid fa-building-columns"></i> 식대 입금 계좌</div>
                ${acctBox}
            </div>
            <div class="ov-actions"><button class="ov-btn gray" onclick="closeOverlay()">닫기 <span id="extCountdown" style="opacity:.65; font-weight:800;"></span></button></div>`;
        overlay.classList.add('show');
        const box = document.getElementById('instrQr'); box.innerHTML='';
        try { new QRCode(box, { text:acctUrl, width:200, height:200, correctLevel:QRCode.CorrectLevel.M }); }
        catch(e){ box.textContent = acctUrl; }
        // 3초 자동 닫힘 + 카운트다운 (시간 조정은 아래 숫자만 변경)
        let n=3; const cd=()=>{ const el=document.getElementById('extCountdown'); if(el) el.textContent='('+n+')'; };
        cd(); _extCountT=setInterval(()=>{ n--; if(n<0)n=0; cd(); }, 1000);
        _extCloseT=setTimeout(()=>{ _clearExtTimers(); closeOverlay(); }, 3000);
    }).catch(()=>{});
}

/* ── 사외강사 계좌 안내 ── */

    db.ref('system/staffMeal/account').once('value').then(s=>{
        const v=s.val();

        ovCard.className='ov-card';
        ovCard.innerHTML = `
            <div class="ov-ttl" style="color:#0f172a;">사외 강사 식대 계좌</div>
            <div class="ov-sub" style="margin-bottom:16px;">아래 계좌로 식대를 입금해 주세요.</div>
            <div style="font-size:23px; font-weight:900; color:#0f172a; background:#f0fdf4; border:1.5px solid #bbf7d0; border-radius:14px; padding:20px; line-height:1.4;">${has?line:'등록된 계좌가 없습니다.<br><span style="font-size:13px;font-weight:700;color:#64748b;">영양사 페이지에서 계좌를 입력해 주세요.</span>'}</div>

}
