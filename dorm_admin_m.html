  <script>
  /* [기기 분리] PC 접속은 PC 전용 화면으로 (모바일은 이 화면 유지). ?forcem 으로 강제 모바일. */
  (function(){ try{
    var wide = window.innerWidth >= 1024;
    var fine = window.matchMedia && window.matchMedia('(pointer:fine)').matches;
    var noTouch = !('ontouchstart' in window) || navigator.maxTouchPoints === 0;
    var isPc = wide && (fine || noTouch);
    if(isPc && location.search.indexOf('forcem')<0){ location.replace('dorm_admin.html'+location.search+location.hash); }
  }catch(e){} })();
  </script>
<!-- @version DAM1 · 2026-06-28 -->
<!-- ════════ [카카오채널 연동] catc1234 접속 게이트 (수정상태: 수정안하는중) ════════
     · dorm_admin.html(교육지원·생활관)의 모바일 라이트판(조회 중심). 직접 진입 시 접속코드 요구.
     · 통과 시 localStorage['catc_gate_ok'] 저장. catcLock()으로 잠금 해제. 기능 로직과 분리. -->
<script>
(function(){
  window.catcLock=function(){ try{localStorage.removeItem('catc_gate_ok');}catch(e){} location.reload(); };
  var ok=false; try{ ok=(function(){var t=parseInt(localStorage.getItem('catc_gate_ok'),10);return !!t&&(Date.now()-t)<2592000000;})(); }catch(e){ ok=true; }
  if(ok){ window.__catcUnlocked=true; return; }
  window.__catcUnlocked=false;
  document.documentElement.classList.add('catc-locked');
  function build(){
    if(document.getElementById('catcGate')) return;
    var o=document.createElement('div'); o.id='catcGate';
    o.innerHTML='<div class="catc-box"><div class="catc-ic">🔒</div>'
      +'<div class="catc-t">접속 코드 입력</div>'
      +'<div class="catc-s">CATC 교육 플랫폼 · 보안 접속</div>'
      +'<input id="catcInp" type="password" autocomplete="off" placeholder="접속 코드">'
      +'<button id="catcBtn">입장</button><div id="catcMsg"></div></div>';
    (document.body||document.documentElement).appendChild(o);
    var inp=o.querySelector('#catcInp'),btn=o.querySelector('#catcBtn'),msg=o.querySelector('#catcMsg');
    function go(){ if(inp.value==='catc1234'){ try{localStorage.setItem('catc_gate_ok',String(Date.now()));}catch(e){} location.reload(); } else { msg.textContent='접속 코드가 올바르지 않습니다.'; inp.value=''; inp.focus(); } }
    btn.addEventListener('click',go);
    inp.addEventListener('keyup',function(e){ if(e.key==='Enter') go(); });
    setTimeout(function(){ try{inp.focus();}catch(e){} },120);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded',build);
})();
</script>
<style>

    .tot-card .big{ margin-left:auto; font-size:22px; }

<body>
<div class="wrap">
  <div class="mhead">
    <div class="row1">
      <div class="ttl"><div class="mk"><i class="fa-solid fa-bed"></i></div>생활관 배정 현황</div>

  </div>

  <div class="sec">
    <div class="sec-ttl"><i class="fa-solid fa-building"></i> 건물별 현황 <span style="font-weight:700;color:#94a3b8;">· 실시간</span></div>

  </div>

    <div class="sec-ttl"><i class="fa-solid fa-door-open"></i> 방별 배정 (건물 · 층)</div>
    <div id="roomList"><div class="empty">불러오는 중...</div></div>
  </div>

</div>

<div id="__catcVer" aria-hidden="true" style="position:fixed;right:5px;bottom:4px;z-index:2147483647;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:700;color:rgba(148,163,184,.5);background:rgba(120,120,120,.12);padding:2px 5px;border-radius:5px;pointer-events:none;user-select:none;">지원M vB</div>

<script src="config.js?v=b260620c"></script>
<script>
/* ========== 교육지원·생활관 모바일 라이트뷰 (조회 중심) ========== */
var db=firebase.database();
var DORM_COLORS={ '청렴관':'#3b82f6', '상생관':'#10b981', '국제교육동':'#8b5cf6' };
var ROOMS={}, STUDENTS={}, _openFloor=new Set();
function h(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 배정제외 판정: DB noAssign + PC와 동일한 특수실 폴백(청렴관 218·219 살림형, 상생관 208 창고) */
function isNoAssign(r){
  if(!r) return true;
  if(r.noAssign) return true;
  var b=(''+(r.building||'')), no=(''+(r.no||''));
  if(b.indexOf('청렴')>=0 && (no==='218'||no==='219')) return true;
  if(b.indexOf('상생')>=0 && no==='208') return true;
  return false;
}
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function mondayOf(d){ var x=new Date(d); var dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); x.setHours(0,0,0,0); return x; }
function getTargetMondayKey(){ var t=new Date(); var b=mondayOf(t); if(t.getDay()===6||t.getDay()===0) b.setDate(b.getDate()+7); return ymd(b); }
var WK=getTargetMondayKey();

function tickClock(){
  var d=new Date(), days=['일','월','화','수','목','금','토'];
  var hh=d.getHours(), ap=hh<12?'AM':'PM', h12=((hh%12)||12);
  var el=document.getElementById('clk');
  if(el) el.innerHTML=(d.getMonth()+1)+'.'+d.getDate()+'('+days[d.getDay()]+') <b>'+h12+':'+pad(d.getMinutes())+'</b> '+ap;
}
setInterval(tickClock,1000); tickClock();

function setWkLabel(){
  var mon=new Date(WK+'T00:00:00'); var fri=new Date(mon); fri.setDate(mon.getDate()+4);
  var fmt=function(d){ return (d.getMonth()+1)+'/'+d.getDate(); };
  var today=new Date(); var thisMon=mondayOf(today);
  var rel = (ymd(mon)===ymd(thisMon)) ? '이번주' : '다음주';
  document.getElementById('wkLabel').textContent=rel+' 배정 ('+fmt(mon)+'~'+fmt(fri)+')';
}
setWkLabel();

db.ref('system/dorm/rooms').on('value', function(s){ ROOMS=s.val()||{}; renderAll(); });
db.ref('system/dorm/assignments/'+WK+'/students').on('value', function(s){ STUDENTS=s.val()||{}; renderAll(); });

function occByRoom(){
  var m={};
  Object.keys(STUDENTS).forEach(function(k){ var st=STUDENTS[k]; if(st && st.roomId){ (m[st.roomId]=m[st.roomId]||[]).push(st); } });
  return m;
}

function renderAll(){
  var occ=occByRoom();
  var totalPpl=Object.keys(STUDENTS).filter(function(k){ var s=STUDENTS[k]; return s && s.name; }).length;

  /* 건물별 요약 */
  var bldg={};
  Object.keys(ROOMS).forEach(function(id){
    var r=ROOMS[id]||{}; if(isNoAssign(r)) return;
    var b=r.building||'기타';
    if(!bldg[b]) bldg[b]={total:0,occ:0,ppl:0};
    bldg[b].total++;
    var n=(occ[id]||[]).length;
    if(n>0) bldg[b].occ++;
    bldg[b].ppl+=n;
  });
  var bkeys=Object.keys(bldg);
  document.getElementById('totCard').innerHTML='<div class="tot-card"><i class="fa-solid fa-users"></i> 전체 배정 인원 <span class="big">'+totalPpl+'명</span></div>';
  var bel=document.getElementById('bsum');
  if(!bkeys.length){ bel.innerHTML='<div class="empty">방 마스터가 설정되지 않았습니다.</div>'; }
  else{
    bel.innerHTML=bkeys.map(function(b){
      var g=bldg[b]; var emptyN=g.total-g.occ; var color=DORM_COLORS[b]||'#94a3b8';
      return '<div class="bcard"><div class="bc-top"><span class="dot" style="background:'+color+'"></span><span class="bn">'+h(b)+'</span><span class="ppl">'+g.ppl+'명 배정</span></div>'
        +'<div class="bc-stat"><div class="st occ"><div class="v">'+g.occ+'</div><div class="k">사용 방</div></div>'
        +'<div class="st empty"><div class="v">'+emptyN+'</div><div class="k">빈 방</div></div>'
        +'<div class="st full"><div class="v">'+g.total+'</div><div class="k">전체 방</div></div></div></div>';
    }).join('');
  }

  /* 과정별 인원 */
  var byC={};
  Object.keys(STUDENTS).forEach(function(k){ var s=STUDENTS[k]; if(!s||!s.name) return; var c=(s.courseName||s.course||'미지정').trim()||'미지정'; byC[c]=(byC[c]||0)+1; });
  var carr=Object.keys(byC).map(function(c){ return [c,byC[c]]; }).sort(function(a,b){ return b[1]-a[1]; });
  var cel=document.getElementById('crsList');
  cel.innerHTML = carr.length ? carr.map(function(x){ return '<div class="crs"><span class="cn">'+h(x[0])+'</span><span class="pc">'+x[1]+'명</span></div>'; }).join('')
    : '<div class="empty">배정된 인원이 없습니다.</div>';

  /* 방별 (건물 → 층) */
  var rel=document.getElementById('roomList');
  if(!bkeys.length){ rel.innerHTML='<div class="empty">방 정보가 없습니다.</div>'; return; }
  var html='';
  bkeys.forEach(function(b){
    var color=DORM_COLORS[b]||'#94a3b8';
    var roomsB=Object.keys(ROOMS).filter(function(id){ var r=ROOMS[id]||{}; return !isNoAssign(r) && (r.building||'기타')===b; });
    var byF={};
    roomsB.forEach(function(id){ var r=ROOMS[id]||{}; var f=(r.floor!=null&&r.floor!=='')?(r.floor+'층'):'기타'; (byF[f]=byF[f]||[]).push(id); });
    var fkeys=Object.keys(byF).sort(function(a,c){ return a.localeCompare(c,'ko',{numeric:true}); });
    fkeys.forEach(function(f){
      var key=b+'__'+f; var open=_openFloor.has(key);
      var ids=byF[f].sort(function(a,c){ var ra=ROOMS[a]||{},rc=ROOMS[c]||{}; return String(ra.no||'').localeCompare(String(rc.no||''),'ko',{numeric:true}); });
      var pplF=ids.reduce(function(s,id){ return s+(occ[id]||[]).length; },0);
      var rowsH=ids.map(function(id){
        var r=ROOMS[id]||{}; var oc=(occ[id]||[]); var cap=r.capacity||0;
        var cls = oc.length===0 ? 'none' : (cap && oc.length>=cap ? 'full' : 'has');
        var gnd = r.gender==='F'||r.gender==='여' ? '<span class="gnd f">여</span>' : (r.gender==='M'||r.gender==='남' ? '<span class="gnd m">남</span>' : '');
        var names = oc.length ? ('<span class="rf">'+oc.slice(0,4).map(function(x){return h(x.name);}).join(', ')+(oc.length>4?(' 외 '+(oc.length-4)):'')+'</span>') : '<span class="rf">비어있음</span>';
        return '<div class="room"><span class="rn">'+h(r.no||'-')+'</span>'+gnd+names+'<span class="occ '+cls+'">'+oc.length+(cap?('/'+cap):'')+'</span></div>';
      }).join('');
      html+='<div class="fgrp"><div class="fgrp-hd" style="background:linear-gradient(135deg,'+color+',rgba(0,0,0,.08))" onclick="toggleFloor(\''+key.replace(/'/g,'')+'\')">'
        +'<i class="fa-solid fa-chevron-'+(open?'up':'down')+'"></i> '+h(b)+' '+h(f)+' <span class="wn">'+pplF+'명 / '+ids.length+'실</span></div>'
        +(open?rowsH:'')+'</div>';
    });
  });
  rel.innerHTML=html||'<div class="empty">방 정보가 없습니다.</div>';
}
function toggleFloor(key){ if(_openFloor.has(key))_openFloor.delete(key); else _openFloor.add(key); renderAll(); }
</script>
</body>
</html>
<!-- 지원부모바일 VC/VC/VC/VC/VC -->
