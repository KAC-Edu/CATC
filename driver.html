<!DOCTYPE html>
<html lang="ko">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Pretendard',system-ui,sans-serif;color:#0f172a;background:#fafbfc;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  table{border-collapse:collapse;width:100%}
  .app{display:flex;height:100vh;min-height:680px;background:#fafbfc}
  /* sidebar */
  .sidebar{width:244px;flex:none;background:#fff;border-right:1px solid #eef0f4;padding:24px 16px;display:flex;flex-direction:column;gap:5px}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
  .brand .logo{width:36px;height:36px;border-radius:11px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
  .brand .bt{font-size:15.5px;font-weight:800;letter-spacing:-.3px}
  .brand .bs{font-size:11px;color:#94a3b8;font-weight:600;margin-top:1px}
  .nav-btn{width:100%;display:flex;align-items:center;gap:11px;padding:11px 13px;border:0;border-radius:10px;cursor:pointer;font-size:13.5px;text-align:left;background:transparent;color:#475569;font-weight:600;transition:background .15s}
  .nav-btn i{width:18px;text-align:center;font-size:14px;color:#94a3b8}
  .nav-btn .lbl{flex:1;text-align:left}
  .nav-btn .badge{min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;padding:0 5px}
  .nav-btn.active{background:#eff4ff;color:#2563eb;font-weight:800;box-shadow:inset 3px 0 #2563eb}
  .nav-btn.active i{color:#2563eb}
  .clock{margin-top:auto;display:flex;flex-direction:column;gap:3px;padding:16px 10px 4px;border-top:1px solid #eef0f4}
  .clock .d{font-size:11px;color:#94a3b8;font-weight:600}
  .clock .t{font-size:18px;font-weight:800;letter-spacing:-.5px}
  /* main */
  .main{flex:1;min-width:0;padding:32px 40px;overflow-y:auto}
  .main::-webkit-scrollbar{width:9px}
  .main::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:99px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
  .head h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.6px}
  .head p{margin:7px 0 0;font-size:13.5px;color:#64748b;font-weight:500}
  .pills{display:flex;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px}
  .pill i{font-size:6px}
  .pill.red{background:#fef2f2;color:#dc2626}
  .pill.blue{background:#eff4ff;color:#2563eb}
  /* panel */
  .panel{background:#fff;border:1px solid #eef0f4;border-radius:16px;padding:20px 22px}
  .panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .panel-h h3{margin:0;font-size:15px;font-weight:800}
  .panel-h .sub{font-size:12px;color:#94a3b8;font-weight:600}
  /* data table */
  .tbl{background:#fff;border:1px solid #eef0f4;border-radius:16px;overflow:hidden}
  .tbl th{background:#f8fafc;color:#64748b;font-size:12px;font-weight:700;padding:13px 16px;border-bottom:1px solid #eef0f4;text-align:center;white-space:nowrap}
  .tbl td{font-size:13.5px;padding:13px 16px;border-bottom:1px solid #f5f7fa;text-align:center}
  .tbl tr:last-child td{border-bottom:0}
  .tbl .l{text-align:left}
  .muted{color:#64748b}
  .dim{color:#94a3b8}
  .b8{font-weight:800}
  .b7{font-weight:700}
  .chip-course{display:inline-block;background:#eff4ff;color:#2563eb;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:6px}
  .blue{color:#2563eb}
  .teal{color:#0d9488}
  .by-dept{font-size:11px;color:#94a3b8;font-weight:600;margin-top:1px}
  .btn-go{border:0;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;color:#fff;background:#2563eb;cursor:pointer}
  .badge-ok{display:inline-block;background:#ecfdf5;color:#047857;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px}
  .badge-no{display:inline-block;background:#fff1f2;color:#be123c;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px}
  .resv-note{display:flex;gap:9px;background:#fffaf0;border:1px solid #fde6bd;border-radius:12px;padding:13px 16px;margin-bottom:14px;font-size:12.5px;color:#92670c;font-weight:600;line-height:1.65}
  .resv-note i{color:#d97706;margin-top:3px}

  .board{table-layout:fixed;width:100%}
  .board th,.board td{border:1px solid #eef0f4}
  .board thead th{padding:9px 4px;text-align:center;white-space:nowrap;background:#f8fafc}
  .board thead th.today{background:#eff4ff}
  .board thead th .dw{font-size:13px;font-weight:800}
  .board thead th .dt{font-size:10.5px;color:#94a3b8;font-weight:600;margin-top:1px}
  .board .tcorner{background:#f8fafc;width:60px}
  .board .tcol{background:#fafbfc;color:#94a3b8;font-size:11px;font-weight:700;text-align:right;padding:5px 9px 0;vertical-align:top;white-space:nowrap;width:60px}
  .board td.cell{vertical-align:top;padding:3px;height:40px}
  .board td.cell.today{background:#f5f9ff}
  .board td.cell.off{background:#fef2f2}
  .board .allday{vertical-align:top;padding:5px}
  .board .allday.today{background:#f5f9ff}
  .board .tcol.allday-lbl{padding:7px 9px;font-size:11px}
  .ev{border:1px solid #eef0f4;border-radius:0 7px 7px 0;padding:3px 6px;margin-bottom:3px}
  .ev .et{font-size:10px;font-weight:800}
  .ev .en{font-size:10.5px;font-weight:700;margin-top:1px;line-height:1.2}
  .ev .es{font-size:9.5px;color:#94a3b8;font-weight:600;margin-top:1px}
  .ev-off{background:#fee2e2;border-left:3px solid #ef4444;border-radius:0 7px 7px 0;padding:3px 6px;margin-bottom:3px}
  .ev-off .ot{font-size:10px;font-weight:800;color:#b91c1c}
  .ev-off .os{font-size:9.5px;color:#ef4444;font-weight:600;margin-top:1px}
  .allday-banner{background:#fef2f2;border-left:3px solid #ef4444;border-radius:0 7px 7px 0;padding:5px 8px}
  .allday-banner .at{font-size:11px;font-weight:800;color:#b91c1c}
  .allday-banner .as{font-size:9.5px;color:#ef4444;font-weight:600;margin-top:1px}
  .lunch{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 8px,#f1f5f9 8px,#f1f5f9 16px);text-align:center;color:#94a3b8;font-size:11.5px;font-weight:800;padding:7px}

  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

  .room{background:#fff;border:1.5px solid #eef0f4;border-radius:16px;overflow:hidden}
  .room.open{border-color:#2563eb}
  .room-top{display:flex;align-items:center;gap:18px;padding:18px 22px;cursor:pointer}
  .room-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
  .room-badge{flex:none;background:#2563eb;color:#fff;font-size:12px;font-weight:800;letter-spacing:.3px;padding:7px 13px;border-radius:9px}
  .room-name{font-size:15.5px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
  .room-stats{display:flex;align-items:center;gap:16px;flex:none}
  .rstat{text-align:center;min-width:40px}
  .rstat .rl{font-size:12px;font-weight:800}
  .rstat .rv{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:3px}

  .rtot .rl{font-size:12px;font-weight:800;color:#64748b}
  .rtot .rv{font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:1px;color:#1e3a8a}
  .room-chev{color:#cbd5e1;font-size:15px;transition:transform .2s}
  .room.open .room-chev{transform:rotate(180deg);color:#2563eb}
  .room-body{border-top:1px solid #eef0f4;padding:16px 22px;background:#fafbff;display:none;flex-direction:column;gap:13px}
  .room.open .room-body{display:flex}
  .room-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:#94a3b8;font-weight:600}
  .roster{width:100%;background:#fff;border:1px solid #eef0f4;border-radius:11px;overflow:hidden}

  .roster tr:last-child td{border-bottom:0}
  .dest-dot{display:inline-flex;align-items:center;gap:6px;font-weight:700}
  .dest-dot i{width:8px;height:8px;border-radius:99px;display:inline-block}
  .empty{font-size:13px;color:#94a3b8;font-weight:600;padding:2px 0}
  /* fixed view */
  .info-bar{display:flex;align-items:center;gap:8px;background:#f5f9ff;border:1px solid #dbe7ff;border-radius:12px;padding:12px 15px;margin-bottom:18px}
  .info-bar i{color:#2563eb;font-size:14px}
  .info-bar span{font-size:12.5px;color:#1e40af;font-weight:600}
  .addbar{display:flex;gap:9px;margin-bottom:18px}

  .add-in{background:#6366f1}.add-out{background:#0d9488}
  .add-off{background:#fff;border:1px solid #fecaca;color:#dc2626}
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
  .mitem{display:flex;align-items:center;gap:12px;border:1px solid #f1f5f9;border-radius:12px;padding:13px 14px}
  .mitem .mic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px}
  .mitem .mbody{flex:1;min-width:0}
  .mitem .mhead{display:flex;align-items:center;gap:8px}
  .kind{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px}
  .mitem .mname{font-size:14px;font-weight:800}
  .mitem .msub{font-size:11.5px;color:#94a3b8;font-weight:600;margin-top:4px}
  .mitem .mdel{border:0;background:none;color:#cbd5e1;cursor:pointer;font-size:15px}
  .mlist{display:flex;flex-direction:column;gap:8px}
  .col18{display:flex;flex-direction:column;gap:18px}

</head>

  { id:'pickups',      label:'강사픽업 일정', icon:'fa-user-tie',        badge:'' },
  { id:'manage',       label:'전체 스케줄표', icon:'fa-calendar-week',   badge:'' },
  { id:'reservations', label:'강사픽업 예약', icon:'fa-clipboard-check', badge:'2' },
  { id:'fixed',        label:'입교·퇴교 일정', icon:'fa-bus-simple',     badge:'' }
];
var TITLES = {
  leave:        { t:'퇴교수송 현황', s:'차수별 인원 집계 · 출발시간은 운영부에서 과정별로 공지합니다' },
  pickups:      { t:'강사픽업 일정', s:'확정된 운행만 표시합니다 · 날짜순 정렬' },
  manage:       { t:'전체 스케줄표', s:'주간 운행표 중심으로 신규 요청과 퇴교수송을 한눈에 확인합니다' },
  reservations: { t:'강사픽업 예약', s:'신규 예약 요청 · 시간이 겹치면 자동으로 경고합니다' },
  fixed:        { t:'입교·퇴교 고정 일정', s:'과정 시작 주에 맞춰 입교/퇴교 버스를 고정 배치합니다 · 보통 시작 주 첫 월요일 오전, 수요일 시작 과정은 그 주에 맞춰 조정' }
};

/* ---------- state & helpers ---------- */
var state = { view:'manage', expanded:'A' };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function pad(n){ return n<10 ? '0'+n : ''+n; }

/* ---------- 전체 스케줄표 (주간 운행 보드) ---------- */
function viewManage(){
  var thead = '<tr><th class="tcorner"></th>' + DAYS.map(function(d){
    return '<th class="'+(d.today?'today':'')+'"><div class="dw" style="color:'+(d.today?'#2563eb':'#0f172a')+'">'+esc(d.dow)+'</div><div class="dt">'+esc(d.date)+'</div></th>';
  }).join('') + '</tr>';

  var allDayItems = OFF.filter(function(o){ return o.allDay; });
  var allRow = '';
  if(allDayItems.length){
    allRow = '<tr><td class="tcol allday-lbl">종일</td>' + DAYS.map(function(d,di){
      var inner = allDayItems.filter(function(o){ return o.day===di; }).map(function(o){
        return '<div class="allday-banner"><div class="at">'+esc(o.label)+'</div><div class="as">종일 · 운행 불가</div></div>';
      }).join('');
      return '<td class="allday'+(d.today?' today':'')+'">'+inner+'</td>';
    }).join('') + '</tr>';
  }

  var rows = HOURS.map(function(h){
    if(h===12){
      return '<tr><td class="tcol">'+pad(h)+':00</td><td class="lunch" colspan="5"><i class="fa-solid fa-mug-hot" style="margin-right:6px"></i>휴게시간 12:00 ~ 13:00 · 운행 없음</td></tr>';
    }
    var cells = DAYS.map(function(d,di){
      var off = null;
      for(var i=0;i<OFF.length;i++){ var o=OFF[i]; if(o.day===di && (o.allDay || (h>=o.from && h<o.to))){ off=o; break; } }
      var cls = 'cell' + (off ? ' off' : (d.today ? ' today' : ''));
      var inner = '';
      if(off && !off.allDay && h===off.from){
        inner += '<div class="ev-off"><div class="ot">'+esc(off.label+' '+pad(off.from)+':00~'+pad(off.to)+':00')+'</div><div class="os">운행 불가</div></div>';
      }
      if(!off){
        inner += EVTS.filter(function(e){ return e.day===di && e.h===h; }).map(function(e){
          return '<div class="ev" style="background:'+TINT[e.type]+';border-left:3px solid '+EVC[e.type]+'">'
            + '<div class="et" style="color:'+EVC[e.type]+'">'+esc(e.time)+'</div>'
            + '<div class="en">'+esc(e.title)+'</div><div class="es">'+esc(e.sub)+'</div></div>';
        }).join('');
      }
      return '<td class="'+cls+'">'+inner+'</td>';
    }).join('');
    return '<tr><td class="tcol">'+pad(h)+':00</td>'+cells+'</tr>';
  }).join('');

  var legend = '<div class="legend">'
    + '<span><i style="background:'+EVC.arr+'"></i>도착(역→항기원)</span>'
    + '<span><i style="background:'+EVC.dep+'"></i>샌딩(항기원→역)</span>'
    + '<span><i style="background:'+EVC.entry+'"></i>입교버스</span>'
    + '<span><i style="background:'+EVC.leave+'"></i>퇴교버스</span>'
    + '<span><i style="background:'+EVC.off+'"></i>휴가</span></div>';

  return '<div class="col18"><div class="panel">'
    + '<div class="panel-h"><h3>주간 운행 스케줄</h3><span class="sub">06.30 ~ 07.04</span></div>'
    + '<table class="board"><thead>'+thead+'</thead><tbody>'+allRow+rows+'</tbody></table>'
    + legend + '</div></div>';
}

/* ---------- 퇴교수송 현황 (ROOM 행 + 펼침 명단표) ---------- */
function viewLeave(){
  var rows = SHUTTLE.map(function(s){
    var open = state.expanded===s.room;
    var stats = DEST.map(function(dd){
      var v = s.people.filter(function(p){ return p.dest===dd.key; }).length;
      return '<div class="rstat"><div class="rl" style="color:'+dd.labelColor+'">'+esc(dd.label)+'</div><div class="rv" style="color:'+dd.valColor+'">'+v+'</div></div>';
    }).join('');
    var total = s.people.length;
    var roster;
    if(total){
      var trs = s.people.map(function(p,i){
        var col = (DEST.filter(function(dd){ return dd.key===p.dest; })[0]||{}).color || '#64748b';
        return '<tr><td style="text-align:center;color:#94a3b8;font-weight:700">'+(i+1)+'</td>'
          + '<td style="text-align:left;font-weight:800">'+esc(p.name)+'</td>'
          + '<td style="text-align:left"><span class="dest-dot" style="color:'+col+'"><i style="background:'+col+'"></i>'+esc(p.dest)+'</span></td></tr>';
      }).join('');
      roster = '<table class="roster"><thead><tr><th style="width:56px;text-align:center">연번</th><th style="text-align:left">교육생</th><th style="text-align:left">목적지</th></tr></thead><tbody>'+trs+'</tbody></table>';
    } else {
      roster = '<div class="empty">아직 퇴교수송 신청이 없습니다.</div>';
    }
    return '<div class="room'+(open?' open':'')+'">'
      + '<div class="room-top" onclick="toggleRoom(\''+s.room+'\')">'
      + '<div class="room-left"><span class="room-badge">ROOM #'+esc(s.room)+'</span><span class="room-name">'+esc(s.name)+'</span></div>'
      + '<div class="room-stats">'+stats
      + '<div class="rtot"><div class="rl">총 신청</div><div class="rv">'+total+'</div></div>'
      + '<i class="fa-solid fa-chevron-down room-chev"></i></div></div>'
      + '<div class="room-body"><div class="room-meta"><span>기간 '+esc(s.period)+'</span><span>·</span><span>출발 '+esc(s.depart)+'</span></div>'+roster+'</div></div>';
  }).join('');
  return '<div class="rooms">'+rows+'</div>';
}

/* ---------- 강사픽업 일정 (확정, 날짜순 표) ---------- */
function viewPickups(){
  var rows = PICKUPS.slice().sort(function(a,b){ return a.sort-b.sort; }).map(function(p,i){
    return '<tr><td class="dim b7">'+(i+1)+'</td>'
      + '<td class="l b7">'+esc(p.date)+' ('+esc(p.dow)+')</td>'
      + '<td class="l b8">'+esc(p.name)+'</td>'
      + '<td class="l"><span class="chip-course">'+esc(p.course)+'</span></td>'
      + '<td class="l">'+esc(p.place)+'</td>'
      + '<td class="b7 blue">'+esc(p.pin)+'</td>'
      + '<td class="b7 teal">'+esc(p.pout)+'</td>'
      + '<td class="l"><div class="b7">'+esc(p.by)+'</div><div class="by-dept">'+esc(p.dept)+'</div></td></tr>';
  }).join('');
  return '<div class="tbl"><table><thead><tr>'
    + '<th style="width:52px">연번</th><th class="l">일자 <i class="fa-solid fa-arrow-down-short-wide" style="margin-left:3px;color:#2563eb"></i></th>'
    + '<th class="l">강사명</th><th class="l">교육과정</th><th class="l">픽업장소</th><th>모시는 시간</th><th>복귀 시간</th><th class="l">신청자 (교육운영부)</th>'
    + '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- 강사픽업 예약 (신규, 날짜순 표) ---------- */
function viewResv(){
  var rows = RESV.slice().sort(function(a,b){ return a.sort-b.sort; }).map(function(r,i){
    var badge = r.conflict ? '<span class="badge-no">'+esc(r.conflict)+'</span>' : '<span class="badge-ok">이상 없음</span>';
    return '<tr style="'+(r.conflict?'background:#fffbfb':'')+'">'
      + '<td class="dim b7">'+(i+1)+'</td>'
      + '<td class="l b8">'+esc(r.name)+'</td>'
      + '<td class="l muted">'+esc(r.phone)+'</td>'
      + '<td class="l b7">'+esc(r.date)+'</td>'
      + '<td class="l"><div class="b7">'+esc(r.by)+'</div><div class="by-dept">'+esc(r.dept)+'</div></td>'
      + '<td>'+badge+'</td>'
      + '<td><button class="btn-go">확정</button></td></tr>';
  }).join('');
  return '<div class="resv-note"><i class="fa-solid fa-circle-info"></i><div><b>예약 제한</b> · 휴게시간(12:00~13:00) 운행 불가 → <b>12:00 픽업</b> 및 <b>13:00 오송역→항기원(도착)</b>은 예약 불가 / 13:00 항기원→오송역(샌딩)은 가능. 입교버스는 왕복 약 2시간 소요로 인접 시간 배차 주의.</div></div>'
    + '<div class="tbl"><table><thead><tr>'
    + '<th style="width:52px">연번</th><th class="l">강사명</th><th class="l">연락처</th><th class="l">픽업요청 일자 <i class="fa-solid fa-arrow-down-short-wide" style="margin-left:3px;color:#2563eb"></i></th><th class="l">신청자 (교육운영부)</th><th>중복여부</th><th style="width:92px">처리</th>'
    + '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- 입교·퇴교 고정 일정 ---------- */
function viewFixed(){
  var fitems = FIXED.map(function(f){
    var kindStyle = f.kind==='입교' ? 'background:#eef0ff;color:#6366f1' : 'background:#effbf7;color:#0d9488';
    return '<div class="mitem"><div class="mic" style="background:'+f.tint+';color:'+f.color+'"><i class="fa-solid '+f.icon+'"></i></div>'
      + '<div class="mbody"><div class="mhead"><span class="kind" style="'+kindStyle+'">'+esc(f.kind)+'</span><span class="mname">'+esc(f.course)+'</span></div>'
      + '<div class="msub">'+esc(f.sub)+'</div></div>'
      + '<button class="mdel"><i class="fa-solid fa-xmark"></i></button></div>';
  }).join('');
  var oitems = DAYOFF.map(function(o){
    return '<div class="mitem"><div class="mic" style="background:#fef2f2;color:#ef4444"><i class="fa-solid fa-calendar-xmark"></i></div>'
      + '<div class="mbody"><div class="mname">'+esc(o.title)+'</div><div class="msub">'+esc(o.sub)+'</div></div>'
      + '<button class="mdel"><i class="fa-solid fa-xmark"></i></button></div>';
  }).join('');
  return '<div class="info-bar"><i class="fa-solid fa-circle-info"></i><span>입교/퇴교 버스는 과정 시작 주에 맞춰 고정 배치됩니다. 보통 시작 주 첫 월요일 오전이며, 수요일 시작 과정은 그 주에 맞춰 조정합니다.</span></div>'
    + '<div class="addbar"><button class="add-in"><i class="fa-solid fa-plus"></i> 입교버스 추가</button>'
    + '<button class="add-out"><i class="fa-solid fa-plus"></i> 퇴교버스 추가</button>'
    + '<button class="add-off"><i class="fa-solid fa-calendar-xmark"></i> 휴가·운행불가</button></div>'
    + '<div class="grid2"><div class="panel"><div class="panel-h"><h3><i class="fa-solid fa-bus-simple" style="color:#6366f1;margin-right:7px"></i>입교 · 퇴교 고정 일정</h3></div><div class="mlist">'+fitems+'</div></div>'
    + '<div class="panel"><div class="panel-h"><h3><i class="fa-solid fa-umbrella-beach" style="color:#ef4444;margin-right:7px"></i>휴가 / 운행불가</h3><span class="sub">등록 시 운영부 자동 고지</span></div><div class="mlist">'+oitems+'</div></div></div>';
}

/* ---------- nav & routing ---------- */
function renderNav(){
  document.getElementById('nav').innerHTML = TABS.map(function(t){
    var on = t.id===state.view;
    return '<button class="nav-btn'+(on?' active':'')+'" onclick="switchView(\''+t.id+'\')">'
      + '<i class="fa-solid '+t.icon+'"></i><span class="lbl">'+esc(t.label)+'</span>'
      + (t.badge ? '<span class="badge">'+esc(t.badge)+'</span>' : '') + '</button>';
  }).join('');
}
function pageHead(){
  var m = TITLES[state.view];
  var pills = state.view==='manage'
    ? '<div class="pills"><span class="pill red"><i class="fa-solid fa-circle"></i>미확인 3건</span>'
      + '<span class="pill blue"><i class="fa-solid fa-circle"></i>오늘 운행 5건</span></div>'
    : '';
  return '<div class="head"><div><h1>'+esc(m.t)+'</h1><p>'+esc(m.s)+'</p></div>'+pills+'</div>';
}
function switchView(id){ state.view = id; render(); }
function toggleRoom(room){ state.expanded = (state.expanded===room ? null : room); render(); }

function render(){
  renderNav();
  var body = ({ manage:viewManage, leave:viewLeave, pickups:viewPickups, reservations:viewResv, fixed:viewFixed }[state.view] || function(){return '';})();
  document.getElementById('main').innerHTML = pageHead() + body;
}
document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
