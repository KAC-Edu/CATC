<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <script>
  /* [기기 분리] PC 접속은 PC 전용 화면으로 (모바일은 이 화면 유지). ?forcem 으로 강제 모바일. */
  (function(){ try{
    var wide = window.innerWidth >= 1024;
    var fine = window.matchMedia && window.matchMedia('(pointer:fine)').matches;
    var noTouch = !('ontouchstart' in window) || navigator.maxTouchPoints === 0;
    var isPc = wide && (fine || noTouch);
    if(isPc && location.search.indexOf('forcem')<0){ location.replace('nutritionist.html'+location.search+location.hash); }
  }catch(e){} })();
  </script>
<!-- @version NM3 · 2026-07-10 (금주 식단표를 접이식 가로바로 — 탭해야 사진/업로드 노출(산만함 해소, 바에 등록/미등록 표기), 하단 여백 확대로 과정 목록 마지막 항목까지 스크롤로 온전히 보이게) (조식/중식/석식 라벨 확대·인원 한 줄, 식수 카드 클릭 시 도출근거(명단) 시트, 중식체크 접이식 가로바(총원만 표기), 금주 식단표 모바일 사진 업로드/삭제) -->
<!-- ════════ [카카오채널 연동] catc1234 접속 게이트 (수정상태: 수정안하는중) ════════
     · nutritionist.html(영양사)의 모바일 라이트판(조회 중심). 직접 진입 시 접속코드 요구.
     · 통과 시 localStorage['catc_gate_ok'] 저장. catcLock()으로 잠금 해제. 기능 로직과 분리. -->
<script>
(function(){
  window.catcLock=function(){ try{localStorage.removeItem('catc_gate_ok');}catch(e){} location.reload(); };
  var ok=false; try{ ok=(function(){var t=parseInt(localStorage.getItem('catc_gate_ok'),10);return !!t&&(Date.now()-t)<2592000000;})(); }catch(e){ ok=false; }   /* [보안] 저장이 막힌 환경(시크릿 창 등)에서 코드 없이 통과되던 구멍 차단 */
  if(ok){ window.__catcUnlocked=true; return; }
  window.__catcUnlocked=false;
  document.documentElement.classList.add('catc-locked');
  function build(){
    if(document.getElementById('catcGate')) return;
    var o=document.createElement('div'); o.id='catcGate';
    o.innerHTML='<div class="catc-box"><div class="catc-ic">🔒</div>'
      +'<div class="catc-t">접속 코드 입력</div>'
      +'<div class="catc-s">CATC 교육 플랫폼 · 보안 접속</div>'
      +'<input id="catcInp" type="password" autocomplete="off" placeholder="접속 코드">'
      +'<button id="catcBtn">입장</button><div id="catcMsg"></div></div>';
    (document.body||document.documentElement).appendChild(o);
    var inp=o.querySelector('#catcInp'),btn=o.querySelector('#catcBtn'),msg=o.querySelector('#catcMsg');
    function go(){ if(inp.value==='catc1234'){ var _saved=false; try{ localStorage.setItem('catc_gate_ok',String(Date.now())); _saved=true; }catch(e){} if(_saved){ location.reload(); } else { try{ o.remove(); }catch(e){} document.documentElement.classList.remove('catc-locked'); window.__catcUnlocked=true; } } else { msg.textContent='접속 코드가 올바르지 않습니다.'; inp.value=''; inp.focus(); } }
    btn.addEventListener('click',go);
    inp.addEventListener('keyup',function(e){ if(e.key==='Enter') go(); });
    setTimeout(function(){ try{inp.focus();}catch(e){} },120);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded',build);
})();
</script>

  #catcGate button:active{ transform:scale(.98); }
  #catcGate #catcMsg{ margin-top:11px; min-height:16px; font-size:12.5px; font-weight:700; color:#dc2626; }

    <div class="meal-grid">

    <!-- [K9] 석식 제외 신청 — 교육생이 외출·외박 신청할 때 함께 낸 '석식 제외'. 누르면 과정별 명단. -->

  <!-- [K9] 입교 인원 합계 = 가로바. 누르면 아래로 과정 목록이 펼쳐진다 (중식 체크·식단표와 같은 방식) -->

      <span class="lb-ic" style="background:#fef3c7;color:#b45309;"><i class="fa-solid fa-graduation-cap"></i></span>
      <span class="lb-t">입교 인원 합계</span>

    <div id="crsDetail" style="display:none;">

<div id="__catcVer" aria-hidden="true" style="position:fixed;right:5px;bottom:4px;z-index:2147483647;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:700;color:rgba(148,163,184,.5);background:rgba(120,120,120,.12);padding:2px 5px;border-radius:5px;pointer-events:none;user-select:none;">영양M vC</div>

<script src="config.js?v=b260620c"></script>
<script>
/* ========== 영양사 모바일 라이트뷰 (조회 중심) ========== */
var db = firebase.database();
var MENU_KEY='system/weeklyMenu';
var allRoomData={}, LUNCH={};
function h(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(n){ return String(n).padStart(2,'0'); }
function toLocalStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function getToday(){ return toLocalStr(new Date()); }
function getMondayOf(ds){ var d=new Date(ds+'T00:00:00'); var dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return toLocalStr(d); }
var today=getToday();

function tickClock(){
  var d=new Date(), days=['일','월','화','수','목','금','토'];
  var hh=d.getHours(), ap=hh<12?'AM':'PM', h12=((hh%12)||12);
  var el=document.getElementById('clk');
  if(el) el.innerHTML=(d.getMonth()+1)+'.'+d.getDate()+'('+days[d.getDay()]+') <b>'+h12+':'+pad(d.getMinutes())+'</b> '+ap;
  var tl=document.getElementById('todayLbl'); if(tl) tl.textContent='· '+today;
}
setInterval(tickClock,1000); tickClock();

function countObj(o){ return o ? Object.keys(o).filter(function(k){ return !!o[k]; }).length : 0; }

/* 식수: breakfast / checks(중식) / dinner / dinner_resv — 원본을 MEAL에 저장해 도출근거(명단) 표시 */
var MEAL={ b:{}, l:{}, d:{}, r:{} };
db.ref('system/staffMeal/breakfast/'+today).on('value', function(s){ MEAL.b=s.val()||{}; document.getElementById('cnt-b').textContent=countObj(MEAL.b); refreshSheet('b'); if(window.kacBootDone) kacBootDone(); });
db.ref('system/staffMeal/dinner/'+today).on('value', function(s){ MEAL.d=s.val()||{}; document.getElementById('cnt-d').textContent=countObj(MEAL.d); refreshSheet('d'); });
db.ref('system/staffMeal/dinner_resv/'+today).on('value', function(s){ MEAL.r=s.val()||{}; document.getElementById('cnt-r').textContent=countObj(MEAL.r)+'명'; refreshSheet('r'); });
db.ref('system/staffMeal/checks/'+today).on('value', function(s){
  LUNCH=s.val()||{}; MEAL.l=LUNCH;
  document.getElementById('cnt-l').textContent=countObj(LUNCH);
  var lt=document.getElementById('lunchTot'); if(lt) lt.textContent=countObj(LUNCH);
  renderDept(); refreshSheet('l');
});

/* ── 식수 도출근거(명단) 바텀시트 ── */
var MEAL_META={ b:{t:'조식',ic:'fa-mug-saucer'}, l:{t:'중식',ic:'fa-bowl-rice'}, d:{t:'석식',ic:'fa-moon'}, r:{t:'석식 예약',ic:'fa-calendar-check'} };
var _sheetKind=null;
function mealRows(kind){
  var data=MEAL[kind]||{};
  var rows=Object.keys(data).map(function(k){ return data[k]; }).filter(function(x){ return !!x; });
  rows.sort(function(a,b){ var da=(a.dept||''), dbb=(b.dept||''); if(da!==dbb) return da<dbb?-1:1; return String(a.name||'')<String(b.name||'')?-1:1; });
  return rows;
}
function deptLabel(r){ if(r.dept&&(''+r.dept).trim()) return r.dept; if(r.category==='external') return '사외강사'; if(r.category==='internal') return '내부강사'; return '-'; }
function openMealDetail(kind){
  _sheetKind=kind;
  var meta=MEAL_META[kind], rows=mealRows(kind);
  var html='<h3><i class="fa-solid '+meta.ic+'"></i> '+meta.t+' 명단</h3>'
    +'<div class="ms-sub">'+today+' · 총 <b>'+rows.length+'명</b><br>아래 인원이 체크되어 합계로 집계되었습니다.</div>';
  if(!rows.length){ html+='<div class="empty">해당 인원이 없습니다.</div>'; }
  else{
    html+='<table class="ms-tbl"><thead><tr><th class="num">#</th><th>성함</th><th>부서/구분</th><th>시간</th></tr></thead><tbody>'
      +rows.map(function(r,i){ return '<tr><td class="num">'+(i+1)+'</td><td>'+h(r.name||'-')+'</td><td>'+h(deptLabel(r))+'</td><td style="color:#94a3b8;">'+h(r.time||'')+'</td></tr>'; }).join('')
      +'</tbody></table>';
  }
  html+='<button class="ms-close" onclick="closeMealSheet()">닫기</button>';
  document.getElementById('mealSheet').innerHTML=html;
  document.getElementById('mealSheetOv').classList.add('open');
}
function refreshSheet(kind){ if(_sheetKind===kind && document.getElementById('mealSheetOv').classList.contains('open')) openMealDetail(kind); }
function closeMealSheet(){ _sheetKind=null; document.getElementById('mealSheetOv').classList.remove('open'); }

/* ══ [K9] 석식 제외 신청자 ═══════════════════════════════════════════
   교육생이 외출·외박을 신청할 때 함께 낸 '석식 제외'다.
   저장 위치: courses/{방}/dinner_skips/{오늘}/{토큰} = "이름(사번)" 문자열
   (PC 영양사 화면의 '석식 제외 신청자 — 과정별 명단'과 같은 자료)
   석식 인원 산정에서 빠지는 사람들이라, 식당에서 바로 확인할 수 있어야 한다.
   ═══════════════════════════════════════════════════════════════════ */
function skipRowsByCourse(){
  var out=[], td=getToday();
  for(var i=65;i<=90;i++){
    var rid=String.fromCharCode(i), room=allRoomData[rid];
    if(!room) continue;
    var s=room.settings||{}, st=room.status||{};
    if(!s.courseName) continue;
    if(st.roomStatus!=='active') continue;
    if(s.hideFromBoard) continue;
    var day=(room.dinner_skips||{})[td]||{};
    var names=Object.keys(day).map(function(k){ return day[k]; })
                 .filter(function(v){ return v && (''+v).trim(); })
                 .map(function(v){ return (''+v).trim(); });
    if(!names.length) continue;
    names.sort(function(a,b){ return a.localeCompare(b,'ko'); });
    out.push({ rid:rid, cn:s.courseName, names:names });
  }
  return out;
}
function skipTotal(){
  return skipRowsByCourse().reduce(function(n,c){ return n + c.names.length; }, 0);
}
function openSkipSheet(){
  _sheetKind='skip';
  var groups=skipRowsByCourse(), tot=skipTotal();
  var html='<h3><i class="fa-solid fa-ban" style="color:#f43f5e;"></i> 석식 제외 신청자</h3>'
    +'<div class="ms-sub">'+today+' · 총 <b>'+tot+'명</b><br>외출·외박을 신청하면서 석식 제외를 함께 신청한 인원입니다. (석식 인원에서 빠집니다)</div>';
  if(!groups.length){
    html+='<div class="empty">오늘 석식 제외 신청자가 없습니다.</div>';
  } else {
    groups.forEach(function(g){
      html+='<div class="sec-ttl" style="margin:14px 3px 8px;"><i class="fa-solid fa-graduation-cap"></i> '
          + h(g.cn)+' <span style="font-weight:800;color:#b45309;">#'+g.rid+' · '+g.names.length+'명</span></div>'
          + '<table class="ms-tbl"><thead><tr><th class="num">#</th><th>성함(사번)</th></tr></thead><tbody>'
          + g.names.map(function(nm,i){ return '<tr><td class="num">'+(i+1)+'</td><td>'+h(nm)+'</td></tr>'; }).join('')
          + '</tbody></table>';
    });
  }
  html+='<button class="ms-close" onclick="closeMealSheet()">닫기</button>';
  document.getElementById('mealSheet').innerHTML=html;
  document.getElementById('mealSheetOv').classList.add('open');
}

/* [K9] 입교 인원 합계 = 접이식 가로바 (중식 체크·식단표와 같은 방식) */
function toggleCrs(){
  var bar=document.getElementById('crsBar'), d=document.getElementById('crsDetail');
  if(!bar||!d) return;
  var open=d.style.display!=='none';
  d.style.display=open?'none':'block';
  bar.classList.toggle('open', !open);
}

/* ── 중식 체크 접이식 ── */
function toggleLunch(){ var b=document.getElementById('lunchBar'), d=document.getElementById('lunchDetail'); if(!b||!d) return; var open=(d.style.display==='none'); d.style.display=open?'block':'none'; b.classList.toggle('open',open); }
function toggleMenu(){ var b=document.getElementById('menuBar'), d=document.getElementById('menuDetail'); if(!b||!d) return; var open=(d.style.display==='none'); d.style.display=open?'block':'none'; b.classList.toggle('open',open); }

/* ── 금주 식단표 사진 업로드(모바일) — PC와 동일 형식(weekKey/uploadedAt/url/fileName) ── */
function uploadMenu(input){
  var file=input.files&&input.files[0]; if(!file){ return; }
  if(!/^image\//.test(file.type||'')){ alert('이미지 파일을 선택해 주세요.'); input.value=''; return; }
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var maxW=1400, w=img.width, hh=img.height;
      if(w>maxW){ hh=Math.round(hh*maxW/w); w=maxW; }
      var c=document.createElement('canvas'); c.width=w; c.height=hh;
      c.getContext('2d').drawImage(img,0,0,w,hh);
      var q=0.7, url=c.toDataURL('image/jpeg',q);
      while(url.length>300*1024 && q>0.42){ q-=0.06; url=c.toDataURL('image/jpeg',q); }
      db.ref(MENU_KEY).set({ weekKey:getMondayOf(getToday()), uploadedAt:Date.now(), url:url, fileName:(file.name||'모바일 업로드') })
        .then(function(){ alert('✅ 금주 식단표가 업로드되었습니다.'); })
        .catch(function(){ alert('업로드에 실패했습니다. 다시 시도해 주세요.'); });
    };
    img.onerror=function(){ alert('이미지를 읽지 못했습니다.'); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  input.value='';
}
function deleteMenu(){ if(!confirm('금주 식단표를 삭제할까요?')) return; db.ref(MENU_KEY).remove().then(function(){ alert('삭제되었습니다.'); }); }

function renderDept(){
  var byD={};
  Object.keys(LUNCH).forEach(function(k){ var v=LUNCH[k]; if(!v) return; var d=(v.dept||'기타').trim()||'기타'; byD[d]=(byD[d]||0)+1; });
  var arr=Object.keys(byD).map(function(d){ return [d,byD[d]]; }).sort(function(a,b){ return b[1]-a[1]; });
  var el=document.getElementById('deptCard');
  if(!arr.length){ el.innerHTML='<div class="empty">오늘 중식 체크 내역이 없습니다.</div>'; return; }
  var max=arr[0][1];
  el.innerHTML=arr.slice(0,8).map(function(x){
    var pct=max?Math.round(x[1]/max*100):0;
    return '<div class="dept-row"><span class="dn">'+h(x[0])+'</span><span class="bar"><i style="width:'+pct+'%"></i></span><span class="dv">'+x[1]+'</span></div>';
  }).join('');
}

/* 금주 식단표 */
db.ref(MENU_KEY).on('value', function(snap){
  var data=snap.val(); var el=document.getElementById('menuCard');
  var thisWeek=getMondayOf(getToday());
  var _ms=document.getElementById('menuStatus');
  if(_ms){ var _on=!!(data && (data.url || data.menu)); _ms.textContent=_on?'등록됨':'미등록'; _ms.style.color=_on?'#15803d':'#dc2626'; }
  if(data && (data.url || data.menu)){
    var current = data.weekKey===thisWeek;
    var upcoming = data.weekKey>thisWeek;
    var tag = current ? '<span class="menu-banner ok"><i class="fa-solid fa-circle-check"></i> 이번주 식단표 등록됨</span>'
      : upcoming ? '<span class="menu-banner ok"><i class="fa-solid fa-clock"></i> 차주 식단표 등록됨 (해당 주 자동 표시)</span>'
      : '<span class="menu-banner no"><i class="fa-solid fa-triangle-exclamation"></i> 지난주 식단표입니다. 금주분 미갱신</span>';
    var period = data.period ? '<div class="menu-period">기간: '+h(data.period)+'</div>' : '';
    var body='';
    if(data.url && String(data.url).indexOf('data:image')===0){
      body='<img class="menu-img" src="'+data.url+'" alt="식단표" onclick="openImg(this.src)">';
    } else if(data.menu && data.menu.days){
      body='<div style="font-size:13px;color:#475569;font-weight:700;padding:8px 2px;"><i class="fa-solid fa-file-lines" style="color:#94a3b8"></i> 텍스트 식단표가 등록되어 있습니다. 전체 표는 PC 화면에서 확인하세요.</div>';
    }
    el.innerHTML=tag+period+body;
  } else {
    el.innerHTML='<span class="menu-banner no"><i class="fa-solid fa-triangle-exclamation"></i> 아직 금주 식단표가 등록되지 않았습니다.</span>';
  }
});
function openImg(src){ var o=document.getElementById('imgOv'); document.getElementById('imgOvImg').src=src; o.classList.add('open'); }

/* 운영중 과정 인원 */
db.ref('courses').on('value', function(s){ allRoomData=s.val()||{}; renderCourses(); });
function _nmN(n){ return String(n==null?'':n).replace(/\s+/g,'').toLowerCase(); }
function studentsCount(room){
  var st=room && room.students; if(!st) return 0;
  var entries=Object.keys(st).map(function(k){return st[k];}).filter(function(x){ return x && x.name && (''+x.name).trim() && x.name!=='undefined'; });
  // [K36] 명단 외 미체크 입교자(구경꾼 = 과정담당 직원 등)는 식수 인원에서 제외. 예정명단 없으면 전원(폴백).
  var es=room.expectedStudents, exp=[];
  if(Array.isArray(es)) exp=es.slice(); else if(es&&typeof es==='object') exp=Object.keys(es).map(function(k){return es[k];});
  exp=exp.map(function(n){return String(n==null?'':n).trim();}).filter(Boolean);
  if(!exp.length) return entries.length;
  var set={}; exp.forEach(function(n){ set[_nmN(n)]=1; });
  var inc=room.rosterInclude||{};
  entries.forEach(function(x){ var nm=String(x.name).trim(); if(inc[nm.replace(/[.#$\[\]\/]/g,'_')]) set[_nmN(nm)]=1; });
  return entries.filter(function(x){ return set[_nmN(String(x.name).trim())]; }).length;
}
function renderCourses(){
  var rows=[], total=0, td=getToday();
  for(var i=65;i<=90;i++){
    var rid=String.fromCharCode(i), room=allRoomData[rid]; if(!room) continue;
    var s=room.settings||{}, st=room.status||{};
    if(!s.courseName) continue;
    if(st.roomStatus!=='active') continue;
    if(s.hideFromBoard) continue;
    if(s.period && s.period.indexOf('~')>=0){ var ed=(s.period.split('~')[1]||'').trim(); if(ed && ed<td) continue; }
    var c=studentsCount(room); total+=c;
    rows.push({rid:rid, cn:s.courseName, c:c});
  }
  // [K9] 합계는 가로바에, 과정 목록은 그 아래(펼쳤을 때)에
  var totN=document.getElementById('crsTotN');
  if(totN) totN.textContent=total;
  var list=document.getElementById('crsList');
  if(list){
    list.innerHTML = rows.length
      ? rows.map(function(r){
          return '<div class="crs"><span class="rb">#'+r.rid+'</span><span class="cn">'+h(r.cn)+'</span><span class="pc">'+r.c+'명</span></div>';
        }).join('')
      : '<div class="empty">운영 중인 과정이 없습니다.</div>';
  }
  // [K9] 석식 제외 신청 인원 — 과정 자료(dinner_skips)가 갱신될 때 함께 반영
  var sk=document.getElementById('cnt-skip');
  if(sk) sk.textContent = skipTotal()+'명';
  if(_sheetKind==='skip' && document.getElementById('mealSheetOv').classList.contains('open')) openSkipSheet();
}
var _msov=document.getElementById('mealSheetOv'); if(_msov) _msov.addEventListener('click', function(e){ if(e.target===this) closeMealSheet(); });
</script>

<!-- ═══ [2026-07-07 전체 점검모드] system/maintenance 스위치 하나로 전 플랫폼 동시 점검중 전환.
     on:true면 전체 화면 점검 안내(실시간), off면 즉시 복귀. 재배포 불필요.
     관리자 우회: 주소 뒤 ?ok=우회코드 (SHA-256 대조, 탭 세션 동안 유지) ═══ -->
<script>
(function(){
  var BH='2c978f750e54c66ebaf4cb8b70d6420b6d7cb6dde1209447a4b87b026ed398a9', tries=0;
  function hide(){ var o=document.getElementById('kacMaintOv'); if(o) o.remove(); try{ document.documentElement.style.overflow=''; }catch(e){} }
  function show(v){
    if (sessionStorage.getItem('kac_maint_bypass')==='1') return;
    var o=document.getElementById('kacMaintOv');
    var msg=(v&&v.msg)||'더 나은 서비스를 위해 시스템을 점검하고 있습니다.';
    var until=(v&&v.until)?String(v.until):'';
    if(!o){
      o=document.createElement('div'); o.id='kacMaintOv';
      o.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0f2057 0%,#1a3a8a 75%,#1e40af 140%);';
      document.body.appendChild(o);
      try{ document.documentElement.style.overflow='hidden'; }catch(e){}
    }
    o.innerHTML='<div style="max-width:460px;width:100%;text-align:center;color:#fff;">'
      +'<div style="font-size:64px;line-height:1;margin-bottom:18px;">\uD83D\uDEE0\uFE0F</div>'
      +'<h1 style="margin:0 0 10px;font-size:26px;font-weight:900;letter-spacing:-.3px;">시스템 점검 중입니다</h1>'
      +'<p id="kacMaintMsg" style="margin:0 0 18px;font-size:15px;font-weight:700;color:rgba(255,255,255,.82);line-height:1.65;"></p>'
      +(until?'<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:800;color:#fde68a;">\u23F0 예상 완료: <b id="kacMaintUntil" style="font-weight:900;"></b></div>':'')
      +'<div style="margin-top:30px;font-size:12px;font-weight:700;color:rgba(255,255,255,.45);">KAC \ud56d\uacf5\uae30\uc220\ud6c8\ub828\uc6d0 \ud1b5\ud569 \uad50\uc721 \uc2dc\uc2a4\ud15c</div>'
      +'</div>';
    var m=document.getElementById('kacMaintMsg'); if(m) m.textContent=msg;   // textContent — 안내문구 HTML 주입 차단
    var u=document.getElementById('kacMaintUntil'); if(u) u.textContent=until;
  }
  // 관리자 우회: ?ok=코드
  try{
    var q=new URLSearchParams(location.search).get('ok');
    if(q && window.crypto && crypto.subtle){
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(q)).then(function(b){
        var h=Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
        if(h===BH){ sessionStorage.setItem('kac_maint_bypass','1'); hide(); }
      });
    }
  }catch(e){}
  function boot(){
    if (typeof firebase==='undefined' || !firebase.apps || !firebase.apps.length){ if(++tries<40) setTimeout(boot,700); return; }
    try{
      firebase.database().ref('system/maintenance').on('value', function(s){
        var v=s.val();
        if(v && v.on){ if(document.body) show(v); else document.addEventListener('DOMContentLoaded', function(){ show(v); }); }
        else hide();
      }, function(){ /* 규칙 미발행 시 조용히 무시(정상 서비스) */ });
    }catch(e){}
  }
  boot();
})();
</script>

</body>
