<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 일정 · 교재 제출 — 항공기술훈련원</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app-check.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js?v=cea6ba7f"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{ box-sizing:border-box; }
        body{ margin:0; min-height:100vh; font-family:'Pretendard','Malgun Gothic',sans-serif; background:linear-gradient(160deg,#eef2ff,#e0f2fe); color:#0f172a; display:flex; align-items:flex-start; justify-content:center; padding:48px 18px; }
        .card{ width:100%; max-width:520px; background:#fff; border-radius:24px; box-shadow:0 20px 50px rgba(15,23,42,.12); padding:32px 30px 30px; }
        h1{ margin:0 0 6px; font-size:23px; font-weight:900; }
        .top{ font-size:14px; font-weight:800; color:#6366f1; }
        .course{ margin-top:6px; font-size:26px; font-weight:900; letter-spacing:-.5px; line-height:1.3; }
        .until{ margin-top:4px; font-size:13px; font-weight:700; color:#94a3b8; }
        .step{ display:flex; align-items:center; gap:8px; margin:26px 2px 10px; font-size:16px; font-weight:900; color:#1e293b; }
        .step .no{ width:24px; height:24px; border-radius:50%; background:#4f46e5; color:#fff; font-size:13px; display:inline-flex; align-items:center; justify-content:center; }
        input[type=text]{ width:100%; padding:15px 16px; border:2px solid #e2e8f0; border-radius:14px; font-size:18px; font-weight:800; outline:none; transition:border-color .15s, box-shadow .15s; }
        input[type=text]:focus{ border-color:#6366f1; box-shadow:0 0 0 4px rgba(99,102,241,.15); }
        input[type=text].need{ border-color:#ef4444; box-shadow:0 0 0 4px rgba(239,68,68,.15); }
        .drop{ border:2px dashed #a5b4fc; border-radius:18px; background:#f8faff; padding:34px 18px; text-align:center; cursor:pointer; transition:background .15s, opacity .15s, border-color .15s; }
        .drop > i{ font-size:38px; color:#6366f1; }
        .drop .dt{ font-size:18px; font-weight:900; margin-top:10px; }
        .drop:hover, .drop.on{ background:#eef2ff; border-color:#6366f1; }
        .drop.off{ opacity:.45; }
        .btn{ display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border:none; border-radius:12px; background:#4f46e5; color:#fff; font-size:15px; font-weight:900; cursor:pointer; }
        .row{ display:flex; align-items:center; gap:10px; padding:11px 13px; border:1px solid #e2e8f0; border-radius:12px; margin-top:8px; font-size:14px; font-weight:700; }
        .muted{ color:#94a3b8; font-size:12.5px; font-weight:700; }
        .err{ background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; border-radius:14px; padding:18px; font-weight:800; line-height:1.6; }
        .note{ background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:11px 13px; font-size:13.5px; font-weight:700; color:#475569; line-height:1.6; margin-bottom:10px; }
        .segs{ display:flex; gap:8px; }
        .seg{ flex:1; padding:12px 6px; border:2px solid #e2e8f0; border-radius:12px; background:#fff; font-size:15px; font-weight:900; color:#475569; cursor:pointer; }
        .seg.on{ border-color:#4f46e5; background:#eef2ff; color:#3730a3; }
        table.sv{ width:100%; border-collapse:separate; border-spacing:4px; table-layout:fixed; }
        table.sv thead th{ font-size:13px; color:#64748b; font-weight:900; padding:2px; }
        table.sv thead th:first-child{ width:66px; }
        table.sv tbody th{ font-size:14px; font-weight:900; color:#1e293b; text-align:left; padding-left:2px; white-space:nowrap; }
        table.sv tbody th small{ color:#94a3b8; font-weight:800; margin-left:2px; }
        table.sv td{ height:52px; border-radius:11px; vertical-align:middle; text-align:center; padding:4px; font-size:12px; }
        td.c{ border:1.5px solid #e2e8f0; background:#fff; cursor:pointer; transition:background .12s, border-color .12s; }
        td.c:hover{ border-color:#a5b4fc; background:#f8faff; }
        td.c.s1{ border-color:#4f46e5; background:#eef2ff; }
        td.c.s2{ border-color:#0ea5e9; background:#f0f9ff; }
        td.bl{ background:repeating-linear-gradient(135deg,#f1f5f9 0 8px,#e2e8f0 8px 16px); color:#64748b; font-weight:800; cursor:not-allowed; }
        td.bl span{ background:rgba(255,255,255,.85); padding:2px 7px; border-radius:6px; }
        .mb{ display:inline-block; padding:2px 9px; border-radius:999px; color:#fff; font-size:12.5px; margin:1px; }
        .mb.b1, b.b1{ background:#4f46e5; } .mb.b2, b.b2{ background:#0ea5e9; }
        b.b1, b.b2{ color:#fff; padding:1px 7px; border-radius:999px; font-size:12px; }
        .oc{ display:inline-block; margin:1px; padding:2px 7px; border-radius:7px; background:#fff7ed; color:#9a3412; font-size:11.5px; font-weight:800; white-space:nowrap; }
        .oc.o2{ background:#f1f5f9; color:#64748b; }
        .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
        .chip{ padding:10px 14px; border:2px solid #e2e8f0; border-radius:999px; background:#fff; font-size:14px; font-weight:800; color:#475569; cursor:pointer; }
        .chip.on{ border-color:#16a34a; background:#f0fdf4; color:#15803d; }
        textarea{ width:100%; margin-top:12px; padding:12px 14px; border:2px solid #e2e8f0; border-radius:12px; font:inherit; font-size:14.5px; font-weight:700; resize:vertical; outline:none; }
        textarea:focus{ border-color:#6366f1; }
        .toast{ position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:#0f172a; color:#fff; padding:13px 22px; border-radius:999px; font-size:14.5px; font-weight:800; box-shadow:0 10px 30px rgba(0,0,0,.25); transition:opacity .3s; z-index:99999; }
        .btn:disabled{ opacity:.6; cursor:default; }
        .sub2{ margin:16px 2px 8px; font-size:14px; font-weight:900; color:#334155; }
        .sub2 i{ color:#6366f1; margin-right:4px; }
        .pkInfo{ margin-top:10px; background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:11px 13px; font-size:13px; font-weight:700; color:#92400e; line-height:1.65; }
        .sel{ flex:1; padding:12px 10px; border:2px solid #e2e8f0; border-radius:12px; font:inherit; font-size:14.5px; font-weight:800; background:#fff; }
        .pkMemo{ margin-top:8px; font-size:14.5px !important; padding:12px 14px !important; }
        .pw{ display:block; margin:1px 0 2px; font-size:11px; font-weight:800; color:#b45309; }
    </style>
</head>
<body>
<div class="card" id="app">
    <div class="sub">불러오는 중…</div>
</div>
<script>
/* [K152] 외부 강사 교재 업로드 페이지 — 교육운영부가 만든 '기간 한정 링크'로만 열린다.
   · 이 페이지에서 할 수 있는 것: 지정된 과정에 교재 '올리기'만 (보기·삭제 불가)
   · 링크의 서명·기간은 Cloudflare 가 확인하고, 운영부가 링크를 '중지'하면 여기서도 막는다 */
(function(){
  var app = document.getElementById('app');
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var API = (window.KAC_MATERIALS_API || 'https://catcmaterials.jds0616.workers.dev');
  var qs = new URLSearchParams(location.search);
  var tok = qs.get('t') || '';
  var info = null;
  function parseTok(){ info = null; try{ var p = tok.split('~')[0].replace(/-/g,'+').replace(/_/g,'/'); while(p.length % 4) p += '='; info = JSON.parse(decodeURIComponent(escape(atob(p)))); }catch(e){} }
  function fail(msg){ app.innerHTML = '<h1>교재 업로드</h1><div class="err" style="margin-top:14px;">' + msg + '</div><div class="muted" style="margin-top:12px;">문의: 항공기술훈련원 교육운영부</div>'; }
  /* [K156/K157] 날짜·크기 표기 함수 — 아래 '짧은 주소' 분기가 먼저 return 하므로 반드시 그 위에서 정의 */
  var fmt = function(ms){ var d = new Date(Number(ms)); return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.'; };
  var fmtSize = function(b){ b=Number(b)||0; return b>=1048576 ? (b/1048576).toFixed(1)+'MB' : Math.max(1,Math.round(b/1024))+'KB'; };
  /* [K155] 짧은 주소(?k=번호) — 서명 토큰을 서버에서 받아온다 */
  function start(){
  parseTok();
  if(!info || !info.r || !info.e) return fail('링크가 올바르지 않습니다.<br>받으신 주소 전체를 다시 확인해 주세요.');
  if(Date.now() > Number(info.e)) return fail('업로드 기간이 끝난 링크입니다.<br>담당자에게 새 링크를 요청해 주세요.');

  firebase.database().ref('system/coord/uploadLinks/' + String(info.n||'x')).once('value').then(function(s){
    var v = s.val();
    if(v && v.revoked) return fail('담당자가 이 업로드 링크를 중지했습니다.<br>필요하시면 새 링크를 요청해 주세요.');
    render();
  }).catch(function(){ render(); });
  }

  /* [K160] 화면 단순화 — ① 성함 ② 파일 두 단계만. 한 과정에 링크 1개를 여러 강사가 함께 쓰므로 '내 파일'은 성함으로 구분 */
  function render(){
    var saved = ''; try{ saved = localStorage.getItem('kac_ext_name') || ''; }catch(e){}
    app.innerHTML = '<div class="top"><i class="fa-solid fa-chalkboard-user"></i> 강의 일정 · 교재 제출</div>'
      + '<div class="course">' + esc(info.c || ('Room ' + info.r)) + '</div>'
      + '<div class="until">' + fmt(info.e) + '까지</div>'
      + '<div class="step"><span class="no">1</span> 성함</div>'
      + '<input type="text" id="nm" placeholder="홍길동" value="' + esc(saved) + '" autocomplete="name">'
      + '<div id="svWrap"></div>'
      + '<div class="step"><span class="no" id="fileNo">2</span> 교재 파일 <span class="muted" style="margin-left:4px;">(있으면)</span></div>'
      + '<div class="drop" id="dz"><i class="fa-solid fa-file-arrow-up"></i><div class="dt">눌러서 파일 선택</div><div class="muted">또는 여기로 끌어다 놓기</div></div>'
      + '<input type="file" id="fi" multiple style="display:none;">'
      + '<div id="list"></div>'
      + '<div id="mineWrap" style="display:none;"><div class="step" style="margin-top:26px;"><i class="fa-solid fa-circle-check" style="color:#16a34a;"></i> 제출한 파일 <span id="mineCnt" class="muted"></span></div><div id="mine"></div></div>';
    var dz = document.getElementById('dz'), fi = document.getElementById('fi'), nmI = document.getElementById('nm');
    var sync = function(){ dz.classList.toggle('off', !nmI.value.trim()); drawMine(); svOnName(); };
    nmI.addEventListener('input', sync);
    dz.onclick = function(){ if(!nmI.value.trim()){ nmI.focus(); nmI.classList.add('need'); setTimeout(function(){ nmI.classList.remove('need'); }, 1200); return; } fi.click(); };
    fi.onchange = function(){ go(fi.files); fi.value=''; };
    ['dragenter','dragover'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('on'); }); });
    ['dragleave','drop'].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove('on'); }); });
    dz.addEventListener('drop', function(e){ go(e.dataTransfer && e.dataTransfer.files); });
    sync(); loadMine(); svStart();
    if(!saved) nmI.focus();
  }

  /* ══ [K161] 강의 가능 일정 사전조사 — system/coord/preSurvey/{방}
       · 날짜 × 오전/오후 칸을 눌러 1안 → 2안 → 취소
       · 다른 강사님이 고른 칸은 'OOO 강사'로 보이고, 담당자가 막아 둔 칸(견학 등)은 고를 수 없다 ══ */
  var SV = { on:false, days:[], blocks:{}, resp:{}, my:{ avail:'', p1:{}, p2:{}, stay:false, pickup:false, msg:'', title:'' }, loadedFor:'' , dirty:false };
  var WD = ['일','월','화','수','목','금','토'];
  function svRef(){ return firebase.database().ref('system/coord/preSurvey/' + String(info.r)); }
  var TTL_RE = /\s*(강사|교수|부장|차장|과장|대리|주임|연구원|박사|소장|팀장|원장|사원|위원)$/;
  function svKey(n){ return String(n||'').trim().replace(TTL_RE,'').replace(/[.#$\[\]\/\s]/g,'').slice(0,40); }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function daysOf(s, e, hol){
    var out = []; if(!/^\d{4}-\d{2}-\d{2}$/.test(s) || !/^\d{4}-\d{2}-\d{2}$/.test(e)) return out;
    var d = new Date(s+'T00:00:00'), end = new Date(e+'T00:00:00');
    for(var i=0; d<=end && i<62; i++){ var w = d.getDay(); if(w!==0 && w!==6) out.push({ d: ymd(d), w: w, hol: (hol||{})[ymd(d)] || '' }); d.setDate(d.getDate()+1); }
    return out;
  }
  function svStart(){
    Promise.all([
      firebase.database().ref('courses/' + info.r + '/settings/period').once('value').then(function(s){ return String(s.val()||''); }).catch(function(){ return ''; }),
      firebase.database().ref('system/holidays').once('value').then(function(s){ return s.val()||{}; }).catch(function(){ return {}; })
    ]).then(function(r){
      var pd = r[0], hol = r[1];
      svRef().on('value', function(s){
        var v = s.val() || {};
        var rg = v.range || {}, ps = pd.split('~').map(function(x){ return x.trim(); });
        SV.days = daysOf(rg.s || ps[0] || '', rg.e || ps[1] || '', hol);
        SV.blocks = v.blocks || {}; SV.bk = v.bk || {}; SV.resp = v.resp || {}; SV.note = String(v.note || '');
        SV.on = SV.days.length > 0 && v.enabled !== false;
        svOnName(true); svDraw();
      });
    });
  }
  /* [K164] 담당자 일정 막기 — bk/{날짜}/{id} = {s:시작시, e:끝시, why}. 오전 9~12시·오후 13~18시를 다 덮으면 그 칸은 선택 불가, 일부만 덮으면 안내만 */
  function bkLabel(b){ var s = Number(b.s), e = Number(b.e); return (s <= 9 && e >= 18 ? '종일' : (s + '~' + e + '시')) + ' ' + (b.why || ''); }
  function slotBk(d, t){
    var list = []; var day = (SV.bk || {})[d] || {}; Object.keys(day).forEach(function(id){ list.push(day[id]); });
    var a = t === 'am' ? 9 : 13, z = t === 'am' ? 12 : 18, full = true, part = [];
    for(var x = a; x < z; x++){ if(!list.some(function(b){ return Number(b.s) <= x && Number(b.e) >= x + 1; })) full = false; }
    list.forEach(function(b){ if(Number(b.s) < z && Number(b.e) > a) part.push(bkLabel(b)); });
    return { full: full && part.length ? part.join(' · ') : '', part: part };
  }
  function svOnName(force){
    var k = svKey(myName());
    if(k !== SV.loadedFor || (force && !SV.dirty)){
      var r = k && SV.resp[k];
      SV.my = r ? { avail: r.avail||'', p1: Object.assign({}, r.p1||{}), p2: Object.assign({}, r.p2||{}), stay: !!r.stay, pickup: !!r.pickup, pkPlace: r.pkPlace||'', pkDate: r.pkDate||'', pkTime: r.pkTime||'', pkMemo: r.pkMemo||'', msg: r.msg||'', title: r.title||'', at: r.at }
                : { avail:'', p1:{}, p2:{}, stay:null, pickup:null, pkPlace:'', pkDate:'', pkTime:'', pkMemo:'', msg:'', title:'' };
      SV.dirty = false; SV.loadedFor = k;
    }
    svDraw();
  }
  var PK_TIMES = (function(){ var a = []; [8,9,10,11,13,14,15,16,17].forEach(function(hh){ a.push(String(hh).padStart(2,'0')+':00'); if(hh!==11 && hh!==17) a.push(String(hh).padStart(2,'0')+':30'); }); return a; })();
  function yn(f, v, label){ var cur = SV.my[f]; var on = (v ? cur === true : cur === false); return '<button type="button" class="seg' + (on?' on':'') + '" data-yn="' + f + '" data-v="' + (v?1:0) + '">' + label + '</button>'; }
  function who(r){ return esc(r.name) + ' ' + esc(r.title || '강사'); }
  function svDraw(){
    var w = document.getElementById('svWrap'), fno = document.getElementById('fileNo'); if(!w) return;
    if(!SV.on){ w.innerHTML = ''; if(fno) fno.textContent = '2'; return; }
    if(fno) fno.textContent = '3';
    var me = svKey(myName()), my = SV.my, a = my.avail;
    var seg = function(v, label){ return '<button type="button" class="seg' + (a===v?' on':'') + '" data-av="' + v + '">' + label + '</button>'; };
    var h = '<div class="step"><span class="no">2</span> 강의 가능 일정</div>'
      + (SV.note ? '<div class="note">' + esc(SV.note).replace(/\n/g,'<br>') + '</div>' : '')
      + '<div class="segs">' + seg('가능','출강 가능') + seg('불가능','불가능') + seg('미정','미정') + '</div>';
    if(a === '가능' || a === '미정'){
      h += '<div class="muted" style="margin:12px 2px 8px;">칸을 누르면 <b class="b1">1안</b> → <b class="b2">2안</b> → 취소</div><table class="sv"><thead><tr><th></th><th>오전</th><th>오후</th></tr></thead><tbody>';
      SV.days.forEach(function(d){
        var md = Number(d.d.slice(5,7)) + '.' + Number(d.d.slice(8,10));
        h += '<tr><th>' + md + '<small>(' + WD[d.w] + ')</small></th>';
        ['am','pm'].forEach(function(t){
          var k = d.d + '_' + t, sb = slotBk(d.d, t), bl = SV.blocks[k] || d.hol || sb.full;
          if(bl){ h += '<td class="bl"><span>' + esc(bl) + '</span></td>'; return; }
          var others = Object.keys(SV.resp).filter(function(x){ var r = SV.resp[x]||{}; return x !== me && r.avail !== '불가능' && ((r.p1||{})[k] || (r.p2||{})[k]); })
            .map(function(x){ var r = SV.resp[x]; return '<span class="oc' + ((r.p1||{})[k] ? '' : ' o2') + '">' + who(r) + '</span>'; }).join('');
          var mine = my.p1[k] ? '<b class="mb b1">1안</b>' : (my.p2[k] ? '<b class="mb b2">2안</b>' : '');
          var warn = sb.part.length ? '<span class="pw"><i class="fa-solid fa-triangle-exclamation"></i> ' + esc(sb.part.join(' · ')) + '</span>' : '';
          h += '<td class="c' + (my.p1[k] ? ' s1' : (my.p2[k] ? ' s2' : '')) + '" data-k="' + k + '">' + warn + mine + others + '</td>';
        });
        h += '</tr>';
      });
      h += '</tbody></table>'
        /* [K162] 숙박·픽업 — 구글폼 항목 그대로 + 픽업 운행 가능 시간 안내 */
        + '<div class="sub2"><i class="fa-solid fa-bed"></i> 교육 전날 숙박</div>'
        + '<div class="segs">' + yn('stay', true, '숙박 신청합니다') + yn('stay', false, '해당 없음') + '</div>'
        + '<div class="sub2"><i class="fa-solid fa-van-shuttle"></i> 픽업 (기사님 차량)</div>'
        + '<div class="segs">' + yn('pickup', true, '픽업 요청합니다') + yn('pickup', false, '해당 없음') + '</div>'
        + (my.pickup ? '<div class="pkInfo"><b>운행 가능 시간</b> 오전 08:00~11:00 · 오후 13:00~17:00<br>12~13시는 기사님 점심시간이라 운행하지 않습니다. 기사님 퇴근을 고려해 <b>가급적 16시 이전</b>으로 부탁드립니다.</div>'
            + '<div class="segs" style="margin-top:8px;">' + ['오송역','청주공항','청주터미널'].map(function(v){ return '<button type="button" class="seg' + (my.pkPlace===v?' on':'') + '" data-pp="' + v + '">' + v + '</button>'; }).join('') + '</div>'
            + '<div style="display:flex; gap:8px; margin-top:8px;"><select id="pkDate" class="sel"><option value="">도착 날짜</option>' + SV.days.map(function(d){ var md = Number(d.d.slice(5,7)) + '.' + Number(d.d.slice(8,10)) + ' (' + WD[d.w] + ')'; return '<option value="' + d.d + '"' + (my.pkDate===d.d?' selected':'') + '>' + md + '</option>'; }).join('') + '</select>'
            + '<select id="pkTime" class="sel"><option value="">도착 시각</option>' + PK_TIMES.map(function(t){ return '<option value="' + t + '"' + (my.pkTime===t?' selected':'') + '>' + t + (t > '16:00' ? ' (가급적 16시 전)' : '') + '</option>'; }).join('') + '</select></div>'
            + '<input type="text" id="pkMemo" class="pkMemo" placeholder="열차·버스편 등 (선택) 예) KTX 101편" value="' + esc(my.pkMemo||'') + '">' : '');
    }
    if(a){
      h += '<textarea id="svMsg" rows="2" placeholder="전달하실 말씀 (선택)">' + esc(my.msg) + '</textarea>'
        + '<button type="button" class="btn" id="svGo" style="width:100%; justify-content:center; margin-top:10px; padding:14px;"><i class="fa-solid fa-paper-plane"></i> ' + (my.at ? '일정 다시 제출' : '일정 제출') + '</button>'
        + (my.at ? '<div class="muted" style="margin-top:8px; text-align:center;"><i class="fa-solid fa-circle-check" style="color:#16a34a;"></i> ' + svTime(my.at) + ' 제출됨 · 고치고 다시 누르면 바뀝니다</div>' : '');
    }
    w.innerHTML = h;
    w.querySelectorAll('[data-av]').forEach(function(b){ b.onclick = function(){ if(!svNeedName()) return; SV.my.avail = b.getAttribute('data-av'); SV.dirty = true; svDraw(); }; });
    w.querySelectorAll('td.c').forEach(function(td){ td.onclick = function(){
      if(!svNeedName()) return; var k = td.getAttribute('data-k');
      if(my.p1[k]){ delete my.p1[k]; my.p2[k] = true; } else if(my.p2[k]){ delete my.p2[k]; } else { my.p1[k] = true; }
      SV.dirty = true; svDraw(); }; });
    w.querySelectorAll('[data-yn]').forEach(function(b){ b.onclick = function(){ my[b.getAttribute('data-yn')] = b.getAttribute('data-v') === '1'; SV.dirty = true; svDraw(); }; });
    w.querySelectorAll('[data-pp]').forEach(function(b){ b.onclick = function(){ my.pkPlace = b.getAttribute('data-pp'); SV.dirty = true; svDraw(); }; });
    var pd = document.getElementById('pkDate'), pt = document.getElementById('pkTime'), pm = document.getElementById('pkMemo');
    if(pd) pd.onchange = function(){ my.pkDate = pd.value; SV.dirty = true; };
    if(pt) pt.onchange = function(){ my.pkTime = pt.value; SV.dirty = true; };
    if(pm) pm.oninput = function(){ my.pkMemo = pm.value; SV.dirty = true; };
    var ta = document.getElementById('svMsg'); if(ta) ta.oninput = function(){ my.msg = ta.value; SV.dirty = true; };
    var go = document.getElementById('svGo'); if(go) go.onclick = svSubmit;
  }
  function svTime(ms){ var d = new Date(Number(ms)), p = function(n){ return String(n).padStart(2,'0'); }; return (d.getMonth()+1)+'.'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes()); }
  function svNeedName(){ if(myName()) return true; var ni = document.getElementById('nm'); ni.focus(); ni.classList.add('need'); setTimeout(function(){ ni.classList.remove('need'); }, 1200); return false; }
  function svSubmit(){
    if(!svNeedName()) return;
    var my = SV.my, nm = myName();
    if(my.avail === '가능' && !Object.keys(my.p1).length && !Object.keys(my.p2).length){ alert('가능한 칸을 하나 이상 눌러 주세요.'); return; }
    if(my.avail !== '불가능'){
      if(my.stay !== true && my.stay !== false){ alert('교육 전날 숙박 여부를 골라 주세요.'); return; }
      if(my.pickup !== true && my.pickup !== false){ alert('픽업 요청 여부를 골라 주세요.'); return; }
      if(my.pickup && (!my.pkPlace || !my.pkDate || !my.pkTime)){ alert('픽업 장소·도착 날짜·도착 시각을 골라 주세요.'); return; }
    }
    var tm = nm.match(TTL_RE), ttl = tm ? tm[1] : '';
    var pure = ttl ? nm.replace(TTL_RE, '').trim() : nm;
    var rec = { name: pure, title: ttl || my.title || '강사', avail: my.avail, p1: (my.avail==='불가능'?null:my.p1), p2: (my.avail==='불가능'?null:my.p2), stay: my.avail!=='불가능' && my.stay===true, pickup: my.avail!=='불가능' && my.pickup===true,
                pkPlace: (my.pickup && my.avail!=='불가능') ? my.pkPlace : null, pkDate: (my.pickup && my.avail!=='불가능') ? my.pkDate : null, pkTime: (my.pickup && my.avail!=='불가능') ? my.pkTime : null, pkMemo: (my.pickup && my.avail!=='불가능') ? String(my.pkMemo||'').slice(0,80) : null, msg: String(my.msg||'').slice(0,500), at: Date.now() };
    try{ localStorage.setItem('kac_ext_name', nm); }catch(e){}
    var go = document.getElementById('svGo'); if(go){ go.disabled = true; go.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 제출 중…'; }
    svRef().child('resp/' + svKey(nm)).set(rec).then(function(){ SV.dirty = false; SV.my.at = rec.at; svDraw(); toast('일정을 제출했습니다. 감사합니다!'); })
      .catch(function(e){ alert('제출하지 못했습니다. 잠시 후 다시 눌러 주세요.\n(' + (e && e.message || e) + ')'); svDraw(); });
  }
  function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<i class="fa-solid fa-circle-check" style="color:#4ade80;"></i> ' + esc(msg); document.body.appendChild(t); setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 350); }, 2600); }

  var mine = [];   // [{id, ...rec}]
  function loadMine(){
    return firebase.database().ref('system/materials').orderByChild('viaLink').equalTo(String(info.n || '_')).once('value').then(function(s){
      var v = s.val() || {}; mine = Object.keys(v).map(function(k){ return Object.assign({ id:k }, v[k]); }).sort(function(a,b){ return (b.uploadedAt||0)-(a.uploadedAt||0); });
      drawMine();
    }).catch(function(){ mine = []; drawMine(); });
  }
  function myName(){ return String((document.getElementById('nm')||{}).value || '').trim(); }
  function myFiles(){ var n = myName().replace(/\s+/g,''); if(!n) return []; return mine.filter(function(m){ return String(m.uploader||'').replace(/\s+/g,'') === n; }); }
  function drawMine(){
    var box = document.getElementById('mine'), cnt = document.getElementById('mineCnt'), wrap = document.getElementById('mineWrap'); if(!box) return;
    var my = myFiles();
    if(wrap) wrap.style.display = my.length ? '' : 'none';
    if(cnt) cnt.textContent = my.length ? (my.length + '건') : '';
    if(!my.length){ box.innerHTML = ''; return; }
    box.innerHTML = my.map(function(m){
      var d = new Date(m.replacedAt || m.uploadedAt || 0), p = function(n){ return String(n).padStart(2,'0'); };
      var ds = d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
      return '<div class="row"><i class="fa-solid fa-file-lines" style="color:#4f46e5;"></i><span style="flex:1; min-width:0;"><span style="display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + esc(m.fileName || m.title) + '</span>'
        + '<span class="muted">' + fmtSize(m.size) + ' · ' + (m.replacedAt ? '<b style="color:#ea580c;">바꿈</b> ' : '') + ds + '</span></span>'
        + '<button type="button" data-del="' + esc(m.id) + '" style="flex-shrink:0; padding:6px 11px; border:none; border-radius:9px; background:#fef2f2; color:#dc2626; font-size:12.5px; font-weight:800; cursor:pointer;">삭제</button></div>';
    }).join('');
    box.querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){ delMine(b.getAttribute('data-del')); }; });
  }
  function fileUrlOf(k){ return API + '/f/' + String(k).split('/').map(encodeURIComponent).join('/'); }
  async function rmR2(k){ try{ if(k) await fetch(fileUrlOf(k), { method:'DELETE', headers:{ 'X-Upload-Token': tok } }); }catch(e){} }
  async function delMine(id){
    var m = mine.filter(function(x){ return x.id === id; })[0]; if(!m) return;
    if(!confirm('"' + (m.fileName || m.title) + '" 을(를) 삭제할까요?\n교육생 화면에서도 사라집니다.')) return;
    await rmR2(m.key);
    await firebase.database().ref('courses/' + info.r + '/materials/' + id).remove().catch(function(){});
    await firebase.database().ref('system/materials/' + id).remove().catch(function(){});
    loadMine();
  }
  function sameFile(name){
    var base = function(s){ return String(s||'').replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|#%&+]/g,'_').replace(/\s+/g,' ').trim().toLowerCase(); };
    var b = base(name); return myFiles().filter(function(m){ return base(m.fileName || m.title) === b; })[0] || null;
  }
  function askReplace(f, old){
    return new Promise(function(res){
      var o = document.createElement('div'); o.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:20px';
      o.innerHTML = '<div style="background:#fff;border-radius:18px;padding:24px;width:100%;max-width:420px">'
        + '<div style="font-size:17px;font-weight:900;margin-bottom:8px">같은 이름의 교재가 이미 있습니다</div>'
        + '<div style="font-size:14px;color:#475569;font-weight:700;line-height:1.7">이미 올린 파일: <b>' + esc(old.fileName || old.title) + '</b> (' + fmtSize(old.size) + ')<br>새로 올리는 파일: <b>' + esc(f.name) + '</b> (' + fmtSize(f.size) + ')</div>'
        + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">'
        + '<button data-v="replace" class="btn" style="justify-content:center">🔄 새 파일로 바꾸기 (예전 파일은 지움)</button>'
        + '<button data-v="both" style="padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-weight:800;cursor:pointer">둘 다 남기기 (따로 올리기)</button>'
        + '<button data-v="" style="padding:11px;border:none;border-radius:12px;background:#f1f5f9;color:#475569;font-weight:800;cursor:pointer">이 파일은 건너뛰기</button></div></div>';
      document.body.appendChild(o);
      o.addEventListener('click', function(e){ var b = e.target.closest('[data-v]'); if(!b) return; o.remove(); res(b.getAttribute('data-v')); });
    });
  }

  async function go(files){
    files = Array.prototype.slice.call(files || []); if(!files.length) return;
    var nm = myName();
    if(!nm){ var ni = document.getElementById('nm'); ni.focus(); ni.classList.add('need'); setTimeout(function(){ ni.classList.remove('need'); }, 1200); return; }
    try{ localStorage.setItem('kac_ext_name', nm); }catch(e){}
    var list = document.getElementById('list');
    for(var i=0;i<files.length;i++){
      var f = files[i];
      var row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="color:#4f46e5;"></i><span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + esc(f.name) + '</span><span class="muted">' + fmtSize(f.size) + '</span>';
      list.appendChild(row);
      var old = sameFile(f.name), mode = 'new';
      if(old){ mode = await askReplace(f, old); if(!mode){ row.firstChild.className = 'fa-solid fa-forward'; row.firstChild.style.color = '#94a3b8'; row.lastChild.textContent = '건너뜀'; continue; } }
      try{
        if(f.size > 100*1024*1024) throw new Error('100MB를 넘는 파일은 올릴 수 없습니다.');
        var r = await fetch(API + '/upload?name=' + encodeURIComponent(f.name), { method:'POST', headers:{ 'X-Upload-Token': tok, 'Content-Type': f.type || 'application/octet-stream' }, body: f });
        var j = await r.json().catch(function(){ return {}; });
        if(!r.ok || !j.ok) throw new Error(j.error || ('업로드 실패 (' + r.status + ')'));
        if(mode === 'replace' && old){
          // 같은 교재 자리를 그대로 두고 파일만 바꾼다 → 과정 연결·교육생 목록이 그대로 새 파일을 가리킨다
          await firebase.database().ref('system/materials/' + old.id).update({ fileName: j.name, size: Number(j.size || f.size || 0), url: j.url, key: j.key, wmKey: null, wmSize: null, replacedAt: Date.now(), uploader: nm });
          await rmR2(old.key); if(old.wmKey) await rmR2(old.wmKey);
          row.lastChild.textContent = '새 파일로 바꿈';
        } else {
          var ref = firebase.database().ref('system/materials').push();
          await ref.set({ title: String(f.name).replace(/\.[^.]+$/, ''), fileName: j.name, size: Number(j.size || f.size || 0), url: j.url, key: j.key,
                          uploader: nm, uploaderRole: '외부강사', course: String(info.c || ''), uploadedAt: Date.now(), viaLink: String(info.n || '') });
          await firebase.database().ref('courses/' + info.r + '/materials/' + ref.key).set({ linkedAt: Date.now(), linkedBy: nm + ' (외부강사)' });
          row.lastChild.textContent = '완료';
        }
        row.firstChild.className = 'fa-solid fa-circle-check'; row.firstChild.style.color = '#16a34a';
        await loadMine();
      }catch(e){
        row.firstChild.className = 'fa-solid fa-circle-xmark'; row.firstChild.style.color = '#dc2626';
        row.lastChild.textContent = (e && e.message) || '실패'; row.lastChild.style.color = '#dc2626';
      }
    }
  }
  /* [K163] 시작은 반드시 맨 끝에서 — 위의 var 변수(SV·mine 등)가 모두 준비된 뒤에 실행해야 한다.
     (중간에서 return 하던 예전 구조 때문에 짧은 주소로 열면 설문이 안 보이고 업로드가 멈췄음) */
  var k = qs.get('k');
  if(k && !tok){
    firebase.database().ref('system/coord/uploadLinks/' + String(k).replace(/[^a-z0-9]/gi,'')).once('value').then(function(s){
      var v = s.val() || {}; tok = String(v.tok || ''); start();
    }).catch(function(){ start(); });
  } else start();
})();
</script>
</body>
