<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <script>
  /* [기기 분리] PC 접속은 PC 전용 화면으로 (모바일은 이 화면 유지). ?forcem 으로 강제 모바일. */
  (function(){ try{
    var wide = window.innerWidth >= 1024;
    var fine = window.matchMedia && window.matchMedia('(pointer:fine)').matches;
    var noTouch = !('ontouchstart' in window) || navigator.maxTouchPoints === 0;
    var isPc = wide && (fine || noTouch);
    if(isPc && location.search.indexOf('forcem')<0){ location.replace('admin.html'+location.search+location.hash); }
  }catch(e){} })();
  </script>
<!-- ════════ [카카오채널 연동] catc1234 접속 게이트 (수정상태: 수정안하는중) ════════
     · admin.html(교수전용 강의 플랫폼)의 모바일 라이트판(조회 중심). 직접 진입 시 접속코드 요구.
     · 통과 시 localStorage['catc_gate_ok'] 저장. catcLock()으로 잠금 해제. 기능 로직과 분리. -->
<script>
(function(){
  window.catcLock=function(){ try{localStorage.removeItem('catc_gate_ok');}catch(e){} location.reload(); };
  var ok=false; try{ ok=(function(){var t=parseInt(localStorage.getItem('catc_gate_ok'),10);return !!t&&(Date.now()-t)<86400000;})(); }catch(e){ ok=true; }
  if(ok){ window.__catcUnlocked=true; return; }
  window.__catcUnlocked=false;
  document.documentElement.classList.add('catc-locked');
  function build(){
    if(document.getElementById('catcGate')) return;
    var o=document.createElement('div'); o.id='catcGate';
    o.innerHTML='<div class="catc-box"><div class="catc-ic">🔒</div>'
      +'<div class="catc-t">접속 코드 입력</div>'
      +'<div class="catc-s">CATC 교육 플랫폼 · 보안 접속</div>'
      +'<input id="catcInp" type="password" autocomplete="off" placeholder="접속 코드">'
      +'<button id="catcBtn">입장</button><div id="catcMsg"></div></div>';
    (document.body||document.documentElement).appendChild(o);
    var inp=o.querySelector('#catcInp'),btn=o.querySelector('#catcBtn'),msg=o.querySelector('#catcMsg');
    function go(){ if(inp.value==='catc1234'){ try{localStorage.setItem('catc_gate_ok',String(Date.now()));}catch(e){} location.reload(); } else { msg.textContent='접속 코드가 올바르지 않습니다.'; inp.value=''; inp.focus(); } }
    btn.addEventListener('click',go);
    inp.addEventListener('keyup',function(e){ if(e.key==='Enter') go(); });
    setTimeout(function(){ try{inp.focus();}catch(e){} },120);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded',build);
})();
</script>
<style>
  html.catc-locked > body{ visibility:hidden !important; }
  #catcGate{ position:fixed; inset:0; z-index:2147483647; background:linear-gradient(135deg,#0f172a,#1e293b); display:flex; align-items:center; justify-content:center; font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif; visibility:visible !important; }
  #catcGate *{ visibility:visible !important; box-sizing:border-box; }
  #catcGate .catc-box{ width:300px; max-width:86vw; background:#fff; border-radius:18px; padding:30px 26px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  #catcGate .catc-ic{ font-size:30px; margin-bottom:8px; }
  #catcGate .catc-t{ font-size:19px; font-weight:800; color:#0f172a; }
  #catcGate .catc-s{ margin:4px 0 18px; font-size:12.5px; color:#64748b; }
  #catcGate input{ width:100%; padding:13px 14px; font-size:16px; text-align:center; letter-spacing:2px; border:1.5px solid #e2e8f0; border-radius:11px; outline:none; color:#0f172a; background:#fff; }
  #catcGate input:focus{ border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  #catcGate button{ width:100%; margin-top:12px; padding:13px; font-size:15px; font-weight:800; color:#fff; background:#2563eb; border:0; border-radius:11px; cursor:pointer; }
  #catcGate button:active{ transform:scale(.98); }
  #catcGate #catcMsg{ margin-top:11px; min-height:16px; font-size:12.5px; font-weight:700; color:#dc2626; }
</style>

    .mhead{ background:linear-gradient(145deg,#0b1220 0%,#172554 62%,#1d4ed8 100%); color:#fff; padding:14px 16px 18px; position:sticky; top:0; z-index:50; border-radius:0 0 28px 28px; box-shadow:0 18px 38px rgba(15,23,42,.30); overflow:hidden; }

    .sec{ padding:15px 14px 0; }

    /* 강의실 선택 칩 */
    .room-pick{ display:flex; gap:9px; overflow-x:auto; padding:1px 2px 6px; scrollbar-width:none; }

    .rchip.on{ background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; border-color:#2563eb; box-shadow:0 12px 24px rgba(37,99,235,.26); }
    .rchip .cn{ display:block; max-width:112px; font-size:11px; font-weight:750; opacity:.82; margin:4px 0 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .card{ background:var(--card); border:1px solid #eef2f7; border-radius:22px; padding:17px; margin-bottom:13px; box-shadow:var(--shadow); }
    .card h3{ margin:0 0 14px; font-size:14px; font-weight:900; color:#0f172a; display:flex; align-items:center; gap:8px; } .card h3 i{ color:#2563eb; }
    .cname-big{ font-size:21px; font-weight:950; color:#0f172a; margin-bottom:10px; word-break:keep-all; line-height:1.3; }
    .room-badge{ display:inline-flex; align-items:center; gap:5px; background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; font-weight:900; font-size:12px; padding:6px 11px; border-radius:999px; margin-bottom:9px; box-shadow:0 6px 14px rgba(37,99,235,.26); }
    .info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .info-item{ background:#f8fbff; border:1px solid #edf3fb; border-radius:15px; padding:12px; min-height:72px; }
    .info-item .k{ font-size:11.5px; color:#64748b; font-weight:900; margin-bottom:6px; }
    .info-item .v{ font-size:15px; font-weight:900; color:#172033; word-break:keep-all; line-height:1.35; }

    .leader-box{ text-align:center; border-radius:14px; padding:14px; margin-top:13px; }
    .leader-box.on{ background:linear-gradient(160deg,#f0fdf6,#dcfce7); border:1px solid #86efac; }
    .leader-box.off{ background:#f6f8fc; border:1px solid var(--line); }
    .leader-box .lk{ font-size:12px; font-weight:800; color:var(--mute); margin-bottom:6px; } .leader-box.on .lk{ color:#15803d; }
    .leader-box .lv{ font-size:21px; font-weight:900; color:#475569; } .leader-box.on .lv{ color:#15803d; }
    .leader-box .lv small{ font-size:13px; font-weight:700; color:var(--mute); margin-left:3px; }
    .leader-box.off .lv{ font-size:15px; color:var(--mute); }

    .notice-box{ background:#f0f6ff; border:1px solid #bfdbfe; border-radius:16px; padding:14px; font-size:14px; color:#1e3a8a; font-weight:750; line-height:1.65; white-space:pre-wrap; }
    .notice-empty{ color:#94a3b8; font-weight:700; font-size:13px; }

    .shut-grid{ display:grid; grid-template-columns:1.25fr repeat(4,1fr); gap:7px; }

    .shut-cell.tot{ background:linear-gradient(135deg,#eff6ff,#dbeafe); border-color:#bfdbfe; }
    .shut-cell .sk{ font-size:11px; font-weight:800; margin-bottom:5px; }
    .shut-cell .sv{ font-size:20px; font-weight:950; color:#1e293b; } .shut-cell.tot .sv{ color:#2563eb; font-size:23px; }

    .empty{ text-align:center; color:var(--mute); font-weight:700; padding:26px 0; }

    @media (max-width:380px){
      .mhead{ padding-left:14px; padding-right:14px; }
      .hero-course{ font-size:20px; }
      .info-grid{ grid-template-columns:1fr; }
      .shut-grid{ grid-template-columns:repeat(2,1fr); }
      .shut-cell.tot{ grid-column:1 / -1; }
    }

<div class="wrap">
  <div class="mhead">

<div id="__catcVer" aria-hidden="true" style="position:fixed;right:5px;bottom:4px;z-index:2147483647;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:700;color:rgba(148,163,184,.5);background:rgba(120,120,120,.12);padding:2px 5px;border-radius:5px;pointer-events:none;user-select:none;">강사M vB</div>

<script src="config.js?v=b260620c"></script>
<script>
/* ========== 강사·교수 모바일 라이트뷰 (강의실 조회 중심) ========== */
var db=firebase.database();
var DATA={}, curRID='';
function h(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function tickClock(){
  var d=new Date(), days=['일','월','화','수','목','금','토'];
  var hh=d.getHours(), ap=hh<12?'AM':'PM', h12=((hh%12)||12);
  var el=document.getElementById('clk');
  if(el) el.innerHTML=(d.getMonth()+1)+'.'+d.getDate()+'('+days[d.getDay()]+') <b>'+h12+':'+pad(d.getMinutes())+'</b> '+ap;
}
setInterval(tickClock,1000); tickClock();

function ownedRooms(){
  try{ var r=JSON.parse(localStorage.getItem('kac_owned_rooms')||'[]'); if(Array.isArray(r)&&r.length) return r; }catch(e){}
  var last=null; try{ last=localStorage.getItem('kac_last_room'); }catch(e){}
  return last?[last]:[];
}
function activeRooms(){
  var out=[], today=todayStr();
  for(var i=65;i<=90;i++){
    var rid=String.fromCharCode(i), room=DATA[rid]; if(!room) continue;
    var s=room.settings||{}, st=room.status||{};
    if(!s.courseName) continue;
    if(st.roomStatus!=='active') continue;
    if(s.hideFromBoard) continue;
    if(s.period && s.period.indexOf('~')>=0){ var ed=(s.period.split('~')[1]||'').trim(); if(ed && ed<today) continue; }
    out.push(rid);
  }
  return out;
}
function studentsOf(room){ return room && room.students ? Object.keys(room.students).map(function(k){return room.students[k];}).filter(function(x){return x&&x.name&&(''+x.name).trim()&&x.name!=='undefined';}) : []; }
function leaderOf(room){ var L=studentsOf(room).filter(function(s){return s&&s.isLeader===true;})[0]; if(!L) return null; return { name:L.name||'-', no:(L.empNo||L.sabun||L.id||L.studentId||'') }; }
function shuttleCount(room){
  var rq=(room.shuttle&&room.shuttle.requests)||{};
  var e=Object.keys(rq).map(function(k){return rq[k];}).filter(function(r){return r&&r.type;});
  return { total:e.filter(function(r){return r.type!=='car';}).length,
    osong:e.filter(function(r){return r.type==='osong';}).length,
    terminal:e.filter(function(r){return r.type==='terminal';}).length,
    airport:e.filter(function(r){return r.type==='airport';}).length,
    car:e.filter(function(r){return r.type==='car';}).length };
}

function renderPick(){
  var el=document.getElementById('roomPick');
  var owned=ownedRooms().filter(function(r){ return DATA[r]; });
  var list = owned.length ? owned : activeRooms();
  if(!list.length){ el.innerHTML='<div class="empty" style="padding:10px 0;">운영 중인 과정이 없습니다.</div>'; document.getElementById('detailSec').style.display='none'; return; }
  if(!curRID || list.indexOf(curRID)<0) curRID=list[0];
  el.innerHTML=list.map(function(rid){
    var s=(DATA[rid]&&DATA[rid].settings)||{};
    return '<div class="rchip '+(rid===curRID?'on':'')+'" onclick="pickRoom(\''+rid+'\')">#'+rid+'<span class="cn">'+h((s.courseName||'').slice(0,8))+'</span></div>';
  }).join('');
  renderDetail();
}
function pickRoom(rid){ curRID=rid; renderPick(); }

function renderDetail(){
  var sec=document.getElementById('detailSec');
  var room=DATA[curRID]; if(!room){ sec.style.display='none'; return; }
  sec.style.display='block';
  var s=room.settings||{}, st=room.status||{};
  var prof=((st.professorName||'').trim())?(st.professorName.trim()+' 교수'):'-';
  var count=studentsOf(room).length;
  var hRoom=document.getElementById('hRoom'), hCourse=document.getElementById('hCourse'), hCount=document.getElementById('hCount'), hProf=document.getElementById('hProf');
  if(hRoom) hRoom.textContent='ROOM #'+curRID;
  if(hCourse) hCourse.textContent=s.courseName||'과정명 미설정';
  if(hCount) hCount.textContent=count+'명';
  if(hProf) hProf.textContent='담임교수 '+prof;
  document.getElementById('dRoomBadge').textContent='ROOM #'+curRID;
  document.getElementById('dCourse').textContent=s.courseName||'-';
  document.getElementById('dInfo').innerHTML=
     '<div class="info-item"><div class="k">교육기간</div><div class="v" style="font-size:13px;">'+h(s.period||'-')+'</div></div>'
    +'<div class="info-item"><div class="k">강의실</div><div class="v" style="font-size:13px;">'+h(s.roomDetailName||s.roomDetail||'-')+'</div></div>'
    +'<div class="info-item"><div class="k">담임교수</div><div class="v">'+h(prof)+'</div></div>'
    +'<div class="info-item"><div class="k">교육인원</div><div class="v">'+count+'명</div></div>';
  var L=leaderOf(room);
  document.getElementById('dLeaderWrap').innerHTML = L
    ? '<div class="leader-box on"><div class="lk"><i class="fa-solid fa-crown"></i> 학생장</div><div class="lv">'+h(L.name)+(L.no?(' <small>('+h(L.no)+')</small>'):'')+'</div></div>'
    : '<div class="leader-box off"><div class="lk"><i class="fa-solid fa-crown"></i> 학생장</div><div class="lv">지정된 학생장 없음</div></div>';

  var notice=(room.coordNotice||'').trim();
  document.getElementById('dNotice').innerHTML = notice ? '<div class="notice-box">'+h(notice)+'</div>' : '<div class="notice-empty">받은 공지가 없습니다.</div>';

  var sh=shuttleCount(room);
  document.getElementById('dShuttle').innerHTML=
     '<div class="shut-cell tot"><div class="sk" style="color:#64748b;">총 신청</div><div class="sv">'+sh.total+'</div></div>'
    +'<div class="shut-cell"><div class="sk" style="color:#ef4444;">오송</div><div class="sv">'+sh.osong+'</div></div>'
    +'<div class="shut-cell"><div class="sk" style="color:#2563eb;">터미널</div><div class="sv">'+sh.terminal+'</div></div>'
    +'<div class="shut-cell"><div class="sk" style="color:#10b981;">공항</div><div class="sv">'+sh.airport+'</div></div>'
    +'<div class="shut-cell"><div class="sk" style="color:#64748b;">자차</div><div class="sv">'+sh.car+'</div></div>';
}

db.ref('courses').on('value', function(snap){ DATA=snap.val()||{}; renderPick(); });
</script>
</body>
</html>
<!-- 강사모바일 VB/VB/VB/VB/VB -->
