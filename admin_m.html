  <script>
  /* [기기 분리] PC 접속은 PC 전용 화면으로 (모바일은 이 화면 유지). ?forcem 으로 강제 모바일. */
  (function(){ try{
    // [vD] 판별을 '실제 기기(스마트폰)' 기준으로 — 진짜 스마트폰이 아니면(좁은 PC창 포함) PC(admin.html)로 복귀. ?forcem=모바일 강제.
    var qs = location.search || '';
    if(qs.indexOf('forcem') < 0){
      var ua = navigator.userAgent || '';
      var uaPhone = /Android.+Mobile|iPhone|iPod|Windows Phone|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      var touch  = ('ontouchstart' in window) || (navigator.maxTouchPoints||0) > 0;
      var coarse = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
      var noHover= !!(window.matchMedia && window.matchMedia('(hover:none)').matches);
      var scrMin = Math.min(screen.width||9999, screen.height||9999);
      var isPhone = uaPhone || (touch && coarse && noHover && scrMin<=820);
      if(!isPhone){ location.replace('admin.html'+location.search+location.hash); }
    }
  }catch(e){} })();
  </script>
<!-- ════════ [카카오채널 연동] catc1234 접속 게이트 (수정상태: 수정안하는중) ════════
     · admin.html(교수전용 강의 플랫폼)의 모바일 라이트판(조회 중심). 직접 진입 시 접속코드 요구.
     · 통과 시 localStorage['catc_gate_ok'] 저장. catcLock()으로 잠금 해제. 기능 로직과 분리.
     · [vC · 2026-07-04 · 운영부 요청으로 admin_coord 담당 디에스장 편집] 상세에 '외출·외박(금일)'·'노조/청렴 공통 교육장소' 조회 카드 추가. 조회 전용(쓰기 없음). 데이터: admin_actions(외출)·system/eduLocations(장소).
     · [vD · 2026-07-10 · 홈을 운영부 모바일 방식 과정 블록 목록으로 전면 개편 — 홈=과정 블록(인원·질문·셔틀·외출 배지)→탭하면 그 과정 상세, 상세 상단에 실시간 모니터링 그리드(수강생/Q&A/셔틀/외출) 추가. curView 홈/상세 2뷰 전환, 기존 데이터·헬퍼 재사용] -->
<script>
(function(){
  window.catcLock=function(){ try{localStorage.removeItem('catc_gate_ok');}catch(e){} location.reload(); };
  var ok=false; try{ ok=(function(){var t=parseInt(localStorage.getItem('catc_gate_ok'),10);return !!t&&(Date.now()-t)<86400000;})(); }catch(e){ ok=false; }   /* [보안] 저장이 막힌 환경(시크릿 창 등)에서 코드 없이 통과되던 구멍 차단 */
  if(ok){ window.__catcUnlocked=true; return; }
  window.__catcUnlocked=false;
  document.documentElement.classList.add('catc-locked');
  function build(){
    if(document.getElementById('catcGate')) return;
    var o=document.createElement('div'); o.id='catcGate';
    o.innerHTML='<div class="catc-box"><div class="catc-ic">🔒</div>'
      +'<div class="catc-t">접속 코드 입력</div>'
      +'<div class="catc-s">CATC 교육 플랫폼 · 보안 접속</div>'
      +'<input id="catcInp" type="password" autocomplete="off" placeholder="접속 코드">'
      +'<button id="catcBtn">입장</button><div id="catcMsg"></div></div>';
    (document.body||document.documentElement).appendChild(o);
    var inp=o.querySelector('#catcInp'),btn=o.querySelector('#catcBtn'),msg=o.querySelector('#catcMsg');
    /* [보안·2026-07-07] 접속코드 평문 제거 — SHA-256 해시 대조 (소스에 비밀번호가 노출되지 않음) */
    function kacHash(s){var K=[1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];function rr(v,n){return(v>>>n)|(v<<(32-n));}var b=unescape(encodeURIComponent(s)),l=b.length,w=[],i;for(i=0;i<l;i++)w[i>>2]=(w[i>>2]||0)|(b.charCodeAt(i)<<((3-i%4)*8));w[l>>2]=(w[l>>2]||0)|(128<<((3-l%4)*8));var N=((l+8>>6)+1)*16;w[N-1]=l*8;var H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225],W=[],a,c,d,e,f,g,h,t1,t2,j,x;for(i=0;i<N;i+=16){a=H[0];c=H[1];d=H[2];e=H[3];f=H[4];g=H[5];h=H[6];x=H[7];for(j=0;j<64;j++){if(j<16)W[j]=w[i+j]|0;else{var s0=rr(W[j-15],7)^rr(W[j-15],18)^(W[j-15]>>>3),s1=rr(W[j-2],17)^rr(W[j-2],19)^(W[j-2]>>>10);W[j]=(W[j-16]+s0+W[j-7]+s1)|0;}var S1=rr(f,6)^rr(f,11)^rr(f,25),ch=(f&g)^(~f&h),T1=(x+S1+ch+K[j]+W[j])|0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&c)^(a&d)^(c&d),T2=(S0+mj)|0;x=h;h=g;g=f;f=(e+T1)|0;e=d;d=c;c=a;a=(T1+T2)|0;}H[0]=(H[0]+a)|0;H[1]=(H[1]+c)|0;H[2]=(H[2]+d)|0;H[3]=(H[3]+e)|0;H[4]=(H[4]+f)|0;H[5]=(H[5]+g)|0;H[6]=(H[6]+h)|0;H[7]=(H[7]+x)|0;}var out='';for(i=0;i<8;i++)out+=('00000000'+((H[i]>>>0).toString(16))).slice(-8);return out;}
    window.kacHash = kacHash;   /* 다른 스크립트(초기화 비번 대조 등)에서도 사용 */
    var GATE_H='2c2a36d9c576e849da596e7888abc2d8f4059ee9fd21d89f502b3495a1e12512';
    function go(){ if(kacHash(inp.value)===GATE_H){ var _saved=false; try{ localStorage.setItem('catc_gate_ok',String(Date.now())); _saved=true; }catch(e){} if(_saved){ location.reload(); } else { try{ o.remove(); }catch(e){} document.documentElement.classList.remove('catc-locked'); window.__catcUnlocked=true; } } else { msg.textContent='접속 코드가 올바르지 않습니다.'; inp.value=''; inp.focus(); } }
    btn.addEventListener('click',go);
    inp.addEventListener('keyup',function(e){ if(e.key==='Enter') go(); });
    setTimeout(function(){ try{inp.focus();}catch(e){} },120);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded',build);
})();
</script>

<div id="__catcVer" aria-hidden="true" style="position:fixed;right:5px;bottom:4px;z-index:2147483647;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:700;color:rgba(148,163,184,.5);background:rgba(120,120,120,.12);padding:2px 5px;border-radius:5px;pointer-events:none;user-select:none;">강사M vD</div>

<script src="config.js?v=b260620c"></script>
<script>
/* ========== 강사 모바일 vD — 과정 블록형 홈 + 과정별 상세 모니터링 (운영부 모바일 방식) ========== */
var db=firebase.database();
var DATA={}, curRID='', EDU={}, curView='home';

/* [J89] 담임 교수 여러 명 — status.professorName=대표, professorNames=전체, professorMain=수동 대표 */
function kacProfList(raw){
  if(Object.prototype.toString.call(raw)==='[object Array]')
    return raw.map(function(s){ return String(s==null?'':s).trim(); }).filter(Boolean);
  return String(raw==null?'':raw).replace(/교수님?/g,' ')
    .split(/[,;\/·、|\n\r\t]+|\s+/).map(function(s){ return s.trim(); }).filter(Boolean);
}
function kacProfAll(st){ return kacProfList((st&&st.professorNames&&st.professorNames.length)?st.professorNames:(st&&st.professorName)); }
function kacProfMain(st){ var a=kacProfAll(st); if(!a.length) return ''; var m=st&&st.professorMain; return (m&&a.indexOf(m)>=0)?m:a[0]; }
function kacProfLabel(st, suffix){
  var a=kacProfAll(st); if(!a.length) return '';
  return kacProfMain(st)+(suffix||'')+(a.length>1?(' 외 '+(a.length-1)+'명'):'');
}
function h(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function tickClock(){
  var d=new Date(), days=['일','월','화','수','목','금','토'];
  var hh=d.getHours(), ap=hh<12?'AM':'PM', h12=((hh%12)||12);
  var html=(d.getMonth()+1)+'.'+d.getDate()+'('+days[d.getDay()]+') <b>'+h12+':'+pad(d.getMinutes())+'</b> '+ap;
  ['clk','clk2'].forEach(function(id){ var el=document.getElementById(id); if(el) el.innerHTML=html; });
}
setInterval(tickClock,1000); tickClock();

function ownedRooms(){
  try{ var r=JSON.parse(localStorage.getItem('kac_owned_rooms')||'[]'); if(Array.isArray(r)&&r.length) return r; }catch(e){}
  var last=null; try{ last=localStorage.getItem('kac_last_room'); }catch(e){}
  return last?[last]:[];
}
function activeRooms(){
  var out=[], today=todayStr();
  for(var i=65;i<=90;i++){
    var rid=String.fromCharCode(i), room=DATA[rid]; if(!room) continue;
    var s=room.settings||{}, st=room.status||{};
    if(!s.courseName) continue;
    if(st.roomStatus!=='active') continue;
    if(s.hideFromBoard) continue;
    if(s.period && s.period.indexOf('~')>=0){ var ed=(s.period.split('~')[1]||'').trim(); if(ed && ed<today) continue; }
    out.push(rid);
  }
  return out;
}
function orderedRooms(){
  var list=activeRooms(), owned=ownedRooms().filter(function(r){ return DATA[r] && list.indexOf(r)>=0; });
  if(!owned.length) return list;
  var others=list.filter(function(r){ return owned.indexOf(r)<0; });
  return owned.concat(others);
}
function studentsOf(room){ return room && room.students ? Object.keys(room.students).map(function(k){return room.students[k];}).filter(function(x){return x&&x.name&&(''+x.name).trim()&&x.name!=='undefined';}) : []; }
function leaderOf(room){ var L=studentsOf(room).filter(function(s){return s&&s.isLeader===true;})[0]; if(!L) return null; return { name:L.name||'-', no:(L.empNo||L.sabun||L.id||L.studentId||'') }; }
function shuttleCount(room){
  var rq=(room.shuttle&&room.shuttle.requests)||{};
  var e=Object.keys(rq).map(function(k){return rq[k];}).filter(function(r){return r&&r.type;});
  return { total:e.filter(function(r){return r.type!=='car';}).length,
    osong:e.filter(function(r){return r.type==='osong';}).length,
    terminal:e.filter(function(r){return r.type==='terminal';}).length,
    airport:e.filter(function(r){return r.type==='airport';}).length,
    car:e.filter(function(r){return r.type==='car';}).length };
}
/* ══ [K1] 질문사항 ═══════════════════════════════════════════════════
   강사분들이 질문을 확인하려면 PC를 켜야 했다. 폰에서 바로 보이게 한다.
   · 질문은 익명이다 (교육생 이름 없음 — 원래 구조가 그렇다)
   · '읽음' 표시는 PC와 같은 방식(localStorage kac_qa_seen_{방})으로 기억한다.
     단 기기별로 따로 기억되므로, 폰에서 확인해도 PC 배지는 그대로다.
   · 정렬: 최신순(기본) / 좋아요순
   ═══════════════════════════════════════════════════════════════════ */
var _qaSort='new';
function qaSeenKey(){ return 'kac_qa_seen_' + (curRID || '_'); }
function qaSeenIds(){
  try{ var raw=localStorage.getItem(qaSeenKey()); var a=raw?JSON.parse(raw):[]; return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function qaLiveList(room){
  var q=(room && room.questions) || {};
  return Object.keys(q)
    .filter(function(k){ return q[k] && q[k].status!=='delete'; })   // 삭제된 질문 제외 (PC와 동일 기준)
    .map(function(k){ var o=q[k]||{}; return { id:k, text:o.text||'', subject:o.subject||'', likes:Number(o.likes||0), timestamp:Number(o.timestamp||0) }; });
}
function setQaSort(s){ _qaSort=s; var r=DATA[curRID]; if(r) renderQa(r); }
function qaMarkAllRead(){
  var room=DATA[curRID]; if(!room) return;
  try{ localStorage.setItem(qaSeenKey(), JSON.stringify(qaLiveList(room).map(function(x){return x.id;}))); }catch(e){}
  renderQa(room);
}
function renderQa(room){
  var box=document.getElementById('dQa'), head=document.getElementById('dQaHead'), cnt=document.getElementById('dQaCnt');
  if(!box||!head) return;
  var list=qaLiveList(room);
  var seen=qaSeenIds();
  var unread=list.filter(function(x){ return seen.indexOf(x.id)<0; }).length;

  if(cnt) cnt.textContent='· 총 '+list.length+'건';
  head.innerHTML =
      (unread>0 ? '<span class="qa-newbadge">새 질문 '+unread+'</span>'
                : '<span style="font-size:12px;font-weight:800;color:#94a3b8;">모두 확인함</span>')
    + (unread>0 ? '<button class="qa-readbtn" onclick="qaMarkAllRead()">모두 확인</button>' : '')
    + '<div class="qa-sort">'
    +   '<button class="'+(_qaSort==='new'?'on':'')+'" onclick="setQaSort(\'new\')">최신순</button>'
    +   '<button class="'+(_qaSort==='like'?'on':'')+'" onclick="setQaSort(\'like\')">좋아요순</button>'
    + '</div>';

  if(!list.length){ box.innerHTML='<div class="empty" style="padding:22px 0;">올라온 질문이 없습니다.</div>'; return; }

  list.sort(_qaSort==='like'
    ? function(a,b){ return (b.likes-a.likes) || (b.timestamp-a.timestamp); }
    : function(a,b){ return b.timestamp-a.timestamp; });

  box.innerHTML='<div class="qa-list">'+list.map(function(x){
    var isNew=seen.indexOf(x.id)<0;
    var t=x.timestamp?new Date(x.timestamp):null;
    var ts=t?(t.getMonth()+1)+'/'+t.getDate()+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'):'-';
    return '<div class="qa-item'+(isNew?' new':'')+'">'
      + '<div class="qa-txt">'+h(x.text||'(내용 없음)')+'</div>'
      + '<div class="qa-meta">'
      +   (x.subject?'<span class="qa-subj">'+h(x.subject)+'</span>':'')
      +   (x.likes>0?'<span class="qa-like"><i class="fa-solid fa-heart"></i> '+x.likes+'</span>':'')
      +   '<span class="qa-time">'+ts+'</span>'
      + '</div></div>';
  }).join('')+'</div>';
}

/* ══ [J99] 퇴교차량 신청자 명단 팝업 ══════════════════════════════════
   숫자만 보이고 '누가' 신청했는지는 알 수 없어서, PC를 켜야만 확인이 됐다.
   → 숫자 칸을 누르면 그 목적지 신청자 명단이 아래에서 올라온다.
     팝업 안의 칩으로 목적지를 바로 갈아끼울 수 있고, 이름 ㄱ~ㅎ 순으로 정렬한다.
     각 칩의 인원수는 위 숫자판과 정확히 일치한다. */
var _mShutFilter='bus';
var _M_SHUT_DEST={
  bus:      { label:'셔틀 전체', color:'#2563eb', has:function(t){ return t==='osong'||t==='terminal'||t==='airport'; } },
  osong:    { label:'오송역',    color:'#ef4444', has:function(t){ return t==='osong'; } },
  terminal: { label:'터미널',    color:'#2563eb', has:function(t){ return t==='terminal'; } },
  airport:  { label:'공항',      color:'#10b981', has:function(t){ return t==='airport'; } },
  car:      { label:'자차',      color:'#64748b', has:function(t){ return t==='car'; } }
};
function showMobileShuttleList(f){
  if(!curRID) return;
  _mShutFilter = _M_SHUT_DEST[f] ? f : 'bus';
  renderMobileShuttleList();
  var ov=document.getElementById('mShuttleOv'); if(ov) ov.classList.add('open');
}
function setMobileShuttleFilter(f){
  if(!_M_SHUT_DEST[f]) return;
  _mShutFilter=f;
  renderMobileShuttleList();
}
function closeMobileShuttleList(){
  var ov=document.getElementById('mShuttleOv'); if(ov) ov.classList.remove('open');
}
function renderMobileShuttleList(){
  var box=document.getElementById('mShuttleList');
  if(!box || !curRID) return;
  var room=DATA[curRID]||{}, s=room.settings||{};
  var rq=(room.shuttle&&room.shuttle.requests)||{};
  var all=Object.keys(rq).map(function(k){ var r=rq[k]||{}; r._key=k; return r; }).filter(function(r){ return r&&r.type; });

  var cnt=function(f){ return all.filter(function(r){ return _M_SHUT_DEST[f].has(r.type); }).length; };
  var chips='<div class="m-shut-chips">'
    + ['bus','osong','terminal','airport','car'].map(function(f){
        return '<button type="button" class="'+(f===_mShutFilter?'on':'')+'" onclick="setMobileShuttleFilter(\''+f+'\')">'
             + h(_M_SHUT_DEST[f].label)+' '+cnt(f)+'</button>';
      }).join('')
    + '</div>';

  var D=_M_SHUT_DEST[_mShutFilter];
  var list=all.filter(function(r){ return D.has(r.type); });
  list.sort(function(a,b){
    return String(a.name||'').localeCompare(String(b.name||''),'ko') || ((a.timestamp||0)-(b.timestamp||0));
  });

  var head='<div style="font-size:13px;font-weight:800;color:#64748b;margin:0 2px 9px;">'
         + h(s.courseName||('ROOM #'+curRID))+' · '+h(D.label)+' '+list.length+'명</div>';

  if(!list.length){
    box.innerHTML=head+chips+'<div class="empty" style="padding:30px 0;">'+h(D.label)+' 신청자가 없습니다.</div>';
    return;
  }
  box.innerHTML=head+chips
    +'<div style="overflow-x:auto;"><table class="m-tbl"><thead><tr><th class="num">연번</th><th>성함</th><th>식별ID</th><th>신청현황</th></tr></thead><tbody>'
    +list.map(function(r,i){
        var c=(_M_SHUT_DEST[r.type]||{}).color||'#2563eb';
        return '<tr><td class="num">'+(i+1)+'</td><td>'+h(r.name||'-')+'</td><td>'+h(r.phone||'-')+'</td>'
             + '<td style="color:'+c+';font-weight:900;">'+h(r.typeText||r.type||'-')+'</td></tr>';
      }).join('')
    +'</tbody></table></div>';
}

function questionsCount(room){ return room && room.questions ? Object.keys(room.questions).length : 0; }
function opWindow(){ var dayMs=86400000; var start=Math.floor(Date.now()/dayMs)*dayMs; return [start, start+dayMs]; }
function shortRoom(v){ v=(''+(v||'')).trim(); if(!v) return '미정'; var p=v.split(' '); return p.length>1?p[p.length-1]:v; }
function outingsToday(room){
  var w=opWindow(), s=w[0], en=w[1], list=[];
  var aa=room.admin_actions||{};
  Object.keys(aa).forEach(function(date){
    var day=aa[date]||{};
    Object.keys(day).forEach(function(tok){
      var it=day[tok];
      if(it && (it.type==='outing'||it.type==='overnight'||it.type==='group_outing')){
        var ts=it.timestamp||0; if(ts>=s && ts<en) list.push(it);
      }
    });
  });
  list.sort(function(a,b){return (a.timestamp||0)-(b.timestamp||0);});
  return list;
}
function applyEduLoc(id, val){
  var el=document.getElementById(id); if(!el) return;
  var set=!!(val&&(''+val).trim());
  el.classList.toggle('set',set);
  var v=el.querySelector('.el-v'); if(v) v.textContent=set?shortRoom(val):'미정';
}

/* ===== 홈: 과정 블록 목록 ===== */
function renderHome(){
  var list=orderedRooms();
  var t=document.getElementById('hTotal'); if(t) t.textContent=list.length+'개 과정';
  var el=document.getElementById('courseList'); if(!el) return;
  if(!list.length){ el.innerHTML='<div class="empty">운영 중인 과정이 없습니다.</div>'; return; }
  el.innerHTML=list.map(function(rid){
    var room=DATA[rid]||{}, s=room.settings||{}, st=room.status||{};
    var prof=kacProfLabel(st)||'-';   // [J89] 담임 여러 명 → "장두석 외 2명"
    var cnt=studentsOf(room).length, q=questionsCount(room), sh=shuttleCount(room), ou=outingsToday(room).length;
    return '<div class="cblock" onclick="openCourse(\''+rid+'\')">'
      +'<div class="cb-top"><span class="cb-room"><i class="fa-solid fa-door-closed"></i> #'+rid+'</span>'
        +'<span class="cb-live"><span class="dot"></span> 진행중</span></div>'
      +'<div class="cb-name">'+h(s.courseName||'과정명 미설정')+'</div>'
      +'<div class="cb-meta">'
        +'<span><i class="fa-solid fa-calendar-days"></i>'+h(s.period||'-')+'</span>'
        +'<span><i class="fa-solid fa-users"></i>'+cnt+'명</span>'
        +'<span><i class="fa-solid fa-user-tie"></i>'+h(prof)+'</span>'
      +'</div>'
      +'<div class="cb-badges">'
        +'<span class="cbadge'+(q>0?' hot':'')+'"><i class="fa-solid fa-comment-dots"></i> 질문 '+q+'</span>'
        +'<span class="cbadge"><i class="fa-solid fa-bus"></i> 셔틀 '+sh.total+'</span>'
        +'<span class="cbadge'+(ou>0?' hot':'')+'"><i class="fa-solid fa-user-clock"></i> 외출 '+ou+'</span>'
      +'</div>'
      +'<i class="fa-solid fa-chevron-right cb-arrow"></i></div>';
  }).join('');
}
function openCourse(rid){ curRID=rid; curView='detail';
  document.getElementById('homeView').style.display='none';
  document.getElementById('detailView').style.display='block';
  try{ window.scrollTo(0,0); }catch(e){}
  renderDetail();
}
function goHome(){ curView='home';
  document.getElementById('detailView').style.display='none';
  document.getElementById('homeView').style.display='block';
  try{ window.scrollTo(0,0); }catch(e){}
  renderHome();
}

/* ===== 상세: 과정 모니터링 ===== */
function renderDetail(){
  var room=DATA[curRID]; if(!room){ goHome(); return; }
  var s=room.settings||{}, st=room.status||{};
  var prof=kacProfLabel(st,' 교수')||'-';   // [J89] "장두석 교수 외 2명"
  var count=studentsOf(room).length;
  var setT=function(id,v){ var el=document.getElementById(id); if(el) el.textContent=v; };
  setT('hRoom','ROOM #'+curRID); setT('hCourse',s.courseName||'과정명 미설정');
  setT('hCount',count+'명'); setT('hProf','담임교수 '+prof);
  var q=questionsCount(room), sh=shuttleCount(room), ou=outingsToday(room).length;
  document.getElementById('dMon').innerHTML=
     '<div class="mon-cell"><div class="mk">수강생</div><div class="mv">'+count+'</div></div>'
    +'<div class="mon-cell'+(q>0?' hot':'')+'"><div class="mk">Q&amp;A 질문</div><div class="mv">'+q+'</div></div>'
    +'<div class="mon-cell"><div class="mk">셔틀신청</div><div class="mv">'+sh.total+'</div></div>'
    +'<div class="mon-cell'+(ou>0?' hot':'')+'"><div class="mk">외출·외박</div><div class="mv">'+ou+'</div></div>';
  setT('dCourse',s.courseName||'-');
  document.getElementById('dInfo').innerHTML=
     '<div class="info-item"><div class="k">교육기간</div><div class="v" style="font-size:13px;">'+h(s.period||'-')+'</div></div>'
    +'<div class="info-item"><div class="k">강의실</div><div class="v" style="font-size:13px;">'+h(s.roomDetailName||s.roomDetail||'-')+'</div></div>'
    +'<div class="info-item"><div class="k">담임교수</div><div class="v">'+h(prof)+'</div></div>'
    +'<div class="info-item"><div class="k">교육인원</div><div class="v">'+count+'명</div></div>';
  var L=leaderOf(room);
  document.getElementById('dLeaderWrap').innerHTML = L
    ? '<div class="leader-box on"><div class="lk"><i class="fa-solid fa-crown"></i> 학생장</div><div class="lv">'+h(L.name)+(L.no?(' <small>('+h(L.no)+')</small>'):'')+'</div></div>'
    : '<div class="leader-box off"><div class="lk"><i class="fa-solid fa-crown"></i> 학생장</div><div class="lv">지정된 학생장 없음</div></div>';
  var notice=(room.coordNotice||'').trim();
  document.getElementById('dNotice').innerHTML = notice ? '<div class="notice-box">'+h(notice)+'</div>' : '<div class="notice-empty">받은 공지가 없습니다.</div>';
  renderQa(room);   // [K1] 질문사항
  /* [J99] 숫자 칸을 누르면 그 목적지를 신청한 사람이 누구인지 바로 뜬다 */
  document.getElementById('dShuttle').innerHTML=
     '<div class="shut-cell tot" onclick="showMobileShuttleList(\'bus\')"><div class="sk" style="color:#64748b;">총 신청</div><div class="sv">'+sh.total+'</div></div>'
    +'<div class="shut-cell" onclick="showMobileShuttleList(\'osong\')"><div class="sk" style="color:#ef4444;">오송</div><div class="sv">'+sh.osong+'</div></div>'
    +'<div class="shut-cell" onclick="showMobileShuttleList(\'terminal\')"><div class="sk" style="color:#2563eb;">터미널</div><div class="sv">'+sh.terminal+'</div></div>'
    +'<div class="shut-cell" onclick="showMobileShuttleList(\'airport\')"><div class="sk" style="color:#10b981;">공항</div><div class="sv">'+sh.airport+'</div></div>'
    +'<div class="shut-cell" onclick="showMobileShuttleList(\'car\')"><div class="sk" style="color:#64748b;">자차</div><div class="sv">'+sh.car+'</div></div>';
  var outs=outingsToday(room);
  var dOut=document.getElementById('dOuting');
  if(dOut){
    if(!outs.length){ dOut.innerHTML='<div class="empty" style="padding:22px 0;">금일 외출·외박 신청이 없습니다.</div>'; }
    else{
      var ostu=(room.students)||{}; var phoneByName={};
      Object.keys(ostu).forEach(function(k){ var ss=ostu[k]||{}; var nm=String(ss.name||'').trim(); if(nm) phoneByName[nm]=ss.phone||''; });
      dOut.innerHTML='<div style="overflow-x:auto;"><table class="m-tbl"><thead><tr><th class="num">연번</th><th>성함</th><th>연락처</th><th>외출/외박</th><th>상태</th></tr></thead><tbody>'
        +outs.map(function(a,i){
          var klabel=(a.type==='group_outing')?'단체외출':(a.type==='outing')?'외출':'외박';
          var kcol=(a.type==='overnight')?'#dc2626':'#ea580c';
          var stat = a.held?'<span style="color:#dc2626;font-weight:900;">미복귀</span>'
            : (a.returned&&a.autoReturn)?'<span style="color:#0891b2;">복귀(자동)</span>'
            : a.returned?'<span style="color:#16a34a;">복귀완료</span>'
            : a.confirmed?'<span style="color:#2563eb;">서명완료</span>'
            : '<span style="color:#94a3b8;">대기</span>';
          var ph=a.phone||phoneByName[String(a.name||'').trim()]||'-';
          return '<tr><td class="num">'+(i+1)+'</td><td>'+h(a.name||'-')+'</td><td>'+h(ph)+'</td><td style="color:'+kcol+';font-weight:900;">'+klabel+'</td><td>'+stat+'</td></tr>';
        }).join('')+'</tbody></table></div>';
    }
  }
  applyEduLoc('dEduIntegrity', EDU.integrity);
  applyEduLoc('dEduUnion', EDU.union);
}

db.ref('courses').on('value', function(snap){ DATA=snap.val()||{};
  if(curView==='detail'){ if(DATA[curRID]) renderDetail(); else goHome(); }
  else renderHome();
  if(window.kacBootDone) kacBootDone();
});
db.ref('system/eduLocations').on('value', function(snap){ EDU=snap.val()||{}; if(curView==='detail'&&DATA[curRID]) renderDetail(); });
</script>

<!-- ═══ [2026-07-07 전체 점검모드] system/maintenance 스위치 하나로 전 플랫폼 동시 점검중 전환.
     on:true면 전체 화면 점검 안내(실시간), off면 즉시 복귀. 재배포 불필요.
     관리자 우회: 주소 뒤 ?ok=우회코드 (SHA-256 대조, 탭 세션 동안 유지) ═══ -->
<script>
(function(){
  var BH='2c978f750e54c66ebaf4cb8b70d6420b6d7cb6dde1209447a4b87b026ed398a9', tries=0;
  function hide(){ var o=document.getElementById('kacMaintOv'); if(o) o.remove(); try{ document.documentElement.style.overflow=''; }catch(e){} }
  function show(v){
    if (sessionStorage.getItem('kac_maint_bypass')==='1') return;
    var o=document.getElementById('kacMaintOv');
    var msg=(v&&v.msg)||'더 나은 서비스를 위해 시스템을 점검하고 있습니다.';
    var until=(v&&v.until)?String(v.until):'';
    if(!o){
      o=document.createElement('div'); o.id='kacMaintOv';
      o.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0f2057 0%,#1a3a8a 75%,#1e40af 140%);';
      document.body.appendChild(o);
      try{ document.documentElement.style.overflow='hidden'; }catch(e){}
    }
    o.innerHTML='<div style="max-width:460px;width:100%;text-align:center;color:#fff;">'
      +'<div style="font-size:64px;line-height:1;margin-bottom:18px;">\uD83D\uDEE0\uFE0F</div>'
      +'<h1 style="margin:0 0 10px;font-size:26px;font-weight:900;letter-spacing:-.3px;">시스템 점검 중입니다</h1>'
      +'<p id="kacMaintMsg" style="margin:0 0 18px;font-size:15px;font-weight:700;color:rgba(255,255,255,.82);line-height:1.65;"></p>'
      +(until?'<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:800;color:#fde68a;">\u23F0 예상 완료: <b id="kacMaintUntil" style="font-weight:900;"></b></div>':'')
      +'<div style="margin-top:30px;font-size:12px;font-weight:700;color:rgba(255,255,255,.45);">KAC \ud56d\uacf5\uae30\uc220\ud6c8\ub828\uc6d0 \ud1b5\ud569 \uad50\uc721 \uc2dc\uc2a4\ud15c</div>'
      +'</div>';
    var m=document.getElementById('kacMaintMsg'); if(m) m.textContent=msg;   // textContent — 안내문구 HTML 주입 차단
    var u=document.getElementById('kacMaintUntil'); if(u) u.textContent=until;
  }
  // 관리자 우회: ?ok=코드
  try{
    var q=new URLSearchParams(location.search).get('ok');
    if(q && window.crypto && crypto.subtle){
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(q)).then(function(b){
        var h=Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
        if(h===BH){ sessionStorage.setItem('kac_maint_bypass','1'); hide(); }
      });
    }
  }catch(e){}
  function boot(){
    if (typeof firebase==='undefined' || !firebase.apps || !firebase.apps.length){ if(++tries<40) setTimeout(boot,700); return; }
    try{
      firebase.database().ref('system/maintenance').on('value', function(s){
        var v=s.val();
        if(v && v.on){ if(document.body) show(v); else document.addEventListener('DOMContentLoaded', function(){ show(v); }); }
        else hide();
      }, function(){ /* 규칙 미발행 시 조용히 무시(정상 서비스) */ });
    }catch(e){}
  }
  boot();
})();
</script>
