<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ═══════════════════════════════════════════════════════════════
     KAC 항공기술훈련원 — 수료 기념사진 업로드 (모바일)
     VERSION: JDS260707(V3) — 가로 촬영 강조 배너(주황) + 세로 사진 감지 시 잘림 경고 확인 팝업 — 저장 경로 courses/{room}/gradPhoto → media/{room}/gradPhoto 이전(레거시 자동 정리)
     · 강사플랫폼 출결 화면의 '수료 기념사진' QR이 이 페이지로 연결 (?room=A)
     · 스마트폰으로 단체사진 촬영/선택 → 긴 변 1600px · JPEG 0.8 압축 →
       courses/{room}/gradPhoto = { dataUrl, updatedAt, endDate } 저장
     · endDate = 과정 종료일(settings.period 뒷날짜) — 수료일 자정까지만 다운로드 유효
     ═══════════════════════════════════════════════════════════════ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>수료 기념사진 업로드 | KAC 항공기술훈련원</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app-check.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
         background: linear-gradient(160deg, #0f2057 0%, #1a3a8a 60%, #2563eb 130%);
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 22px; }
  .card { width: 100%; max-width: 430px; background: #fff; border-radius: 22px;
          box-shadow: 0 24px 60px rgba(2, 8, 30, .45); overflow: hidden; }
  .head { padding: 22px 24px 18px; background: linear-gradient(135deg, #0f2057, #1a3a8a); color: #fff; text-align: center; }
  .head .ic { font-size: 34px; margin-bottom: 8px; }
  .head h1 { font-size: 19px; font-weight: 900; letter-spacing: -.3px; }
  .head p { margin-top: 6px; font-size: 12.5px; font-weight: 700; opacity: .85; }
  .body { padding: 22px 22px 26px; }
  .course { background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 13px 16px;
            font-size: 14.5px; font-weight: 900; color: #0f2057; text-align: center; margin-bottom: 18px; word-break: keep-all; }
  .course small { display: block; margin-top: 3px; font-size: 11.5px; font-weight: 700; color: #64748b; }
  .shoot { width: 100%; padding: 18px; border: none; border-radius: 16px; cursor: pointer;
           background: linear-gradient(135deg, #16a34a, #15803d); color: #fff;
           font-size: 17px; font-weight: 900; box-shadow: 0 8px 22px rgba(22, 163, 74, .4); }
  .shoot:active { transform: scale(.98); }
  .tip { margin-top: 14px; text-align: center; font-size: 12px; font-weight: 700; color: #64748b; line-height: 1.7; }
  #stateBox { display: none; text-align: center; padding: 8px 0 2px; }
  #stateBox .big { font-size: 52px; margin-bottom: 10px; }
  #stateBox h2 { font-size: 17px; font-weight: 900; color: #0f172a; margin-bottom: 8px; }
  #stateBox p { font-size: 13px; font-weight: 700; color: #475569; line-height: 1.7; }
  .bar { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin: 16px 0 6px; display: none; }
  .bar i { display: block; height: 100%; width: 30%; border-radius: 99px;
           background: linear-gradient(90deg, #2563eb, #16a34a); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .retry { margin-top: 14px; padding: 12px 22px; border: none; border-radius: 12px; background: #2563eb; color: #fff;
           font-size: 14px; font-weight: 900; cursor: pointer; display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="ic">📸</div>
      <h1>수료 기념사진 업로드</h1>
      <p>KAC 항공기술훈련원</p>
    </div>
    <div class="body">
      <div class="course" id="courseBox">과정 확인 중...<small id="roomSub"></small></div>

      <div id="mainBox">
        <button class="shoot" onclick="document.getElementById('file').click()">
          <i>📷</i> 사진 촬영 / 선택하기
        </button>
        <input type="file" id="file" accept="image/*" capture="environment" style="display:none;">
        <div style="display:flex; align-items:center; gap:11px; background:#fff7ed; border:2px solid #fb923c; border-radius:14px; padding:13px 15px; margin:14px 0 10px; text-align:left;">
            <span style="font-size:28px; flex-shrink:0;">📱↻</span>
            <div style="font-size:14px; font-weight:800; color:#9a3412; line-height:1.55;">
                휴대폰을 <b style="color:#c2410c; font-size:15.5px;">반드시 가로로 눕혀서</b> 촬영하세요!<br>
                <small style="font-size:12px; font-weight:700; color:#b45309;">액자 사진칸이 가로로 넓어, 세로 사진은 위아래가 크게 잘립니다.</small>
            </div>
        </div>
        <div class="tip">
          교탁에서 교육생 전체가 나오도록 촬영해 주세요.<br>
          업로드하면 액자에 자동 합성되어<br>강사·교육생 플랫폼에서 <b>수료일 자정까지</b> 내려받을 수 있습니다.
        </div>
      </div>

      <div class="bar" id="bar"><i></i></div>

      <div id="stateBox">
        <div class="big" id="stIcon">✅</div>
        <h2 id="stTitle">업로드 완료!</h2>
        <p id="stMsg">기념사진이 등록되었습니다.<br>강사 화면에서 액자 합성본을 확인하세요.</p>
        <button class="retry" id="retryBtn" onclick="resetUI()">다시 시도</button>
      </div>
    </div>
  </div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var room = String(params.get('room') || '').trim().toUpperCase();
  var endDate = '';

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function endOf(period) {
    var p = String(period || '');
    var sep = p.indexOf(' ~ ') >= 0 ? ' ~ ' : '~';
    var parts = p.split(sep);
    return (parts[1] || parts[0] || '').trim();
  }

  function showState(icon, title, msg, retry) {
    document.getElementById('mainBox').style.display = 'none';
    document.getElementById('bar').style.display = 'none';
    var s = document.getElementById('stateBox');
    s.style.display = 'block';
    document.getElementById('stIcon').textContent = icon;
    document.getElementById('stTitle').textContent = title;
    document.getElementById('stMsg').innerHTML = msg;
    document.getElementById('retryBtn').style.display = retry ? 'inline-block' : 'none';
  }
  window.resetUI = function () {
    document.getElementById('stateBox').style.display = 'none';
    document.getElementById('mainBox').style.display = 'block';
  };

  if (!room || !/^[A-Z]$/.test(room)) {
    document.getElementById('courseBox').innerHTML = '⚠️ 잘못된 접근입니다';
    showState('⚠️', '잘못된 접근', '강사플랫폼의 QR 코드를 통해<br>다시 접속해 주세요.', false);
    return;
  }

  // 과정 정보 표시 + 종료일 확보
  try {
    firebase.database().ref('courses/' + room + '/settings').once('value').then(function (s) {
      var v = s.val() || {};
      endDate = endOf(v.period);
      document.getElementById('courseBox').innerHTML =
        (v.courseName ? v.courseName : '과정명 미설정') +
        '<small id="roomSub">' + (v.period || '') + ' · ROOM #' + room + '</small>';
    });
  } catch (e) {}

  document.getElementById('file').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    document.getElementById('mainBox').style.display = 'none';
    document.getElementById('bar').style.display = 'block';

    var rd = new FileReader();
    rd.onload = function () {
      var im = new Image();
      im.onload = function () {
        try {
          // [V3] 세로 사진 감지 — 액자 창이 가로형이라 세로 사진은 위아래가 크게 잘림
          if (im.height > im.width) {
            if (!confirm('⚠️ 세로로 찍힌 사진입니다.\n\n액자 사진칸이 가로로 넓어서, 세로 사진은 위아래가 크게 잘려 나옵니다.\n휴대폰을 가로로 눕혀 다시 촬영하시길 강력히 권장합니다.\n\n그래도 이 사진으로 진행할까요?')) {
              document.getElementById('mainBox').style.display = '';
              document.getElementById('bar').style.display = 'none';
              return;
            }
          }
          var MAX = 1600;
          var sc = Math.min(1, MAX / Math.max(im.width, im.height));
          var cv = document.createElement('canvas');
          cv.width = Math.round(im.width * sc);
          cv.height = Math.round(im.height * sc);
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          var dataUrl = cv.toDataURL('image/jpeg', 0.8);
          // [V2] 저장소를 media/{room}/gradPhoto 로 이전 (courses 트리 이그레스 격리, admin.js J16 연동)
          firebase.database().ref('media/' + room + '/gradPhoto').set({
            dataUrl: dataUrl,
            updatedAt: Date.now(),
            endDate: endDate || todayStr()
          }).then(function () {
            firebase.database().ref('courses/' + room + '/gradPhoto').remove().catch(function(){});
            showState('✅', '업로드 완료!', '기념사진이 등록되었습니다.<br>강사 화면에서 액자 합성본을 확인하고<br>글자 위치를 다듬을 수 있습니다.', false);
          }).catch(function (err) {
            showState('❌', '업로드 실패', (err && err.message ? err.message : '네트워크를 확인해 주세요.'), true);
          });
        } catch (e) {
          showState('❌', '처리 실패', '사진을 처리하지 못했습니다.<br>다른 사진으로 시도해 주세요.', true);
        }
      };
      im.onerror = function () { showState('❌', '사진 오류', '사진을 읽지 못했습니다.', true); };
      im.src = rd.result;
    };
    rd.onerror = function () { showState('❌', '읽기 실패', '파일을 읽지 못했습니다.', true); };
    rd.readAsDataURL(f);
  });
})();
</script>

<!-- ═══ [2026-07-07 전체 점검모드] system/maintenance 스위치 하나로 전 플랫폼 동시 점검중 전환.
     on:true면 전체 화면 점검 안내(실시간), off면 즉시 복귀. 재배포 불필요.
     관리자 우회: 주소 뒤 ?ok=우회코드 (SHA-256 대조, 탭 세션 동안 유지) ═══ -->
<script>
(function(){
  var BH='2c978f750e54c66ebaf4cb8b70d6420b6d7cb6dde1209447a4b87b026ed398a9', tries=0;
  function hide(){ var o=document.getElementById('kacMaintOv'); if(o) o.remove(); try{ document.documentElement.style.overflow=''; }catch(e){} }
  function show(v){
    if (sessionStorage.getItem('kac_maint_bypass')==='1') return;
    var o=document.getElementById('kacMaintOv');
    var msg=(v&&v.msg)||'더 나은 서비스를 위해 시스템을 점검하고 있습니다.';
    var until=(v&&v.until)?String(v.until):'';
    if(!o){
      o=document.createElement('div'); o.id='kacMaintOv';
      o.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0f2057 0%,#1a3a8a 75%,#1e40af 140%);';
      document.body.appendChild(o);
      try{ document.documentElement.style.overflow='hidden'; }catch(e){}
    }
    o.innerHTML='<div style="max-width:460px;width:100%;text-align:center;color:#fff;">'
      +'<div style="font-size:64px;line-height:1;margin-bottom:18px;">\uD83D\uDEE0\uFE0F</div>'
      +'<h1 style="margin:0 0 10px;font-size:26px;font-weight:900;letter-spacing:-.3px;">시스템 점검 중입니다</h1>'
      +'<p id="kacMaintMsg" style="margin:0 0 18px;font-size:15px;font-weight:700;color:rgba(255,255,255,.82);line-height:1.65;"></p>'
      +(until?'<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:800;color:#fde68a;">\u23F0 예상 완료: <b id="kacMaintUntil" style="font-weight:900;"></b></div>':'')
      +'<div style="margin-top:30px;font-size:12px;font-weight:700;color:rgba(255,255,255,.45);">KAC \ud56d\uacf5\uae30\uc220\ud6c8\ub828\uc6d0 \ud1b5\ud569 \uad50\uc721 \uc2dc\uc2a4\ud15c</div>'
      +'</div>';
    var m=document.getElementById('kacMaintMsg'); if(m) m.textContent=msg;   // textContent — 안내문구 HTML 주입 차단
    var u=document.getElementById('kacMaintUntil'); if(u) u.textContent=until;
  }
  // 관리자 우회: ?ok=코드
  try{
    var q=new URLSearchParams(location.search).get('ok');
    if(q && window.crypto && crypto.subtle){
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(q)).then(function(b){
        var h=Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
        if(h===BH){ sessionStorage.setItem('kac_maint_bypass','1'); hide(); }
      });
    }
  }catch(e){}
  function boot(){
    if (typeof firebase==='undefined' || !firebase.apps || !firebase.apps.length){ if(++tries<40) setTimeout(boot,700); return; }
    try{
      firebase.database().ref('system/maintenance').on('value', function(s){
        var v=s.val();
        if(v && v.on){ if(document.body) show(v); else document.addEventListener('DOMContentLoaded', function(){ show(v); }); }
        else hide();
      }, function(){ /* 규칙 미발행 시 조용히 무시(정상 서비스) */ });
    }catch(e){}
  }
  boot();
})();
</script>

</body>
</html>
