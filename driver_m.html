  <script>
  /* [기기 분리] PC 접속은 PC 전용 화면으로 (모바일은 이 화면 유지). ?forcem 으로 강제 모바일. */
  (function(){ try{
    var wide = window.innerWidth >= 1024;
    var fine = window.matchMedia && window.matchMedia('(pointer:fine)').matches;
    var noTouch = !('ontouchstart' in window) || navigator.maxTouchPoints === 0;
    var isPc = wide && (fine || noTouch);
    if(isPc && location.search.indexOf('forcem')<0){ location.replace('driver.html'+location.search+location.hash); }
  }catch(e){} })();
  </script>
<!-- ════════ [카카오채널 연동] catc1234 접속 게이트 (수정상태: 수정안하는중) ════════
     · driver.html(차량지원)의 모바일 라이트판. 직접 진입 시 접속코드 요구.
     · 통과 시 localStorage['catc_gate_ok'] 저장. catcLock()으로 잠금 해제. 기능 로직과 분리. -->
<script>
(function(){
  window.catcLock=function(){ try{localStorage.removeItem('catc_gate_ok');}catch(e){} location.reload(); };
  var ok=false; try{ ok=(function(){var t=parseInt(localStorage.getItem('catc_gate_ok'),10);return !!t&&(Date.now()-t)<86400000;})(); }catch(e){ ok=true; }
  if(ok){ window.__catcUnlocked=true; return; }
  window.__catcUnlocked=false;
  document.documentElement.classList.add('catc-locked');
  function build(){
    if(document.getElementById('catcGate')) return;
    var o=document.createElement('div'); o.id='catcGate';
    o.innerHTML='<div class="catc-box"><div class="catc-ic">🔒</div>'
      +'<div class="catc-t">접속 코드 입력</div>'
      +'<div class="catc-s">CATC 교육 플랫폼 · 보안 접속</div>'
      +'<input id="catcInp" type="password" autocomplete="off" placeholder="접속 코드">'
      +'<button id="catcBtn">입장</button><div id="catcMsg"></div></div>';
    (document.body||document.documentElement).appendChild(o);
    var inp=o.querySelector('#catcInp'),btn=o.querySelector('#catcBtn'),msg=o.querySelector('#catcMsg');
    function go(){ if(inp.value==='catc1234'){ try{localStorage.setItem('catc_gate_ok',String(Date.now()));}catch(e){} location.reload(); } else { msg.textContent='접속 코드가 올바르지 않습니다.'; inp.value=''; inp.focus(); } }
    btn.addEventListener('click',go);
    inp.addEventListener('keyup',function(e){ if(e.key==='Enter') go(); });
    setTimeout(function(){ try{inp.focus();}catch(e){} },120);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded',build);
})();
</script>

<script>
/* ========== 차량지원 모바일 라이트뷰 (픽업 처리 + 퇴교차량 조회) ========== */
var allCourses={}, pickups=[], knownIds=[], firstLoad=true, curTab='pickup';
function h(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtPhone(p){ if(!p) return ''; var d=(''+p).replace(/[^0-9]/g,''); if(d.length===11) return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'); if(d.length===10) return d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3'); return p; }
function normDate(s){ return s ? String(s).replace(/\./g,'-').replace(/\s/g,'') : ''; }
function fmtFull(s){ if(!s) return ''; return String(s).replace(/-/g,'.'); }
function dirText(place,dir){ place=place||'역'; return dir==='dep' ? ('항기원 → '+place) : (place+' → 항기원'); }
function dirLabel(dir){ return dir==='dep' ? '모셔다드리기' : '모셔오기'; }

function tickClock(){
  var d=new Date(), days=['일','월','화','수','목','금','토'];
  var hh=d.getHours(), ap=hh<12?'AM':'PM', h12=((hh%12)||12);
  var el=document.getElementById('clk');
  if(el) el.innerHTML=(d.getMonth()+1)+'.'+d.getDate()+'('+days[d.getDay()]+') <b>'+h12+':'+pad(d.getMinutes())+'</b> '+ap;
}
setInterval(tickClock,1000); tickClock();

function switchTab(v){
  curTab=v;
  document.querySelectorAll('.view').forEach(function(e){ e.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(e){ e.classList.remove('active'); });
  document.getElementById('v-'+v).classList.add('active');
  document.querySelector('.tab[data-v="'+v+'"]').classList.add('active');
}

/* ===== Firebase ===== */
firebase.database().ref('courses').on('value', function(s){ allCourses=s.val()||{}; renderLeave(); });
firebase.database().ref('system/pickup').on('value', function(s){
  var raw=s.val()||{}, ids=Object.keys(raw), hasNew=false;
  ids.forEach(function(id){ if(knownIds.indexOf(id)<0 && raw[id].status==='pending') hasNew=true; });
  pickups=ids.map(function(id){ var o=raw[id]||{}; o.id=id; return o; }).sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  if(!firstLoad && hasNew){ var a=document.getElementById('alarm-sound'); if(a){ a.currentTime=0; a.play().catch(function(){}); } }
  knownIds=ids; firstLoad=false;
  renderPickup();
});

function reqCard(p){
  var statusTag = p.status==='confirmed' ? '<span class="tag tag-confirmed">확인완료</span>'
    : p.status==='rejected' ? '<span class="tag tag-rejected">운행불가</span>'
    : '<span class="tag tag-pending">미확인</span>';
  var memo = p.memo ? '<div class="req-memo"><i class="fa-solid fa-note-sticky" style="color:#cbd5e1"></i> '+h(p.memo)+'</div>' : '';
  var rej = (p.status==='rejected'&&p.rejectReason) ? '<div class="req-rej"><i class="fa-solid fa-circle-info"></i> '+h(p.rejectReason)+'</div>' : '';
  var btns = p.status==='pending'
    ? '<div class="req-btns"><button class="btn btn-ok" onclick="confirmPickup(\''+p.id+'\')"><i class="fa-solid fa-check"></i> 확인</button><button class="btn btn-no" onclick="markReject(\''+p.id+'\')"><i class="fa-solid fa-xmark"></i> 불가</button></div>'
    : '<div class="req-btns"><button class="btn btn-undo" onclick="undoPickup(\''+p.id+'\')"><i class="fa-solid fa-rotate-left"></i> 미확인으로 되돌리기</button></div>';
  return '<div class="req '+(p.status==='pending'?'pending':'')+'" id="req-'+p.id+'">'
    +'<div class="req-top"><span class="req-prof">'+h(p.prof||'-')+'</span><span class="req-phone">'+h(fmtPhone(p.phone))+'</span>'+statusTag+'</div>'
    +'<div class="req-line"><i class="fa-solid fa-route"></i> <span class="dir">'+h(dirText(p.place,p.dir))+'</span> <span style="color:#94a3b8;font-size:11px;font-weight:700;">'+dirLabel(p.dir)+'</span></div>'
    +'<div class="req-line"><i class="fa-regular fa-calendar"></i> '+h(fmtFull(normDate(p.date))||'-')+'  <i class="fa-regular fa-clock" style="margin-left:6px;"></i> '+h(p.time||'-')+'</div>'
    +memo+rej+btns+'</div>';
}

function renderPickup(){
  var pend=pickups.filter(function(p){ return p.status==='pending'; });
  var done=pickups.filter(function(p){ return p.status==='confirmed'||p.status==='rejected'; })
                  .sort(function(a,b){ return (b.respondedAt||0)-(a.respondedAt||0); });
  var tc=document.getElementById('tabCnt');
  if(pend.length){ tc.style.display='inline-block'; tc.textContent=pend.length; } else { tc.style.display='none'; }
  document.getElementById('pendN').textContent=pend.length?(pend.length+'건 대기'):'';
  document.getElementById('pendList').innerHTML = pend.length ? pend.map(reqCard).join('')
    : '<div class="empty"><i class="fa-regular fa-circle-check" style="font-size:20px;display:block;margin-bottom:6px;color:#cbd5e1;"></i>대기 중인 신청이 없습니다.</div>';
  document.getElementById('doneList').innerHTML = done.length ? done.slice(0,12).map(reqCard).join('')
    : '<div class="empty" style="padding:18px 0;">처리 내역 없음</div>';
}

function confirmPickup(id){
  var el=document.getElementById('req-'+id); if(el) el.classList.add('resolving');
  firebase.database().ref('system/pickup/'+id).update({ status:'confirmed', rejectReason:null, respondedAt:firebase.database.ServerValue.TIMESTAMP })
    .then(function(){ toast('✅ 확인 처리'); });
}
var _rejId=null;
function markReject(id){ _rejId=id; var t=document.getElementById('rejText'); if(t)t.value=''; document.getElementById('rejSheet').classList.add('open'); }
function rejPick(s){ var t=document.getElementById('rejText'); if(t)t.value=s; }
function confirmRej(){
  var reason=(document.getElementById('rejText').value||'').trim();
  if(_rejId){ var el=document.getElementById('req-'+_rejId); if(el) el.classList.add('resolving');
    firebase.database().ref('system/pickup/'+_rejId).update({ status:'rejected', rejectReason:reason||'운행 불가', respondedAt:firebase.database.ServerValue.TIMESTAMP }); }
  closeRej(); toast('⛔ 운행 불가로 처리');
}
function closeRej(){ document.getElementById('rejSheet').classList.remove('open'); _rejId=null; }
function undoPickup(id){ firebase.database().ref('system/pickup/'+id).update({ status:'pending', rejectReason:null, respondedAt:null }); toast('미확인으로 되돌림'); }

/* ===== 퇴교차량 집계 ===== */
function sumLine(c){ return '오송'+c.osong+'·터미널'+c.terminal+'·공항'+c.airport+(c.car?('·자차'+c.car):''); }
function renderLeave(){
  var box=document.getElementById('leaveList'); var groups={}, pending=[];
  for(var rid in allCourses){
    var room=allCourses[rid]; var reqs=room.shuttle&&room.shuttle.requests; if(!reqs) continue;
    var arr=Object.keys(reqs).map(function(k){return reqs[k];}); if(!arr.length) continue;
    var counts={osong:0,terminal:0,airport:0,car:0};
    arr.forEach(function(r){ if(counts[r.type]!==undefined) counts[r.type]++; });
    var busTot=counts.osong+counts.terminal+counts.airport;
    var cn=(room.settings&&room.settings.courseName)||rid;
    var dep=room.shuttle&&room.shuttle.departure;
    if(dep && dep.announced && dep.time){
      var key=(dep.date||'')+'__'+dep.time;
      if(!groups[key]) groups[key]={date:dep.date||'',time:dep.time,counts:{osong:0,terminal:0,airport:0,car:0},busTot:0,courses:[]};
      var g=groups[key]; ['osong','terminal','airport','car'].forEach(function(k){ g.counts[k]+=counts[k]; }); g.busTot+=busTot; g.courses.push({cn:cn,counts:counts,busTot:busTot});
    } else { pending.push({cn:cn,counts:counts,busTot:busTot}); }
  }
  var gkeys=Object.keys(groups).sort(function(a,b){return a.localeCompare(b);});
  if(!gkeys.length && !pending.length){ box.innerHTML='<div class="empty">신청된 퇴교차량이 없습니다.</div>'; return; }
  var html='';
  gkeys.forEach(function(k){ var g=groups[k];
    html+='<div class="lv-run"><div class="lv-run-h"><span class="lv-time"><i class="fa-solid fa-bus"></i> '+fmtFull(g.date)+' '+(g.time==='미정'?'출발시간 미정':(g.time+' 출발'))+'</span><span class="lv-tot">'+g.busTot+'명</span></div>'
      +'<div class="lv-bd"><span class="bd2 osong">오송 '+g.counts.osong+'</span><span class="bd2 term">터미널 '+g.counts.terminal+'</span><span class="bd2 air">공항 '+g.counts.airport+'</span><span class="bd2 car">자차 '+g.counts.car+'</span></div>'
      +'<div class="lv-courses">'+g.courses.map(function(c){ return '<div class="lv-c"><span>'+h(c.cn)+'</span><b>'+c.busTot+'명</b><small>'+sumLine(c.counts)+'</small></div>'; }).join('')+'</div></div>';
  });
  if(pending.length){
    html+='<div class="lv-run pending"><div class="lv-run-h"><span class="lv-time wait"><i class="fa-solid fa-clock"></i> 출발시간 미공지 (운영부 대기)</span></div>'
      +'<div class="lv-courses">'+pending.map(function(c){ return '<div class="lv-c"><span>'+h(c.cn)+'</span><b>'+c.busTot+'명</b><small>'+sumLine(c.counts)+'</small></div>'; }).join('')+'</div></div>';
  }
  box.innerHTML=html;
}

var _toastT;
function toast(msg){ var el=document.getElementById('toast'); if(!el) return; el.textContent=msg; el.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(function(){ el.classList.remove('show'); },2000); }
document.getElementById('rejSheet').addEventListener('click', function(e){ if(e.target===this) closeRej(); });
</script>
