<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ============================================================
  CATC · 교육생 자동연결  (go.html)
  @version  B
  @build    20260610-220210
  ────────────────────────────────────────────────────────
  [코드 수정 규칙 · AI/개발자 공통]
  이 파일을 한 글자라도 고치면:
    1) 위 @version 을 다음 순서로 딱 1단계 올린다
       A → B → C → … → Z → A1 → B1 → … → Z1 → A2 → …
    2) @build 를 수정 시각(YYYYMMDD-HHMMSS)으로 갱신한다
    3) 아래 화면 배지(vA)와 콘솔 로그의 글자도 같이 맞춘다
  화면 우측 하단의 작은 'v?' 배지 / 콘솔 로그를 보고
  Shift+Ctrl+R(강력 새로고침) 후 최신본 적용 여부를 확인한다.
============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>교육생 플랫폼 연결</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { min-height: 100dvh; background: #0f172a; display: flex; align-items: center; justify-content: center; padding: 24px; color: #fff; }
        .card { width: 100%; max-width: 380px; text-align: center; }
        .logo { font-size: 46px; margin-bottom: 14px; }
        .spinner { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,0.15); border-top-color: #facc15; border-radius: 50%; margin: 18px auto; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .title { font-size: 18px; font-weight: 900; margin-bottom: 6px; }
        .sub { font-size: 14px; color: #94a3b8; line-height: 1.6; }
        .room-badge { display: inline-block; margin-top: 14px; background: rgba(250,204,21,0.15); border: 1px solid rgba(250,204,21,0.5); color: #facc15; font-weight: 800; font-size: 15px; padding: 8px 18px; border-radius: 12px; }
        .section { display: none; }
        .steps { text-align: left; background: rgba(255,255,255,0.06); border-radius: 14px; padding: 18px 20px; margin: 18px 0; font-size: 14px; line-height: 1.9; color: #cbd5e1; }
        .steps b { color: #fff; }
        .input { width: 100%; padding: 15px 16px; border-radius: 13px; border: 1.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-size: 16px; font-weight: 700; outline: none; text-align: center; margin-bottom: 12px; }
        .input::placeholder { color: #64748b; }
        .input:focus { border-color: #facc15; }
        .btn { display: block; width: 100%; padding: 15px; background: #facc15; color: #1e293b; border: none; border-radius: 13px; font-size: 15px; font-weight: 900; cursor: pointer; }
        .btn:disabled { opacity: 0.5; }
        .btn-sub { background: transparent; color: #94a3b8; border: 1.5px solid rgba(255,255,255,0.2); margin-top: 10px; }
        .match-card { background: rgba(255,255,255,0.08); border: 1.5px solid rgba(250,204,21,0.4); border-radius: 14px; padding: 18px; margin: 16px 0; }
        .match-room { display:inline-block; font-size: 12.5px; font-weight: 800; color: #cbd5e1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; padding: 4px 13px; letter-spacing: 0.5px; }
        .match-course { font-size: 25px; font-weight: 900; color: #facc15; margin-top: 12px; line-height: 1.3; word-break: keep-all; }
        .match-prof { font-size: 14px; color: #94a3b8; margin-top: 8px; font-weight: 700; }
        .err { color: #fca5a5; font-size: 13px; margin: 8px 0; min-height: 16px; }
        .link-find { margin-top: 16px; font-size: 13px; color: #facc15; text-decoration: underline; cursor: pointer; background: none; border: none; }
    </style>
</head>
<body>
    <div class="card">
        <!-- 연결 중 (룸 기록 있음) -->
        <div id="sec-connecting" class="section" style="display:block;">
            <div class="logo">🎓</div>
            <div class="spinner"></div>
            <div class="title">교육생 플랫폼으로 연결 중…</div>
            <div class="sub">최근 입장하신 강의실로 이동합니다.</div>
            <div class="room-badge" id="roomBadge" style="display:none;"></div>
        </div>

        <!-- 입장 기록 없음 → 안내 + 이름으로 찾기 진입 -->
        <div id="sec-notice" class="section">
            <div class="logo">📋</div>
            <div class="title">입장 기록을 찾지 못했어요</div>
            <div class="sub">처음이거나, 기기 정보가 초기화된 경우입니다.</div>
            <div class="steps">
                <b>처음이신가요?</b><br>
                강의실에 게시된 <b>QR 코드</b>를 스캔해 등록해 주세요.<br><br>
                <b>이미 등록하셨나요?</b><br>
                아래 버튼을 눌러 성함으로 강의실을 찾을 수 있어요.
            </div>
            <button class="btn" onclick="showFind()"><i class="fa-solid fa-user-magnifying-glass"></i> 성함으로 내 강의실 찾기</button>
        </div>

        <!-- 이름으로 찾기 -->
        <div id="sec-find" class="section">
            <div class="logo">🔎</div>
            <div class="title">성함으로 강의실 찾기</div>
            <div class="sub">등록하셨던 성함을 입력해 주세요.</div>
            <div style="margin-top:18px;">
                <input type="text" id="findName" class="input" placeholder="성함 (예: 홍길동)" autocomplete="off">
                <div class="err" id="findErr"></div>
                <button class="btn" id="findBtn" onclick="findRoom()">강의실 찾기</button>
                <button class="btn btn-sub" onclick="showNotice()">뒤로</button>
            </div>
        </div>

        <!-- 매칭 결과 확인 -->
        <div id="sec-confirm" class="section">
            <div class="logo">✅</div>
            <div class="title">이 강의실이 맞으신가요?</div>
            <div class="match-card">
                <div class="match-room" id="mRoom"></div>
                <div class="match-course" id="mCourse"></div>
                <div class="match-prof" id="mProf"></div>
            </div>
            <button class="btn" onclick="confirmEnter()"><i class="fa-solid fa-right-to-bracket"></i> 네, 입장합니다</button>
            <button class="btn btn-sub" onclick="showFind()">아니요, 다시 찾기</button>
            <div id="multiHint" style="display:none; margin-top:14px;"></div>
        </div>

        <!-- 동명이인: 과정 선택 -->
        <div id="sec-picker" class="section">
            <div class="logo">👥</div>
            <div class="title">본인 과정을 선택하세요</div>
            <div class="sub">같은 성함이 여러 강의실에 있어요.<br>듣고 계신 과정을 눌러 주세요.</div>
            <div id="pickerList" style="margin-top:18px; display:flex; flex-direction:column; gap:12px;"></div>
            <button class="btn btn-sub" style="margin-top:14px;" onclick="showFind()">다시 찾기</button>
        </div>
    </div>

    <script>
        var db = null;
        try { db = firebase.database(); } catch (e) { console.error('firebase init 실패', e); }

        function show(sec) {
            ['connecting','notice','find','confirm','picker'].forEach(function (s) {
                document.getElementById('sec-' + s).style.display = (s === sec) ? 'block' : 'none';
            });
        }
        function showNotice() { show('notice'); }
        function showFind() {
            show('find');
            document.getElementById('findErr').textContent = '';
            setTimeout(function () { document.getElementById('findName').focus(); }, 100);
        }

        // ── 1) 최근 확정한 강의실 자동 복귀 (유효성 검증 후) ──
        (function () {
            var room = null, savedName = null;
            try {
                room = localStorage.getItem('kac_last_visited_room');
                savedName = localStorage.getItem('kac_last_visited_name');
            } catch (e) {}

            function goFind() {
                show('find');
                setTimeout(function () { var el = document.getElementById('findName'); if (el) el.focus(); }, 150);
            }
            function clearSaved() {
                try { localStorage.removeItem('kac_last_visited_room'); localStorage.removeItem('kac_last_visited_name'); } catch (e) {}
            }

            if (!room || !String(room).trim() || !db) { goFind(); return; }

            // 저장된 방이 아직 운영 중이고, 내 이름이 명단에 있는지 검증
            show('connecting');
            db.ref('courses/' + room).once('value').then(function (snap) {
                var c = snap.val() || {};
                var st = c.status || {};
                var active = (st.roomStatus === 'active');
                // 기간 만료 체크
                var period = (c.settings && c.settings.period) || '';
                var expired = false;
                if (period.indexOf(' ~ ') > -1) {
                    var end = new Date(period.split(' ~ ')[1]); end.setHours(23,59,59,999);
                    var today = new Date();
                    if (!isNaN(end) && today > end) expired = true;
                }
                // 명단에 내 이름 존재 여부
                var nameInRoom = false;
                if (savedName && c.students) {
                    nameInRoom = Object.keys(c.students).some(function (k) {
                        var s = c.students[k] || {};
                        return (s.name || '').trim() === savedName.trim();
                    });
                }
                // 유효: 운영 중 + 미만료 + (이름 저장 안됐거나 명단에 있음)
                if (active && !expired && (!savedName || nameInRoom)) {
                    var badge = document.getElementById('roomBadge');
                    if (badge) { badge.textContent = 'ROOM ' + room; badge.style.display = 'inline-block'; }
                    location.replace('index.html?room=' + encodeURIComponent(room));
                } else {
                    // 방이 리셋됐거나 명단에 없음 → 저장 삭제 후 이름 검색
                    clearSaved();
                    goFind();
                }
            }).catch(function () { goFind(); });
        })();

        // ── 2) 이름으로 강의실 찾기 ──
        var _matches = [];
        var _pickedRoom = null;
        var _pickedName = null;

        function findRoom() {
            var name = (document.getElementById('findName').value || '').trim();
            var errEl = document.getElementById('findErr');
            errEl.textContent = '';
            if (!name) { errEl.textContent = '성함을 입력해 주세요.'; return; }
            if (!db) { errEl.textContent = '연결 오류입니다. QR로 입장해 주세요.'; return; }
            _pickedName = name;  // 입장 확정 시 저장용

            var btn = document.getElementById('findBtn');
            btn.disabled = true; btn.textContent = '찾는 중…';

            db.ref('courses').once('value').then(function (snap) {
                var courses = snap.val() || {};
                var today = new Date(); today.setHours(0,0,0,0);
                _matches = [];

                Object.keys(courses).forEach(function (room) {
                    var c = courses[room] || {};
                    var st = c.status || {};
                    var settings = c.settings || {};
                    // 운영 중(active)인 강의실만 대상
                    if (st.roomStatus !== 'active') return;
                    // 기간이 지난 과정 제외
                    var period = settings.period || '';
                    if (period.indexOf(' ~ ') > -1) {
                        var endStr = period.split(' ~ ')[1].trim();
                        var endDt = new Date(endStr + 'T23:59:59');
                        if (!isNaN(endDt) && endDt < today) return;
                    }
                    // 학생 명단에서 이름 일치 검색
                    var students = c.students || {};
                    var found = Object.keys(students).some(function (tk) {
                        var s = students[tk] || {};
                        var nm = (s.name || tk.split('_')[0] || '').trim();
                        return nm === name;
                    });
                    if (found) {
                        _matches.push({
                            room: room,
                            course: settings.courseName || ('ROOM ' + room),
                            prof: (st.professorName || '')
                        });
                    }
                });

                btn.disabled = false; btn.textContent = '강의실 찾기';

                if (_matches.length === 0) {
                    errEl.textContent = '"' + name + '" 님으로 등록된 강의실을 찾지 못했어요. 성함을 다시 확인해 주세요.';
                    return;
                }
                if (_matches.length === 1) {
                    // 단일 매치 → 바로 확인 화면
                    showConfirm(0);
                } else {
                    // 동명이인 → 과정명으로 본인 강의실 선택하게 안내
                    showPicker();
                }
            }).catch(function (e) {
                console.error(e);
                btn.disabled = false; btn.textContent = '강의실 찾기';
                errEl.textContent = '조회 중 오류가 발생했습니다. 잠시 후 다시 시도하거나 QR로 입장해 주세요.';
            });
        }

        // 동명이인 → 과정명으로 선택
        function showPicker() {
            var list = document.getElementById('pickerList');
            list.innerHTML = _matches.map(function (m, i) {
                return '<button class="btn" style="text-align:left; line-height:1.4;" onclick="showConfirm(' + i + ')">' +
                    '<span style="font-weight:900;">ROOM ' + m.room + '</span><br>' +
                    '<span style="font-size:14px; opacity:0.95;">' + m.course + '</span>' +
                    (m.prof ? ' <span style="font-size:12px; opacity:0.8;">· ' + m.prof + ' 교수</span>' : '') +
                    '</button>';
            }).join('');
            show('picker');
        }

        function showConfirm(idx) {
            var m = _matches[idx];
            if (!m) return;
            _pickedRoom = m.room;
            document.getElementById('mRoom').textContent = 'ROOM ' + m.room;
            document.getElementById('mCourse').textContent = m.course;
            document.getElementById('mProf').textContent = m.prof ? (m.prof + ' 교수') : '';
            document.getElementById('multiHint').style.display = 'none';
            show('confirm');
        }

        function confirmEnter() {
            if (!_pickedRoom) return;
            // 본인이 확정한 방 + 이름을 저장 → 다음 자동 복귀 시 검증에 사용
            try {
                localStorage.setItem('kac_last_visited_room', _pickedRoom);
                if (_pickedName) localStorage.setItem('kac_last_visited_name', _pickedName);
            } catch (e) {}
            location.replace('index.html?room=' + encodeURIComponent(_pickedRoom));
        }

        // 엔터로 검색
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && document.getElementById('sec-find').style.display === 'block') {
                findRoom();
            }
        });
    </script>

</body>
