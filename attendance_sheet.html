<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>항기원 교육생 출석 관리대장</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background: #f1f5f9; }
        .sheet-container { box-sizing: border-box; background: white; padding: 11mm 13mm; width: 210mm; min-height: 297mm; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; }
        .title { text-align: center; font-size: 22px; font-weight: 900; text-decoration: underline; margin-bottom: 12px; }
        
        /* 상단 서명란 */
        .sign-area { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .sign-table { border-collapse: collapse; }
        .sign-table td { border: 1px solid #000; width: 100px; height: 30px; text-align: center; font-size: 12px; font-weight: bold; }
        .sign-box { height: 60px; cursor: pointer; position: relative; vertical-align: middle; }
        .sign-box img { max-height: 50px; mix-blend-mode: multiply; }

/* 메인 테이블 스타일 수정 */
        .main-table { width: 100%; border-collapse: collapse; font-size: 10px; table-layout: fixed; word-break: break-all; }
        .main-table th, .main-table td { border: 1px solid #000; padding: 1px 2px; text-align: center; overflow: hidden; height: var(--rh, 24px); }
        .main-table th { background: #f8fafc; height: 30px; font-size:10px; }
        .main-table td.hol { background: #f1f5f9; }
        .main-table th.hol { background: #e2e8f0; color:#64748b; }
        
        /* No·성명만 고정폭, 날짜 열은 남은 공간을 균등 분할(3일→3등분, 5일→5등분) */
        .no-col { width: 28px; }
        .name-col { width: 92px; font-weight: bold; }
        /* .day-col 은 폭 미지정 → table-layout:fixed 가 남은 폭을 균등 분배 */

        /* 주차 페이지/라벨 */
        .sheet-container { margin-bottom: 28px; }
        .week-label { display:inline-block; font-size:13px; font-weight:800; color:#1e3a8a; margin:4px 0 12px; padding:3px 12px; border:1px solid #1e3a8a; border-radius:14px; }
        
        /* 도장 스타일 */
        .stamp { color: #dc2626; font-weight: 900; border: 1.5px solid #dc2626; border-radius: 50%; width: var(--sw,16px); height: var(--sw,16px); display: inline-flex; align-items: center; justify-content: center; font-size: var(--sf,8px); transform: rotate(-10deg); margin:0 auto; }

        @media print {
            .no-print { display: none; }
            html, body { background: white; padding: 0; margin: 0; }
            /* @page 여백 0 → 브라우저가 자동 삽입하는 머리글/꼬리글(주소·날짜·페이지) 제거 */
            @page { size: A4 portrait; margin: 0; }
            /* 페이지 여백은 컨테이너 패딩으로 직접 부여 (한 주 = 한 페이지, 가운데 정렬) */
            .sheet-container {
                box-sizing: border-box;
                width: 100%;
                min-height: auto;
                box-shadow: none;
                margin: 0;
                border: none;
                padding: 11mm 13mm;
            }
            /* 주차별 페이지 자동 분할 — 다음 주는 새 장에서 이어 출력 */
            .sheet-container { page-break-after: always; }
            .sheet-container:last-child { page-break-after: auto; }
            /* 테이블 헤더 반복 (여러 페이지) */
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            tr { page-break-inside: avoid; }
            /* 결재란이 페이지 넘어가지 않도록 */
            .sign-area { page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        /* [운영부 수동 출석 · OTP 인증표기] */
        .att-in{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.5px; line-height:1; }
        .att-auth{ font-size:calc(var(--sf, 8px) - 2px); font-family:'Consolas','Roboto Mono',monospace; color:#059669; font-weight:800; letter-spacing:-.3px; white-space:nowrap; transform:rotate(-10deg); margin-top:1px; }
        .att-auth.manual{ color:#2563eb; }
        .stamp-manual{ color:#2563eb !important; border-color:#2563eb !important; }
        .att-mark{ cursor:pointer; }
        .att-mark:hover{ background:#eff6ff; }
        .mk-hint{ color:#cbd5e1; opacity:.55; font-size:calc(var(--sf, 8px) + 2px); transition:all .12s; }
        .att-mark:hover .mk-hint{ color:#2563eb; opacity:1; }
        @media print{ .att-mark{ cursor:default !important; } .mk-hint{ display:none !important; } }
    </style>
</head>
<body>

    <div class="no-print" style="text-align:center; margin-bottom:20px;">
        <button onclick="printSheet()" style="padding:10px 30px; background:#003366; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">출석부 PDF 저장 / 인쇄 (A4)</button>
    </div>
    <div id="markHint" class="no-print" style="display:none; max-width:780px; margin:0 auto 18px; padding:11px 16px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; color:#1e40af; font-size:13.5px; font-weight:800; text-align:center; line-height:1.5;"><i class="fa-solid fa-hand-pointer"></i> 아직 출석 처리되지 않은 칸(<i class="fa-solid fa-hand-pointer" style="color:#94a3b8;"></i> 표시)을 클릭하면 <b>운영부 직접 출석 처리</b>됩니다. OTP 출석에는 인증번호가 표기되고, 직접 처리한 칸에는 <b>‘직접처리’</b>가 함께 남습니다. <span style="color:#64748b;font-weight:700;">(클릭 아이콘은 인쇄·PDF에 표시되지 않음)</span></div>

    <!-- 주차별 출석부 페이지가 자동 생성됩니다 -->
    <div id="print-area">
        <div id="sheets-root"></div>
    </div>


<script>
    const params = new URLSearchParams(window.location.search);
    const autoSave = params.get('auto') === '1';   // 교육운영부 'PDF 저장' 확인 후 진입 시 자동 인쇄
    let _autoDone = false;
    let courseInfo = {};
    let dateArray = [];
    let SHEET_ROOM = '';   // [수정] init 외의 함수(renderTable)에서도 방 번호를 참조할 수 있도록 전역 보관
    let HEADER = { courseName:'', period:'', coordName:'', profName:'' }; // [신규] 주차 페이지 공통 헤더 정보

    // 파이어베이스 데이터베이스 참조 (config.js 로드 후 사용 가능)
    const db = firebase.database();




// 실제 PDF 파일 생성·다운로드 (모바일/인앱 브라우저에서도 동작). 미지원 시 인쇄로 폴백.
function printSheet() {
    const base = (HEADER.courseName || '') + ' 출석부 대장';
    const el = document.getElementById('sheets-root') || document.getElementById('print-area') || document.body;
    if (typeof html2pdf === 'undefined' || !el) { document.title = base; window.print(); return; }
    const btn = document.querySelector('button[onclick="printSheet()"]');
    const oldTxt = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = '⏳ PDF 생성 중…'; }
    const tmp = document.createElement('style');
    // PDF 캡처 영역을 정확히 A4 폭(210mm)으로 고정 → 좌우 여백/축소 방지
    tmp.innerHTML = '#sheets-root,#print-area{width:210mm !important;margin:0 auto !important;}.sheet-container{box-shadow:none !important;margin:0 auto !important;}.mk-hint{display:none !important;}.att-mark{cursor:default !important;}';
    document.head.appendChild(tmp);
    const done = () => { tmp.remove(); if (btn) { btn.disabled = false; btn.innerHTML = oldTxt; } };
    html2pdf().set({
        margin: 0,
        filename: base + '.pdf',
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'], before: '.sheet-container:not(:first-of-type)' }
    }).from(el).save().then(done).catch(() => { done(); document.title = base; window.print(); });
}

// [운영부 수동 출석] 아직 처리 안 된 칸 클릭 → 해당 날짜 출석 처리(OTP 미체크 보완). 라이브 방에서만.
function markCell(td){
  try{
    if(!SHEET_ROOM || autoSave) return;
    var d=td.getAttribute('data-d'), nm=td.getAttribute('data-n'), ph=td.getAttribute('data-p')||'';
    if(!d||!nm) return;
    if(!confirm('['+nm+'] '+d+'\n이 교육생을 출석으로 처리할까요?\n\n※ 운영부 직접 처리(OTP 미체크 보완)로 기록됩니다.')) return;
    var key=(nm+'_'+ph).replace(/[.#$\[\]\/]/g,'_');
    firebase.database().ref('courses/'+SHEET_ROOM+'/internal_attendance/'+d+'/'+key)
      .set({ name:nm, phone:ph, manual:true, src:'coord', ts:Date.now() })
      .catch(function(e){ alert('출석 처리 실패: '+((e&&e.message)||'')); });
  }catch(e){ alert('오류: '+((e&&e.message)||'')); }
}
window.markCell=markCell;

async function init() {
    // 1. 주소창에서 방 번호(room)를 정확히 가져옵니다.
    const params = new URLSearchParams(window.location.search);
    const _archiveId = params.get('archive');
    if (_archiveId) {
        const arSnap = await db.ref('system/course_archive/' + _archiveId).once('value');
        const ar = arSnap.val() || {};
        SHEET_ROOM = null; window._archiveMode = true; window._archiveExpected = ar.expectedStudents || null;
        HEADER.courseName = ar.courseName || '지난 과정'; HEADER.period = ar.period || '-'; HEADER.coordName = ar.coord || '-'; HEADER.profName = ar.prof ? ar.prof + ' 교수' : '-';
        dateArray = generateDates(ar.period || '');
        renderTable(ar.students || {}, ar.internal_attendance || {});
        if (autoSave && !_autoDone) { _autoDone = true; setTimeout(() => { try { printSheet(); } catch (e) {} }, 1000); }
        return;
    }
    const roomFromUrl = params.get('room');
    SHEET_ROOM = roomFromUrl;   // [수정] 전역 보관 (renderTable에서 사용)

    if (!roomFromUrl) {
        document.getElementById('print-area').innerHTML = '<div style="text-align:center; padding:80px 20px; color:#64748b;"><h2>⚠️ 강의실 정보가 없습니다</h2><p>올바른 경로로 접속해 주세요.<br>강사 플랫폼의 [출석부 관리/인쇄] 버튼을 통해 접속해 주세요.</p></div>';
        return;
    }

    // 2. 해당 방의 과정 정보(이름, 기간, 담당자) 및 상태(교수명) 가져오기
    const setSnap = await db.ref(`courses/${roomFromUrl}/settings`).once('value');
    const statSnap = await db.ref(`courses/${roomFromUrl}/status`).once('value');
    
    const courseInfo = setSnap.val() || {};
    const roomStatus = statSnap.val() || {};

    // [수정] 주차별 페이지에서 반복 사용하기 위해 헤더 정보를 전역에 보관
    HEADER.courseName = courseInfo.courseName || roomFromUrl;
    HEADER.period     = courseInfo.period || "-";
    HEADER.coordName  = courseInfo.coordinatorName || "-";
    HEADER.profName   = roomStatus.professorName ? roomStatus.professorName + " 교수" : "-";

    // 3. 전체 평일 날짜 배열 생성 (월~금) — 이후 주 단위로 분할
    dateArray = generateDates(courseInfo.period);

    // 4. [중요] 해당 방의 수강생 명단 및 출석 데이터만 실시간 감시
    db.ref(`courses/${roomFromUrl}/students`).on('value', studentSnap => {
        const studentsRaw = studentSnap.val() || {};

        db.ref(`courses/${roomFromUrl}/internal_attendance`).on('value', attendanceSnap => {
            const attendanceData = attendanceSnap.val() || {};
            // 명단 그리기 함수 호출
            renderTable(studentsRaw, attendanceData);
            // auto=1 진입 시 렌더 완료 후 자동으로 저장(인쇄) 창 띄움 — 1회만
            if (autoSave && !_autoDone) {
                _autoDone = true;
                setTimeout(() => {
                    try { printSheet(); } catch (e) {}
                }, 1000);
            }
        });
    });
}







// 대한민국 공휴일(평일에 걸친 날만 의미 있음) — 필요시 갱신
    const HOLIDAYS = {
        '2026-01-01':'신정','2026-02-16':'설날','2026-02-17':'설날','2026-02-18':'설날',
        '2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-05':'어린이날','2026-05-25':'부처님오신날',
        '2026-06-06':'현충일','2026-08-15':'광복절','2026-08-17':'대체공휴일',
        '2026-09-24':'추석','2026-09-25':'추석','2026-09-26':'추석','2026-10-03':'개천절','2026-10-05':'대체공휴일',
        '2026-10-09':'한글날','2026-12-25':'성탄절',
        '2027-01-01':'신정','2027-02-06':'설날','2027-02-08':'설날','2027-02-09':'설날','2027-03-01':'삼일절'
    };
    function isHoliday(d){ return HOLIDAYS[d] || null; }

    function renderTable(studentsRaw, attendanceData) {
        const root = document.getElementById('sheets-root');
        if (!root) return;
        root.innerHTML = "";
        // [운영부 수동 출석] 라이브 방(archive/인쇄 아님)에서만 빈 칸 클릭 마킹 허용
        const canMark = !!SHEET_ROOM && !autoSave;
        const todayStr = (function(){ var t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); })();
        try { var _mh=document.getElementById('markHint'); if(_mh) _mh.style.display = canMark ? 'block' : 'none'; } catch(e){}

        const uniqueStudentsMap = new Map();
        Object.values(studentsRaw).forEach(s => {
            if (s.name && s.name !== "undefined") {
                const cleanPhone = (s.phone || "0000").trim();
                const id = `${s.name.trim()}_${cleanPhone}`;
                uniqueStudentsMap.set(id, { name: s.name.trim(), phone: cleanPhone });
            }
        });
        const sortedStudents = Array.from(uniqueStudentsMap.values()).sort((a, b) => a.name.localeCompare(b.name));
        if (sortedStudents.length === 0) {
            root.innerHTML = `<div class="sheet-container"><div class="title">교 육 생 출 석 부</div><div style="padding:50px; color:#999; text-align:center;">현재 입교 완료된 교육생이 없습니다.</div></div>`;
            return;
        }

        const _renderWithExp = (rawList) => {
            // 날짜는 12일(약 2주반)씩, 학생은 42명씩 한 페이지 — 90명·2주 → 2페이지
            const _n = sortedStudents.length;
            let _rowH, _sw, _sf, MAXROWS;
            if (_n <= 25)      { _rowH = 40; _sw = 22; _sf = 10; MAXROWS = 60; }
            else if (_n <= 45) { _rowH = 25; _sw = 16; _sf = 8;  MAXROWS = 60; }
            else               { _rowH = 17; _sw = 13; _sf = 7;  MAXROWS = 42; }
            const MAXCOLS = 12;
            const colBlocks = [];
            for (let i = 0; i < dateArray.length; i += MAXCOLS) colBlocks.push(dateArray.slice(i, i + MAXCOLS));
            if (!colBlocks.length) colBlocks.push([]);
            const stuPages = [];
            for (let i = 0; i < sortedStudents.length; i += MAXROWS) stuPages.push({ list: sortedStudents.slice(i, i + MAXROWS), start: i });
            if (!stuPages.length) stuPages.push({ list: [], start: 0 });
            const total = colBlocks.length * stuPages.length;
            let pno = 0;
            colBlocks.forEach(dates => {
                stuPages.forEach(sp => { pno++; root.appendChild(buildPage(dates, sp.list, sp.start, pno, total, attendanceData, rawList, _rowH, _sw, _sf)); });
            });
        };
        if (window._archiveMode) { _renderWithExp(window._archiveExpected); }
        else { db.ref(`courses/${SHEET_ROOM}/expectedStudents`).once('value', expSnap => _renderWithExp(expSnap.val())); }
    }

    function buildPage(dates, students, startIdx, pageNo, totalPages, attendanceData, rawList, rowH, sw, sf) {
        const page = document.createElement('div');
        page.className = 'sheet-container';
        const pageInfo = totalPages > 1 ? ` (${pageNo}/${totalPages})` : '';
        const range = dates.length ? `${dates[0].slice(5).replace('-', '/')} ~ ${dates[dates.length - 1].slice(5).replace('-', '/')}` : '';
        const head = document.createElement('div');
        head.innerHTML = `
            <div class="title">교 육 생 출 석 부${pageInfo}</div>
            <div style="margin-bottom:8px; font-weight:bold; font-size:13px;">과정명: ${HEADER.courseName}<br>기간: ${HEADER.period}</div>
            ${range ? `<div class="week-label">${range}</div>` : ''}
            <div class="sign-area">
                <table class="sign-table">
                    <tr><td rowspan="2" style="width:20px; background:#eee;">결<br>재</td><td>과정담당</td><td>담임교수</td></tr>
                    <tr>
                        <td class="sign-box" onclick="applySign('coord')"><div class="sign-coord">${HEADER.coordName}</div></td>
                        <td class="sign-box" onclick="applySign('prof')"><div class="sign-prof">${HEADER.profName}</div></td>
                    </tr>
                </table>
            </div>`;
        page.appendChild(head);

        const table = document.createElement('table');
        table.className = 'main-table';
        table.style.cssText = '--rh:' + (rowH||24) + 'px; --sw:' + (sw||16) + 'px; --sf:' + (sf||8) + 'px;';
        let cols = '<col class="no-col"><col class="name-col">';
        dates.forEach(() => { cols += '<col class="day-col">'; });
        let thead = '<tr><th class="no-col">No</th><th class="name-col">성명</th>';
        dates.forEach(d => { const h = isHoliday(d); thead += `<th class="day-col${h ? ' hol' : ''}">${d.split('-')[1]}/${d.split('-')[2]}<br>${h ? '공휴일' : getDayName(d)}</th>`; });
        thead += '</tr>';

        let tbody = '';
        students.forEach((s, idx) => {
            const isExpected = rawList && (Array.isArray(rawList) ? rawList.includes(s.name) : Object.values(rawList).includes(s.name));
            const icon = isExpected
                ? '<i class="fa-solid fa-book-open" style="font-size:10px; color:#059669; margin-right:3px;"></i>'
                : '<i class="fa-solid fa-qrcode" style="font-size:10px; color:#059669; margin-right:3px;"></i>';
            let row = `<td>${startIdx + idx + 1}</td><td class="name-col">${icon}${s.name}</td>`;
            dates.forEach(d => {
                if (isHoliday(d)) { row += '<td class="hol"></td>'; return; }
                const info = findAttendanceRecord(attendanceData[d], s.name, s.phone);
                if (info) {
                    const _auth = (info.authId || '').toString().trim();
                    const _tm = (info.time || '').toString().trim();
                    const _man = !!(info.manual || info.src === 'coord' || (info.by && !_auth));
                    let _sub = '';
                    if (_man) _sub = '<div class="att-auth manual">직접처리</div>';
                    else if (_auth) _sub = `<div class="att-auth">${_auth.replace(/^KAC-?/i, '')}</div>`;
                    else if (_tm) _sub = `<div class="att-auth">${_tm.replace(/[오전오후\s]/g, '')}</div>`;
                    const _ttl = (_man ? '운영부 직접 처리' : ('OTP 인증 출석' + (_auth ? ' · ' + _auth : '') + (_tm ? ' · ' + _tm : ''))).replace(/"/g, '&quot;');
                    row += `<td title="${_ttl}"><div class="att-in"><div class="stamp${_man ? ' stamp-manual' : ''}">출석</div>${_sub}</div></td>`;
                } else if (canMark && d <= todayStr) {
                    const _n = (s.name || '').replace(/"/g, '&quot;');
                    const _p = ('' + (s.phone || '')).replace(/"/g, '&quot;');
                    row += `<td class="att-mark" data-d="${d}" data-n="${_n}" data-p="${_p}" onclick="markCell(this)"><span class="mk-hint" title="클릭하면 출석 처리"><i class="fa-solid fa-hand-pointer"></i></span></td>`;
                } else {
                    row += '<td></td>';
                }
            });
            tbody += `<tr>${row}</tr>`;
        });

        table.innerHTML = `<colgroup>${cols}</colgroup><thead>${thead}</thead><tbody>${tbody}</tbody>`;
        page.appendChild(table);
        return page;
    }

    function findAttendanceRecord(dayData, name, phone) {
        if (!dayData) return null;
        const nm = (name || '').trim();
        const idRaw = (phone || '').toString().replace(/\D/g, '');
        const last4 = idRaw.slice(-4);
        const last5 = idRaw.slice(-5);

        // 1) 정확 키 우선 (이름_식별번호 전체)
        const exactKey = `${nm}_${phone}`;
        if (dayData[exactKey]) return dayData[exactKey];

        // 2) 이름 + 식별번호(전체/뒤5/뒤4) 유연 매칭
        for (const k in dayData) {
            const v = dayData[k] || {};
            const vName = (v.name || (k.split('_')[0] || '')).trim();
            const vRaw = (v.phone != null ? v.phone : (k.split('_').slice(1).join('_') || '')).toString().replace(/\D/g, '');
            const idMatch = !idRaw || !vRaw
                || vRaw === idRaw
                || vRaw.slice(-5) === last5
                || vRaw.slice(-4) === last4;
            if (vName === nm && idMatch) return v;
        }
        return null;
    }














    // 기간 문자열에서 평일 날짜만 추출하는 함수
    function generateDates(period) {
        if (!period || !period.includes('~')) return [];
        const parts = period.split('~');
        let current = new Date(parts[0].trim());
        const end = new Date(parts[1].trim());
        const result = [];
        // [수정] 출결 저장 측과 동일한 '로컬 기준 YYYY-MM-DD'로 생성 (UTC 변환으로 인한 날짜 어긋남 방지)
        const fmt = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;

        // 안전장치: 최대 200일까지 생성 (장기 과정 대응, 무한루프 방지)
        let safety = 0;
        while (current <= end && safety < 200) {
            const day = current.getDay();
            if (day !== 0 && day !== 6) { // 토, 일 제외
                result.push(fmt(current));
            }
            current.setDate(current.getDate() + 1);
            safety++;
        }
        return result;
    }

    function getDayName(dateStr) {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        return days[new Date(dateStr).getDay()];
    }

    // 서명 기능
    function applySign(type) {
        const name = prompt("확인자 성함을 입력하세요:");
        if (!name) return;
        // 모든 주차 페이지의 동일 결재칸을 함께 갱신
        document.querySelectorAll(`.sign-${type}`).forEach(el => el.innerText = name);
    }

    // 실행
    init();
</script>
