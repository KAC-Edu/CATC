<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>항기원 교육생 출석 관리대장</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background: #f1f5f9; }
        .sheet-container { background: white; padding: 40px; width: 210mm; min-height: 297mm; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; }
        .title { text-align: center; font-size: 28px; font-weight: 900; text-decoration: underline; margin-bottom: 30px; }
        
        /* 상단 서명란 */
        .sign-area { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .sign-table { border-collapse: collapse; }
        .sign-table td { border: 1px solid #000; width: 100px; height: 30px; text-align: center; font-size: 12px; font-weight: bold; }
        .sign-box { height: 60px; cursor: pointer; position: relative; vertical-align: middle; }
        .sign-box img { max-height: 50px; mix-blend-mode: multiply; }

/* 메인 테이블 스타일 수정 */
        .main-table { 
            width: 100%;                 /* [수정] A4 가로폭 전체 사용 (쏠림 방지) */
            border-collapse: collapse; 
            font-size: 11px; 
            table-layout: fixed; /* 열 너비를 고정 비율로 균등 배분 */
            word-break: break-all;
        }
        .main-table th, .main-table td { 
            border: 1px solid #000; 
            padding: 4px 2px; 
            text-align: center; 
            overflow: hidden; /* 내용이 넘쳐도 틀이 깨지지 않게 합니다 */
            height: 50px;     /* [고정] 출석 여부/이름 길이와 무관하게 행 높이 고정 */
        }
        .main-table th { background: #f8fafc; height: 40px; }
        
        /* No·성명만 고정폭, 날짜 열은 남은 공간을 균등 분할(3일→3등분, 5일→5등분) */
        .no-col { width: 38px; }
        .name-col { width: 110px; font-weight: bold; }
        /* .day-col 은 폭 미지정 → table-layout:fixed 가 남은 폭을 균등 분배 */

        /* 주차 페이지/라벨 */
        .sheet-container { margin-bottom: 28px; }
        .week-label { display:inline-block; font-size:13px; font-weight:800; color:#1e3a8a; margin:4px 0 12px; padding:3px 12px; border:1px solid #1e3a8a; border-radius:14px; }
        
        /* 도장 스타일 */
        .stamp { color: #dc2626; font-weight: 900; border: 2px solid #dc2626; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; transform: rotate(-10deg); }

        @media print {
            .no-print { display: none; }
            html, body { background: white; padding: 0; margin: 0; }
            /* @page 여백 0 → 브라우저가 자동 삽입하는 머리글/꼬리글(주소·날짜·페이지) 제거 */
            @page { size: A4 portrait; margin: 0; }
            /* 페이지 여백은 컨테이너 패딩으로 직접 부여 (한 주 = 한 페이지, 가운데 정렬) */
            .sheet-container {
                box-sizing: border-box;
                width: 100%;
                min-height: auto;
                box-shadow: none;
                margin: 0;
                border: none;
                padding: 11mm 13mm;
            }
            /* 주차별 페이지 자동 분할 — 다음 주는 새 장에서 이어 출력 */
            .sheet-container { page-break-after: always; }
            .sheet-container:last-child { page-break-after: auto; }
            /* 테이블 헤더 반복 (여러 페이지) */
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            tr { page-break-inside: avoid; }
            /* 결재란이 페이지 넘어가지 않도록 */
            .sign-area { page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>

    <div class="no-print" style="text-align:center; margin-bottom:20px;">
        <button onclick="printSheet()" style="padding:10px 30px; background:#003366; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">출석부 PDF 저장 / 인쇄 (A4)</button>
    </div>

    <!-- 주차별 출석부 페이지가 자동 생성됩니다 -->
    <div id="print-area">
        <div id="sheets-root"></div>
    </div>


<script>
    const params = new URLSearchParams(window.location.search);
    const autoSave = params.get('auto') === '1';   // 교육운영부 'PDF 저장' 확인 후 진입 시 자동 인쇄
    let _autoDone = false;
    let courseInfo = {};
    let dateArray = [];
    let SHEET_ROOM = '';   // [수정] init 외의 함수(renderTable)에서도 방 번호를 참조할 수 있도록 전역 보관
    let HEADER = { courseName:'', period:'', coordName:'', profName:'' }; // [신규] 주차 페이지 공통 헤더 정보

    // 파이어베이스 데이터베이스 참조 (config.js 로드 후 사용 가능)
    const db = firebase.database();




// 실제 PDF 파일 생성·다운로드 (모바일/인앱 브라우저에서도 동작). 미지원 시 인쇄로 폴백.
function printSheet() {
    const base = '(출석부)' + (HEADER.courseName || '');
    const el = document.getElementById('sheets-root') || document.getElementById('print-area') || document.body;
    if (typeof html2pdf === 'undefined' || !el) { document.title = base; window.print(); return; }
    const btn = document.querySelector('button[onclick="printSheet()"]');
    const oldTxt = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = '⏳ PDF 생성 중…'; }
    const tmp = document.createElement('style');
    tmp.innerHTML = '.sheet-container{box-shadow:none !important;margin:0 auto !important;}';
    document.head.appendChild(tmp);
    const done = () => { tmp.remove(); if (btn) { btn.disabled = false; btn.innerHTML = oldTxt; } };
    html2pdf().set({
        margin: 0,
        filename: base + '.pdf',
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'], before: '.sheet-container' }
    }).from(el).save().then(done).catch(() => { done(); document.title = base; window.print(); });
}

async function init() {
    // 1. 주소창에서 방 번호(room)를 정확히 가져옵니다.
    const params = new URLSearchParams(window.location.search);
    const roomFromUrl = params.get('room');
    SHEET_ROOM = roomFromUrl;   // [수정] 전역 보관 (renderTable에서 사용)

    if (!roomFromUrl) {
        document.getElementById('print-area').innerHTML = '<div style="text-align:center; padding:80px 20px; color:#64748b;"><h2>⚠️ 강의실 정보가 없습니다</h2><p>올바른 경로로 접속해 주세요.<br>강사 플랫폼의 [출석부 관리/인쇄] 버튼을 통해 접속해 주세요.</p></div>';
        return;
    }

    // 2. 해당 방의 과정 정보(이름, 기간, 담당자) 및 상태(교수명) 가져오기
    const setSnap = await db.ref(`courses/${roomFromUrl}/settings`).once('value');
    const statSnap = await db.ref(`courses/${roomFromUrl}/status`).once('value');
    
    const courseInfo = setSnap.val() || {};
    const roomStatus = statSnap.val() || {};

    // [수정] 주차별 페이지에서 반복 사용하기 위해 헤더 정보를 전역에 보관
    HEADER.courseName = courseInfo.courseName || roomFromUrl;
    HEADER.period     = courseInfo.period || "-";
    HEADER.coordName  = courseInfo.coordinatorName || "-";
    HEADER.profName   = roomStatus.professorName ? roomStatus.professorName + " 교수" : "-";

    // 3. 전체 평일 날짜 배열 생성 (월~금) — 이후 주 단위로 분할
    dateArray = generateDates(courseInfo.period);

    // 4. [중요] 해당 방의 수강생 명단 및 출석 데이터만 실시간 감시
    db.ref(`courses/${roomFromUrl}/students`).on('value', studentSnap => {
        const studentsRaw = studentSnap.val() || {};

        db.ref(`courses/${roomFromUrl}/internal_attendance`).on('value', attendanceSnap => {
            const attendanceData = attendanceSnap.val() || {};
            // 명단 그리기 함수 호출
            renderTable(studentsRaw, attendanceData);
            // auto=1 진입 시 렌더 완료 후 자동으로 저장(인쇄) 창 띄움 — 1회만
            if (autoSave && !_autoDone) {
                _autoDone = true;
                setTimeout(() => {
                    try { printSheet(); } catch (e) {}
                }, 1000);
            }
        });
    });
}







function renderTable(studentsRaw, attendanceData) {
        const root = document.getElementById('sheets-root');
        if (!root) return;
        root.innerHTML = "";

        const uniqueStudentsMap = new Map();
        Object.values(studentsRaw).forEach(s => {
            if (s.name && s.name !== "undefined") {
                const cleanPhone = (s.phone || "0000").trim();
                const id = `${s.name.trim()}_${cleanPhone}`;
                uniqueStudentsMap.set(id, { name: s.name.trim(), phone: cleanPhone });
            }
        });

        const sortedStudents = Array.from(uniqueStudentsMap.values()).sort((a, b) => a.name.localeCompare(b.name));

        if (sortedStudents.length === 0) {
            root.innerHTML = `<div class="sheet-container"><div class="title">교 육 생 출 석 부</div><div style="padding:50px; color:#999; text-align:center;">현재 입교 완료된 교육생이 없습니다.</div></div>`;
            return;
        }

        // expectedStudents 데이터 로드 (없어도 렌더링 진행)
        db.ref(`courses/${SHEET_ROOM}/expectedStudents`).once('value', expSnap => {
            const rawList = expSnap.val();

            // [신규] 전체 기간을 1주일(월~금) 단위로 분할하여 각각 별도 페이지로 출력
            const weeks = chunkDatesByWeek(dateArray);
            const pages = weeks.length ? weeks : [[]];
            const totalPages = pages.length;

            pages.forEach((weekDates, wIdx) => {
                root.appendChild(buildWeekPage(weekDates, wIdx, totalPages, sortedStudents, attendanceData, rawList));
            });
        });
    }

    // [신규] 평일 날짜 배열을 '주(월요일 기준)' 단위로 묶는다
    function chunkDatesByWeek(dates) {
        const groups = [];
        let curKey = null, cur = null;
        dates.forEach(d => {
            const dt = new Date(d + 'T00:00:00');
            const monday = new Date(dt);
            const dow = (dt.getDay() + 6) % 7; // 월=0 ... 일=6
            monday.setDate(dt.getDate() - dow);
            const key = `${monday.getFullYear()}-${monday.getMonth()}-${monday.getDate()}`;
            if (key !== curKey) { cur = []; groups.push(cur); curKey = key; }
            cur.push(d);
        });
        return groups;
    }

    // [신규] 한 주(週) 분량의 출석부 페이지(헤더+결재란+표)를 생성. 헤더/결재란은 매 페이지 반복.
    function buildWeekPage(weekDates, wIdx, totalPages, students, attendanceData, rawList) {
        const page = document.createElement('div');
        page.className = 'sheet-container';

        const pageInfo = totalPages > 1 ? ` (${wIdx + 1}/${totalPages} 주차)` : '';
        const weekRange = weekDates.length
            ? `${weekDates[0].slice(5).replace('-', '/')} ~ ${weekDates[weekDates.length - 1].slice(5).replace('-', '/')}`
            : '';

        const head = document.createElement('div');
        head.innerHTML = `
            <div class="title">교 육 생 출 석 부${pageInfo}</div>
            <div style="margin-bottom:10px; font-weight:bold;">
                과정명: ${HEADER.courseName}<br>
                기간: ${HEADER.period}
            </div>
            ${weekRange ? `<div class="week-label">${weekRange}</div>` : ''}
            <div class="sign-area">
                <table class="sign-table">
                    <tr><td rowspan="2" style="width:20px; background:#eee;">결<br>재</td><td>과정담당</td><td>담임교수</td></tr>
                    <tr>
                        <td class="sign-box" onclick="applySign('coord')"><div class="sign-coord">${HEADER.coordName}</div></td>
                        <td class="sign-box" onclick="applySign('prof')"><div class="sign-prof">${HEADER.profName}</div></td>
                    </tr>
                </table>
            </div>`;
        page.appendChild(head);

        const table = document.createElement('table');
        table.className = 'main-table';
        // [수정] 표 너비는 CSS의 width:100% 를 사용 → A4 가로폭을 꽉 채우고 날짜 열이 균등 배분됨

        let cols = '<col class="no-col"><col class="name-col">';
        weekDates.forEach(() => { cols += '<col class="day-col">'; });

        let thead = '<tr><th class="no-col">No</th><th class="name-col">성명</th>';
        weekDates.forEach(d => {
            thead += `<th class="day-col">${d.split('-')[1]}/${d.split('-')[2]}<br>${getDayName(d)}</th>`;
        });
        thead += '</tr>';

        let tbody = '';
        students.forEach((s, idx) => {
            const isExpected = rawList && (Array.isArray(rawList)
                ? rawList.includes(s.name)
                : Object.values(rawList).includes(s.name));
            const icon = isExpected
                ? '<i class="fa-solid fa-book-open" title="명단 등록" style="font-size:12px; color:#059669; margin-right:4px;"></i>'
                : '<i class="fa-solid fa-qrcode" title="QR 신규 입교" style="font-size:12px; color:#059669; margin-right:4px;"></i>';
            let row = `<td>${idx + 1}</td><td class="name-col">${icon}${s.name}</td>`;
            weekDates.forEach(d => {
                const info = findAttendanceRecord(attendanceData[d], s.name, s.phone);
                if (info) {
                    // [간소화] 빨간 도장(출석) + 인증번호(Auth ID)만 표시 — 시간 등 부가 텍스트 제거
                    const authId = (info && info.authId) ? info.authId : '';
                    row += `<td><div style="display:flex; flex-direction:column; align-items:center; gap:3px;"><div class="stamp">출석</div><div style="font-size:8px; color:#888; font-weight:normal; line-height:1;">${authId}</div></div></td>`;
                } else {
                    row += `<td></td>`;
                }
            });
            tbody += `<tr>${row}</tr>`;
        });

        table.innerHTML = `<colgroup>${cols}</colgroup><thead>${thead}</thead><tbody>${tbody}</tbody>`;
        page.appendChild(table);
        return page;
    }

    // [수정] 출석 데이터에서 학생 기록을 찾는다 (이름 + 식별번호(사번/전화) 기준, 키 표기 차이 흡수)
    function findAttendanceRecord(dayData, name, phone) {
        if (!dayData) return null;
        const nm = (name || '').trim();
        const idRaw = (phone || '').toString().replace(/\D/g, '');
        const last4 = idRaw.slice(-4);
        const last5 = idRaw.slice(-5);

        // 1) 정확 키 우선 (이름_식별번호 전체)
        const exactKey = `${nm}_${phone}`;
        if (dayData[exactKey]) return dayData[exactKey];

        // 2) 이름 + 식별번호(전체/뒤5/뒤4) 유연 매칭
        for (const k in dayData) {
            const v = dayData[k] || {};
            const vName = (v.name || (k.split('_')[0] || '')).trim();
            const vRaw = (v.phone != null ? v.phone : (k.split('_').slice(1).join('_') || '')).toString().replace(/\D/g, '');
            const idMatch = !idRaw || !vRaw
                || vRaw === idRaw
                || vRaw.slice(-5) === last5
                || vRaw.slice(-4) === last4;
            if (vName === nm && idMatch) return v;
        }
        return null;
    }














    // 기간 문자열에서 평일 날짜만 추출하는 함수
    function generateDates(period) {
        if (!period || !period.includes('~')) return [];
        const parts = period.split('~');
        let current = new Date(parts[0].trim());
        const end = new Date(parts[1].trim());
        const result = [];
        // [수정] 출결 저장 측과 동일한 '로컬 기준 YYYY-MM-DD'로 생성 (UTC 변환으로 인한 날짜 어긋남 방지)
        const fmt = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;

        // 안전장치: 최대 200일까지 생성 (장기 과정 대응, 무한루프 방지)
        let safety = 0;
        while (current <= end && safety < 200) {
            const day = current.getDay();
            if (day !== 0 && day !== 6) { // 토, 일 제외
                result.push(fmt(current));
            }
            current.setDate(current.getDate() + 1);
            safety++;
        }
        return result;
    }

    function getDayName(dateStr) {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        return days[new Date(dateStr).getDay()];
    }

    // 서명 기능
    function applySign(type) {
        const name = prompt("확인자 성함을 입력하세요:");
        if (!name) return;
        // 모든 주차 페이지의 동일 결재칸을 함께 갱신
        document.querySelectorAll(`.sign-${type}`).forEach(el => el.innerText = name);
    }

    // 실행
    init();
</script>
