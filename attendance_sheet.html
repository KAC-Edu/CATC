<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>항기원 교육생 출석 관리대장</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background: #f1f5f9; }
        .sheet-container { box-sizing: border-box; background: white; padding: 11mm 13mm; width: 210mm; min-height: 297mm; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; }
        .title { text-align: center; font-size: 22px; font-weight: 900; text-decoration: underline; margin-bottom: 12px; }
        
        /* 상단 서명란 */
        .sign-area { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .sign-table { border-collapse: collapse; }
        .sign-table td { border: 1px solid #000; width: 100px; height: 30px; text-align: center; font-size: 12px; font-weight: bold; }
        .sign-box { height: 60px; cursor: pointer; position: relative; vertical-align: middle; }
        .sign-box img { max-height: 50px; mix-blend-mode: multiply; }

/* 메인 테이블 스타일 수정 */
        .main-table { width: 100%; border-collapse: collapse; font-size: 10px; table-layout: fixed; word-break: break-all; }
        .main-table th, .main-table td { border: 1px solid #000; padding: 1px 2px; text-align: center; overflow: hidden; height: var(--rh, 24px); }
        .main-table th { background: #f8fafc; height: 30px; font-size:10px; }
        .main-table td.hol { background: #f1f5f9; }
        .main-table th.hol { background: #e2e8f0; color:#64748b; }
        
        /* No·성명만 고정폭, 날짜 열은 남은 공간을 균등 분할(3일→3등분, 5일→5등분) */
        .no-col { width: 28px; }
        .name-col { width: 92px; font-weight: bold; }
        /* .day-col 은 폭 미지정 → table-layout:fixed 가 남은 폭을 균등 분배 */

        /* 주차 페이지/라벨 */
        .sheet-container { margin-bottom: 28px; }
        .week-label { display:inline-block; font-size:13px; font-weight:800; color:#1e3a8a; margin:4px 0 12px; padding:3px 12px; border:1px solid #1e3a8a; border-radius:14px; }
        
        /* 도장 스타일 */
        .stamp { color: #dc2626; font-weight: 900; border: 1.5px solid #dc2626; border-radius: 50%; width: var(--sw,16px); height: var(--sw,16px); display: inline-flex; align-items: center; justify-content: center; font-size: var(--sf,8px); transform: rotate(-10deg); margin:0 auto; }

        @media print {
            .no-print { display: none; }
            html, body { background: white; padding: 0; margin: 0; }
            /* @page 여백 0 → 브라우저가 자동 삽입하는 머리글/꼬리글(주소·날짜·페이지) 제거 */
            @page { size: A4 portrait; margin: 0; }
            /* 페이지 여백은 컨테이너 패딩으로 직접 부여 (한 주 = 한 페이지, 가운데 정렬) */
            .sheet-container {
                box-sizing: border-box;
                width: 100%;
                min-height: auto;
                box-shadow: none;
                margin: 0;
                border: none;
                padding: 11mm 13mm;
            }
            /* 주차별 페이지 자동 분할 — 다음 주는 새 장에서 이어 출력 */
            .sheet-container { page-break-after: always; }
            .sheet-container:last-child { page-break-after: auto; }
            /* 테이블 헤더 반복 (여러 페이지) */
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            tr { page-break-inside: avoid; }
            /* 결재란이 페이지 넘어가지 않도록 */
            .sign-area { page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        /* [운영부 수동 출석 · OTP 인증표기] */
        .att-in{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.5px; line-height:1; }
        .att-auth{ font-size:calc(var(--sf, 8px) - 2px); font-family:'Consolas','Roboto Mono',monospace; color:#059669; font-weight:800; letter-spacing:-.3px; white-space:nowrap; transform:rotate(-10deg); margin-top:1px; }
        .att-auth.manual{ color:#2563eb; }
        .stamp-manual{ color:#2563eb !important; border-color:#2563eb !important; }
        .att-mark{ cursor:pointer; }
        .att-mark:hover{ background:#eff6ff; }
        .att-manual{ cursor:pointer; }
        .att-manual:hover{ background:#fef2f2; }
        @media print{ .att-manual{ cursor:default !important; } }
        .mk-hint{ color:#cbd5e1; opacity:.55; font-size:calc(var(--sf, 8px) + 2px); transition:all .12s; }
        .att-mark:hover .mk-hint{ color:#2563eb; opacity:1; }
        @media print{ .att-mark{ cursor:default !important; } .mk-hint{ display:none !important; } }
    </style>
</head>
<body>

    <div class="no-print" style="text-align:center; margin-bottom:20px;">
        <button onclick="printSheet()" style="padding:10px 30px; background:#003366; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">출석부 PDF 저장 / 인쇄 (A4)</button>
    </div>
    <div id="markHint" class="no-print" style="display:none; max-width:780px; margin:0 auto 18px; padding:11px 16px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; color:#1e40af; font-size:13.5px; font-weight:800; text-align:center; line-height:1.5;"><i class="fa-solid fa-hand-pointer"></i> 아직 출석 처리되지 않은 칸(<i class="fa-solid fa-hand-pointer" style="color:#94a3b8;"></i> 표시)을 클릭하면 <b>운영부 직접 출석 처리</b>됩니다. OTP 출석에는 인증번호가 표기되고, 직접 처리한 칸에는 <b>‘직접처리’</b>가 함께 남습니다. <span style="color:#64748b;font-weight:700;">(클릭 아이콘은 인쇄·PDF에 표시되지 않음)</span></div>

    <!-- 주차별 출석부 페이지가 자동 생성됩니다 -->
    <div id="print-area">
        <div id="sheets-root"></div>
    </div>


<script>
    const params = new URLSearchParams(window.location.search);
    const autoSave = params.get('auto') === '1';   // 교육운영부 'PDF 저장' 확인 후 진입 시 자동 인쇄
    let _autoDone = false;
    let courseInfo = {};
    let dateArray = [];
    let SHEET_ROOM = '';   // [수정] init 외의 함수(renderTable)에서도 방 번호를 참조할 수 있도록 전역 보관
    let _canMark = false, _todayStr = '';   // [운영부 수동출석] 모듈 스코프 — buildPage(셀 렌더)에서 참조
    let HEADER = { courseName:'', period:'', coordName:'', profName:'' }; // [신규] 주차 페이지 공통 헤더 정보

    // 파이어베이스 데이터베이스 참조 (config.js 로드 후 사용 가능)
    const db = firebase.database();




// 실제 PDF 파일 생성·다운로드 (모바일/인앱 브라우저에서도 동작). 미지원 시 인쇄로 폴백.
function printSheet() {
    const base = (HEADER.courseName || '') + ' 출석부 대장';
    const el = document.getElementById('sheets-root') || document.getElementById('print-area') || document.body;
    if (typeof html2pdf === 'undefined' || !el) { document.title = base; window.print(); return; }
    const btn = document.querySelector('button[onclick="printSheet()"]');
    const oldTxt = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = '⏳ PDF 생성 중…'; }
    const tmp = document.createElement('style');
    /* [M17 · 정렬 깨짐 수정] 예전엔 #sheets-root 만 210mm 로 고정했는데,
       html2canvas 는 windowWidth(794px = A4 폭) 기준으로 '문서 전체(body)'를 캡처한다.
       body 는 padding 20px + 기본 폭 때문에 1247px 로 남아 있었고,
       1247px 짜리 문서를 794px 창에 맞춰 캡처하니 왼쪽 453px(No·성명·첫 날짜 열)이
       종이 밖으로 밀려 잘려 나갔다. → body/html 폭과 padding 까지 A4 로 함께 고정한다. */
    /* [빈 페이지 방지] 화면용 .sheet-container 에는 margin-bottom:28px 이 붙어 있고
       min-height:297mm 도 걸려 있다. PDF 로 뜰 때 이 여백이 A4 한 장을 살짝 넘기면서
       넘친 여백만큼이 '빈 장'으로 하나 더 만들어졌다.
       → 저장할 때는 컨테이너 높이를 A4(297mm)에 정확히 못박고 바깥 여백을 0 으로 만든다. */
    tmp.innerHTML =
        'html,body{width:210mm !important;min-width:210mm !important;max-width:210mm !important;'
      + 'margin:0 !important;padding:0 !important;background:#fff !important;overflow-x:hidden !important;}'
      + '#sheets-root,#print-area{width:210mm !important;min-width:210mm !important;max-width:210mm !important;margin:0 auto !important;padding:0 !important;}'
      + '.sheet-container{box-sizing:border-box !important;width:210mm !important;'
      + 'height:297mm !important;min-height:297mm !important;max-height:297mm !important;'   /* A4 한 장에 정확히 */
      + 'margin:0 !important;padding:11mm 13mm !important;'                                   /* 아래 여백 28px 제거 */
      + 'box-shadow:none !important;border:none !important;overflow:hidden !important;}'
      + '.no-print{display:none !important;}'
      + '.mk-hint{display:none !important;}.att-mark{cursor:default !important;}';
    document.head.appendChild(tmp);
    const done = () => { tmp.remove(); if (btn) { btn.disabled = false; btn.innerHTML = oldTxt; } };

    /* [M18 · 빈 페이지 완전 차단] html2pdf 의 '자동 페이지 나누기'에 계속 끌려다녔다.
       그 방식은 문서 전체를 이미지 한 장으로 뜬 뒤 A4 높이로 잘라 붙이는데,
       1px 이라도 넘치면 그 잔여분이 '빈 장'으로 하나 더 붙는다.
       → 자동 나누기를 아예 쓰지 않는다. 우리는 이미 한 장(.sheet-container)이
         정확히 A4 한 장이라는 걸 알고 있으므로, 장마다 따로 캡처해서 PDF 페이지에
         1:1 로 붙인다. 빈 장이 생길 여지 자체가 없다.                                  */
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');

    (async () => {
        try {
            const pages = el.querySelectorAll('.sheet-container');
            if (!pages.length || typeof html2canvas === 'undefined') throw new Error('fallback');

            const { jsPDF } = (window.jspdf || window);      // html2pdf 번들에 포함되어 있음
            const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

            /* [M18 · 화질 개선]
                 · scale 2 → 3  : 캡처 해상도를 1.5배로 (96dpi × 3 ≈ 288dpi — 인쇄에 충분)
                 · JPEG → PNG   : JPEG 압축은 가는 표 선과 작은 글씨를 뭉갠다. PNG 는 무손실.
                 · compression:'FAST' : 용량이 커지므로 PDF 단에서 무손실 압축으로 줄인다.        */
            for (let i = 0; i < pages.length; i++) {
                const canvas = await html2canvas(pages[i], {
                    scale: 3, useCORS: true, backgroundColor: '#ffffff',
                    windowWidth: 794,          // A4 폭(210mm)
                    width: 794, height: 1123,  // A4 한 장 = 794 x 1123px
                    x: 0, y: 0, scrollX: 0, scrollY: 0
                });
                const img = canvas.toDataURL('image/png');       // 무손실 — 표 선·글씨 선명
                if (i > 0) pdf.addPage();                        // 페이지 수만큼만 추가 (빈 장 없음)
                pdf.addImage(img, 'PNG', 0, 0, 210, 297, undefined, 'FAST');   // A4 한 장에 정확히
            }

            const blob = pdf.output('blob');
            const fname = base + '.pdf';

            // 모바일: OS 공유시트(카톡·메일 등) → 실패하면 다운로드
            if (isMobile && navigator.canShare) {
                const file = new File([blob], fname, { type: 'application/pdf' });
                if (navigator.canShare({ files: [file] })) {
                    try { await navigator.share({ files: [file], title: base }); done(); return; }
                    catch (se) { if (se && se.name === 'AbortError') { done(); return; } }
                }
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = fname;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
            done();
        } catch (e) {
            // 어떤 이유로든 실패하면 브라우저 인쇄로 폴백 (기존 동작 유지)
            done(); document.title = base; window.print();
        }
    })();
}

// [운영부 수동 출석] 아직 처리 안 된 칸 클릭 → 해당 날짜 출석 처리(OTP 미체크 보완). 라이브 방·보관(archive) 모두 지원.
function markCell(td){
  try{
    if(autoSave) return;
    var d=td.getAttribute('data-d'), nm=td.getAttribute('data-n'), ph=td.getAttribute('data-p')||'';
    if(!d||!nm) return;
    var key=(nm+'_'+ph).replace(/[.#$\[\]\/]/g,'_');
    var path;
    if(window._archiveMode && window._archiveId){ path='system/course_archive/'+window._archiveId+'/internal_attendance/'+d+'/'+key; }
    else if(SHEET_ROOM){ path='courses/'+SHEET_ROOM+'/internal_attendance/'+d+'/'+key; }
    else return;
    if(!confirm('['+nm+'] '+d+'\n이 교육생을 출석으로 처리할까요?\n\n※ 운영부 직접 처리(OTP 미체크 보완)로 기록됩니다.')) return;
    firebase.database().ref(path)
      .set({ name:nm, phone:ph, manual:true, src:'coord', ts:Date.now() })
      .then(function(){
        // 클릭한 칸을 즉시 '출석 + 직접처리(다시 클릭 시 취소)'로 갱신(보관 모드는 실시간 리스너가 없으므로 필수)
        try{ td.className='att-manual'; td.title='클릭하면 직접처리 취소'; td.setAttribute('onclick','unmarkCell(this)'); td.innerHTML='<div class="att-in"><div class="stamp stamp-manual">출석</div><div class="att-auth manual">직접처리</div></div>'; }catch(_){}
      })
      .catch(function(e){ alert('출석 처리 실패: '+((e&&e.message)||'')); });
  }catch(e){ alert('오류: '+((e&&e.message)||'')); }
}
window.markCell=markCell;

// [운영부 수동 출석 취소] 직접 처리한 칸을 다시 클릭 → 확인 후 취소(삭제). OTP 인증 출석은 보호(취소 불가).
function unmarkCell(td){
  try{
    if(autoSave) return;
    var d=td.getAttribute('data-d'), nm=td.getAttribute('data-n'), ph=td.getAttribute('data-p')||'';
    if(!d||!nm) return;
    var key=(nm+'_'+ph).replace(/[.#$\[\]\/]/g,'_');
    var path;
    if(window._archiveMode && window._archiveId){ path='system/course_archive/'+window._archiveId+'/internal_attendance/'+d+'/'+key; }
    else if(SHEET_ROOM){ path='courses/'+SHEET_ROOM+'/internal_attendance/'+d+'/'+key; }
    else return;
    if(!confirm('['+nm+'] '+d+'\n직접 처리한 출석을 취소하시겠습니까?')) return;
    var ref=firebase.database().ref(path);
    ref.once('value').then(function(snap){
      var rec=snap.val()||{};
      if(rec.authId && !rec.manual && rec.src!=='coord'){ alert('OTP 인증 출석은 취소할 수 없습니다.'); throw 'otp'; }
      return ref.remove();
    }).then(function(){
      // 클릭한 칸을 즉시 빈 칸(다시 처리 가능)으로 갱신
      try{ td.className='att-mark'; td.title=''; td.setAttribute('onclick','markCell(this)'); td.innerHTML='<span class="mk-hint" title="클릭하면 출석 처리"><i class="fa-solid fa-hand-pointer"></i></span>'; }catch(_){}
    }).catch(function(e){ if(e!=='otp') alert('취소 실패: '+((e&&e.message)||'')); });
  }catch(e){ alert('오류: '+((e&&e.message)||'')); }
}
window.unmarkCell=unmarkCell;

async function init() {
    // 1. 주소창에서 방 번호(room)를 정확히 가져옵니다.
    const params = new URLSearchParams(window.location.search);
    const _archiveId = params.get('archive');
    if (_archiveId) {
        const arSnap = await db.ref('system/course_archive/' + _archiveId).once('value');
        const ar = arSnap.val() || {};
        SHEET_ROOM = null; window._archiveMode = true; window._archiveId = _archiveId; window._archiveExpected = ar.expectedStudents || null;
        HEADER.courseName = ar.courseName || '지난 과정'; HEADER.period = ar.period || '-'; HEADER.coordName = ar.coord || '-'; HEADER.profName = ar.prof ? ar.prof + ' 교수' : '-';
        dateArray = generateDates(ar.period || '');
        renderTable(ar.students || {}, ar.internal_attendance || {});
        if (autoSave && !_autoDone) { _autoDone = true; setTimeout(() => { try { printSheet(); } catch (e) {} }, 1000); }
        return;
    }
    const roomFromUrl = params.get('room');
    SHEET_ROOM = roomFromUrl;   // [수정] 전역 보관 (renderTable에서 사용)

    if (!roomFromUrl) {
        document.getElementById('print-area').innerHTML = '<div style="text-align:center; padding:80px 20px; color:#64748b;"><h2>⚠️ 강의실 정보가 없습니다</h2><p>올바른 경로로 접속해 주세요.<br>강사 플랫폼의 [출석부 관리/인쇄] 버튼을 통해 접속해 주세요.</p></div>';
        return;
    }

    // 2. 해당 방의 과정 정보(이름, 기간, 담당자) 및 상태(교수명) 가져오기
    const setSnap = await db.ref(`courses/${roomFromUrl}/settings`).once('value');
    const statSnap = await db.ref(`courses/${roomFromUrl}/status`).once('value');
    
    const courseInfo = setSnap.val() || {};
    const roomStatus = statSnap.val() || {};

    // [수정] 주차별 페이지에서 반복 사용하기 위해 헤더 정보를 전역에 보관
    HEADER.courseName = courseInfo.courseName || roomFromUrl;
    HEADER.period     = courseInfo.period || "-";
    HEADER.coordName  = courseInfo.coordinatorName || "-";
    HEADER.profName   = roomStatus.professorName ? roomStatus.professorName + " 교수" : "-";

    // 3. 전체 평일 날짜 배열 생성 (월~금) — 이후 주 단위로 분할
    dateArray = generateDates(courseInfo.period);

    /* 4. [M17 · 화면 떨림 수정] 해당 방의 수강생 명단 + 출석 데이터 실시간 감시
       예전엔 students 리스너 '안에서' internal_attendance 리스너를 또 등록했다.
       그래서 students 가 갱신될 때마다 리스너가 하나씩 계속 쌓였고,
       쌓인 리스너들이 저마다 renderTable() 을 불러 root.innerHTML='' 로 표를 통째로
       지웠다 다시 그리는 바람에 화면이 주기적으로 깜빡였다(= 떨리는 느낌).
       → 두 리스너를 나란히(중첩 아님) 한 번씩만 등록하고,

    function findAttendanceRecord(dayData, name, phone) {
        if (!dayData) return null;
        const nm = (name || '').trim();
        const idRaw = (phone || '').toString().replace(/\D/g, '');
        const last4 = idRaw.slice(-4);
        const last5 = idRaw.slice(-5);

        // 1) 정확 키 우선 (이름_식별번호 전체)
        const exactKey = `${nm}_${phone}`;
        if (dayData[exactKey]) return dayData[exactKey];

        // 2) 이름 + 식별번호(전체/뒤5/뒤4) 유연 매칭
        for (const k in dayData) {
            const v = dayData[k] || {};
            const vName = (v.name || (k.split('_')[0] || '')).trim();
            const vRaw = (v.phone != null ? v.phone : (k.split('_').slice(1).join('_') || '')).toString().replace(/\D/g, '');
            const idMatch = !idRaw || !vRaw
                || vRaw === idRaw
                || vRaw.slice(-5) === last5
                || vRaw.slice(-4) === last4;
            if (vName === nm && idMatch) return v;
        }
        return null;
    }

    function generateDates(period) {
        if (!period || !period.includes('~')) return [];
        const parts = period.split('~');
        let current = new Date(parts[0].trim());
        const end = new Date(parts[1].trim());
        const result = [];
        // [수정] 출결 저장 측과 동일한 '로컬 기준 YYYY-MM-DD'로 생성 (UTC 변환으로 인한 날짜 어긋남 방지)
        const fmt = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;

        // 안전장치: 최대 200일까지 생성 (장기 과정 대응, 무한루프 방지)
        let safety = 0;
        while (current <= end && safety < 200) {
            const day = current.getDay();
            if (day !== 0 && day !== 6) { // 토, 일 제외
                result.push(fmt(current));
            }
            current.setDate(current.getDate() + 1);
            safety++;
        }
        return result;
    }

    function getDayName(dateStr) {
        const days = ['일', '월', '화', '수', '목', '금', '토'];

    }
