<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>항기원 교육생 출석 관리대장</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background: #f1f5f9; }
        .sheet-container { background: white; padding: 40px; width: 210mm; min-height: 297mm; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; }
        .title { text-align: center; font-size: 28px; font-weight: 900; text-decoration: underline; margin-bottom: 30px; }
        
        /* 상단 서명란 */
        .sign-area { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .sign-table { border-collapse: collapse; }
        .sign-table td { border: 1px solid #000; width: 100px; height: 30px; text-align: center; font-size: 12px; font-weight: bold; }
        .sign-box { height: 60px; cursor: pointer; position: relative; vertical-align: middle; }
        .sign-box img { max-height: 50px; mix-blend-mode: multiply; }

/* 메인 테이블 스타일 수정 */
        .main-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 11px; 
            table-layout: fixed; /* 모든 열 너비를 고정합니다 */
            word-break: break-all;
        }
        .main-table th, .main-table td { 
            border: 1px solid #000; 
            padding: 8px 2px; 
            text-align: center; 
            overflow: hidden; /* 내용이 넘쳐도 틀이 깨지지 않게 합니다 */
        }
        .main-table th { background: #f8fafc; height: 35px; }
        
        /* 열별 너비 지정 */
        .no-col { width: 35px; }   /* 번호 칸 */
        .name-col { width: 75px; font-weight: bold; } /* 성명 칸 */
        /* 나머지 날짜 칸들은 남은 공간을 똑같이 나눠 갖습니다 */
        
        /* 도장 스타일 */
        .stamp { color: #dc2626; font-weight: 900; border: 2px solid #dc2626; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; transform: rotate(-10deg); }

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; margin: 0; }
            .sheet-container { box-shadow: none; margin: 0; border: none; padding: 10mm 15mm; }
            /* A4 페이지 설정 */
            @page { size: A4 portrait; margin: 10mm 15mm; }
            /* 테이블 헤더 반복 (여러 페이지) */
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            tr { page-break-inside: avoid; }
            /* 결재란이 페이지 넘어가지 않도록 */
            .sign-area { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="no-print" style="text-align:center; margin-bottom:20px;">
        <button onclick="window.print()" style="padding:10px 30px; background:#003366; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">출석부 인쇄하기 (A4)</button>
    </div>

    <div class="sheet-container" id="print-area">
        <div class="title">교 육 생 출 석 부</div>
        
        <div style="margin-bottom:10px; font-weight:bold;">
            과정명: <span id="courseName">-</span><br>
            기간: <span id="coursePeriod">-</span>
        </div>

        <div class="sign-area">
            <table class="sign-table">
                <tr><td rowspan="2" style="width:20px; background:#eee;">결<br>재</td><td>과정담당</td><td>담임교수</td></tr>
                <tr>
                    <td class="sign-box" onclick="applySign('coord')"><div id="sign-coord">-</div></td>
                    <td class="sign-box" onclick="applySign('prof')"><div id="sign-prof">-</div></td>
                </tr>
            </table>
        </div>

        <table class="main-table">
            <thead>
                <tr id="date-header">
                    <th>No</th>
                    <th>성명</th>
                    <!-- 날짜 칸이 자동으로 생성됩니다 -->
                </tr>
            </thead>
            <tbody id="attendance-body">
                <!-- 수강생 목록이 자동으로 생성됩니다 -->
            </tbody>
        </table>
    </div>


<script>
    const params = new URLSearchParams(window.location.search);
    let courseInfo = {};
    let dateArray = [];

    // 파이어베이스 데이터베이스 참조 (config.js 로드 후 사용 가능)
    const db = firebase.database();




async function init() {
    // 1. 주소창에서 방 번호(room)를 정확히 가져옵니다.
    const params = new URLSearchParams(window.location.search);
    const roomFromUrl = params.get('room');

    if (!roomFromUrl) {
        document.getElementById('print-area').innerHTML = '<div style="text-align:center; padding:80px 20px; color:#64748b;"><h2>⚠️ 강의실 정보가 없습니다</h2><p>올바른 경로로 접속해 주세요.<br>강사 플랫폼의 [출석부 관리/인쇄] 버튼을 통해 접속해 주세요.</p></div>';
        return;
    }

    // 2. 해당 방의 과정 정보(이름, 기간, 담당자) 및 상태(교수명) 가져오기
    const setSnap = await db.ref(`courses/${roomFromUrl}/settings`).once('value');
    const statSnap = await db.ref(`courses/${roomFromUrl}/status`).once('value');
    
    const courseInfo = setSnap.val() || {};
    const roomStatus = statSnap.val() || {};

    // [화면 연동] 상단 정보 표시
    document.getElementById('courseName').innerText = courseInfo.courseName || roomFromUrl;
    document.getElementById('coursePeriod').innerText = courseInfo.period || "-";

    // [화면 연동] 결재란 담당자/교수 자동 입력
    document.getElementById('sign-coord').innerText = courseInfo.coordinatorName || "-";
    document.getElementById('sign-prof').innerText = roomStatus.professorName ? roomStatus.professorName + " 교수" : "-";

    // 3. 날짜 헤더 생성 (월~금)
    dateArray = generateDates(courseInfo.period);
    const header = document.getElementById('date-header');
    header.innerHTML = '<th class="no-col">No</th><th class="name-col">성명</th>';
    
    dateArray.forEach(d => {
        const th = document.createElement('th');
        th.innerHTML = d.split('-')[1] + '/' + d.split('-')[2] + '<br>' + getDayName(d);
        header.appendChild(th);
    });

    // 4. [중요] 해당 방의 수강생 명단 및 출석 데이터만 실시간 감시
    db.ref(`courses/${roomFromUrl}/students`).on('value', studentSnap => {
        const studentsRaw = studentSnap.val() || {};

        db.ref(`courses/${roomFromUrl}/internal_attendance`).on('value', attendanceSnap => {
            const attendanceData = attendanceSnap.val() || {};
            // 명단 그리기 함수 호출
            renderTable(studentsRaw, attendanceData);
        });
    });
}







function renderTable(studentsRaw, attendanceData) {
        const tbody = document.getElementById('attendance-body');
        tbody.innerHTML = ""; 

        const uniqueStudentsMap = new Map();
        Object.values(studentsRaw).forEach(s => {
            if (s.name && s.name !== "undefined") {
                const cleanPhone = (s.phone || "0000").trim();
                const id = `${s.name.trim()}_${cleanPhone}`;
                uniqueStudentsMap.set(id, { name: s.name.trim(), phone: cleanPhone });
            }
        });

        const sortedStudents = Array.from(uniqueStudentsMap.values()).sort((a, b) => a.name.localeCompare(b.name));

        if (sortedStudents.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${dateArray.length + 2}" style="padding:50px; color:#999;">현재 입교 완료된 교육생이 없습니다.</td></tr>`;
            return;
        }

        // expectedStudents 데이터 로드 (명단 업로드 여부 확인용)
        db.ref(`courses/${roomFromUrl}/expectedStudents`).once('value', expSnap => {
            const expectedList = expSnap.val() || [];
        
        sortedStudents.forEach((s, idx) => {
            const tr = document.createElement('tr');
            const isExpected = Array.isArray(expectedList) 
                ? expectedList.includes(s.name)
                : Object.values(expectedList).includes(s.name);
            // 명단 업로드: 공책 아이콘, QR 신규: QR 아이콘
            const icon = isExpected
                ? '<span style="font-size:13px; margin-right:3px;" title="명단 등록">📋</span>'
                : '<span style="font-size:13px; margin-right:3px;" title="QR 신규 입교">📱</span>';
            tr.innerHTML = `<td>${idx + 1}</td><td class="name-col">${icon}${s.name}</td>`;

            dateArray.forEach(d => {
                const td = document.createElement('td');
                const attendKey = `${s.name}_${s.phone}`;

                if (attendanceData[d] && attendanceData[d][attendKey]) {
                    const info = attendanceData[d][attendKey];
                    const displayTime = (typeof info === 'object') ? info.time : "";
                    
                    // [인증 ID 생성] 데이터베이스에 authId가 있으면 쓰고, 없으면 토큰 앞자리를 가져옵니다.
                    const authId = info.authId || "CERT-" + Math.random().toString(36).substr(2, 4).toUpperCase();

                    td.innerHTML = `
                        <div style="display:flex; flex-direction:column; align-items:center; gap:1px;">
                            <div class="stamp">출석</div>
                            <div style="font-size:8px; color:#999; font-weight:normal; line-height:1;">${displayTime}</div>
                            <div style="font-size:7px; color:#ccc; font-weight:normal; line-height:1;">${authId}</div>
                        </div>
                    `;
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }); // sortedStudents.forEach 끝
        }); // expectedStudents once 끝
    }














    // 기간 문자열에서 평일 날짜만 추출하는 함수
    function generateDates(period) {
        if (!period || !period.includes('~')) return [];
        const parts = period.split('~');
        let current = new Date(parts[0].trim());
        const end = new Date(parts[1].trim());
        const result = [];
        
        // 안전장치: 최대 30일까지만 생성 (무한루프 방지)
        let safety = 0;
        while (current <= end && safety < 30) {
            const day = current.getDay();
            if (day !== 0 && day !== 6) { // 토, 일 제외
                result.push(current.toISOString().split('T')[0]);
            }
            current.setDate(current.getDate() + 1);
            safety++;
        }
        return result;
    }

    function getDayName(dateStr) {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        return days[new Date(dateStr).getDay()];
    }

    // 서명 기능
    function applySign(type) {
        const name = prompt("확인자 성함을 입력하세요:");
        if (!name) return;
        document.getElementById(`sign-${type}`).innerText = name;
    }

    // 실행
    init();
</script>







</body>
</html>
