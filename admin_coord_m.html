  <meta charset="UTF-8" />
  <script>
  /* [기기 분리] PC 접속은 PC 전용 화면으로 (모바일은 이 화면 유지) */
  (function(){ try{
    var wide = window.innerWidth >= 1024;
    var fine = window.matchMedia && window.matchMedia('(pointer:fine)').matches;
    var noTouch = !('ontouchstart' in window) || navigator.maxTouchPoints === 0;
    var isPc = wide && (fine || noTouch);
    if(isPc && location.search.indexOf('forcem')<0){ location.replace('admin_coord.html'+location.search+location.hash); }
  }catch(e){} })();
  </script>
<!-- ════════ [외부 변경 · 카카오채널 연동 · 2026-06-25] catc1234 접속 게이트 · 수정상태: 수정안하는중 ════════
     · admin_coord.html(교육운영부)의 모바일판. 포털 경유 폐지 → 직접진입 시 접속코드 요구.
     · 통과 시 localStorage['catc_gate_ok']='1' 저장. catcLock()으로 잠금 해제. 기능 로직 미변경. -->
<script>
(function(){
  window.catcLock=function(){ try{localStorage.removeItem('catc_gate_ok');}catch(e){} location.reload(); };
  var ok=false; try{ ok=(function(){var t=parseInt(localStorage.getItem('catc_gate_ok'),10);return !!t&&(Date.now()-t)<2592000000;})(); }catch(e){ ok=true; }
  if(ok){ window.__catcUnlocked=true; return; }
  window.__catcUnlocked=false;
  document.documentElement.classList.add('catc-locked');
  function build(){
    if(document.getElementById('catcGate')) return;
    var o=document.createElement('div'); o.id='catcGate';
    o.innerHTML='<div class="catc-box"><div class="catc-ic">🔒</div>'
      +'<div class="catc-t">접속 코드 입력</div>'
      +'<div class="catc-s">CATC 교육 플랫폼 · 보안 접속</div>'
      +'<input id="catcInp" type="password" autocomplete="off" placeholder="접속 코드">'
      +'<button id="catcBtn">입장</button><div id="catcMsg"></div></div>';
    (document.body||document.documentElement).appendChild(o);
    var inp=o.querySelector('#catcInp'),btn=o.querySelector('#catcBtn'),msg=o.querySelector('#catcMsg');
    function go(){ if(inp.value==='catc1234'){ try{localStorage.setItem('catc_gate_ok',String(Date.now()));}catch(e){} location.reload(); } else { msg.textContent='접속 코드가 올바르지 않습니다.'; inp.value=''; inp.focus(); } }
    btn.addEventListener('click',go);
    inp.addEventListener('keyup',function(e){ if(e.key==='Enter') go(); });
    setTimeout(function(){ try{inp.focus();}catch(e){} },120);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded',build);
})();
</script>

    .otalk-open-btn{ width:100%; padding:15px; border:none; border-radius:16px; background:linear-gradient(135deg,#3a1d1d,#111); color:#fae100; font-size:15px; font-weight:900; display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.18); }
    .otalk-open-btn:active{ transform:scale(.98); }
    .otalk-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 15px; border:1px solid #eceff4; border-radius:14px; margin-bottom:9px; text-decoration:none; background:#fffdf5; }
    .otalk-item:active{ transform:scale(.99); }
    .otalk-item .oi-name{ font-size:15.5px; font-weight:900; color:#0f172a; display:flex; align-items:center; gap:9px; }
    .otalk-item .oi-go{ font-size:13px; font-weight:900; color:#3a1d1d; background:#fae100; padding:7px 13px; border-radius:999px; white-space:nowrap; }
    .otalk-item.off{ background:#f8fafc; border-style:dashed; }

  </style>
</head>

<script src="config.js?v=b260620c"></script>
<script>
/* ========== 교육운영부 모바일 (경량) ========== */
var db = firebase.database();
var DATA = {};          // courses 전체
var EDU = {};           // system/eduLocations
var CUSTOM_ROOMS = {};  // system/classrooms (건물별)
var curRID = '';
var eduType = '';

function esc(t){ return (''+(t==null?'':t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shortRoom(v){ v=(''+(v||'')).trim(); if(!v) return '미정'; var p=v.split(' '); return p.length>1?p[p.length-1]:v; }
var COORD_MAP={};
var RANK_RE=/\s*(차장|부장|팀장|실장|원장|과장|대리|주임|사원|교수)\s*$/;
function coordFull(nm){ nm=(''+(nm==null?'':nm)).trim(); if(!nm) return ''; if(RANK_RE.test(nm)) return nm; return COORD_MAP[nm]||nm; }

/* 시계 */
function tickClock(){
  var d=new Date();
  var days=['일','월','화','수','목','금','토'];
  var h=d.getHours(), ap=h<12?'AM':'PM', hh=((h%12)||12);
  var el=document.getElementById('clk');
  if(el) el.innerHTML=(d.getMonth()+1)+'.'+d.getDate()+'('+days[d.getDay()]+') <b>'+hh+':'+String(d.getMinutes()).padStart(2,'0')+'</b> '+ap;
}
setInterval(tickClock,1000); tickClock();

/* 운영일(09시 KST) 윈도우 — 09:00 KST == 00:00 UTC */
function opWindow(){ var dayMs=86400000; var start=Math.floor(Date.now()/dayMs)*dayMs; return [start, start+dayMs]; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* 활성 과정 목록 */
function activeRooms(){
  var out=[], today=todayStr();
  for(var i=65;i<=90;i++){
    var rid=String.fromCharCode(i), room=DATA[rid];
    if(!room) continue;
    var ss=room.settings||{}, st=room.status||{};
    if(st.roomStatus!=='active') continue;
    if(ss.hideFromBoard) continue;
    if(ss.period && ss.period.indexOf(' ~ ')>=0){ var end=(ss.period.split(' ~ ')[1]||'').trim(); if(end && end<today) continue; }
    out.push({rid:rid, s:ss, st:st, room:room});
  }
  return out;
}
function studentsOf(room){ return room && room.students ? Object.keys(room.students).map(function(k){return room.students[k];}).filter(function(x){return x&&x.name&&(''+x.name).trim()&&x.name!=='undefined';}) : []; }
function leaderOf(room){
  var L=studentsOf(room).filter(function(s){return s&&s.isLeader===true;})[0];
  if(!L) return null;
  return { name:L.name||'-', no:(L.empNo||L.sabun||L.id||L.studentId||L.phone||'') };
}
function shuttleCount(room){
  var rq=(room.shuttle&&room.shuttle.requests)||{};
  var e=Object.keys(rq).map(function(k){return rq[k];}).filter(function(r){return r&&r.type;});
  return { total:e.length,
    osong:e.filter(function(r){return r.type==='osong';}).length,
    terminal:e.filter(function(r){return r.type==='terminal';}).length,
    airport:e.filter(function(r){return r.type==='airport';}).length,
    car:e.filter(function(r){return r.type==='car';}).length };
}
function outingsToday(room){
  var w=opWindow(), s=w[0], en=w[1], list=[];
  var aa=room.admin_actions||{};
  Object.keys(aa).forEach(function(date){
    var day=aa[date]||{};
    Object.keys(day).forEach(function(tok){
      var it=day[tok];
      if(it && (it.type==='outing'||it.type==='overnight'||it.type==='group_outing')){
        var ts=it.timestamp||0;
        if(ts>=s && ts<en) list.push(it);
      }
    });
  });
  list.sort(function(a,b){return (a.timestamp||0)-(b.timestamp||0);});
  return list;
}

/* 과정 목록 렌더 */
function renderList(){
  var rooms=activeRooms(), el=document.getElementById('courseList');
  if(!el) return;
  if(!rooms.length){ el.innerHTML='<div class="empty">운영 중인 과정이 없습니다.</div>'; return; }
  el.innerHTML=rooms.map(function(r){
    var L=leaderOf(r.room);
    var prof=((r.st.professorName||'').trim())?(r.st.professorName.trim()+' 교수'):'담임 미지정';
    var coord=coordFull(r.s.coordinatorName)||'담당 미지정';
    var ldHtml=L?('<span class="ld on"><i class="fa-solid fa-crown"></i> '+esc(L.name)+'</span>'):'<span class="ld off"><i class="fa-solid fa-crown"></i> 교육생장 미지정</span>';
    return '<div class="crd" onclick="openDetail(\''+r.rid+'\')">'
      +'<div class="c1"><span class="room-badge">ROOM <b>#'+r.rid+'</b></span><span class="cname">'+esc(r.s.courseName||'-')+'</span><i class="fa-solid fa-chevron-right cchev"></i></div>'
      +'<div class="c2"><span class="pill">'+esc(prof)+'</span><span class="pill">'+esc(coord)+'</span>'+ldHtml+'</div>'
      +'</div>';
  }).join('');
}

/* 청렴/노조 카드 렌더 */
function renderEdu(){
  applyEduCard('eduIntegrity','eduIntegrityVal','eduIntegritySel', EDU.integrity);
  applyEduCard('eduUnion','eduUnionVal','eduUnionSel', EDU.union);
}
function applyEduCard(cardId, valId, selId, val){
  var card=document.getElementById(cardId), v=document.getElementById(valId), sel=document.getElementById(selId);
  var set=!!(val&&(''+val).trim());
  if(v) v.textContent=set?shortRoom(val):'미정';
  if(card){ card.classList.toggle('set',set); card.classList.toggle('unset',!set); }
  if(sel && sel.value!==(val||'')) sel.value=(val||'');
}

/* 상세 열기/닫기 */
function openDetail(rid){
  curRID=rid;
  document.getElementById('detailOv').classList.add('open');
  document.body.style.overflow='hidden';
  var room=DATA[rid]||{};
  document.getElementById('dNotice').value=room.coordNotice||'';
  // 공지발송 카드는 평시 접힘(화면에 딱 맞게) — 가로바 탭하면 펼침
  var nb=document.getElementById('dNoticeBody'), nc=document.getElementById('dNoticeChev');
  if(nb) nb.style.display='none'; if(nc) nc.style.transform='';
  document.querySelector('#detailOv .ov-body') && (document.querySelector('#detailOv .ov-body').scrollTop=0);
  updateDetail();
}
function toggleNoticeCard(){
  var b=document.getElementById('dNoticeBody'), c=document.getElementById('dNoticeChev');
  if(!b) return;
  var open=b.style.display!=='none';
  b.style.display=open?'none':'block';
  if(c) c.style.transform=open?'':'rotate(180deg)';
  if(!open){ try{ document.getElementById('dNoticeCard').scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){} }
}
function closeDetail(){
  document.getElementById('detailOv').classList.remove('open');
  document.body.style.overflow='';
  curRID='';
}
function updateDetail(){
  if(!curRID) return;
  var room=DATA[curRID]; if(!room) return;
  var s=room.settings||{}, st=room.status||{};
  document.getElementById('dTtl').textContent=s.courseName||'-';
  var prof=((st.professorName||'').trim())?(st.professorName.trim()+' 교수'):'-';
  document.getElementById('dInfo').innerHTML=
     '<div class="info-item"><div class="k">교육기간</div><div class="v" style="font-size:14px;">'+esc(s.period||'-')+'</div></div>'
    +'<div class="info-item"><div class="k">강의실</div><div class="v" style="font-size:14px;">'+esc(s.roomDetailName||s.roomDetail||'-')+'</div></div>'
    +'<div class="info-item"><div class="k">담임교수</div><div class="v">'+esc(prof)+'</div></div>'
    +'<div class="info-item"><div class="k">과정담당</div><div class="v">'+esc(coordFull(s.coordinatorName)||'-')+'</div></div>';
  var L=leaderOf(room);
  document.getElementById('dLeaderWrap').innerHTML= L
    ? '<div class="leader-box on"><div class="lk"><i class="fa-solid fa-crown"></i> 교육생장</div><div class="lv">'+esc(L.name)+(L.no?(' <small>('+esc(L.no)+')</small>'):'')+'</div></div>'
    : '<div class="leader-box off"><div class="lk"><i class="fa-solid fa-crown"></i> 교육생장</div><div class="lv">지정된 교육생장 없음</div></div>';
  var sh=shuttleCount(room);
  document.getElementById('dShuttle').setAttribute('onclick','showMobileShuttleList()');
  document.getElementById('dShuttle').innerHTML=
     '<div class="shut-cell tot"><div class="sk" style="color:#64748b;">총 신청</div><div class="sv">'+sh.total+'</div></div>'
    +'<div class="shut-cell"><div class="sk" style="color:#ef4444;">오송</div><div class="sv">'+sh.osong+'</div></div>'
    +'<div class="shut-cell"><div class="sk" style="color:#2563eb;">터미널</div><div class="sv">'+sh.terminal+'</div></div>'
    +'<div class="shut-cell"><div class="sk" style="color:#10b981;">공항</div><div class="sv">'+sh.airport+'</div></div>'
    +'<div class="shut-cell"><div class="sk" style="color:#64748b;">자차</div><div class="sv">'+sh.car+'</div></div>';
  var outs=outingsToday(room);
  if(!outs.length){ document.getElementById('dOuting').innerHTML='<div class="empty" style="padding:22px 0;">금일 외출·외박 신청이 없습니다.</div>'; }
  else{
    var ostu=(room.students)||{}; var phoneByName={}; Object.keys(ostu).forEach(function(k){ var ss=ostu[k]||{}; var nm=String(ss.name||'').trim(); if(nm) phoneByName[nm]=ss.phone||''; });
    document.getElementById('dOuting').innerHTML='<div style="overflow-x:auto;"><table class="m-tbl"><thead><tr><th class="num">연번</th><th>성함</th><th>연락처</th><th>외출/외박</th><th>상태</th></tr></thead><tbody>'
      +outs.map(function(a,i){
        var klabel=(a.type==='group_outing')?'단체외출':(a.type==='outing')?'외출':'외박';
        var kcol=(a.type==='overnight')?'#dc2626':'#ea580c';
        var stat = a.held?'<span style="color:#dc2626;font-weight:900;">미복귀</span>'
          : (a.returned&&a.autoReturn)?'<span style="color:#0891b2;">복귀(자동)</span>'
          : a.returned?'<span style="color:#16a34a;">복귀완료</span>'
          : a.confirmed?'<span style="color:#2563eb;">서명완료</span>'
          : '<span style="color:#94a3b8;">대기</span>';
        var ph=a.phone||phoneByName[String(a.name||'').trim()]||'-';
        return '<tr><td class="num">'+(i+1)+'</td><td>'+esc(a.name||'-')+'</td><td>'+esc(ph)+'</td><td style="color:'+kcol+';font-weight:900;">'+klabel+'</td><td>'+stat+'</td></tr>';
      }).join('')
      +'</tbody></table></div>';
  }
  renderHist(room);
}

function showMobileShuttleList(){
  if(!curRID) return;
  var room=DATA[curRID]||{}, s=room.settings||{};
  var rq=(room.shuttle&&room.shuttle.requests)||{};
  var list=Object.keys(rq).map(function(k){ var r=rq[k]||{}; r._key=k; return r; }).filter(function(r){ return r&&r.type; });
  list.sort(function(a,b){ return (a.timestamp||0)-(b.timestamp||0); });
  var box=document.getElementById('mShuttleList');
  if(!box) return;
  if(!list.length){
    box.innerHTML='<div class="empty" style="padding:34px 0;">신청자가 없습니다.</div>';
  } else {
    var stu=(room.students)||{}; var deptByName={}; Object.keys(stu).forEach(function(k){ var ss=stu[k]||{}; var nm=String(ss.name||'').trim(); if(nm) deptByName[nm]=ss.dept||ss.department||''; });
    box.innerHTML='<div style="font-size:13px;font-weight:800;color:#64748b;margin:0 2px 9px;">'+esc(s.courseName||('ROOM #'+curRID))+' · 총 '+list.length+'명</div>'
      +'<div style="overflow-x:auto;"><table class="m-tbl"><thead><tr><th class="num">연번</th><th>성명</th><th>소속</th><th>신청현황</th></tr></thead><tbody>'
      +list.map(function(r,i){ return '<tr><td class="num">'+(i+1)+'</td><td>'+esc(r.name||'-')+'</td><td>'+esc(deptByName[String(r.name||'').trim()]||'-')+'</td><td style="color:#2563eb;font-weight:900;">'+esc(r.typeText||r.type||'-')+'</td></tr>'; }).join('')
      +'</tbody></table></div>';
  }
  document.getElementById('mShuttleOv').classList.add('open');
}
function closeMobileShuttleList(){
  var ov=document.getElementById('mShuttleOv');
  if(ov) ov.classList.remove('open');
}
function renderHist(room){
  var h=room.coordNoticeHistory||{};
  var arr=Object.keys(h).map(function(k){return h[k];}).filter(Boolean).sort(function(a,b){return (b.timestamp||0)-(a.timestamp||0);}).slice(0,5);
  var el=document.getElementById('dHist');
  if(!arr.length){ el.innerHTML='<div class="hk"><i class="fa-solid fa-clock-rotate-left"></i> 이전 공지 이력</div><div style="font-size:12.5px;color:#94a3b8;">발송 이력 없음</div>'; return; }
  el.innerHTML='<div class="hk"><i class="fa-solid fa-clock-rotate-left"></i> 이전 공지 이력</div>'
    +arr.map(function(x){return '<div class="hi"><small>'+esc(x.timeStr||'')+'</small>'+esc((x.text||'').slice(0,60))+((x.text||'').length>60?'…':'')+'</div>';}).join('');
}

/* 공지 발송 */
function sendNotice(){
  if(!curRID) return;
  var ta=document.getElementById('dNotice'), txt=(ta.value||'').trim();
  if(!txt){ toast('공지 내용을 입력하세요'); return; }
  var ts=Date.now();
  db.ref('courses/'+curRID+'/coordNotice').set(txt);
  db.ref('courses/'+curRID+'/coordNoticeHistory/'+ts).set({ text:txt, timestamp:ts, timeStr:new Date(ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) });
  toast('✅ 강사플랫폼에 전송되었습니다');
}

/* 청렴/노조 장소 선택 — 드롭다운 */
var ROOM_GROUPS=[
  {label:'하늘관', rooms:['하늘관 1층 대강당','하늘관 2층 A강의실','하늘관 2층 B강의실','하늘관 2층 C강의실','하늘관 2층 D강의실','하늘관 2층 E강의실','하늘관 2층 F강의실','하늘관 2층 G강의실']},
  {label:'국제동', rooms:['국제동 1층 세미나홀','국제동 1층 A강의실','국제동 1층 B강의실']},
  {label:'서울', rooms:['항공보안교육센터','항공훈련센터']},
  {label:'비대면', rooms:['온라인(Zoom)']}
];
function eduOptionsHtml(){
  var h='<option value="">미정 (선택 안 함)</option>';
  ROOM_GROUPS.forEach(function(g){
    h+='<optgroup label="'+esc(g.label)+'">';
    g.rooms.forEach(function(rm){ h+='<option value="'+esc(rm)+'">'+esc(rm)+'</option>'; });
    h+='</optgroup>';
  });
  var bks=Object.keys(CUSTOM_ROOMS);
  if(bks.length){
    h+='<optgroup label="추가된 강의실">';
    bks.forEach(function(b){ CUSTOM_ROOMS[b].forEach(function(nm){ h+='<option value="'+esc(nm)+'">'+esc(nm)+'</option>'; }); });
    h+='</optgroup>';
  }
  return h;
}
function buildEduSelects(){
  var a=document.getElementById('eduIntegritySel'), b=document.getElementById('eduUnionSel');
  if(a){ a.innerHTML=eduOptionsHtml(); a.value=(EDU.integrity||''); }
  if(b){ b.innerHTML=eduOptionsHtml(); b.value=(EDU.union||''); }
}
function setEduSel(type, val){
  EDU[type]=val||'';
  renderEdu();
  db.ref('system/eduLocations/'+type).set(val||'');
  toast(val?('✅ '+shortRoom(val)+'(으)로 공지'):'미정으로 변경');
}
/* 청렴/노조 장소 — 커스텀 바텀시트 picker (네이티브 select 대체) */
function _eduShortLbl(g,rm){ var t=(''+rm).trim(); if(g && t.indexOf(g)===0) t=t.slice(g.length).trim(); t=t.replace(/^\d+\s*층\s*/,'').trim(); return t||rm; }
function openEduSheet(type){
  var ov=document.getElementById('eduSheetOv'), body=document.getElementById('eduSheetBody'); if(!ov||!body) return;
  var cur=(EDU[type]||'');
  var title=(type==='integrity')?'<i class="fa-solid fa-scale-balanced" style="color:#059669;"></i> 청렴교육 장소 선택':'<i class="fa-solid fa-handshake" style="color:#2563eb;"></i> 노조와의 대화 장소 선택';
  var h='<h3>'+title+'</h3><div class="note">건물별로 골라주세요. 수업 중인 강의실도 선택 가능합니다.</div>';
  ROOM_GROUPS.forEach(function(g){
    h+='<div class="grp">'+esc(g.label)+'</div><div class="rooms">';
    g.rooms.forEach(function(rm){ var on=(rm===cur); h+='<button class="rbtn'+(on?' sel':'')+'" data-v="'+esc(rm)+'" onclick="pickEduPlace(\''+type+'\',this.getAttribute(\'data-v\'))">'+esc(_eduShortLbl(g.label,rm))+(on?' ✓':'')+'</button>'; });
    h+='</div>';
  });
  var bks=Object.keys(CUSTOM_ROOMS||{});
  if(bks.length){ h+='<div class="grp">추가된 강의실</div><div class="rooms">'; bks.forEach(function(b){ (CUSTOM_ROOMS[b]||[]).forEach(function(nm){ var on=(nm===cur); h+='<button class="rbtn'+(on?' sel':'')+'" data-v="'+esc(nm)+'" onclick="pickEduPlace(\''+type+'\',this.getAttribute(\'data-v\'))">'+esc(nm)+(on?' ✓':'')+'</button>'; }); }); h+='</div>'; }
  h+='<div class="grp">기타</div><div class="rooms"><button class="rbtn clear" onclick="pickEduPlace(\''+type+'\',\'\')"><i class="fa-solid fa-eraser"></i> 미정으로 초기화</button></div>';
  body.innerHTML=h; body.scrollTop=0; body.style.transform=''; body.style.transition=''; ov.classList.add('open');
}
function pickEduPlace(type,val){ setEduSel(type, val||''); closeEduSheet(); }
function closeEduSheet(){ var ov=document.getElementById('eduSheetOv'); if(ov) ov.classList.remove('open'); }

/* [M9] 교수 오픈톡방 — system/professorProfiles/{교수}/kakaoLink */
function _otalkHref(link){
  var s=(''+(link||'')).trim(); if(!s) return '';
  if(!/^https?:\/\//i.test(s)) s='https://'+s;
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function openProfTalkSheet(){
  var ov=document.getElementById('profTalkOv'), body=document.getElementById('profTalkBody');
  if(!ov||!body) return;
  body.innerHTML='<h3><i class="fa-solid fa-comments" style="color:#3a1d1d;"></i> 교수 오픈톡방</h3>'
    +'<div class="note">교수님을 누르면 오픈톡방으로 이동합니다. 오픈톡방이 등록되지 않은 교수님은 <b>미개설</b>로 표시됩니다.</div>'
    +'<div id="profTalkList"><div class="empty">불러오는 중...</div></div>';
  ov.classList.add('open');
  db.ref('system/professorProfiles').once('value').then(function(s){ renderProfTalk(s.val()||{}); })
    .catch(function(){ var l=document.getElementById('profTalkList'); if(l) l.innerHTML='<div class="empty">불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>'; });
}
function renderProfTalk(all){
  var list=document.getElementById('profTalkList'); if(!list) return;
  var names=Object.keys(all||{}).filter(function(k){ return k && k!=='undefined' && (''+k).trim(); });
  names.sort(function(a,b){ return String(a).localeCompare(String(b),'ko'); });
  if(!names.length){ list.innerHTML='<div class="empty">등록된 교수님이 없습니다.</div>'; return; }
  list.innerHTML=names.map(function(nm){
    var p=all[nm]||{}; var link=(''+(p.kakaoLink||'')).trim(); var disp=esc(nm)+' 교수';
    if(link){
      return '<a class="otalk-item" href="'+_otalkHref(link)+'" target="_blank" rel="noopener noreferrer">'
        +'<span class="oi-name"><i class="fa-solid fa-comment" style="color:#3a1d1d;"></i> '+disp+'</span>'
        +'<span class="oi-go">입장 <i class="fa-solid fa-arrow-right"></i></span></a>';
    }
    return '<div class="otalk-item off">'
      +'<span class="oi-name"><i class="fa-solid fa-comment-slash"></i> '+disp+'</span>'
      +'<span class="oi-none">미개설</span></div>';
  }).join('');
}
function closeProfTalkSheet(){ var ov=document.getElementById('profTalkOv'); if(ov) ov.classList.remove('open'); }
/* [M10] 바텀시트 아래로 밀어 닫기 (공통) — 맨 위 스크롤 상태에서 아래로 드래그하면 따라 내려가고 일정 이상이면 닫힘 */
function _bindSheetDrag(sheet, closeFn){
  if(!sheet || sheet._dragBound) return; sheet._dragBound=true;
  var startY=0, curY=0, dragging=false;
  sheet.addEventListener('touchstart', function(e){
    if(sheet.scrollTop>0){ dragging=false; return; }
    startY=curY=e.touches[0].clientY; dragging=true; sheet.style.transition='none';
  }, {passive:true});
  sheet.addEventListener('touchmove', function(e){
    if(!dragging) return;
    curY=e.touches[0].clientY; var dy=curY-startY;
    if(dy>0){ if(e.cancelable) e.preventDefault(); sheet.style.transform='translateY('+dy+'px)'; }
  }, {passive:false});
  sheet.addEventListener('touchend', function(){
    if(!dragging) return; dragging=false;
    var dy=curY-startY;
    sheet.style.transition='transform .22s cubic-bezier(.4,0,.2,1)';
    if(dy>90){ sheet.style.transform='translateY(100%)'; setTimeout(function(){ try{closeFn();}catch(e){} sheet.style.transform=''; sheet.style.transition=''; }, 210); }
    else { sheet.style.transform=''; }
  });
}
_bindSheetDrag(document.getElementById('eduSheetBody'), closeEduSheet);
_bindSheetDrag(document.getElementById('profTalkBody'), closeProfTalkSheet);

/* 토스트 */
var _toastT;
function toast(msg){
  var el=document.getElementById('toast'); if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(function(){ el.classList.remove('show'); },2200);
}

/* ===== Firebase 실시간 구독 ===== */
db.ref('courses').on('value', function(snap){
  DATA=snap.val()||{};
  renderList();
  if(curRID && document.getElementById('detailOv').classList.contains('open')){
    var ta=document.getElementById('dNotice');
    if(document.activeElement!==ta){ var room=DATA[curRID]; if(room) ta.value=room.coordNotice||''; }
    updateDetail();
  }
});
db.ref('system/eduLocations').on('value', function(snap){ EDU=snap.val()||{}; renderEdu(); });
db.ref('system/coordinators').on('value', function(snap){
  var data=snap.val()||{}, map={};
  Object.keys(data).forEach(function(k){
    var c=data[k]; if(!c||!c.name) return;
    var bare=(''+c.name).replace(RANK_RE,'').trim();
    var full=c.title?((bare+' '+c.title).trim()):(''+c.name).trim();
    if(bare) map[bare]=full; map[full]=full; map[(''+c.name).trim()]=full;
  });
  COORD_MAP=map;
  renderList();
  if(curRID && document.getElementById('detailOv').classList.contains('open')) updateDetail();
});
db.ref('system/classrooms').on('value', function(snap){
  var v=snap.val()||{}, by={};
  Object.keys(v).forEach(function(k){ var it=v[k]; if(!it||!it.name) return; var b=(''+(it.building||'기타')).trim(); (by[b]=by[b]||[]).push((''+it.name).trim()); });
  CUSTOM_ROOMS=by;
  buildEduSelects();
});
buildEduSelects();
</script>
