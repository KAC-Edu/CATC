<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ============================================================
  CATC · 교육생 대표  (student_leader.html)
  @version  B
  @build    20260615-REWIRE
  ────────────────────────────────────────────────────────
  연동(읽기 전용):
   · courses/{rid}/students        : 입실 명부 / 학생장(isLeader) / 입실(isOnline)  ← 강사(admin)·교육생(index)
   · courses/{rid}/settings.courseName, status.professorName, status.roomStatus
   · courses/{rid}/dinner_skips/{today}/{token}  = "이름(뒷번호)"               ← 교육생(index)
   · courses/{rid}/admin_actions/{today}/{token} = {name,dept,type,startTime,
       endTime,returnDate,destination,reason,phone,returned}                    ← 교육생(index)
============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KAC Student Leader Platform</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

  <style>
    :root{
      --navy:#0f172a; --navy2:#1e293b; --indigo:#6366f1; --indigo-d:#4f46e5;
      --indigo-soft:#eef2ff; --text:#1e293b; --muted:#64748b; --line:#eef2f7;
      --emerald:#10b981; --orange:#ea580c; --rose:#e11d48; --amber:#d97706;
      --bg:#f1f5f9; --shadow:0 8px 24px -8px rgba(15,23,42,.12);
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{ margin:0; font-family:'Pretendard',sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; }
    .app{ width:100%; max-width:600px; min-height:100dvh; background:var(--bg); position:relative; display:flex; flex-direction:column; box-shadow:0 0 40px rgba(0,0,0,.08); }

    /* 인증 */
    #authOverlay{ position:fixed; inset:0; max-width:600px; margin:0 auto; background:#fff; z-index:2000;
      display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; }
    .auth-crown{ width:74px; height:74px; background:var(--indigo-soft); border-radius:22px; display:flex; align-items:center; justify-content:center; margin-bottom:22px; }
    .auth-crown i{ font-size:32px; color:var(--indigo); }
    .auth-title{ font-size:25px; font-weight:900; color:var(--navy); margin-bottom:10px; }
    .auth-desc{ font-size:14px; color:var(--muted); text-align:center; line-height:1.6; margin-bottom:36px; }
    .auth-input{ width:100%; height:56px; border-radius:16px; border:2px solid #eef2f7; margin-bottom:12px; padding:0 18px; font-size:16px; font-weight:700; background:#f8fafc; color:var(--navy); outline:none; transition:.2s; }
    .auth-input:focus{ border-color:var(--indigo); background:#fff; }
    .auth-btn{ width:100%; height:56px; border-radius:16px; border:none; background:var(--indigo); color:#fff; font-size:17px; font-weight:800; cursor:pointer; box-shadow:0 10px 20px -6px rgba(99,102,241,.45); transition:.15s; }
    .auth-btn:active{ transform:scale(.98); }
    .auth-btn:disabled{ opacity:.7; }
    #authError{ margin-top:18px; color:#ef4444; font-size:13px; font-weight:700; display:none; }

    /* 헤더/푸터 */
    .hd{ position:sticky; top:0; height:60px; background:var(--navy); display:flex; align-items:center; justify-content:space-between; padding:0 18px; z-index:1000; }
    .hd-title{ color:#fff; font-size:15.5px; font-weight:800; display:flex; align-items:center; gap:9px; }
    .hd-title i{ color:#a5b4fc; }
    .hd-btn{ font-size:18px; color:#cbd5e1; background:none; border:none; cursor:pointer; padding:6px; }
    .ft{ height:50px; background:var(--navy); color:#94a3b8; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:11px; }
    .ft img{ height:16px; filter:brightness(0) invert(1); opacity:.65; }

    .content{ flex:1; padding:16px; display:none; }

    /* 과정 카드 */
    .hero{ background:linear-gradient(135deg,#4f46e5,#6366f1); border-radius:22px; padding:20px; color:#fff; box-shadow:0 12px 28px -10px rgba(79,70,229,.5); margin-bottom:14px; }
    .hero .cn{ font-size:21px; font-weight:900; line-height:1.25; }
    .hero .pf{ font-size:13px; opacity:.9; font-weight:600; margin-top:5px; }
    .hero .dt{ font-size:12px; opacity:.8; margin-top:2px; }
    .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0 2px; }
    .stat{ background:rgba(255,255,255,.16); border-radius:14px; padding:10px 4px; text-align:center; }
    .stat .n{ font-size:19px; font-weight:900; }
    .stat .l{ font-size:10.5px; opacity:.9; margin-top:2px; }

    .card{ background:#fff; border-radius:20px; padding:16px; margin-bottom:14px; border:1px solid var(--line); box-shadow:var(--shadow); }
    .card-h{ font-size:13.5px; font-weight:800; margin-bottom:13px; display:flex; align-items:center; gap:8px; }
    .card-h .cnt{ margin-left:auto; font-size:12px; font-weight:800; color:#fff; background:var(--indigo); border-radius:20px; padding:2px 10px; }
    .h-meal{ color:var(--emerald); } .h-meal .cnt{ background:var(--emerald); }
    .h-act{ color:var(--indigo-d); }
    .h-ros{ color:var(--navy2); } .h-ros .cnt{ background:var(--navy2); }

    .row{ display:flex; align-items:center; gap:12px; padding:13px 14px; background:#fff; border:1.5px solid var(--line); border-radius:16px; margin-bottom:9px; }
    .row:last-child{ margin-bottom:0; }
    .row .info{ flex:1; min-width:0; }
    .nm{ font-size:15.5px; font-weight:800; color:var(--navy); display:flex; align-items:center; gap:6px; }
    .sub{ font-size:12.5px; color:var(--muted); font-weight:600; margin-top:3px; line-height:1.45; }
    .sub b{ color:var(--text); font-weight:800; }
    .ph{ font-size:13px; color:var(--indigo); font-weight:800; letter-spacing:.2px; }
    .ph.muted{ color:var(--muted); font-weight:600; }
    .badge{ padding:6px 11px; border-radius:11px; font-size:12px; font-weight:800; white-space:nowrap; flex-shrink:0; }
    .b-out{ background:#fff7ed; color:var(--orange); }
    .b-over{ background:#fef2f2; color:var(--rose); }
    .b-group{ background:#eff6ff; color:#2563eb; }
    .b-etc{ background:#f1f5f9; color:#475569; }
    .b-meal{ background:#ecfdf5; color:var(--emerald); }
    .b-in{ background:#f0fdf4; color:#16a34a; }
    .b-off{ background:#f8fafc; color:#94a3b8; }
    .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .dot.on{ background:#22c55e; } .dot.off{ background:#cbd5e1; }
    .empty{ text-align:center; padding:30px 0; color:#cbd5e1; font-size:13.5px; font-weight:700; }
    .ret{ color:#16a34a !important; } .ret b{ color:#16a34a; }
  </style>
</head>
<body>
  <div class="app">
    <div id="authOverlay">
      <div class="auth-crown"><i class="fa-solid fa-crown"></i></div>
      <div class="auth-title">학생장 본인확인</div>
      <div class="auth-desc">담당 교수님으로부터 <b>학생장 권한</b>을 부여받은<br>교육생만 접속할 수 있습니다.</div>
      <input type="text" id="leaderName" class="auth-input" placeholder="성함 입력">
      <input type="text" inputmode="numeric" id="leaderPhone" class="auth-input" maxlength="5" placeholder="본인 사번 (없으면 전화 뒤 4자리)">
      <button class="auth-btn" onclick="verifyLeaderAccess()">권한 확인 및 입장</button>
      <div id="authError"></div>
    </div>

    <header class="hd">
      <div class="hd-title"><i class="fa-solid fa-crown"></i> 학생장 대시보드</div>
      <button class="hd-btn" onclick="location.reload()" title="새로고침/로그아웃"><i class="fa-solid fa-power-off"></i></button>
    </header>

    <main id="mainContent" class="content">
      <div class="hero">
        <div class="cn" id="cName">과정명 불러오는 중…</div>
        <div class="pf" id="cProf">담당교수 로드 중</div>
        <div class="dt" id="cDate"></div>
        <div class="stats">
          <div class="stat"><div class="n" id="stStu">0</div><div class="l">수강생</div></div>
          <div class="stat"><div class="n" id="stOut">0</div><div class="l">외출</div></div>
          <div class="stat"><div class="n" id="stOver">0</div><div class="l">외박</div></div>
          <div class="stat"><div class="n" id="stMeal">0</div><div class="l">석식제외</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-h h-act"><i class="fa-solid fa-person-walking-arrow-right"></i> 외출 · 외박 신청 현황 <span class="cnt" id="cntAct">0</span></div>
        <div id="actionList"><div class="empty">불러오는 중…</div></div>
      </div>

      <div class="card">
        <div class="card-h h-meal"><i class="fa-solid fa-utensils"></i> 금일 석식 제외 <span class="cnt" id="cntMeal">0</span></div>
        <div id="dinnerSkipList"><div class="empty">불러오는 중…</div></div>
      </div>

      <div class="card">
        <div class="card-h h-ros"><i class="fa-solid fa-users"></i> 수강생 입실 명부 <span class="cnt" id="cntRos">0</span></div>
        <div id="studentList"></div>
      </div>
    </main>

    <footer class="ft">
      <div id="footer-date">0000년 00월 00일 (요일) 00:00</div>
      <div class="footer-logo"><img src="logo.png" alt="KAC"></div>
    </footer>
  </div>

  <script src="config.js"></script>
  <script>
    let myRoomID=null;
    let _cntOut=0,_cntOver=0,_cntMeal=0,_cntStu=0;

    function getTodayString(){ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function runClock(){ const n=new Date(); const w=['일','월','화','수','목','금','토'];
      document.getElementById('footer-date').innerText=`${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 (${w[n.getDay()]}) ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; }
    setInterval(runClock,1000); runClock();
    function setStats(){ document.getElementById('stStu').innerText=_cntStu; document.getElementById('stOut').innerText=_cntOut; document.getElementById('stOver').innerText=_cntOver; document.getElementById('stMeal').innerText=_cntMeal; }
    function resetBtn(b){ b.innerText="권한 확인 및 입장"; b.disabled=false; }

    async function verifyLeaderAccess(){
      const name=document.getElementById('leaderName').value.trim();
      const inputPhone=document.getElementById('leaderPhone').value.trim();
      const errorEl=document.getElementById('authError');
      if(!name || !/^\d{4,5}$/.test(inputPhone)) return alert("성함과 사번(또는 전화 뒤 4자리)을 정확히 입력해주세요.");
      errorEl.style.display="none";
      const btn=document.querySelector('.auth-btn'); btn.innerText="권한 검증 중…"; btn.disabled=true;
      try{
        const snap=await firebase.database().ref('courses').once('value');
        const courses=snap.val()||{};
        let found=false;
        for(const rid in courses){
          const room=courses[rid];
          if(room && room.status && room.status.roomStatus==='active' && room.students){
            for(const sKey in room.students){
              const st=room.students[sKey];
              const dbRaw=String(st.phone||"").replace(/[^0-9]/g,"");
              const idMatch=(dbRaw===inputPhone)||(dbRaw.slice(-4)===inputPhone)||(dbRaw.slice(-5)===inputPhone);
              if(st.name===name && idMatch){
                if(st.isLeader===true){ myRoomID=rid; found=true; }
                else { alert("교수님에 의해 학생장으로 지정되지 않았습니다.\n강사 플랫폼에서 학생장 권한 부여를 확인해 주세요."); resetBtn(btn); return; }
                break;
              }
            }
          }
          if(found) break;
        }
        if(found){
          document.getElementById('authOverlay').style.display='none';
          document.getElementById('mainContent').style.display='block';
          document.getElementById('cDate').innerText=getTodayString().replace(/-/g,'.');
          loadLeaderData();
        } else { errorEl.innerText="정보가 일치하지 않거나 권한이 없습니다."; errorEl.style.display="block"; resetBtn(btn); }
      }catch(e){ console.error(e); alert("연결 오류가 발생했습니다."); resetBtn(btn); }
    }

    const ACT={ outing:{l:'외출',c:'b-out'}, overnight:{l:'외박',c:'b-over'}, group_outing:{l:'단체외출',c:'b-group'} };
    function actMeta(t){ return ACT[t] || {l:'신청',c:'b-etc'}; }

    function loadLeaderData(){
      if(!myRoomID) return;
      const today=getTodayString();

      // 과정 정보 + 입실 명부
      firebase.database().ref(`courses/${myRoomID}`).on('value',snap=>{
        const data=snap.val()||{};
        document.getElementById('cName').innerText=(data.settings&&data.settings.courseName)||'과정명 미지정';
        document.getElementById('cProf').innerText=`담당교수 · ${(data.status&&data.status.professorName)||'미지정'}`;
        const box=document.getElementById('studentList'); box.innerHTML="";
        const studs=data.students?Object.values(data.students).filter(s=>s&&s.name):[];
        studs.sort((a,b)=>(b.isLeader?1:0)-(a.isLeader?1:0)||String(a.name).localeCompare(b.name,'ko'));
        _cntStu=studs.length; document.getElementById('cntRos').innerText=_cntStu; setStats();
        if(!studs.length){ box.innerHTML=`<div class="empty">등록된 수강생이 없습니다.</div>`; return; }
        studs.forEach(s=>{
          const on=s.isOnline===true;
          box.insertAdjacentHTML('beforeend',
            `<div class="row">
               <span class="dot ${on?'on':'off'}"></span>
               <div class="info">
                 <div class="nm">${esc(s.name)} ${s.isLeader?'<i class="fa-solid fa-crown" style="color:#f59e0b;font-size:13px;"></i>':''}</div>
                 <div class="sub">뒷번호 ${esc(s.phone||'-')}${s.dept?` · ${esc(s.dept)}`:''}</div>
               </div>
               <span class="badge ${on?'b-in':'b-off'}">${on?'입실 중':'미입실'}</span>
             </div>`);
        });
      });

      // 석식 제외
      firebase.database().ref(`courses/${myRoomID}/dinner_skips/${today}`).on('value',snap=>{
        const box=document.getElementById('dinnerSkipList'); box.innerHTML="";
        const data=snap.val()||{}; const entries=Object.values(data);
        _cntMeal=entries.length; document.getElementById('cntMeal').innerText=_cntMeal; setStats();
        if(!entries.length){ box.innerHTML=`<div class="empty">오늘 석식 제외 신청자가 없습니다.</div>`; return; }
        entries.forEach(info=>{
          const str=String(info); const name=str.split('(')[0]; const phone=(str.split('(')[1]||'').replace(')','')||'-';
          box.insertAdjacentHTML('beforeend',
            `<div class="row"><div class="info"><div class="nm">${esc(name)}</div><div class="sub">뒷번호 ${esc(phone)}</div></div><span class="badge b-meal">석식 제외</span></div>`);
        });
      });

      // 외출 / 외박
      firebase.database().ref(`courses/${myRoomID}/admin_actions/${today}`).on('value',snap=>{
        const box=document.getElementById('actionList'); box.innerHTML="";
        const data=snap.val()||{}; const items=Object.values(data).filter(x=>x&&x.type&&x.type!=='none');
        _cntOut=items.filter(i=>i.type==='outing').length;
        _cntOver=items.filter(i=>i.type==='overnight').length;
        document.getElementById('cntAct').innerText=items.length; setStats();
        if(!items.length){ box.innerHTML=`<div class="empty">현재 외출·외박 신청자가 없습니다.</div>`; return; }
        const ord={overnight:0,group_outing:1,outing:2};
        items.sort((a,b)=>(ord[a.type]??9)-(ord[b.type]??9)||String(a.name||'').localeCompare(b.name||'','ko'));
        items.forEach(it=>{
          const m=actMeta(it.type);
          const time=(it.startTime||it.endTime)?`${esc(it.startTime||'')}${it.endTime?' ~ '+esc(it.endTime):''}`:'';
          const ret=(it.type==='overnight'&&it.returnDate)?`<div class="sub ret"><b>복귀 ${esc(it.returnDate)}</b></div>`:'';
          const lines=[
            it.destination?`목적지 <b>${esc(it.destination)}</b>`:'',
            time?`시간 ${time}`:'',
            it.reason?`사유 ${esc(it.reason)}`:'',
            it.dept?`${esc(it.dept)}`:''
          ].filter(Boolean).join(' · ');
          box.insertAdjacentHTML('beforeend',
            `<div class="row">
               <div class="info">
                 <div class="nm">${esc(it.name||'-')}</div>
                 ${lines?`<div class="sub">${lines}</div>`:''}
                 ${ret}
                 ${it.phone?`<div class="ph">${esc(it.phone)}</div>`:''}
               </div>
               <span class="badge ${m.c}">${m.l}</span>
             </div>`);
        });
      });
    }
  </script>
<style>@media print{#__catcVer{display:none!important}}</style>
<div id="__catcVer" aria-hidden="true" style="position:fixed;right:5px;bottom:4px;z-index:2147483647;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:700;line-height:1;letter-spacing:.4px;color:rgba(148,163,184,.5);background:rgba(120,120,120,.12);padding:2px 5px;border-radius:5px;pointer-events:none;user-select:none;">vB</div>

</body>
</html>
