<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ============================================================
  CATC · 교육생 대표  (student_leader.html)
  @version  C
  @build    20260615-PORTAL
  ────────────────────────────────────────────────────────
  연동(읽기 전용):
   · courses/{rid}/students        : 입실 명부 / 학생장(isLeader) / 입실(isOnline)
   · courses/{rid}/settings.courseName, status.professorName, status.roomStatus
   · courses/{rid}/dinner_skips/{today}/{token}  = "이름(뒷번호)"
   · courses/{rid}/admin_actions/{today}/{token} = {name,dept,type,startTime,endTime,returnDate,destination,reason,phone}
  디자인: 포털(portal.html) 톤 — 네이비→블루 그라데이션 헤더 / 카드 상단 액센트
============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KAC Student Leader Platform</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --blue:#2563eb; --blue-light:#3b82f6; --navy:#1e3a8a;
      --green:#059669; --orange:#ea580c; --rose:#e11d48; --indigo:#4f46e5;
      --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --bg-page:#e8eef8;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{
      margin:0; min-height:100dvh; font-family:'Noto Sans KR','DM Sans',sans-serif;
      color:var(--text); display:flex; justify-content:center; align-items:flex-start; padding:24px 16px;
      background:var(--bg-page);
      background-image:linear-gradient(rgba(37,99,235,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.05) 1px,transparent 1px);
      background-size:22px 22px;
    }
    @media (max-width:540px){ body{ padding:0; align-items:stretch; } }

    .app{ width:100%; max-width:460px; background:#fff; border-radius:28px; overflow:hidden;
      box-shadow:0 20px 60px rgba(15,23,42,.14), 0 4px 16px rgba(15,23,42,.08); display:flex; flex-direction:column; }
    @media (max-width:540px){ .app{ max-width:100%; border-radius:0; min-height:100dvh; box-shadow:none; } }

    /* ── 헤더 (포털과 동일한 네이비→블루 그라데이션) ── */
    .app-header{ background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#3b82f6 100%); padding:20px 20px 22px; position:relative; overflow:hidden; }
    .app-header::before{ content:''; position:absolute; top:-30px; right:-30px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.08); }
    .app-header::after{ content:''; position:absolute; bottom:-26px; left:36px; width:90px; height:90px; border-radius:50%; background:rgba(255,255,255,.06); }
    .hdr-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; position:relative; z-index:1; }
    .hdr-brand{ display:flex; align-items:center; gap:10px; }
    .hdr-badge{ width:38px; height:38px; background:rgba(255,255,255,.22); border:1.5px solid rgba(255,255,255,.35); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#fbbf24; }
    .hdr-sub{ font-size:9px; color:rgba(255,255,255,.65); font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
    .hdr-title{ font-size:14px; font-weight:900; color:#fff; margin-top:1px; }
    .hdr-pw{ width:38px; height:38px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.28); border-radius:11px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.9); cursor:pointer; font-size:15px; }
    .hdr-info{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; position:relative; z-index:1; }
    .hi-l{ min-width:0; }
    #cName{ font-size:21px; font-weight:900; color:#fff; line-height:1.2; display:block; word-break:keep-all; }
    #cProf{ font-size:12px; color:rgba(255,255,255,.78); margin-top:4px; display:block; font-weight:500; }
    .hi-r{ text-align:right; flex-shrink:0; }
    #clock-display{ font-size:24px; font-weight:800; color:#fff; font-family:'DM Sans',monospace; letter-spacing:-.5px; line-height:1; }
    #cDate{ font-size:11px; color:rgba(255,255,255,.65); margin-top:4px; font-weight:600; display:block; }

    /* 통계 칩 */
    .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:18px; position:relative; z-index:1; }
    .stat{ background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:11px 4px; text-align:center; }
    .stat .n{ font-size:20px; font-weight:900; color:#fff; font-family:'DM Sans',sans-serif; }
    .stat .l{ font-size:10.5px; color:rgba(255,255,255,.8); margin-top:3px; font-weight:600; }

    /* ── 본문 ── */
    .app-body{ background:#f8fafc; padding:16px; display:flex; flex-direction:column; gap:13px; flex:1; }
    .card{ background:#fff; border:1.5px solid var(--border); border-radius:18px; padding:15px 15px 13px; position:relative; overflow:hidden; box-shadow:0 1px 6px rgba(15,23,42,.05); }
    .card::before{ content:''; position:absolute; top:0; left:0; right:0; height:3.5px; border-radius:18px 18px 0 0; }
    .card.c-act::before{ background:linear-gradient(90deg,#4f46e5,#818cf8); }
    .card.c-meal::before{ background:linear-gradient(90deg,#047857,#34d399); }
    .card.c-ros::before{ background:linear-gradient(90deg,#1e3a8a,#3b82f6); }
    .card-h{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .ch-ic{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
    .c-act .ch-ic{ background:#eef2ff; color:#4f46e5; }
    .c-meal .ch-ic{ background:#ecfdf5; color:#059669; }
    .c-ros .ch-ic{ background:#eff6ff; color:#1e3a8a; }
    .ch-t{ font-size:14.5px; font-weight:800; color:var(--text); }
    .ch-cnt{ margin-left:auto; min-width:24px; height:24px; padding:0 9px; border-radius:20px; color:#fff; font-size:12.5px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
    .c-act .ch-cnt{ background:#4f46e5; } .c-meal .ch-cnt{ background:#059669; } .c-ros .ch-cnt{ background:#1e3a8a; }

    .row{ display:flex; align-items:center; gap:12px; padding:12px 13px; background:#fff; border:1.5px solid #f1f5f9; border-radius:14px; margin-bottom:9px; }
    .row:last-child{ margin-bottom:0; }
    .row .info{ flex:1; min-width:0; }
    .nm{ font-size:15px; font-weight:800; color:var(--navy); display:flex; align-items:center; gap:6px; }
    .sub{ font-size:12.5px; color:var(--muted); font-weight:500; margin-top:3px; line-height:1.45; }
    .sub b{ color:var(--text); font-weight:700; }
    .ph{ font-size:13px; color:var(--blue); font-weight:800; letter-spacing:.2px; margin-top:3px; }
    .ph.muted{ color:var(--muted); font-weight:600; }
    .ret b{ color:#16a34a; }
    .badge{ padding:6px 11px; border-radius:10px; font-size:12px; font-weight:800; white-space:nowrap; flex-shrink:0; }
    .b-out{ background:#fff7ed; color:#ea580c; } .b-over{ background:#fef2f2; color:#e11d48; }
    .b-group{ background:#eff6ff; color:#2563eb; } .b-etc{ background:#f1f5f9; color:#475569; }
    .b-meal{ background:#ecfdf5; color:#059669; }
    .b-in{ background:#f0fdf4; color:#16a34a; } .b-off{ background:#f8fafc; color:#94a3b8; }
    .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .dot.on{ background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.15); } .dot.off{ background:#cbd5e1; }
    .empty{ text-align:center; padding:26px 0; color:#cbd5e1; font-size:13px; font-weight:700; }

    /* ── 푸터 ── */
    .app-footer{ background:#f8fafc; border-top:1px solid var(--border); padding:11px 18px; display:flex; align-items:center; justify-content:space-between; }
    #footer-date{ font-size:11px; color:var(--muted); font-weight:600; }
    .ft-brand{ display:flex; align-items:center; gap:7px; }
    .ft-brand img{ height:15px; opacity:.55; }
    .ft-ver{ font-size:11px; color:#cbd5e1; font-weight:700; }

    /* ── 인증 ── */
    #authOverlay{ position:fixed; inset:0; background:var(--bg-page);
      background-image:linear-gradient(rgba(37,99,235,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.05) 1px,transparent 1px); background-size:22px 22px;
      z-index:2000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:34px; }
    .auth-card{ width:100%; max-width:360px; background:#fff; border:1px solid var(--border); border-radius:24px; padding:34px 26px; box-shadow:0 20px 50px rgba(15,23,42,.12); text-align:center; }
    .auth-crown{ width:72px; height:72px; margin:0 auto 20px; border-radius:20px; background:linear-gradient(135deg,#1e3a8a,#3b82f6); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 22px -8px rgba(30,58,138,.5); }
    .auth-crown i{ font-size:30px; color:#fbbf24; }
    .auth-title{ font-size:23px; font-weight:900; color:var(--navy); margin-bottom:9px; }
    .auth-desc{ font-size:13.5px; color:var(--muted); line-height:1.6; margin-bottom:26px; }
    .auth-input{ width:100%; height:54px; border-radius:14px; border:1.5px solid var(--border); margin-bottom:11px; padding:0 16px; font-size:16px; font-weight:700; background:#f8fafc; color:var(--navy); outline:none; transition:.2s; font-family:inherit; }
    .auth-input:focus{ border-color:var(--blue); background:#fff; }
    .auth-btn{ width:100%; height:54px; border-radius:14px; border:none; background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 10px 22px -8px rgba(37,99,235,.5); transition:.15s; font-family:inherit; margin-top:4px; }
    .auth-btn:active{ transform:scale(.98); } .auth-btn:disabled{ opacity:.7; }
    #authError{ margin-top:16px; color:#ef4444; font-size:13px; font-weight:700; display:none; }
  </style>
</head>
<body>
  <div id="authOverlay">
    <div class="auth-card">
      <div class="auth-crown"><i class="fa-solid fa-crown"></i></div>
      <div class="auth-title">학생장 본인확인</div>
      <div class="auth-desc">담당 교수님으로부터 <b>학생장 권한</b>을 부여받은<br>교육생만 접속할 수 있습니다.</div>
      <input type="text" id="leaderName" class="auth-input" placeholder="성함 입력">
      <input type="text" inputmode="numeric" id="leaderPhone" class="auth-input" maxlength="5" placeholder="본인 사번 (없으면 전화 뒤 4자리)">
      <button class="auth-btn" onclick="verifyLeaderAccess()">권한 확인 및 입장</button>
      <div id="authError"></div>
    </div>
  </div>

  <div class="app" id="mainContent" style="display:none;">
    <header class="app-header">
      <div class="hdr-top">
        <div class="hdr-brand">
          <div class="hdr-badge"><i class="fa-solid fa-crown"></i></div>
          <div><div class="hdr-sub">STUDENT LEADER</div><div class="hdr-title">학생장 대시보드</div></div>
        </div>
        <button class="hdr-pw" onclick="location.reload()" title="새로고침 / 로그아웃"><i class="fa-solid fa-power-off"></i></button>
      </div>
      <div class="hdr-info">
        <div class="hi-l"><span id="cName">과정명 불러오는 중…</span><span id="cProf">담당교수 로드 중</span></div>
        <div class="hi-r"><div id="clock-display">--:--</div><span id="cDate"></span></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="n" id="stStu">0</div><div class="l">수강생</div></div>
        <div class="stat"><div class="n" id="stOut">0</div><div class="l">외출</div></div>
        <div class="stat"><div class="n" id="stOver">0</div><div class="l">외박</div></div>
        <div class="stat"><div class="n" id="stMeal">0</div><div class="l">석식제외</div></div>
      </div>
    </header>

    <main class="app-body">
      <div class="card c-act">
        <div class="card-h"><span class="ch-ic"><i class="fa-solid fa-person-walking-arrow-right"></i></span><span class="ch-t">외출 · 외박 신청 현황</span><span class="ch-cnt" id="cntAct">0</span></div>
        <div id="actionList"><div class="empty">불러오는 중…</div></div>
      </div>
      <div class="card c-meal">
        <div class="card-h"><span class="ch-ic"><i class="fa-solid fa-utensils"></i></span><span class="ch-t">금일 석식 제외</span><span class="ch-cnt" id="cntMeal">0</span></div>
        <div id="dinnerSkipList"><div class="empty">불러오는 중…</div></div>
      </div>
      <div class="card c-ros">
        <div class="card-h"><span class="ch-ic"><i class="fa-solid fa-users"></i></span><span class="ch-t">수강생 입실 명부</span><span class="ch-cnt" id="cntRos">0</span></div>
        <div id="studentList"></div>
      </div>
    </main>

    <footer class="app-footer">
      <div id="footer-date">0000년 00월 00일 (요일) 00:00</div>
      <div class="ft-brand"><img src="logo.png" alt="KAC"><span class="ft-ver">학생장</span></div>
    </footer>
  </div>

  <script src="config.js"></script>
  <script>
    let myRoomID=null;
    let _cntOut=0,_cntOver=0,_cntMeal=0,_cntStu=0;

    function getTodayString(){ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function runClock(){ const n=new Date(); const w=['일','월','화','수','목','금','토'];
      const hm=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
      const fd=document.getElementById('footer-date'); if(fd) fd.innerText=`${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 (${w[n.getDay()]}) ${hm}`;
      const cd=document.getElementById('clock-display'); if(cd) cd.innerText=hm; }
    setInterval(runClock,1000); runClock();
    function setStats(){ document.getElementById('stStu').innerText=_cntStu; document.getElementById('stOut').innerText=_cntOut; document.getElementById('stOver').innerText=_cntOver; document.getElementById('stMeal').innerText=_cntMeal; }
    function resetBtn(b){ b.innerText="권한 확인 및 입장"; b.disabled=false; }

    async function verifyLeaderAccess(){
      const name=document.getElementById('leaderName').value.trim();
      const inputPhone=document.getElementById('leaderPhone').value.trim();
      const errorEl=document.getElementById('authError');
      if(!name || !/^\d{4,5}$/.test(inputPhone)) return alert("성함과 사번(또는 전화 뒤 4자리)을 정확히 입력해주세요.");
      errorEl.style.display="none";
      const btn=document.querySelector('.auth-btn'); btn.innerText="권한 검증 중…"; btn.disabled=true;
      try{
        const snap=await firebase.database().ref('courses').once('value');
        const courses=snap.val()||{};
        let found=false;
        for(const rid in courses){
          const room=courses[rid];
          if(room && room.status && room.status.roomStatus==='active' && room.students){
            for(const sKey in room.students){
              const st=room.students[sKey];
              const dbRaw=String(st.phone||"").replace(/[^0-9]/g,"");
              const idMatch=(dbRaw===inputPhone)||(dbRaw.slice(-4)===inputPhone)||(dbRaw.slice(-5)===inputPhone);
              if(st.name===name && idMatch){
                if(st.isLeader===true){ myRoomID=rid; found=true; }
                else { alert("교수님에 의해 학생장으로 지정되지 않았습니다.\n강사 플랫폼에서 학생장 권한 부여를 확인해 주세요."); resetBtn(btn); return; }
                break;
              }
            }
          }
          if(found) break;
        }
        if(found){
          document.getElementById('authOverlay').style.display='none';
          document.getElementById('mainContent').style.display='flex';
          document.getElementById('cDate').innerText=getTodayString().replace(/-/g,'.');
          loadLeaderData();
        } else { errorEl.innerText="정보가 일치하지 않거나 권한이 없습니다."; errorEl.style.display="block"; resetBtn(btn); }
      }catch(e){ console.error(e); alert("연결 오류가 발생했습니다."); resetBtn(btn); }
    }

    const ACT={ outing:{l:'외출',c:'b-out'}, overnight:{l:'외박',c:'b-over'}, group_outing:{l:'단체외출',c:'b-group'} };
    function actMeta(t){ return ACT[t] || {l:'신청',c:'b-etc'}; }

    function loadLeaderData(){
      if(!myRoomID) return;
      const today=getTodayString();

      firebase.database().ref(`courses/${myRoomID}`).on('value',snap=>{
        const data=snap.val()||{};
        document.getElementById('cName').innerText=(data.settings&&data.settings.courseName)||'과정명 미지정';
        document.getElementById('cProf').innerText=`담당교수 · ${(data.status&&data.status.professorName)||'미지정'}`;
        const box=document.getElementById('studentList'); box.innerHTML="";
        const studs=data.students?Object.values(data.students).filter(s=>s&&s.name):[];
        studs.sort((a,b)=>(b.isLeader?1:0)-(a.isLeader?1:0)||String(a.name).localeCompare(b.name,'ko'));
        _cntStu=studs.length; document.getElementById('cntRos').innerText=_cntStu; setStats();
        if(!studs.length){ box.innerHTML=`<div class="empty">등록된 수강생이 없습니다.</div>`; return; }
        studs.forEach(s=>{
          const on=s.isOnline===true;
          box.insertAdjacentHTML('beforeend',
            `<div class="row">
               <span class="dot ${on?'on':'off'}"></span>
               <div class="info">
                 <div class="nm">${esc(s.name)} ${s.isLeader?'<i class="fa-solid fa-crown" style="color:#f59e0b;font-size:13px;"></i>':''}</div>
                 <div class="sub">뒷번호 ${esc(s.phone||'-')}${s.dept?` · ${esc(s.dept)}`:''}</div>
               </div>
               <span class="badge ${on?'b-in':'b-off'}">${on?'입실 중':'미입실'}</span>
             </div>`);
        });
      });

      firebase.database().ref(`courses/${myRoomID}/dinner_skips/${today}`).on('value',snap=>{
        const box=document.getElementById('dinnerSkipList'); box.innerHTML="";
        const data=snap.val()||{}; const entries=Object.values(data);
        _cntMeal=entries.length; document.getElementById('cntMeal').innerText=_cntMeal; setStats();
        if(!entries.length){ box.innerHTML=`<div class="empty">오늘 석식 제외 신청자가 없습니다.</div>`; return; }
        entries.forEach(info=>{
          const str=String(info); const name=str.split('(')[0]; const phone=(str.split('(')[1]||'').replace(')','')||'-';
          box.insertAdjacentHTML('beforeend',
            `<div class="row"><div class="info"><div class="nm">${esc(name)}</div><div class="sub">뒷번호 ${esc(phone)}</div></div><span class="badge b-meal">석식 제외</span></div>`);
        });
      });

      firebase.database().ref(`courses/${myRoomID}/admin_actions/${today}`).on('value',snap=>{
        const box=document.getElementById('actionList'); box.innerHTML="";
        const data=snap.val()||{}; const items=Object.values(data).filter(x=>x&&x.type&&x.type!=='none');
        _cntOut=items.filter(i=>i.type==='outing').length;
        _cntOver=items.filter(i=>i.type==='overnight').length;
        document.getElementById('cntAct').innerText=items.length; setStats();
        if(!items.length){ box.innerHTML=`<div class="empty">현재 외출·외박 신청자가 없습니다.</div>`; return; }
        const ord={overnight:0,group_outing:1,outing:2};
        items.sort((a,b)=>(ord[a.type]??9)-(ord[b.type]??9)||String(a.name||'').localeCompare(b.name||'','ko'));
        items.forEach(it=>{
          const m=actMeta(it.type);
          const time=(it.startTime||it.endTime)?`${esc(it.startTime||'')}${it.endTime?' ~ '+esc(it.endTime):''}`:'';
          const ret=(it.type==='overnight'&&it.returnDate)?`<div class="sub ret"><b>복귀 ${esc(it.returnDate)}</b></div>`:'';
          const lines=[
            it.destination?`목적지 <b>${esc(it.destination)}</b>`:'',
            time?`시간 ${time}`:'',
            it.reason?`사유 ${esc(it.reason)}`:'',
            it.dept?`${esc(it.dept)}`:''
          ].filter(Boolean).join(' · ');
          box.insertAdjacentHTML('beforeend',
            `<div class="row">
               <div class="info">
                 <div class="nm">${esc(it.name||'-')}</div>
                 ${lines?`<div class="sub">${lines}</div>`:''}
                 ${ret}
                 ${it.phone?`<div class="ph">${esc(it.phone)}</div>`:''}
               </div>
               <span class="badge ${m.c}">${m.l}</span>
             </div>`);
        });
      });
    }
  </script>
