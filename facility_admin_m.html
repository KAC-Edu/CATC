<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <script>
  /* [기기 분리] PC 접속은 PC 전용 화면으로 (모바일은 이 화면 유지). ?forcem 으로 강제 모바일. */
  (function(){ try{
    var wide = window.innerWidth >= 1024;
    var fine = window.matchMedia && window.matchMedia('(pointer:fine)').matches;
    var noTouch = !('ontouchstart' in window) || navigator.maxTouchPoints === 0;
    var isPc = wide && (fine || noTouch);
    if(isPc && location.search.indexOf('forcem')<0){ location.replace('facility_admin.html'+location.search+location.hash); }
  }catch(e){} })();
  </script>
<!-- ════════ [카카오채널 연동] catc1234 접속 게이트 (수정상태: 수정안하는중) ════════
     · facility_admin.html(미화·비품)의 모바일 라이트판. 직접 진입 시 접속코드 요구.
     · 통과 시 localStorage['catc_gate_ok'] 저장. catcLock()으로 잠금 해제. 기능 로직과 분리. -->
<script>
(function(){
  window.catcLock=function(){ try{localStorage.removeItem('catc_gate_ok');}catch(e){} location.reload(); };
  var ok=false; try{ ok=(function(){var t=parseInt(localStorage.getItem('catc_gate_ok'),10);return !!t&&(Date.now()-t)<86400000;})(); }catch(e){ ok=false; }   /* [보안] 저장이 막힌 환경(시크릿 창 등)에서 코드 없이 통과되던 구멍 차단 */
  if(ok){ window.__catcUnlocked=true; return; }
  window.__catcUnlocked=false;
  document.documentElement.classList.add('catc-locked');
  function build(){
    if(document.getElementById('catcGate')) return;
    var o=document.createElement('div'); o.id='catcGate';
    o.innerHTML='<div class="catc-box"><div class="catc-ic">🔒</div>'
      +'<div class="catc-t">접속 코드 입력</div>'
      +'<div class="catc-s">CATC 교육 플랫폼 · 보안 접속</div>'
      +'<input id="catcInp" type="password" autocomplete="off" placeholder="접속 코드">'
      +'<button id="catcBtn">입장</button><div id="catcMsg"></div></div>';
    (document.body||document.documentElement).appendChild(o);
    var inp=o.querySelector('#catcInp'),btn=o.querySelector('#catcBtn'),msg=o.querySelector('#catcMsg');
    function go(){ if(inp.value==='catc1234'){ var _saved=false; try{ localStorage.setItem('catc_gate_ok',String(Date.now())); _saved=true; }catch(e){} if(_saved){ location.reload(); } else { try{ o.remove(); }catch(e){} document.documentElement.classList.remove('catc-locked'); window.__catcUnlocked=true; } } else { msg.textContent='접속 코드가 올바르지 않습니다.'; inp.value=''; inp.focus(); } }
    btn.addEventListener('click',go);
    inp.addEventListener('keyup',function(e){ if(e.key==='Enter') go(); });
    setTimeout(function(){ try{inp.focus();}catch(e){} },120);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded',build);
})();
</script>

<script>
/* ========== 미화·비품 모바일 라이트뷰 (조회 + 빠른 처리) ========== */
var db = firebase.database().ref('system/facility_requests');
var BLDGS = ['청렴관','상생관','국제동'];
var BL_ICON = {'청렴관':'fa-building','상생관':'fa-building-circle-check','국제동':'fa-earth-asia'};
var ICONS = { '수건':'fa-bath','샴푸':'fa-pump-soap','바디샤워':'fa-soap','치약':'fa-tooth' };
var cache=null, activeCourseNames=null;
var _openDone=new Set();

function h(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function bldgOf(d){ d=d||''; if(d.indexOf('청렴')>=0)return'청렴관'; if(d.indexOf('상생')>=0)return'상생관'; if(d.indexOf('국제')>=0)return'국제동'; return'기타'; }
function floorOf(d){ var m=(d||'').match(/(\d+)\s*층/); return m?m[1]+'층':''; }
function roomNoOf(d){ var m=(d||'').match(/(\d+\s*호)/); if(m)return m[1].replace(/\s/g,''); var f=floorOf(d); return f||(d||'-'); }
function parseReq(req){ var c=Array.isArray(req.items)?req.items.slice():[]; var e=req.text||''; if(c.length)e=e.replace(c.join(', '),'').replace(/^\s*\/\s*/,'').trim(); return {chips:c,extra:e}; }
function chip(name){ var fa=ICONS[name]; return '<span class="ichip"><i class="fa-solid '+(fa||'fa-box')+'"></i> '+h(name)+'</span>'; }
function isWait(r){ return r.status==='대기'||r.status==='확인'; }
function isDone(r){ return r.status==='처리완료'||r.status==='처리불가'; }
function whenStr(ts){ var d=new Date(ts), p=function(x){return String(x).padStart(2,'0');}; return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes()); }

/* 시계 */
function tickClock(){
  var d=new Date(), days=['일','월','화','수','목','금','토'];
  var h2=d.getHours(), ap=h2<12?'AM':'PM', hh=((h2%12)||12);
  var el=document.getElementById('clk');
  if(el) el.innerHTML=(d.getMonth()+1)+'.'+d.getDate()+'('+days[d.getDay()]+') <b>'+hh+':'+String(d.getMinutes()).padStart(2,'0')+'</b> '+ap;
}
setInterval(tickClock,1000); tickClock();

/* 진행중 과정만 표시 (강사플랫폼 hideFromBoard·기간 반영) */
firebase.database().ref('courses').on('value', function(snap){
  var data=snap.val()||{}, set=new Set();
  var today=new Date(); today.setHours(0,0,0,0);
  var tStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  Object.keys(data).forEach(function(k){
    var c=data[k]||{}, s=c.settings||{}, st=c.status||{};
    if(!s.courseName) return;
    if(s.hideFromBoard) return;
    if(st.roomStatus!=='active') return;
    if(s.period && s.period.indexOf('~')>=0){ var ed=(s.period.split('~')[1]||'').trim(); if(ed && ed<tStr) return; }
    set.add((s.courseName||'').trim());
  });
  activeCourseNames=set; render();
});
db.on('value', function(snap){ cache=snap.val(); render(); if(window.kacBootDone) kacBootDone(); });

function render(){
  var data=cache||{};
  var items=Object.keys(data).map(function(k){ var o=data[k]||{}; o.id=k; return o; });
  if(activeCourseNames){ items=items.filter(function(it){ return activeCourseNames.has((it.courseName||'').trim()); }); }
  var waits=items.filter(isWait), dones=items.filter(isDone);
  document.getElementById('s-wait').textContent=waits.length;
  document.getElementById('s-done').textContent=dones.length;

  var byB={}; BLDGS.forEach(function(b){ byB[b]={reqs:[],done:[]}; });
  items.forEach(function(it){
    var b=bldgOf(it.dorm); if(!byB[b]) return;
    if(isWait(it)) byB[b].reqs.push(it);
    else if(isDone(it)) byB[b].done.push(it);
  });

  var html = BLDGS.map(function(b){
    var g=byB[b];
    g.reqs.sort(function(x,y){ return (y.timestamp||0)-(x.timestamp||0); });
    var reqHtml = g.reqs.length ? g.reqs.map(function(req){
      var pr=parseReq(req);
      var chipsHtml=pr.chips.length?pr.chips.map(chip).join(''):chip('비품 요청');
      var extraHtml=pr.extra?'<div class="extra-box"><i class="fa-solid fa-pen-to-square" style="color:#94a3b8"></i> '+h(pr.extra)+'</div>':'';
      var who=req.name?('<div class="req-who"><i class="fa-solid fa-user" style="color:#cbd5e1"></i> '+h(req.name)+(req.courseName?(' · '+h(req.courseName)):'')+'</div>'):'';
      return '<div class="req" id="req-'+req.id+'">'
        +'<div class="req-top"><span class="req-no">'+h(roomNoOf(req.dorm))+'</span><span class="req-fl">'+h(floorOf(req.dorm)||'')+'</span><span class="req-time">'+whenStr(req.timestamp||Date.now())+'</span></div>'
        +'<div class="items">'+chipsHtml+'</div>'+extraHtml+who
        +'<div class="acts"><button class="btn btn-ok" onclick="markDone(\''+req.id+'\')"><i class="fa-solid fa-check"></i> 해결 완료</button>'
        +'<button class="btn btn-no" onclick="markReject(\''+req.id+'\')"><i class="fa-solid fa-xmark"></i> 처리 불가</button></div></div>';
    }).join('') : '<div class="empty"><i class="fa-regular fa-circle-check" style="font-size:20px;display:block;margin-bottom:6px;color:#cbd5e1;"></i>대기 요청 없음</div>';

    var doneOpen=_openDone.has(b);
    var doneHtml = g.done.length ? '<div class="done-foot"><div class="done-toggle" onclick="toggleDone(\''+b+'\')"><i class="fa-solid fa-chevron-'+(doneOpen?'up':'down')+'"></i> 오늘 처리완료 '+g.done.length+'건 '+(doneOpen?'접기':'보기')+'</div>'
      +'<div class="done-list '+(doneOpen?'show':'')+'">'+g.done.sort(function(x,y){return (y.timestamp||0)-(x.timestamp||0);}).map(function(d){
        return '<div class="done-row"><span class="dr-no">'+h(roomNoOf(d.dorm))+'</span><span>'+(d.status==='처리완료'?'✅':'⛔')+' '+h(d.name||'')+'</span><button class="undo" onclick="undoStatus(\''+d.id+'\')">되돌리기</button></div>';
      }).join('')+'</div></div>' : '';

    return '<div class="bgrp '+(g.reqs.length?'':'allclear')+'">'
      +'<div class="bgrp-hd '+b+'"><span><i class="fa-solid '+(BL_ICON[b]||'fa-building')+'"></i> '+b+'</span><span class="wn">대기 '+g.reqs.length+'</span></div>'
      +reqHtml+doneHtml+'</div>';
  }).join('');
  document.getElementById('reqList').innerHTML=html;
}

function toggleDone(b){ if(_openDone.has(b))_openDone.delete(b); else _openDone.add(b); render(); }

function markDone(id){
  var el=document.getElementById('req-'+id); if(el) el.classList.add('resolving');
  setTimeout(function(){ db.child(id).update({status:'처리완료', resolvedAt: firebase.database.ServerValue.TIMESTAMP}); toast('✅ 해결 완료 처리'); }, 300);
}
var _rejId=null;
function markReject(id){ _rejId=id; var t=document.getElementById('rejText'); if(t)t.value=''; document.getElementById('rejSheet').classList.add('open'); }
function rejPick(s){ var t=document.getElementById('rejText'); if(t)t.value=s; }
function confirmRej(){
  var r=(document.getElementById('rejText').value||'').trim();
  var u={status:'처리불가', resolvedAt: firebase.database.ServerValue.TIMESTAMP}; if(r)u.reason=r;
  if(_rejId){ var el=document.getElementById('req-'+_rejId); if(el) el.classList.add('resolving'); db.child(_rejId).update(u); }
  closeRej(); toast('⛔ 처리 불가로 기록');
}
function closeRej(){ document.getElementById('rejSheet').classList.remove('open'); _rejId=null; }
function undoStatus(id){ db.child(id).update({status:'대기', reason:null, resolvedAt:null}); toast('대기로 되돌림'); }

var _toastT;
function toast(msg){ var el=document.getElementById('toast'); if(!el) return; el.textContent=msg; el.classList.add('show'); clearTimeout(_toastT); _toastT=setTimeout(function(){ el.classList.remove('show'); },2000); }

document.getElementById('rejSheet').addEventListener('click', function(e){ if(e.target===this) closeRej(); });
</script>

<!-- ═══ [2026-07-07 전체 점검모드] system/maintenance 스위치 하나로 전 플랫폼 동시 점검중 전환.
     on:true면 전체 화면 점검 안내(실시간), off면 즉시 복귀. 재배포 불필요.
     관리자 우회: 주소 뒤 ?ok=우회코드 (SHA-256 대조, 탭 세션 동안 유지) ═══ -->
<script>
(function(){
  var BH='2c978f750e54c66ebaf4cb8b70d6420b6d7cb6dde1209447a4b87b026ed398a9', tries=0;
  function hide(){ var o=document.getElementById('kacMaintOv'); if(o) o.remove(); try{ document.documentElement.style.overflow=''; }catch(e){} }
  function show(v){
    if (sessionStorage.getItem('kac_maint_bypass')==='1') return;
    var o=document.getElementById('kacMaintOv');
    var msg=(v&&v.msg)||'더 나은 서비스를 위해 시스템을 점검하고 있습니다.';
    var until=(v&&v.until)?String(v.until):'';
    if(!o){
      o=document.createElement('div'); o.id='kacMaintOv';
      o.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0f2057 0%,#1a3a8a 75%,#1e40af 140%);';
      document.body.appendChild(o);
      try{ document.documentElement.style.overflow='hidden'; }catch(e){}
    }
    o.innerHTML='<div style="max-width:460px;width:100%;text-align:center;color:#fff;">'
      +'<div style="font-size:64px;line-height:1;margin-bottom:18px;">\uD83D\uDEE0\uFE0F</div>'
      +'<h1 style="margin:0 0 10px;font-size:26px;font-weight:900;letter-spacing:-.3px;">시스템 점검 중입니다</h1>'
      +'<p id="kacMaintMsg" style="margin:0 0 18px;font-size:15px;font-weight:700;color:rgba(255,255,255,.82);line-height:1.65;"></p>'
      +(until?'<div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:800;color:#fde68a;">\u23F0 예상 완료: <b id="kacMaintUntil" style="font-weight:900;"></b></div>':'')
      +'<div style="margin-top:30px;font-size:12px;font-weight:700;color:rgba(255,255,255,.45);">KAC \ud56d\uacf5\uae30\uc220\ud6c8\ub828\uc6d0 \ud1b5\ud569 \uad50\uc721 \uc2dc\uc2a4\ud15c</div>'
      +'</div>';
    var m=document.getElementById('kacMaintMsg'); if(m) m.textContent=msg;   // textContent — 안내문구 HTML 주입 차단
    var u=document.getElementById('kacMaintUntil'); if(u) u.textContent=until;
  }
  // 관리자 우회: ?ok=코드
  try{
    var q=new URLSearchParams(location.search).get('ok');
    if(q && window.crypto && crypto.subtle){
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(q)).then(function(b){
        var h=Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
        if(h===BH){ sessionStorage.setItem('kac_maint_bypass','1'); hide(); }
      });
    }
  }catch(e){}
  function boot(){
    if (typeof firebase==='undefined' || !firebase.apps || !firebase.apps.length){ if(++tries<40) setTimeout(boot,700); return; }
    try{
      firebase.database().ref('system/maintenance').on('value', function(s){
        var v=s.val();
        if(v && v.on){ if(document.body) show(v); else document.addEventListener('DOMContentLoaded', function(){ show(v); }); }
        else hide();
      }, function(){ /* 규칙 미발행 시 조용히 무시(정상 서비스) */ });
    }catch(e){}
  }
  boot();
})();
</script>
