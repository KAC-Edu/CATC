<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미화/시설 비품요청 관리</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root { --navy: #0f172a; --green: #10b981; --bg: #f1f5f9; }
        body { margin: 0; background: var(--bg); font-family: 'Pretendard'; padding-bottom: 50px; }
        .header { background: var(--navy); color: white; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .req-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #cbd5e1; }
        .req-card.status-대기 { border-left-color: #ef4444; }
        .req-card.status-확인 { border-left-color: #3b82f6; }
        .req-card.status-처리완료 { border-left-color: #10b981; opacity: 0.7; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #64748b; }
        .dorm-info { font-weight: 800; color: var(--navy); font-size: 16px; }
        .req-text { background: #f8fafc; padding: 12px; border-radius: 10px; margin: 10px 0; font-size: 15px; font-weight: 600; line-height: 1.5; }
        .btn-group { display: flex; gap: 5px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-check { background: #eff6ff; color: #3b82f6; }
        .btn-done { background: #ecfdf5; color: #10b981; }
        .btn-no { background: #fff1f2; color: #ef4444; }
        .status-badge { padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 800; }
        .badge-대기 { background: #fee2e2; color: #ef4444; }
        .badge-확인 { background: #dbeafe; color: #3b82f6; }
        .badge-처리완료 { background: #d1fae5; color: #10b981; }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0;">🧹 비품요청 관리판</h2>
        <div id="stats" style="font-size:12px; margin-top:5px; opacity:0.8;">대기 0건 | 확인 0건</div>
    </div>
    <div class="container" id="requestList">
        <p style="text-align:center; color:#94a3b8; margin-top:50px;">요청 내역을 불러오는 중...</p>
    </div>

    <script>
        const db = firebase.database().ref('system/facility_requests');

        // 데이터 불러오기 및 실시간 업데이트
        db.on('value', (snap) => {
            const listDiv = document.getElementById('requestList');
            const data = snap.val();
            if (!data) {
                listDiv.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:50px;">현재 요청이 없습니다.</p>';
                return;
            }

            let html = "";
            let waitCnt = 0;
            let checkCnt = 0;

            // 최신순 정렬을 위해 역순 작업
            const keys = Object.keys(data).reverse();
            keys.forEach(key => {
                const req = data[key];
                if(req.status === "대기") waitCnt++;
                if(req.status === "확인") checkCnt++;

                const time = new Date(req.timestamp).toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                
                html += `
                    <div class="req-card status-${req.status}">
                        <div class="info-row">
                            <span>${time}</span>
                            <span class="status-badge badge-${req.status}">${req.status}</span>
                        </div>
                        <div class="dorm-info">${req.dorm}</div>
                        <div style="font-size:12px; color:#64748b;">${req.name} (${req.courseName})</div>
                        <div class="req-text">${req.text}</div>
                        ${req.reason ? `<div style="font-size:12px; color:#ef4444; margin-bottom:10px;">🚩 사유: ${req.reason}</div>` : ""}
                        <div class="btn-group">
                            <button class="btn btn-check" onclick="updateStatus('${key}', '확인')">확인함</button>
                            <button class="btn btn-done" onclick="updateStatus('${key}', '처리완료')">처리완료</button>
                            <button class="btn btn-no" onclick="rejectStatus('${key}')">불가</button>
                        </div>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
            document.getElementById('stats').innerText = `대기 ${waitCnt}건 | 확인 ${checkCnt}건`;
        });

        // 상태 업데이트 함수
        function updateStatus(key, newStatus) {
            firebase.database().ref('system/facility_requests/' + key).update({ status: newStatus });
        }

        // 처리 불가 처리 함수
        function rejectStatus(key) {
            const reason = prompt("처리 불가 사유를 입력해주세요 (예: 재고없음, 지원대상 아님)");
            if (reason) {
                firebase.database().ref('system/facility_requests/' + key).update({ 
                    status: "처리불가",
                    reason: reason
                });
            }
        }
    </script>
</body>
</html>
