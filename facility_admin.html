<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생활관 비품 요청 현황</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --navy:#0f172a; --blue:#2563eb; --green:#10b981; --red:#ef4444; --amber:#f59e0b; }
        body { background:#0f172a; font-family:'Malgun Gothic','맑은 고딕',sans-serif; color:#f1f5f9; min-height:100vh; }
        .top { background:#1e293b; padding:20px 30px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; border-bottom:2px solid #334155; }
        .top h1 { font-size:30px; font-weight:900; display:flex; align-items:center; gap:12px; }
        .top h1 .dot { width:14px; height:14px; border-radius:50%; background:var(--green); animation:blink 1.4s infinite; }
        @keyframes blink { 50%{opacity:0.3;} }
        .clock { margin-left:auto; font-size:24px; font-weight:800; color:#94a3b8; }
        .stats { display:flex; gap:14px; }
        .stat { background:#0f172a; border:1px solid #334155; border-radius:14px; padding:10px 20px; text-align:center; min-width:90px; }
        .stat .n { font-size:30px; font-weight:900; }
        .stat .l { font-size:13px; color:#94a3b8; font-weight:700; margin-top:2px; }
        .stat.wait .n { color:var(--red); } .stat.done .n { color:#64748b; }
        .filters { display:flex; gap:12px; padding:18px 30px; flex-wrap:wrap; }
        .chip { padding:12px 26px; border-radius:30px; background:#1e293b; border:2px solid #334155; font-size:18px; font-weight:800; color:#cbd5e1; cursor:pointer; }
        .chip.active { background:var(--blue); border-color:var(--blue); color:#fff; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); gap:18px; padding:10px 30px 40px; }
        .card { background:#1e293b; border:2px solid #334155; border-radius:20px; padding:22px 24px; display:flex; flex-direction:column; gap:14px; }
        .card.wait { border-color:var(--green); box-shadow:0 0 0 2px rgba(16,185,129,0.25); }
        .card .head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .card .dorm { font-size:28px; font-weight:900; color:#fff; }
        .card .meta { font-size:15px; color:#94a3b8; font-weight:700; }
        .card .when { font-size:15px; color:#64748b; font-weight:700; white-space:nowrap; }
        .items { display:flex; flex-wrap:wrap; gap:10px; }
        .item-chip { background:#0f172a; border:1.5px solid #475569; border-radius:12px; padding:10px 18px; font-size:20px; font-weight:800; color:#e2e8f0; display:inline-flex; align-items:center; gap:8px; }
        .extra { font-size:18px; color:#cbd5e1; font-weight:600; line-height:1.5; background:#0f172a; border-radius:12px; padding:12px 16px; }
        .actions { display:flex; gap:10px; margin-top:4px; }
        .btn { flex:1; padding:16px; border:none; border-radius:14px; font-size:20px; font-weight:900; cursor:pointer; }
        .btn-done { background:var(--green); color:#fff; }
        .btn-reject { background:#3f1d2e; color:#fca5a5; }
        .card.done { opacity:0.5; }
        .card.done .badge-done { font-size:20px; font-weight:900; color:#64748b; text-align:center; padding:14px; }
        .empty { text-align:center; padding:80px 20px; color:#64748b; font-size:24px; font-weight:700; grid-column:1/-1; }
        .status-tag { font-size:15px; font-weight:900; padding:6px 14px; border-radius:20px; }
        .tag-done { background:#334155; color:#94a3b8; } .tag-reject { background:#3f1d2e; color:#fca5a5; }
    </style>
</head>
<body>
    <div class="top">
        <h1><span class="dot"></span>🧹 생활관 비품 요청 현황</h1>
        <div class="stats">
            <div class="stat wait"><div class="n" id="s-wait">0</div><div class="l">처리 대기</div></div>
            <div class="stat done"><div class="n" id="s-done">0</div><div class="l">처리 완료</div></div>
        </div>
        <div class="clock" id="clock">--:--</div>
    </div>
    <div class="filters">
        <div class="chip active" onclick="setFilter('대기', this)">⏳ 처리 대기</div>
        <div class="chip" onclick="setFilter('전체', this)">전체 보기</div>
        <div class="chip" onclick="setFilter('청렴관', this)">청렴관</div>
        <div class="chip" onclick="setFilter('상생관', this)">상생관</div>
        <div class="chip" onclick="setFilter('국제', this)">국제동</div>
    </div>
    <div class="grid" id="grid">
        <div class="empty">데이터를 불러오는 중입니다...</div>
    </div>
    <script>
        let filter = '대기';
        let cache = null;
        const ref = firebase.database().ref('system/facility_requests');
        function clock() {
            const d = new Date();
            document.getElementById('clock').innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        clock(); setInterval(clock, 10000);
        function setFilter(f, el) {
            filter = f;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            if (cache !== null) render(cache);
        }
        ref.on('value', snap => { cache = snap.val(); render(cache); });
        function render(data) {
            const grid = document.getElementById('grid');
            if (!data) {
                grid.innerHTML = '<div class="empty">📭 현재 요청이 없습니다.</div>';
                document.getElementById('s-wait').innerText = 0;
                document.getElementById('s-done').innerText = 0;
                return;
            }
            let items = Object.keys(data).map(k => ({ id:k, ...data[k] }));
            const waitCount = items.filter(i => i.status === '대기' || i.status === '확인').length;
            const doneCount = items.filter(i => i.status === '처리완료' || i.status === '처리불가').length;
            document.getElementById('s-wait').innerText = waitCount;
            document.getElementById('s-done').innerText = doneCount;
            if (filter === '대기') items = items.filter(i => i.status === '대기' || i.status === '확인');
            else if (filter !== '전체') items = items.filter(i => (i.dorm||'').includes(filter));
            const pri = { '대기':0, '확인':1, '처리완료':2, '처리불가':2 };
            items.sort((a,b) => (pri[a.status]-pri[b.status]) || (b.timestamp-a.timestamp));
            if (!items.length) {
                grid.innerHTML = '<div class="empty">✅ 처리할 요청이 없습니다.</div>';
                return;
            }
            const emoji = { '수건':'🧺','샴푸':'🧴','바디샤워':'🛁','치약':'🪥' };
            grid.innerHTML = items.map(req => {
                const d = new Date(req.timestamp);
                const when = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                const isWait = (req.status === '대기' || req.status === '확인');
                const isDone = (req.status === '처리완료' || req.status === '처리불가');
                let chips = Array.isArray(req.items) ? req.items.slice() : [];
                let extra = req.text || '';
                if (chips.length) { extra = extra.replace(chips.join(', '), '').replace(/^\s*\/\s*/, '').trim(); }
                const chipsHtml = chips.map(c => `<span class="item-chip">${emoji[c]||'📦'} ${c}</span>`).join('');
                const extraHtml = extra ? `<div class="extra">✏️ ${escapeHtml(extra)}</div>` : '';
                let body;
                if (isDone) {
                    const tag = req.status === '처리완료'
                        ? '<span class="status-tag tag-done">처리 완료</span>'
                        : '<span class="status-tag tag-reject">처리 불가</span>';
                    body = `<div class="badge-done">${tag}${req.reason ? '<div style="margin-top:8px; font-size:15px; color:#fca5a5;">사유: '+escapeHtml(req.reason)+'</div>' : ''}</div>`;
                } else {
                    body = `<div class="actions">
                        <button class="btn btn-done" onclick="markDone('${req.id}')"><i class="fa-solid fa-check"></i> 해결 완료</button>
                        <button class="btn btn-reject" onclick="markReject('${req.id}')">처리 불가</button>
                    </div>`;
                }
                return `<div class="card ${isWait?'wait':''} ${isDone?'done':''}">
                    <div class="head">
                        <div>
                            <div class="dorm">${escapeHtml(req.dorm||'-')}</div>
                            <div class="meta">${escapeHtml(req.name||'')} · ${escapeHtml(req.courseName||'')}</div>
                        </div>
                        <div class="when">${when}</div>
                    </div>
                    <div class="items">${chipsHtml || '<span class="item-chip">📦 비품 요청</span>'}</div>
                    ${extraHtml}
                    ${body}
                </div>`;
            }).join('');
        }
        function markDone(id) { firebase.database().ref('system/facility_requests/' + id).update({ status:'처리완료' }); }
        function markReject(id) {
            const reason = prompt("처리 불가 사유를 입력하세요 (생략 가능)");
            const upd = { status:'처리불가' };
            if (reason) upd.reason = reason;
            firebase.database().ref('system/facility_requests/' + id).update(upd);
        }
        function escapeHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    </script>
</body>
</html>
