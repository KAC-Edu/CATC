<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미화 · 비품관리</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root{ --navy:#0f1e3d; --blue:#2563eb; --border:#e2e8f0; --muted:#64748b; }
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#eef2f7; font-family:'Pretendard','Malgun Gothic',sans-serif; color:#1e293b; min-height:100vh; }

        /* ── 상단바 (교육지원부/영양사 동일 계열, 세련된 그라데이션) ── */
        .top{ background:linear-gradient(120deg,#0b1733 0%,#152a5e 45%,#2563eb 120%);
            padding:0 26px; height:68px; display:flex; align-items:center; gap:20px;
            position:sticky; top:0; z-index:100; box-shadow:0 6px 22px rgba(15,30,80,.28); }
        .brand{ display:flex; align-items:center; gap:12px; }
        .brand .ic{ width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.14);
            display:flex; align-items:center; justify-content:center; font-size:19px; color:#fff; }
        .brand .tt{ line-height:1.15; }
        .brand .sub{ font-size:10.5px; font-weight:800; letter-spacing:1.5px; color:#9dc0ff; }
        .brand h1{ font-size:20px; font-weight:900; color:#fff; white-space:nowrap; }
        .top-stats{ display:flex; gap:9px; margin-left:8px; }
        .scard{ border-radius:12px; padding:7px 16px; text-align:center; min-width:78px; border:1.5px solid; background:rgba(255,255,255,.06); }
        .scard.wait{ border-color:rgba(248,113,113,.55); }
        .scard.done{ border-color:rgba(52,211,153,.45); }
        .scard .sn{ font-size:21px; font-weight:900; line-height:1; }
        .scard.wait .sn{ color:#fca5a5; } .scard.done .sn{ color:#6ee7b7; }
        .scard .sl{ font-size:10.5px; font-weight:800; color:#cbd5e1; margin-top:3px; }
        .clock{ margin-left:auto; display:flex; align-items:center; gap:11px; background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:7px 16px; }
        .clock .c-date{ font-size:15px; font-weight:800; color:#e2e8f0; letter-spacing:.5px; }
        .clock .c-day{ font-size:12px; font-weight:800; color:#93c5fd; }
        .clock .c-div{ width:1px; height:20px; background:rgba(255,255,255,.2); }
        .clock .c-time{ font-size:19px; font-weight:900; color:#fff; letter-spacing:.5px; }
        .clock .c-ampm{ font-size:11px; font-weight:800; color:#93c5fd; margin-left:3px; }
        .blink{ animation:cblink 1s step-end infinite; } @keyframes cblink{ 50%{opacity:.3;} }
        .gear{ width:40px; height:40px; border-radius:11px; border:1px solid rgba(255,255,255,.16);
            background:rgba(255,255,255,.08); color:#dbeafe; font-size:16px; cursor:pointer; }
        .gear:hover{ background:rgba(255,255,255,.16); }

        /* ── 생활관별 세로 블록 (전체 높이, 블록별 독립 스크롤) ── */
        .wrap{ padding:18px 22px; height:calc(100vh - 68px); }
        .blocks{ display:flex; gap:16px; align-items:stretch; height:100%; }
        .bblock{ flex:1 1 0; min-width:0; background:#fff; border:1.5px solid var(--border); border-radius:18px;
            box-shadow:0 4px 16px rgba(15,30,80,.06); overflow:hidden; display:flex; flex-direction:column; height:100%; }
        .bb-hd{ padding:15px 18px; display:flex; align-items:center; justify-content:space-between; color:#fff; flex:none; }
        .bb-hd.청렴관{ background:linear-gradient(135deg,#1d4ed8,#3b82f6); }
        .bb-hd.상생관{ background:linear-gradient(135deg,#047857,#10b981); }
        .bb-hd.국제동{ background:linear-gradient(135deg,#6d28d9,#8b5cf6); }
        .bb-hd .nm{ font-size:18px; font-weight:900; display:flex; align-items:center; gap:9px; }
        .bb-hd .wn{ font-size:13px; font-weight:900; background:rgba(255,255,255,.22); border-radius:20px; padding:3px 13px; }
        .bb-body{ padding:12px; display:flex; flex-direction:column; gap:10px; flex:1; overflow-y:auto; }
        .bb-body::-webkit-scrollbar{ width:9px; }
        .bb-body::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:5px; }
        .bb-body::-webkit-scrollbar-track{ background:transparent; }
        .bb-empty{ margin:auto; text-align:center; color:#cbd5e1; font-size:14px; font-weight:800; padding:34px 0; }

        /* 호수 카드 (접힘: 호수+건수 / 펼침: 신청내용+처리) */
        .rcard{ border:1.5px solid var(--border); border-radius:13px; overflow:hidden; transition:.15s; }
        .rcard.open{ border-color:#bfdbfe; box-shadow:0 3px 12px rgba(37,99,235,.1); }
        .rcard.resolving{ opacity:.45; filter:grayscale(.7); pointer-events:none; }
        .rc-hd{ display:flex; align-items:center; gap:11px; padding:13px 15px; cursor:pointer; background:#fff; }
        .rc-hd:hover{ background:#f8fafc; }
        .rc-no{ font-size:17px; font-weight:900; color:#0f172a; }
        .rc-fl{ font-size:12px; color:var(--muted); font-weight:700; }
        .rc-cnt{ margin-left:auto; font-size:12.5px; font-weight:900; color:#dc2626; background:#fef2f2; border:1.5px solid #fecaca; border-radius:20px; padding:3px 11px; }
        .rc-chev{ color:#94a3b8; font-size:13px; transition:transform .15s; }
        .rcard.open .rc-chev{ transform:rotate(180deg); }
        .rc-body{ display:none; padding:4px 15px 14px; border-top:1px dashed var(--border); background:#fcfdff; }
        .rcard.open .rc-body{ display:block; }

        .req{ background:#f1f6ff; border:1.5px solid #dbeafe; border-radius:12px; padding:13px 14px; margin-bottom:10px; }
        .req:last-child{ margin-bottom:0; }
        .req-meta{ font-size:12px; color:var(--muted); font-weight:700; margin-bottom:7px; display:flex; gap:8px; flex-wrap:wrap; }
        .req-time{ color:#94a3b8; }
        .items{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px; }
        .ichip{ display:inline-flex; align-items:center; gap:5px; padding:6px 11px; border-radius:9px; font-size:13px; font-weight:800; border:1.5px solid; }
        .ichip.수건{ background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8; }
        .ichip.샴푸{ background:#faf5ff; border-color:#ddd6fe; color:#7c3aed; }
        .ichip.바디샤워{ background:#f0fdf4; border-color:#bbf7d0; color:#15803d; }
        .ichip.치약{ background:#fffbeb; border-color:#fde68a; color:#b45309; }
        .ichip.기타{ background:#f8fafc; border-color:#e2e8f0; color:#475569; }
        .extra-box{ background:#f8fafc; border:1px solid var(--border); border-radius:9px; padding:8px 12px; font-size:13px; color:#475569; font-weight:600; line-height:1.5; margin-bottom:9px; }
        .acts{ display:flex; gap:7px; }
        .btn{ padding:10px 0; border:none; border-radius:10px; font-size:13.5px; font-weight:900; cursor:pointer; flex:1; }
        .btn-ok{ background:#10b981; color:#fff; } .btn-ok:hover{ background:#059669; }
        .btn-no{ background:#fff; border:1.5px solid #fecaca; color:#dc2626; } .btn-no:hover{ background:#fef2f2; }

        .done-foot{ border-top:1px solid var(--border); padding:9px 14px; }
        .done-toggle{ font-size:12.5px; font-weight:800; color:#64748b; cursor:pointer; display:flex; align-items:center; gap:7px; }
        .done-toggle:hover{ color:#0f172a; }
        .done-list{ display:none; margin-top:8px; }
        .done-list.show{ display:block; }
        .done-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:#64748b; padding:6px 0; border-bottom:1px dashed #eef2f7; }
        .done-row .dr-no{ font-weight:900; color:#0f172a; }
        .done-row .undo{ margin-left:auto; font-size:11.5px; font-weight:800; color:#2563eb; background:#eff6ff; border:1px solid #bfdbfe; border-radius:7px; padding:4px 9px; cursor:pointer; }

        /* 설정 모달 */
        .ov{ position:fixed; inset:0; background:rgba(15,23,42,.5); display:none; align-items:center; justify-content:center; z-index:300; }
        .ov.show{ display:flex; }
        .set{ background:#fff; border-radius:18px; padding:24px; width:340px; max-width:92vw; box-shadow:0 20px 60px rgba(0,0,0,.3); }
        .set h3{ font-size:17px; font-weight:900; color:#0f172a; margin-bottom:16px; display:flex; align-items:center; gap:9px; }
        .set-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid #eef2f7; }
        .set-row .lab{ font-size:14px; font-weight:800; color:#334155; }
        .switch{ width:52px; height:30px; border-radius:99px; background:#cbd5e1; position:relative; cursor:pointer; transition:.18s; border:none; flex:none; }
        .switch.on{ background:#10b981; }
        .switch .kn{ position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:.18s; box-shadow:0 1px 4px rgba(0,0,0,.2); }
        .switch.on .kn{ left:25px; }
        .rej-chip{ padding:8px 13px; border:1.5px solid #fecaca; background:#fef2f2; color:#b91c1c; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer; }
        .rej-chip:hover{ background:#fee2e2; }
        .set-close{ width:100%; margin-top:16px; padding:12px; border:none; border-radius:12px; background:#0f172a; color:#fff; font-size:14px; font-weight:800; cursor:pointer; }

        @media (max-width:860px){
            .top{ flex-wrap:wrap; height:auto; padding:10px 14px; gap:10px; }
            .clock{ margin-left:0; } .brand h1{ font-size:16px; }
            .wrap{ height:auto; }
            .blocks{ flex-direction:column; height:auto; } .bblock{ width:100%; height:auto; }
            .bb-body{ overflow:visible; }
        }
    </style>
</head>
<body>

<div class="top">
    <div class="brand">
        <div class="ic"><i class="fa-solid fa-broom"></i></div>
        <div class="tt"><div class="sub">KAC 항공기술훈련원</div><h1>미화 · 비품관리</h1></div>
    </div>
    <div class="top-stats">
        <div class="scard wait"><div class="sn" id="s-wait">0</div><div class="sl">처리 대기</div></div>
        <div class="scard done"><div class="sn" id="s-done">0</div><div class="sl">오늘 완료</div></div>
    </div>
    <div class="clock" id="clock"></div>
    <button class="gear" onclick="openReport()" title="월간 리포트" style="margin-right:8px;"><i class="fa-solid fa-chart-column"></i></button>
    <button class="gear" onclick="openSet()" title="설정"><i class="fa-solid fa-gear"></i></button>
</div>

<div class="wrap"><div class="blocks" id="blocks"></div></div>

<!-- 설정 -->
<div class="ov" id="setOv" onclick="if(event.target===this)closeSet()">
    <div class="set">
        <h3><i class="fa-solid fa-gear" style="color:#2563eb;"></i> 설정</h3>
        <div class="set-row">
            <span class="lab"><i class="fa-solid fa-volume-high" style="color:#10b981; margin-right:7px;"></i> 새 요청 알림음</span>
            <button class="switch" id="soundSwitch" onclick="toggleSound()"><span class="kn"></span></button>
        </div>
        <div class="set-row" style="border:none;">
            <span class="lab" style="font-size:12.5px; color:#94a3b8; font-weight:700;">요청이 새로 접수되면 알림음이 울립니다.</span>
        </div>
        <div class="set-row" style="display:block; border:none; padding-top:6px;">
            <div class="lab" style="margin-bottom:9px;"><i class="fa-solid fa-box-open" style="color:#10b981; margin-right:7px;"></i> 신청 가능 비품 항목</div>
            <div id="itemList" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px;"></div>
            <div style="display:flex; gap:6px;">
                <input id="newItem" placeholder="비품명 (예: 전기장판)" onkeydown="if(event.key==='Enter')addItem()" style="flex:1; padding:9px 11px; border:1.5px solid #e2e8f0; border-radius:9px; font-size:13px; outline:none;">
                <button onclick="addItem()" style="padding:9px 15px; border:none; border-radius:9px; background:#2563eb; color:#fff; font-weight:800; cursor:pointer;">추가</button>
            </div>
            <div style="font-size:11px; color:#94a3b8; margin-top:7px; line-height:1.5;">여기서 추가/삭제하면 교육생 앱 비품 신청 목록에 바로 반영됩니다. (예: 겨울철 전기장판 추가, 미제공 품목 삭제)</div>
        </div>
        <button class="set-close" onclick="closeSet()">닫기</button>
    </div>
</div>

<!-- [처리 불가 사유] 프리셋 + 직접입력 모달 -->
<div class="ov" id="rejOv" onclick="if(event.target===this)closeRej()">
    <div class="set">
        <h3><i class="fa-solid fa-circle-xmark" style="color:#dc2626;"></i> 처리 불가 사유</h3>
        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
            <button type="button" class="rej-chip" onclick="rejPick('주별 허용 수량 초과')">주별 허용 수량 초과</button>
            <button type="button" class="rej-chip" onclick="rejPick('재고 소진')">재고 소진</button>
            <button type="button" class="rej-chip" onclick="rejPick('신청 대상 품목 아님')">신청 대상 품목 아님</button>
            <button type="button" class="rej-chip" onclick="rejPick('중복 신청')">중복 신청</button>
            <button type="button" class="rej-chip" onclick="rejPick('이미 직접 배부 완료')">직접 배부 완료</button>
        </div>
        <textarea id="rejText" placeholder="사유 직접 입력 (생략 가능)" style="width:100%; height:64px; border:1.5px solid #e2e8f0; border-radius:11px; padding:11px; font-size:14px; outline:none; resize:none;"></textarea>
        <div style="display:flex; gap:8px; margin-top:14px;">
            <button onclick="confirmRej()" style="flex:1; padding:12px; border:none; border-radius:11px; background:#dc2626; color:#fff; font-weight:800; cursor:pointer;">처리 불가 확정</button>
            <button onclick="closeRej()" style="flex:1; padding:12px; border:none; border-radius:11px; background:#e2e8f0; color:#475569; font-weight:800; cursor:pointer;">취소</button>
        </div>
    </div>
</div>

<!-- 월간 리포트 -->
<div class="ov" id="rpOv" onclick="if(event.target===this)closeReport()">
    <div class="set" style="width:760px; max-width:95vw; max-height:90vh; overflow-y:auto;">
        <h3 style="justify-content:space-between;"><span><i class="fa-solid fa-chart-column" style="color:#2563eb;"></i> 미화 · 비품 월간 리포트</span>
            <span style="display:flex; gap:8px; align-items:center;">
                <select id="rpMonth" onchange="renderReport()" style="font-size:13px; font-weight:800; padding:7px 10px; border:1.5px solid #e2e8f0; border-radius:9px;"></select>
                <button onclick="printReport()" style="font-size:13px; font-weight:800; padding:8px 14px; border:none; border-radius:9px; background:#2563eb; color:#fff; cursor:pointer;"><i class="fa-solid fa-print"></i> 인쇄 / PDF</button>
            </span>
        </h3>
        <div style="font-size:12px; color:#94a3b8; font-weight:700; margin-bottom:14px;">민원 데이터는 3개월간 보관되며, 반복 민원 호수·품목 소진·처리시간을 개선 자료로 활용하세요.</div>
        <div id="rpBody"></div>
        <button class="set-close" onclick="closeReport()">닫기</button>
    </div>
</div>

<script>
    const BLDGS = ['청렴관','상생관','국제동'];
    const BL_ICON = {'청렴관':'fa-building','상생관':'fa-building-circle-check','국제동':'fa-earth-asia'};
    const ICONS = {
        '수건':{fa:'fa-bath',cls:'수건'}, '샴푸':{fa:'fa-pump-soap',cls:'샴푸'},
        '바디샤워':{fa:'fa-soap',cls:'바디샤워'}, '치약':{fa:'fa-tooth',cls:'치약'}
    };
    let cache = null, activeCourseNames = null;
    let _openRooms = new Set();     // 펼친 호수 (건물__호수)
    let _openDone = new Set();      // 펼친 '완료 보기' (건물)
    const db = firebase.database().ref('system/facility_requests');

    /* ── 알림음 ── */
    let SOUND_ON = (()=>{ try{ return localStorage.getItem('kacFacilitySound')!=='off'; }catch(e){ return true; } })();
    let _snd=null; function _initSnd(){ try{ _snd=new Audio(encodeURI('선택.mp3')); _snd.preload='auto'; _snd.load(); }catch(e){} }
    _initSnd();
    function playDing(){ if(!SOUND_ON) return; try{ if(_snd){ _snd.currentTime=0; _snd.volume=.95; _snd.play().catch(()=>{}); } }catch(e){} }
    function applySoundUI(){ const s=document.getElementById('soundSwitch'); if(s) s.classList.toggle('on', SOUND_ON); }
    function toggleSound(){ SOUND_ON=!SOUND_ON; try{ localStorage.setItem('kacFacilitySound', SOUND_ON?'on':'off'); }catch(e){} applySoundUI(); }
    function openSet(){ applySoundUI(); document.getElementById('setOv').classList.add('show'); }
    function closeSet(){ document.getElementById('setOv').classList.remove('show'); }

    /* ── 시계 ── */
    const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    function tick(){
        const n=new Date(), p=x=>String(x).padStart(2,'0');
        const date=`${n.getFullYear()}.${p(n.getMonth()+1)}.${p(n.getDate())}`;
        let h=n.getHours(); const ampm=h>=12?'PM':'AM'; h=h%12||12;
        document.getElementById('clock').innerHTML =
            `<span class="c-date">${date}</span><span class="c-day">${DAYS[n.getDay()]}</span><span class="c-div"></span>`
            + `<span class="c-time">${p(h)}<span class="blink">:</span>${p(n.getMinutes())}<span class="c-ampm">${ampm}</span></span>`;
    }
    tick(); setInterval(tick,1000);

    /* ── 진행 중 과정만 (강사플랫폼 hideFromBoard·기간 반영, 실시간) ── */
    function loadActiveCourses(){
        const today=new Date(); today.setHours(0,0,0,0);
        const tStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        firebase.database().ref('courses').on('value', snap=>{
            const data=snap.val()||{}; const set=new Set();
            Object.values(data).forEach(c=>{
                const s=(c&&c.settings)||{}, st=(c&&c.status)||{};
                if(!s.courseName) return;
                if(s.hideFromBoard) return;             // 비노출 과정 제외 (실시간)
                if(st.roomStatus!=='active') return;
                if(s.period && s.period.includes('~')){ const ed=(s.period.split('~')[1]||'').trim(); if(ed && ed<tStr) return; }
                set.add((s.courseName||'').trim());
            });
            activeCourseNames=set; render();
        });
    }
    loadActiveCourses();
    db.on('value', snap=>{ cache=snap.val(); render(); });

    /* ── 헬퍼 ── */
    function bldgOf(d){ d=d||''; if(d.includes('청렴'))return'청렴관'; if(d.includes('상생'))return'상생관'; if(d.includes('국제'))return'국제동'; return'기타'; }
    function floorOf(d){ const m=(d||'').match(/(\d+)\s*층/); return m?m[1]+'층':''; }
    function roomNoOf(d){ const m=(d||'').match(/(\d+\s*호)/); if(m)return m[1].replace(/\s/g,''); const f=floorOf(d); return f||(d||'-'); }
    function parseReq(req){ let c=Array.isArray(req.items)?req.items.slice():[]; let e=req.text||''; if(c.length)e=e.replace(c.join(', '),'').replace(/^\s*\/\s*/,'').trim(); return {chips:c,extra:e}; }
    function h(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function chip(name){ const ic=ICONS[name]; return ic?`<span class="ichip ${ic.cls}"><i class="fa-solid ${ic.fa}"></i> ${name}</span>`:`<span class="ichip 기타"><i class="fa-solid fa-box"></i> ${h(name)}</span>`; }
    function isWait(r){ return r.status==='대기'||r.status==='확인'; }
    function isDone(r){ return r.status==='처리완료'||r.status==='처리불가'; }
    function whenStr(ts){ const d=new Date(ts); const p=x=>String(x).padStart(2,'0'); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }

    /* ── 신규 요청 감지 ── */
    let _prevWaitIds=null;

    function render(){
        const data=cache||{};
        let items=Object.keys(data).map(k=>({id:k,...data[k]}));
        if(activeCourseNames){ items=items.filter(it=>activeCourseNames.has((it.courseName||'').trim())); }

        const waits=items.filter(isWait);
        const dones=items.filter(isDone);
        document.getElementById('s-wait').textContent=waits.length;
        document.getElementById('s-done').textContent=dones.length;

        // 신규 요청 알림음
        const nowWait=new Set(waits.map(w=>w.id));
        if(_prevWaitIds!==null){ for(const id of nowWait){ if(!_prevWaitIds.has(id)){ playDing(); break; } } }
        _prevWaitIds=nowWait;

        // 건물 → 호수 그룹
        const byB={}; BLDGS.forEach(b=>byB[b]={rooms:{}, done:[]});
        items.forEach(it=>{
            const b=bldgOf(it.dorm); if(!byB[b]) return;
            if(isWait(it)){ const rn=roomNoOf(it.dorm); (byB[b].rooms[rn]=byB[b].rooms[rn]||{floor:floorOf(it.dorm),reqs:[]}).reqs.push(it); }
            else if(isDone(it)){ byB[b].done.push(it); }
        });

        document.getElementById('blocks').innerHTML = BLDGS.map(b=>{
            const g=byB[b]; const roomKeys=Object.keys(g.rooms).sort((a,c)=>a.localeCompare(c,'ko',{numeric:true}));
            const waitN=roomKeys.reduce((s,rn)=>s+g.rooms[rn].reqs.length,0);
            const roomsHtml = roomKeys.length ? roomKeys.map(rn=>{
                const rk=`${b}__${rn}`; const open=_openRooms.has(rk); const reqs=g.rooms[rn];
                const reqHtml = reqs.reqs.sort((x,y)=>y.timestamp-x.timestamp).map(req=>{
                    const {chips,extra}=parseReq(req);
                    const chipsHtml=chips.length?chips.map(chip).join(''):chip('비품 요청');
                    const extraHtml=extra?`<div class="extra-box"><i class="fa-solid fa-pen-to-square" style="color:#94a3b8"></i> ${h(extra)}</div>`:'';
                    return `<div class="req">
                        <div class="items">${chipsHtml}</div>${extraHtml}
                        <div class="acts">
                            <button class="btn btn-ok" onclick="event.stopPropagation();markDone('${req.id}','${rk.replace(/'/g,"")}')"><i class="fa-solid fa-check"></i> 해결 완료</button>
                            <button class="btn btn-no" onclick="event.stopPropagation();markReject('${req.id}')"><i class="fa-solid fa-xmark"></i> 처리 불가</button>
                        </div></div>`;
                }).join('');
                return `<div class="rcard ${open?'open':''}" id="rc-${rk}">
                    <div class="rc-hd" onclick="toggleRoom('${rk}')">
                        <span class="rc-no">${h(rn)}</span><span class="rc-fl">${h(reqs.floor||'')}</span>
                        <span class="rc-cnt">요청 ${reqs.reqs.length}</span>
                        <i class="fa-solid fa-chevron-down rc-chev"></i>
                    </div>
                    <div class="rc-body">${reqHtml}</div>
                </div>`;
            }).join('') : `<div class="bb-empty"><i class="fa-regular fa-circle-check" style="font-size:22px; display:block; margin-bottom:8px; color:#d1d5db;"></i>요청 없음</div>`;

            // 완료 보기(되돌리기용, 접힘)
            const doneOpen=_openDone.has(b);
            const doneHtml = g.done.length ? `<div class="done-foot">
                <div class="done-toggle" onclick="toggleDone('${b}')"><i class="fa-solid fa-chevron-${doneOpen?'up':'down'}"></i> 오늘 처리완료 ${g.done.length}건 ${doneOpen?'접기':'보기'}</div>
                <div class="done-list ${doneOpen?'show':''}">${g.done.sort((x,y)=>y.timestamp-x.timestamp).map(d=>`<div class="done-row"><span class="dr-no">${h(roomNoOf(d.dorm))}</span><span>${d.status==='처리완료'?'✅':'⛔'} ${h(d.name||'')}</span><button class="undo" onclick="undoStatus('${d.id}')">되돌리기</button></div>`).join('')}</div>
            </div>` : '';

            return `<div class="bblock">
                <div class="bb-hd ${b}"><span class="nm"><i class="fa-solid ${BL_ICON[b]||'fa-building'}"></i> ${b}</span><span class="wn">대기 ${waitN}</span></div>
                <div class="bb-body">${roomsHtml}</div>
                ${doneHtml}
            </div>`;
        }).join('');
    }

    function toggleRoom(rk){ if(_openRooms.has(rk))_openRooms.delete(rk); else _openRooms.add(rk); render(); }
    function toggleDone(b){ if(_openDone.has(b))_openDone.delete(b); else _openDone.add(b); render(); }

    function markDone(id, rk){
        const el=document.getElementById('rc-'+rk); if(el) el.classList.add('resolving');   // 회색 비활성 → 곧 사라짐
        setTimeout(()=>{ db.child(id).update({status:'처리완료', resolvedAt: firebase.database.ServerValue.TIMESTAMP}); }, 320);
    }
    let _rejId=null;
    function markReject(id){ _rejId=id; var t=document.getElementById('rejText'); if(t)t.value=''; document.getElementById('rejOv').classList.add('show'); }
    function rejPick(s){ var t=document.getElementById('rejText'); if(t)t.value=s; }
    function confirmRej(){ const r=(document.getElementById('rejText').value||'').trim(); const u={status:'처리불가', resolvedAt: firebase.database.ServerValue.TIMESTAMP}; if(r)u.reason=r; if(_rejId) db.child(_rejId).update(u); closeRej(); }
    function closeRej(){ document.getElementById('rejOv').classList.remove('show'); _rejId=null; }
    /* ── 신청 가능 비품 항목 관리 (교육생 앱과 연동) ── */
    const _itemsRef = firebase.database().ref('system/facility_items');
    const _DEF_ITEMS=['수건','샴푸','바디샤워','치약'];
    let _ITEMS=_DEF_ITEMS.slice();
    _itemsRef.on('value', s=>{ const v=s.val(); _ITEMS = (Array.isArray(v)&&v.length) ? v : (v&&typeof v==='object'&&Object.keys(v).length ? Object.values(v) : _DEF_ITEMS.slice()); renderItemList(); });
    function _escI(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
    function renderItemList(){ const el=document.getElementById('itemList'); if(!el)return; el.innerHTML = _ITEMS.length ? _ITEMS.map((it,i)=>`<span style="display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:9px;padding:6px 10px;font-weight:800;font-size:13px;">${_escI(it)} <i class="fa-solid fa-xmark" onclick="removeItem(${i})" style="color:#ef4444;cursor:pointer;"></i></span>`).join('') : '<span style="color:#94a3b8;font-size:12px;">기본 항목이 표시됩니다. 항목을 추가해 주세요.</span>'; }
    function addItem(){ const inp=document.getElementById('newItem'); const v=(inp.value||'').trim(); if(!v)return; if(_ITEMS.indexOf(v)>=0){ inp.value=''; return; } _itemsRef.set(_ITEMS.concat([v])); inp.value=''; }
    function removeItem(i){ const next=_ITEMS.slice(); next.splice(i,1); _itemsRef.set(next.length?next:null); }
    function undoStatus(id){ db.child(id).update({status:'대기', reason:null, resolvedAt:null}); }

    /* ── 3개월 자동 보관/정리 (그 이전 민원 자동 삭제) ── */
    function autoCleanFacility(){
        try{
            const cut = Date.now() - 92*24*60*60*1000;   // 약 3개월
            db.once('value').then(snap=>{
                const data=snap.val()||{}; const upd={}; let n=0;
                Object.entries(data).forEach(([k,v])=>{ const ts=Number(v&&v.timestamp||0); if(ts && ts<cut){ upd[k]=null; n++; } });
                if(n){ db.update(upd).then(()=>console.log('[미화] 3개월 경과 민원 '+n+'건 자동삭제')); }
            });
        }catch(e){ console.warn('[미화] 자동정리 오류',e); }
    }
    (function(){ try{ const d=new Date().toISOString().slice(0,10); if(localStorage.getItem('kacFacilityCleanDay')===d) return; localStorage.setItem('kacFacilityCleanDay', d); }catch(e){} autoCleanFacility(); })();

    /* ── 월간 리포트 (빅데이터: 반복 호수·품목 소진·건물비교·처리시간·요일/시간 패턴) ── */
    function _ym(ts){ const d=new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
    function _analyze(ym){
        const data=cache||{};
        const all=Object.keys(data).map(k=>({id:k,...data[k]})).filter(r=>r.timestamp && _ym(r.timestamp)===ym);
        const st={'대기':0,'확인':0,'처리완료':0,'처리불가':0};
        const byB={'청렴관':0,'상생관':0,'국제동':0,'기타':0};
        const byItem={}; const byRoom={}; const byDow=[0,0,0,0,0,0,0]; const byHour=new Array(24).fill(0);
        let resolveMs=0, resolveN=0;
        all.forEach(r=>{
            st[r.status]=(st[r.status]||0)+1;
            const b=bldgOf(r.dorm); byB[b]=(byB[b]||0)+1;
            const items=Array.isArray(r.items)&&r.items.length?r.items:['기타(직접입력)'];
            items.forEach(it=>{ byItem[it]=(byItem[it]||0)+1; });
            const roomKey=`${b} ${roomNoOf(r.dorm)}`; byRoom[roomKey]=(byRoom[roomKey]||0)+1;
            const d=new Date(r.timestamp); byDow[d.getDay()]++; byHour[d.getHours()]++;
            if(r.resolvedAt && r.timestamp && (r.status==='처리완료'||r.status==='처리불가')){ resolveMs+=(r.resolvedAt-r.timestamp); resolveN++; }
        });
        const total=all.length;
        const done=st['처리완료']||0, rej=st['처리불가']||0;
        const itemRank=Object.entries(byItem).sort((a,b)=>b[1]-a[1]);
        const roomRank=Object.entries(byRoom).sort((a,b)=>b[1]-a[1]);
        const avgResolveMin=resolveN?Math.round(resolveMs/resolveN/60000):null;
        return {ym, all, total, st, byB, itemRank, roomRank, byDow, byHour, done, rej, avgResolveMin,
            resolveRate: total?Math.round((done)/total*100):0};
    }
    function _bar(label, val, max, color){
        const pct=max?Math.round(val/max*100):0;
        return `<div style="display:flex;align-items:center;gap:10px;margin:5px 0;">
            <span style="width:120px;font-size:13px;font-weight:700;color:#334155;flex:none;text-align:right;">${h(label)}</span>
            <div style="flex:1;background:#f1f5f9;border-radius:6px;height:18px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:${color};border-radius:6px;"></div></div>
            <span style="width:46px;font-size:13px;font-weight:900;color:#0f172a;flex:none;">${val}건</span></div>`;
    }
    function _reportInner(a){
        const dow=['일','월','화','수','목','금','토'];
        const itemMax=a.itemRank.length?a.itemRank[0][1]:0;
        const dowMax=Math.max(...a.byDow,1);
        const bMax=Math.max(a.byB['청렴관'],a.byB['상생관'],a.byB['국제동'],1);
        const peakHour=a.byHour.indexOf(Math.max(...a.byHour));
        return `
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;">
            ${[['총 민원',a.total,'#2563eb'],['처리완료',a.done,'#10b981'],['처리불가',a.rej,'#dc2626'],['처리율',a.resolveRate+'%','#7c3aed'],['평균 처리시간',a.avgResolveMin==null?'-':(a.avgResolveMin>=60?Math.floor(a.avgResolveMin/60)+'시간 '+(a.avgResolveMin%60)+'분':a.avgResolveMin+'분'),'#0891b2']].map(([l,v,c])=>`<div style="flex:1;min-width:120px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px 14px;"><div style="font-size:12px;font-weight:800;color:#64748b;">${l}</div><div style="font-size:22px;font-weight:900;color:${c};margin-top:3px;">${v}</div></div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;">
            <div><h4 style="font-size:14px;font-weight:900;color:#0f172a;margin-bottom:8px;">🏢 생활관별 민원</h4>
                ${_bar('청렴관',a.byB['청렴관'],bMax,'#3b82f6')}${_bar('상생관',a.byB['상생관'],bMax,'#10b981')}${_bar('국제동',a.byB['국제동'],bMax,'#8b5cf6')}</div>
            <div><h4 style="font-size:14px;font-weight:900;color:#0f172a;margin-bottom:8px;">📦 품목별 요청 (소진 빈도)</h4>
                ${a.itemRank.length?a.itemRank.slice(0,6).map(([k,v])=>_bar(k,v,itemMax,'#f59e0b')).join(''):'<div style="color:#94a3b8;font-size:13px;">데이터 없음</div>'}</div>
            <div><h4 style="font-size:14px;font-weight:900;color:#0f172a;margin-bottom:8px;">🔁 반복 민원 호수 (상위 8)</h4>
                ${a.roomRank.length?`<table style="width:100%;border-collapse:collapse;font-size:13px;">${a.roomRank.slice(0,8).map(([k,v],i)=>`<tr style="border-bottom:1px solid #eef2f7;"><td style="padding:6px 4px;font-weight:${v>=2?'900':'600'};color:${v>=3?'#dc2626':'#334155'};">${i+1}. ${h(k)}</td><td style="padding:6px 4px;text-align:right;font-weight:900;">${v}건</td></tr>`).join('')}</table>`:'<div style="color:#94a3b8;font-size:13px;">데이터 없음</div>'}</div>
            <div><h4 style="font-size:14px;font-weight:900;color:#0f172a;margin-bottom:8px;">📅 요일별 분포 · ⏰ 피크</h4>
                ${a.byDow.map((v,i)=>_bar(dow[i]+'요일',v,dowMax,'#6366f1')).join('')}
                <div style="margin-top:8px;font-size:13px;color:#475569;font-weight:700;">가장 많은 시간대: <b style="color:#0f172a;">${a.total?peakHour+'시경':'-'}</b></div></div>
        </div>`;
    }
    function openReport(){
        const months=[]; const now=new Date();
        for(let i=0;i<3;i++){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }
        const sel=document.getElementById('rpMonth');
        sel.innerHTML=months.map(m=>`<option value="${m}">${m.split('-')[0]}년 ${parseInt(m.split('-')[1])}월</option>`).join('');
        renderReport(); document.getElementById('rpOv').classList.add('show');
    }
    function renderReport(){ const ym=document.getElementById('rpMonth').value; document.getElementById('rpBody').innerHTML=_reportInner(_analyze(ym)); }
    function closeReport(){ document.getElementById('rpOv').classList.remove('show'); }
    function printReport(){
        const ym=document.getElementById('rpMonth').value; const a=_analyze(ym);
        const rows=a.all.sort((x,y)=>x.timestamp-y.timestamp).map(r=>{ const d=new Date(r.timestamp); const p=x=>String(x).padStart(2,'0');
            const items=(Array.isArray(r.items)&&r.items.length?r.items.join(', '):'')+(r.text&&!(r.items||[]).length?(' '+r.text):'');
            return `<tr><td>${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}</td><td>${h(bldgOf(r.dorm))}</td><td>${h(roomNoOf(r.dorm))}</td><td>${h(items||'-')}</td><td>${h(r.name||'')}</td><td>${h(r.status)}</td></tr>`; }).join('');
        const w=window.open('','_blank'); if(!w){ alert('팝업이 차단되었습니다. 팝업을 허용해 주세요.'); return; }
        w.document.write(`<html><head><meta charset="utf-8"><title>미화·비품 월간 리포트 ${a.ym}</title>
        <style>body{font-family:'Malgun Gothic',sans-serif;padding:28px;color:#1e293b;}h1{font-size:22px;}h2{font-size:16px;margin:20px 0 8px;border-bottom:2px solid #1e3a8a;padding-bottom:5px;}
        table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}th,td{border:1px solid #cbd5e1;padding:6px 8px;text-align:left;}th{background:#1e3a8a;color:#fff;}
        .sum{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}.sc{border:1.5px solid #cbd5e1;border-radius:8px;padding:8px 14px;}.sc b{font-size:18px;}</style></head><body>
        <h1>🧹 미화 · 비품 월간 리포트 — ${a.ym.split('-')[0]}년 ${parseInt(a.ym.split('-')[1])}월</h1>
        <div class="sum"><div class="sc">총 민원 <b>${a.total}</b>건</div><div class="sc">처리완료 <b>${a.done}</b></div><div class="sc">처리불가 <b>${a.rej}</b></div><div class="sc">처리율 <b>${a.resolveRate}%</b></div><div class="sc">평균 처리시간 <b>${a.avgResolveMin==null?'-':a.avgResolveMin+'분'}</b></div></div>
        <h2>생활관별 민원</h2><table><tr><th>청렴관</th><th>상생관</th><th>국제동</th></tr><tr><td>${a.byB['청렴관']}건</td><td>${a.byB['상생관']}건</td><td>${a.byB['국제동']}건</td></tr></table>
        <h2>품목별 요청 (소진 빈도 / 재고 참고)</h2><table><tr><th>품목</th><th>요청 건수</th></tr>${a.itemRank.map(([k,v])=>`<tr><td>${h(k)}</td><td>${v}건</td></tr>`).join('')||'<tr><td colspan=2>없음</td></tr>'}</table>
        <h2>반복 민원 호수 (개선 우선)</h2><table><tr><th>순위</th><th>위치</th><th>건수</th></tr>${a.roomRank.map(([k,v],i)=>`<tr><td>${i+1}</td><td>${h(k)}</td><td>${v}건</td></tr>`).join('')||'<tr><td colspan=3>없음</td></tr>'}</table>
        <h2>전체 민원 내역</h2><table><tr><th>일시</th><th>생활관</th><th>호수</th><th>요청내용</th><th>요청자</th><th>상태</th></tr>${rows||'<tr><td colspan=6>없음</td></tr>'}</table>
        <p style="margin-top:20px;font-size:11px;color:#64748b;">생성: ${new Date().toLocaleString('ko-KR')} · KAC 항공기술훈련원 미화·비품관리</p>
        <!-- @build JDS260614 미화·비품: 전체높이 블록·블록별 독립스크롤, 3개월 보관 자동정리, 월간 리포트(반복호수·품목소진·건물비교·처리시간·요일/시간 패턴) + 인쇄/PDF, 새요청 알림음, 설정 -->
</body></html>`);
        w.document.close(); w.focus(); setTimeout(()=>{ try{w.print();}catch(e){} }, 400);
    }
</script>
<!-- @build JDS260614 미화·비품: 전체높이 블록·블록별 독립스크롤, 3개월 보관 자동정리, 월간 리포트(반복호수·품목소진·건물비교·처리시간·요일/시간 패턴) + 인쇄/PDF, 새요청 알림음, 설정 -->

<div id="__catcVer" class="no-print" aria-hidden="true" style="position:fixed;right:5px;bottom:4px;z-index:2147483647;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:700;line-height:1;letter-spacing:.4px;color:rgba(148,163,184,.5);background:rgba(120,120,120,.12);padding:2px 5px;border-radius:5px;pointer-events:none;user-select:none;">vC</div>
